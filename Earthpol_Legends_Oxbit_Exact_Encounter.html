<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;background:#04060a;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center;
       font-family:'Pixelify Sans', Inter,'Segoe UI',Arial,sans-serif;color:#e8e2d0;

  canvas{image-rendering:pixelated;image-rendering:crisp-edges;background:#05070c;

         touch-action:none;cursor:crosshair;transition:filter .18s ease}
  #tip{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);
       font-size:11px;letter-spacing:.2px;color:#66718e;white-space:nowrap;pointer-events:none}

  body.ep-embed #wrap{padding:0}
  body.ep-embed #tip{display:none}
  body.ep-embed canvas{border-radius:0;box-shadow:none;width:100vw!important;height:100vh!important;object-fit:contain}
  #ep-wiki-launch{position:fixed;inset:0;z-index:9999;display:flex;align-items:center;justify-content:center;
    background:radial-gradient(circle at 50% 36%,rgba(35,61,76,.94),rgba(2,5,9,.985) 68%);padding:22px;color:#e9edf3}
  #ep-wiki-launch .card{width:min(720px,94vw);background:linear-gradient(145deg,#111a26,#070c13 72%);border:1px solid #596b7c;
    box-shadow:0 26px 100px #000;border-radius:13px;padding:26px 28px;text-align:center;font-family:'Pixelify Sans',Inter,'Segoe UI',Arial,sans-serif}
  #ep-wiki-launch .eyebrow{font-size:11px;letter-spacing:2.3px;color:#83d7ff;margin-bottom:10px}
  #ep-wiki-launch h1{font-size:34px;line-height:1.05;color:#ffe09a;margin:0 0 8px}
  #ep-wiki-launch h2{font-size:16px;font-weight:500;color:#b9c6d8;margin:0 0 18px}
  #ep-wiki-launch .rule{height:1px;background:linear-gradient(90deg,transparent,#63778d,transparent);margin:18px 0}
  #ep-wiki-launch p{font-family:Inter,'Segoe UI',Arial,sans-serif;font-size:13px;line-height:1.5;color:#aeb8c6;margin:0 auto 20px;max-width:560px}
  #ep-wiki-launch button{cursor:pointer;border:1px solid #d6ad54;background:linear-gradient(#6e531d,#33260f);color:#fff1c7;
    border-radius:7px;padding:13px 24px;font:700 15px 'Pixelify Sans',Inter,sans-serif;letter-spacing:.7px;box-shadow:0 0 28px rgba(230,181,75,.12)}
  #ep-wiki-launch button:hover{filter:brightness(1.18);transform:translateY(-1px)}
  #ep-wiki-launch .hint{display:block;margin-top:12px;color:#66768a;font:11px Inter,'Segoe UI',Arial,sans-serif}

</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="960" height="540"></canvas>
  <div id="tip">B arsenal · C signature attack · click to enable audio · SHIFT sprint · F guard/parry · M mute · H guide · E/R/T abilities · V voices · P pause · F8 graphics</div>
</div>
<script>
"use strict";
const SINGLE_WIKI_ENCOUNTER = true;
/* Exact Oxbit encounter export: full Earthpol Legends engine/renderer/AI retained; unrelated embedded boss media removed. */
/* v34 Discord Wiki Deep-Link Pass
   - Supports ?fight=<bosskey> for boss-specific EarthPol wiki links.
   - Uses a click-to-enter overlay so browser audio works correctly.
   - ?embed=1 removes surrounding chrome for Discord Activity / iframe use.
   - Preserves Legends-only campaign, custom soundtrack and frozen boss roster. */
/* =====================================================================
   EARTHPOL: FOUR CROWNS  —  v2.0 Chronicles / v1.19 Toronto base
   ===================================================================== */
const cv = document.getElementById('c');
const W = 960, H = 540;
let DPR = Math.min(2.5, Math.max(1, window.devicePixelRatio || 1));
cv.width = Math.round(W * DPR);
cv.height = Math.round(H * DPR);
cv.style.width = W + 'px';
cv.style.height = H + 'px';
const ctx = cv.getContext('2d');
ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
ctx.imageSmoothingEnabled = false;

const STAGE = { x: 0, y: 74, w: W, h: H - 74 };
const HORIZON = STAGE.y + 168;
const PLAY = { x: 26, y: HORIZON, w: W - 52, h: STAGE.y + STAGE.h - HORIZON - 12 };

function clampPlay(e){
  const loX = PLAY.x + e.r, hiX = PLAY.x + PLAY.w - e.r;
  e.x = Math.max(loX, Math.min(hiX, e.x));
  e.y = Math.max(PLAY.y + 14, Math.min(PLAY.y + PLAY.h, e.y));
}
const rnd = (a,b) => a + Math.random()*(b-a);
const pick = a => a[Math.floor(Math.random()*a.length)];
const dist = (a,b) => Math.hypot(a.x-b.x, a.y-b.y);
const lerp = (a,b,t) => a + (b-a)*t;

/* ---------------------------------------------------------------- input */
const keys = {};
const mouse = { x: W/2, y: H/2, left:false, right:false };
let confirmLatch = false;

addEventListener('keydown', e => {
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyQ','Tab'].includes(e.code)) e.preventDefault();
  if (!keys[e.code]) keys['_p'+e.code] = true;
  keys[e.code] = true;
  if (e.code === 'KeyP' && state === 'play'){
    paused = !paused;
    if (paused){ Music.suspend(); Voice.cancel(); } else Music.resume();
  }
  /* K = secret invincible / developer mode. No HUD indicator. */
  if (e.code === 'KeyK') godmode = !godmode;
  /* Escape abandons the current invasion and drops you back on the war map */
  if (!SINGLE_WIKI_ENCOUNTER && e.code === 'Escape' && (state === 'play' || state === 'intro' || state === 'cutscene' || state === 'shop' || state === 'cleared')){
    openMap(boss ? boss.def.key : null);
  }
  if (e.code === 'Escape' && state === 'wiki'){
    wikiBack();
  }
  if (!SINGLE_WIKI_ENCOUNTER && e.code === 'Escape' && state === 'map'){
    state = 'title'; confirmLatch = false; Music.play('title');
  }
  CustomAudio.retry();
  if (e.code === 'KeyM'){
    Music.muted = !Music.muted;
    CustomAudio.setMuted(Music.muted);
    if (Music.muted) Music.stop(); else Music.play(Music.current);
  }

  if (e.code === 'KeyV'){ Voice.muted = !Voice.muted; if (Voice.muted) Voice.cancel(); }
  /* Arsenal quick-swap: swords remain slot 1; purchased specialist weapons use 2/3. */
  if (state === 'play' && !player.swing && player.bowCharge < 0){
    if (e.code === 'Digit1'){ player.meleeType='sword'; Music.sfx('draw'); }
    if (e.code === 'Digit2' && player.weaponUnlocks?.spear){ player.meleeType='spear'; Music.sfx('draw'); }
    if (e.code === 'Digit3' && player.weaponUnlocks?.hammer){ player.meleeType='hammer'; Music.sfx('heavy'); }
    if (e.code === 'Digit4' && player.weaponUnlocks?.rapier){ player.meleeType='rapier'; Music.sfx('draw'); }
    if (e.code === 'Digit5' && player.weaponUnlocks?.glaive){ player.meleeType='glaive'; Music.sfx('heavy'); }
  }
  if (e.code === 'Enter' || e.code === 'Space') confirmLatch = true;
});
addEventListener('keyup', e => { keys[e.code] = false; });
function pressed(code){ if (keys['_p'+code]){ keys['_p'+code] = false; return true; } return false; }

function canvasPos(ev){
  const r = cv.getBoundingClientRect();
  let x=(ev.clientX-r.left)*(W/r.width),y=(ev.clientY-r.top)*(H/r.height);
  if(state==='play' && Visual.projection){const p=Visual.projection;x=(x-W/2-p.x)/p.z+W/2;y=(y-H/2-p.y)/p.z+H/2;}
  return {x,y};
}
let suppressTransitionRelease = false;
cv.addEventListener('mousemove', ev => {
  const p = canvasPos(ev); mouse.x = p.x; mouse.y = p.y;
  if (state === 'map') mapPointerMove(p.x, p.y, true);
});
cv.addEventListener('mousedown', ev => {
  CustomAudio.retry();          // browsers block audio until a real gesture
  const p = canvasPos(ev); mouse.x = p.x; mouse.y = p.y;
  if (ev.button === 0){
    mouse.left = true; confirmLatch = true;
    // IMPORTANT: dispatch this physical click to exactly ONE screen. Some screen
    // handlers change `state`; independent `if` statements would then let the same
    // click fall through into the newly opened screen underneath.
    const screenAtDown = state;
    if (screenAtDown === 'shop'){
      shopClick(p.x, p.y);
    } else if (screenAtDown === 'title'){
      const changed = titleClick(p.x, p.y);
      if (changed) suppressTransitionRelease = true;
    } else if (screenAtDown === 'wiki'){
      wikiClick(p.x, p.y);
    } else if (screenAtDown === 'map'){
      confirmLatch = false;
      mapPointerMove(p.x, p.y);
      mapPointerDown(p.x, p.y);
    }
  }
  if (ev.button === 2) mouse.right = true;
});
addEventListener('mouseup', ev => {
  if (ev.button === 0){
    mouse.left = false;
    if (suppressTransitionRelease){
      // Consume the release from a title-screen button click. Without this, a
      // LEGENDS click can open the map on mouse-down and then mouse-up on a wiki
      // head in the same coordinates.
      suppressTransitionRelease = false;
      mapUI.dragging = false;
      rosterUI.grab = false;
      loreUI.grab = false;
      return;
    }
    if (state === 'map'){ const p = canvasPos(ev); mapPointerUp(p.x, p.y); }
  }
  if (ev.button === 2) mouse.right = false;
});
cv.addEventListener('wheel', ev => {
  if (state === 'map'){ ev.preventDefault(); mapWheel(ev); }
}, { passive:false });
cv.addEventListener('contextmenu', ev => ev.preventDefault());

const touch = { moveId:null, origin:null, pos:null, aimId:null };
cv.addEventListener('touchstart', ev => {
  ev.preventDefault();
  for (const t of ev.changedTouches){
    const p = canvasPos(t);
    const screenAtTouch = state;
    if (screenAtTouch === 'map'){
      mapUI.touch = true; mapPointerMove(p.x, p.y); mapPointerDown(p.x, p.y); continue;
    }
    if (screenAtTouch === 'title'){
      if (titleClick(p.x, p.y)){ suppressTransitionRelease = true; continue; }
    }
    if (screenAtTouch === 'wiki'){ wikiClick(p.x, p.y); continue; }
    if (p.x < W/2 && touch.moveId === null){ touch.moveId = t.identifier; touch.origin = p; touch.pos = p; }
    else { touch.aimId = t.identifier; mouse.x = p.x; mouse.y = p.y; mouse.left = true; }
  }
  if (state !== 'map' && state !== 'wiki') confirmLatch = true;
}, {passive:false});
cv.addEventListener('touchmove', ev => {
  ev.preventDefault();
  for (const t of ev.changedTouches){
    const p = canvasPos(t);
    if (state === 'map'){ mapPointerMove(p.x, p.y); continue; }
    if (t.identifier === touch.moveId) touch.pos = p;
    else if (t.identifier === touch.aimId){ mouse.x = p.x; mouse.y = p.y; }
  }
}, {passive:false});
function touchEnd(ev){
  if (suppressTransitionRelease){
    suppressTransitionRelease = false;
    mapUI.dragging = false;
    rosterUI.grab = false;
    loreUI.grab = false;
    return;
  }
  if (state === 'map'){
    for (const t of ev.changedTouches){ const p = canvasPos(t); mapPointerUp(p.x, p.y); }
    return;
  }
  for (const t of ev.changedTouches){
    if (t.identifier === touch.moveId){ touch.moveId = null; touch.origin = null; }
    if (t.identifier === touch.aimId){ touch.aimId = null; mouse.left = false; }
  }
}
cv.addEventListener('touchend', touchEnd);
cv.addEventListener('touchcancel', touchEnd);

/* =====================================================================
   MUSIC — layered orchestral engine (strings, brass, harp, choir, perc)
   ===================================================================== */
const Music = {
  ac:null, muted:false, current:null, timer:null, step:0, noise:null,
  bus:{}, started:false, duck:1,

  init(){
    if (this.ac) return;
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    const ac = this.ac = new AC();

    const comp = ac.createDynamicsCompressor();
    comp.threshold.value = -22; comp.knee.value = 20; comp.ratio.value = 4.5;
    comp.attack.value = 0.004; comp.release.value = 0.22;

    // brick-wall limiter: catches any pile-up before it reaches the speakers
    const lim = ac.createDynamicsCompressor();
    lim.threshold.value = -3; lim.knee.value = 0; lim.ratio.value = 20;
    lim.attack.value = 0.001; lim.release.value = 0.08;
    comp.connect(lim); lim.connect(ac.destination);

    const master = ac.createGain(); master.gain.value = 0.52 * this.duck; master.connect(comp);
    this.bus.master = master;

    // hall reverb from generated impulse
    const conv = ac.createConvolver();
    const secs = 2.6, len = Math.floor(ac.sampleRate*secs);
    const imp = ac.createBuffer(2, len, ac.sampleRate);
    for (let ch=0; ch<2; ch++){
      const d = imp.getChannelData(ch);
      for (let i=0;i<len;i++){
        const t = i/len;
        d[i] = (Math.random()*2-1) * Math.pow(1-t, 2.6) * (1 - t*0.25);
      }
    }
    conv.buffer = imp;
    const wet = ac.createGain(); wet.gain.value = 0.34;
    conv.connect(wet); wet.connect(master);
    this.bus.wet = wet; this.bus.conv = conv;

    const dry = ac.createGain(); dry.gain.value = 0.9; dry.connect(master);
    this.bus.dry = dry;

    const nlen = Math.floor(ac.sampleRate*1.4);
    const nb = ac.createBuffer(1, nlen, ac.sampleRate);
    const nd = nb.getChannelData(0);
    for (let i=0;i<nlen;i++) nd[i] = Math.random()*2-1;
    this.noise = nb;
  },

  f(m){ return 440*Math.pow(2,(m-69)/12); },
  out(node, sendWet){
    node.connect(this.bus.dry);
    const s = this.ac.createGain(); s.gain.value = sendWet === undefined ? 0.55 : sendWet;
    node.connect(s); s.connect(this.bus.conv);
  },

  /* bowed strings: detuned saws, slow swell, gentle vibrato */
  strings(m, t, dur, vol){
    const ac = this.ac;
    const g = ac.createGain();
    const flt = ac.createBiquadFilter();
    flt.type = 'lowpass';
    flt.frequency.setValueAtTime(700, t);
    flt.frequency.linearRampToValueAtTime(2400, t+Math.min(0.5,dur*0.5));
    flt.Q.value = 0.6;
    const lfo = ac.createOscillator(), lg = ac.createGain();
    lfo.frequency.value = 5.1; lg.gain.value = 4.2;
    lfo.connect(lg);
    [-7, 0, 6].forEach((det,i) => {
      const o = ac.createOscillator();
      o.type = i===1 ? 'sawtooth' : 'sawtooth';
      o.frequency.value = this.f(m); o.detune.value = det;
      lg.connect(o.detune);
      o.connect(flt); o.start(t); o.stop(t+dur+0.35);
    });
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+Math.min(0.22,dur*0.45));
    g.gain.setValueAtTime(vol, t+dur*0.75);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur+0.3);
    flt.connect(g); this.out(g, 0.7);
    lfo.start(t); lfo.stop(t+dur+0.35);
  },

  /* brass: bright saw + square, fast attack, filter bloom */
  brass(m, t, dur, vol){
    const ac = this.ac;
    const g = ac.createGain();
    const flt = ac.createBiquadFilter(); flt.type='lowpass'; flt.Q.value = 3.2;
    flt.frequency.setValueAtTime(420, t);
    flt.frequency.linearRampToValueAtTime(3200, t+0.09);
    flt.frequency.linearRampToValueAtTime(1500, t+dur);
    [0, -9, 8].forEach((det,i) => {
      const o = ac.createOscillator();
      o.type = i===2 ? 'square' : 'sawtooth';
      o.frequency.value = this.f(m); o.detune.value = det;
      o.connect(flt); o.start(t); o.stop(t+dur+0.2);
    });
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.035);
    g.gain.setValueAtTime(vol*0.9, t+dur*0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur+0.18);
    flt.connect(g); this.out(g, 0.5);
  },

  /* harp / pizzicato pluck */
  pluck(m, t, dur, vol){
    const ac = this.ac;
    const o = ac.createOscillator(), g = ac.createGain();
    const flt = ac.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value = 3600;
    o.type='triangle'; o.frequency.value = this.f(m);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    o.connect(flt); flt.connect(g); this.out(g, 0.7);
    o.start(t); o.stop(t+dur+0.08);
  },

  /* choir / warm pad */
  choir(m, t, dur, vol){
    const ac = this.ac;
    const g = ac.createGain();
    const flt = ac.createBiquadFilter(); flt.type='bandpass'; flt.frequency.value = 900; flt.Q.value = 0.9;
    [0,3,-4].forEach(det => {
      const o = ac.createOscillator();
      o.type='sine'; o.frequency.value = this.f(m); o.detune.value = det;
      o.connect(flt); o.start(t); o.stop(t+dur+0.5);
    });
    const o2 = ac.createOscillator(); o2.type='triangle'; o2.frequency.value = this.f(m+12);
    const g2 = ac.createGain(); g2.gain.value = 0.25; o2.connect(g2); g2.connect(flt);
    o2.start(t); o2.stop(t+dur+0.5);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.35);
    g.gain.setValueAtTime(vol, t+dur*0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur+0.45);
    flt.connect(g); this.out(g, 0.85);
  },

  /* low sub / contrabass */
  low(m, t, dur, vol){
    const ac = this.ac;
    const o = ac.createOscillator(), o2 = ac.createOscillator(), g = ac.createGain();
    const flt = ac.createBiquadFilter(); flt.type='lowpass'; flt.frequency.value = 380;
    o.type='sawtooth'; o.frequency.value = this.f(m);
    o2.type='sine'; o2.frequency.value = this.f(m-12);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.03);
    g.gain.setValueAtTime(vol*0.85, t+dur*0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur+0.12);
    o.connect(flt); o2.connect(flt); flt.connect(g); this.out(g, 0.28);
    o.start(t); o.stop(t+dur+0.15); o2.start(t); o2.stop(t+dur+0.15);
  },

  timpani(m, t, vol){
    const ac = this.ac;
    const o = ac.createOscillator(), g = ac.createGain();
    o.type='sine';
    o.frequency.setValueAtTime(this.f(m)*1.6, t);
    o.frequency.exponentialRampToValueAtTime(this.f(m), t+0.06);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+0.55);
    o.connect(g); this.out(g, 0.8);
    o.start(t); o.stop(t+0.6);
    const s = ac.createBufferSource(); s.buffer = this.noise;
    const f2 = ac.createBiquadFilter(); f2.type='lowpass'; f2.frequency.value=260;
    const g2 = ac.createGain(); g2.gain.setValueAtTime(vol*0.5,t);
    g2.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
    s.connect(f2); f2.connect(g2); this.out(g2, 0.5);
    s.start(t); s.stop(t+0.2);
  },

  perc(kind, t, vol){
    const ac = this.ac;
    const s = ac.createBufferSource(); s.buffer = this.noise;
    const f = ac.createBiquadFilter();
    const g = ac.createGain();
    let dur = 0.12;
    if (kind === 's'){ f.type='bandpass'; f.frequency.value=1900; f.Q.value=0.8; dur=0.17; }
    else if (kind === 'h'){ f.type='highpass'; f.frequency.value=8200; dur=0.045; }
    else if (kind === 'c'){ f.type='highpass'; f.frequency.value=5200; dur=0.9; }
    else { f.type='lowpass'; f.frequency.value=400; dur=0.2; }
    g.gain.setValueAtTime(vol,t);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
    s.connect(f); f.connect(g); this.out(g, kind==='c'?0.9:0.35);
    s.start(t); s.stop(t+dur+0.05);
  },

  /* ominous muted trumpet — narrow, buzzy, cuts through the low brass */
  trumpet(m, t, dur, vol){
    const ac = this.ac;
    const g = ac.createGain();
    const bp = ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = 1150; bp.Q.value = 1.6;
    const lp = ac.createBiquadFilter(); lp.type='lowpass';
    lp.frequency.setValueAtTime(900, t);
    lp.frequency.linearRampToValueAtTime(3400, t+0.10);
    lp.frequency.linearRampToValueAtTime(1700, t+dur);
    const vib = ac.createOscillator(), vg = ac.createGain();
    vib.frequency.value = 5.6; vg.gain.value = 5; vib.connect(vg);
    [0, -6, 7].forEach((det,i) => {
      const o = ac.createOscillator();
      o.type = i === 0 ? 'sawtooth' : 'square';
      o.frequency.value = this.f(m); o.detune.value = det;
      vg.connect(o.detune);
      o.connect(bp); o.start(t); o.stop(t+dur+0.2);
    });
    bp.connect(lp);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol, t+0.045);
    g.gain.setValueAtTime(vol*0.88, t+dur*0.72);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur+0.22);
    lp.connect(g); this.out(g, 0.62);
    vib.start(t); vib.stop(t+dur+0.2);
  },

  /* three ominous trumpet notes — punctuates a Romandicario line */
  trumpetStab(){
    this.init(); if (!this.ac || this.muted) return;
    const t = this.ac.currentTime + 0.02;
    this.trumpet(38, t, 0.85, 0.19);
    this.trumpet(45, t+0.40, 0.85, 0.17);
    this.trumpet(50, t+0.80, 1.9, 0.19);
    this.trumpet(33, t+0.16, 0.6, 0.11);   // darker under-note
    this.low(24, t, 2.4, 0.30);
    this.low(19, t, 2.7, 0.20);
    this.timpani(26, t, 0.52);
  },

  /* low menacing bed that runs underneath a spoken line */
  growl(dur){
    this.init(); if (!this.ac || this.muted) return;
    const ac = this.ac, t = ac.currentTime + 0.02;
    // deep sub drone
    const o = ac.createOscillator(), g = ac.createGain();
    o.type='sawtooth'; o.frequency.value = this.f(19);
    const lp = ac.createBiquadFilter(); lp.type='lowpass'; lp.frequency.value = 140;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.26, t+0.55);
    g.gain.setValueAtTime(0.26, t+dur*0.72);
    g.gain.exponentialRampToValueAtTime(0.0001, t+dur+0.55);
    o.connect(lp); lp.connect(g); this.out(g, 0.48);
    o.start(t); o.stop(t+dur+0.7);
    // second slightly detuned layer for thickness
    const o2 = ac.createOscillator(), g3 = ac.createGain();
    o2.type='sawtooth'; o2.frequency.value = this.f(19); o2.detune.value = -18;
    const lp2 = ac.createBiquadFilter(); lp2.type='lowpass'; lp2.frequency.value = 110;
    g3.gain.setValueAtTime(0.0001,t);
    g3.gain.exponentialRampToValueAtTime(0.14, t+0.7);
    g3.gain.exponentialRampToValueAtTime(0.0001, t+dur+0.5);
    o2.connect(lp2); lp2.connect(g3); this.out(g3, 0.35);
    o2.start(t); o2.stop(t+dur+0.6);
    // slow noise rumble
    const s = ac.createBufferSource(); s.buffer = this.noise; s.loop = true;
    const bp = ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value = 78; bp.Q.value = 2.8;
    const g2 = ac.createGain();
    g2.gain.setValueAtTime(0.0001,t);
    g2.gain.exponentialRampToValueAtTime(0.12, t+0.65);
    g2.gain.exponentialRampToValueAtTime(0.0001, t+dur+0.55);
    s.connect(bp); bp.connect(g2); this.out(g2, 0.55);
    s.start(t); s.stop(t+dur+0.7);
  },

  suspend(){
    if (this.ac && this.ac.state === 'running'){
      this._pausedAt = this.ac.currentTime;
      this.ac.suspend();
    }
  },
  resume(){
    if (this.ac && this.ac.state === 'suspended'){
      this.ac.resume().then(() => {
        /* Force a hard resync so the sequencer never tries to catch up a
           backlog of notes — that backlog is what produced the static. */
        this._forceResync = true;
      }).catch(()=>{});
    }
  },

  play(name){
    this.init();
    // a boss with a real recorded track bypasses the procedural engine
    if (CUSTOM_TRACKS[name]){
      this.current = name;
      this.stop();                       // silence any procedural theme
      CustomAudio.play(CUSTOM_TRACK_GROUP[name] || name, CUSTOM_TRACKS[name]);
      return;
    }
    CustomAudio.stop();                  // leaving a custom-track boss
    if (!this.ac) return;
    this.current = name;
    this.stop();
    if (this.muted) return;
    if (this.ac.state === 'suspended') this.ac.resume();
    const th = THEMES[name];
    if (!th) return;
    this.step = 0;
    this._forceResync = false;
    const spb = 60/th.bpm/4;                 // 16th note
    let next = this.ac.currentTime + 0.08;
    this.timer = setInterval(() => {
      if (this.muted || !this.ac) return;
      if (this.ac.state !== 'running') return;
      const now = this.ac.currentTime;
      /* Hard resync after pause/background: jump the sequencer clock forward
         instead of dumping hundreds of overlapping notes (the static). */
      if (this._forceResync || next < now - 0.08){
        next = now + 0.08;
        this.step = Math.round(this.step / th.len) * th.len;
        this._forceResync = false;
      }
      let guard = 0;
      while (next < now + 0.18 && guard++ < 12){
        const i = this.step % th.len;
        // bass
        if (th.bass[i] !== undefined && th.bass[i] !== null)
          this.low(th.bass[i], next, spb*(th.bassDur||3.6), 0.30);
        // chords (strings / choir beds)
        if (th.chords){
          for (const c of th.chords) if (c.s === i)
            for (const n of c.n){
              if (th.pad === 'choir') this.choir(n, next, spb*c.d, 0.075);
              else this.strings(n, next, spb*c.d, 0.085);
            }
        }
        // melody
        const m = th.mel[i];
        if (m !== undefined && m !== null){
          const dur = spb*(th.melDur ? th.melDur[i] || 2 : 2);
          if (th.lead === 'trumpet') this.trumpet(m, next, dur, 0.145);
          else if (th.lead === 'brass') this.brass(m, next, dur, 0.13);
          else if (th.lead === 'pluck') this.pluck(m, next, dur*1.1, 0.16);
          else this.strings(m, next, dur, 0.12);
        }
        // ominous trumpet line
        if (th.trump){
          const tr = th.trump[i];
          if (tr !== undefined && tr !== null) this.trumpet(tr, next, spb*(th.trumpDur||3), 0.10);
        }
        // counter line
        if (th.cnt){
          const c2 = th.cnt[i];
          if (c2 !== undefined && c2 !== null) this.pluck(c2, next, spb*2.2, 0.085);
        }
        // percussion
        const p = th.perc ? th.perc[i % th.perc.length] : '.';
        if (p === 'T') this.timpani(th.timp || 33, next, 0.5);
        else if (p === 't') this.timpani((th.timp || 33)+7, next, 0.3);
        else if (p === 's') this.perc('s', next, 0.24);
        else if (p === 'h') this.perc('h', next, 0.11);
        else if (p === 'k') this.perc('k', next, 0.4);
        else if (p === 'c') this.perc('c', next, 0.20);
        next += spb;
        this.step++;
        if (this.step > 100000) this.step = this.step % th.len;
      }
    }, 30);
  },
  stop(){ if (this.timer){ clearInterval(this.timer); this.timer = null; } },

  /* Voice ducking: lower both procedural WebAudio music and embedded/custom
     boss tracks while a recorded character line is playing. The WebAudio
     side eases into/out of the change so dialogue never causes a hard pop. */
  setDuck(level){
    this.duck = Math.max(0, Math.min(1, level));
    if (this.bus.master && this.ac){
      try {
        const now = this.ac.currentTime;
        const g = this.bus.master.gain;
        g.cancelScheduledValues(now);
        g.setTargetAtTime(0.52 * this.duck, now, 0.075);
      } catch(e){}
    }
    try {
      if (CustomAudio && CustomAudio.el)
        CustomAudio.el.volume = this.muted ? 0 : this.duck;
    } catch(e){}
  },

  sfx(kind){
    this.init(); if (!this.ac || this.muted) return;
    const t = this.ac.currentTime;
    switch(kind){
      case 'swing': this.perc('h', t, 0.16); this.pluck(70, t, 0.1, 0.06); break;
      case 'hit':   this.perc('s', t, 0.20); this.low(40, t, 0.1, 0.16); break;
      case 'bow': {
        // noise "fwip" transient — the breath of air off a released string
        const bp = this.ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=2600; bp.Q.value=1.1;
        const ns = this.ac.createBufferSource(); ns.buffer = this.noise;
        const ng = this.ac.createGain();
        ng.gain.setValueAtTime(0.24, t); ng.gain.exponentialRampToValueAtTime(0.0001, t+0.05);
        ns.connect(bp); bp.connect(ng); this.out(ng, 0.35);
        ns.start(t); ns.stop(t+0.06);
        // bright twang that snaps down in pitch — the string itself
        const o = this.ac.createOscillator(), g = this.ac.createGain();
        o.type = 'triangle';
        o.frequency.setValueAtTime(this.f(92), t);
        o.frequency.exponentialRampToValueAtTime(this.f(74), t+0.15);
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.26, t+0.010);
        g.gain.exponentialRampToValueAtTime(0.0001, t+0.22);
        o.connect(g); this.out(g, 0.55);
        o.start(t); o.stop(t+0.24);
        this.perc('h', t, 0.10);
        break;
      }
      case 'crossbow': {
        // shorter, lower click for enemy crossbows/bows — noticeable but
        // distinct from the player's own release so the mix stays readable
        const bp = this.ac.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=1750; bp.Q.value=1.5;
        const ns = this.ac.createBufferSource(); ns.buffer = this.noise;
        const ng = this.ac.createGain();
        ng.gain.setValueAtTime(0.16, t); ng.gain.exponentialRampToValueAtTime(0.0001, t+0.045);
        ns.connect(bp); bp.connect(ng); this.out(ng, 0.3);
        ns.start(t); ns.stop(t+0.05);
        this.pluck(64, t, 0.11, 0.07);
        break;
      }
      case 'laser': {
        const o = this.ac.createOscillator(), g = this.ac.createGain();
        o.type = 'sawtooth';
        o.frequency.setValueAtTime(this.f(88), t);
        o.frequency.exponentialRampToValueAtTime(this.f(64), t+0.12);
        const bp = this.ac.createBiquadFilter(); bp.type='bandpass';
        bp.frequency.value = 1600; bp.Q.value = 3;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(0.20, t+0.008);
        g.gain.exponentialRampToValueAtTime(0.0001, t+0.15);
        o.connect(bp); bp.connect(g); this.out(g, 0.4);
        o.start(t); o.stop(t+0.16);
        break;
      }
      case 'heal': this.pluck(76, t, 0.28, 0.10); this.pluck(83, t+0.06, 0.3, 0.08); break;
      case 'draw':  this.pluck(52, t, 0.3, 0.05); break;
      case 'hurt':  this.brass(41, t, 0.28, 0.20); break;
      case 'boom':  this.timpani(28, t, 0.75); this.perc('k', t, 0.55); this.perc('c', t, 0.2); break;
      case 'cannonFire': this.timpani(22, t, 0.6); this.perc('k', t, 0.7); this.perc('c', t+0.02, 0.15);
                          this.low(19, t, 0.35, 0.28); break;
      case 'pearl': [72,79,84].forEach((n,i)=>this.pluck(n, t+i*0.045, 0.35, 0.11)); break;
      case 'apple': {
        // crunchy Minecraft-style chew: noise bites + bright plucks
        for (let i=0;i<4;i++){
          const tt = t + i*0.09;
          this.perc('s', tt, 0.18 - i*0.02);
          this.pluck(62 + i*3, tt, 0.22, 0.09);
        }
        this.pluck(79, t+0.38, 0.4, 0.11);
        this.pluck(84, t+0.46, 0.35, 0.08);
        break;
      }
      case 'coin':  [88,93].forEach((n,i)=>this.pluck(n, t+i*0.05, 0.3, 0.09)); break;
      case 'roll':  this.perc('h', t, 0.13); break;
      case 'die':   [57,53,50,45].forEach((n,i)=>this.brass(n, t+i*0.16, 0.6, 0.16)); this.timpani(26, t, 0.7); break;
      case 'win':   [60,64,67,72].forEach((n,i)=>this.brass(n, t+i*0.13, 1.0, 0.16)); this.perc('c', t, 0.25); break;
      case 'spawn': this.pluck(48, t, 0.3, 0.12); this.perc('h', t, 0.10); break;
      case 'block': this.perc('h', t, 0.20); this.pluck(45, t, 0.18, 0.12); this.pluck(57, t, 0.12, 0.07); break;
      case 'heavy': this.perc('k', t, 0.5); this.brass(38, t, 0.34, 0.18); this.perc('s', t, 0.18); break;
      case 'charge': this.low(25, t, 4.0, 0.26); this.trumpet(49, t, 1.4, 0.13);
                     this.trumpet(56, t+1.4, 1.4, 0.13); this.trumpet(61, t+2.8, 1.4, 0.15); break;
      case 'banhammer': this.timpani(24, t, 0.9); this.perc('c', t, 0.32); this.perc('k', t, 0.6);
                        this.brass(28, t, 1.6, 0.26); this.brass(35, t, 1.6, 0.20);
                        this.low(21, t, 2.2, 0.34); break;
    }
  }
};

/* =====================================================================
   VOICE — phrase-level delivery.

   A single flat utterance is what makes browser TTS sound like a robot:
   one pitch, one rate, no breathing. So every line is split into phrases
   and each phrase is spoken as its own utterance with its own pitch, rate
   and a pause after it. Phrases in CAPS get pushed louder and faster;
   phrases ending in "..." get dropped and slowed. Romandicario also gets a
   sub-bass growl bed and trumpet stabs layered underneath in Web Audio,
   which is the part browser TTS cannot do on its own.
   ===================================================================== */
/* =====================================================================
   ROMANDICARIO RECORDED VOICE LAYER

   Put generated MP3/WAV data-URLs in ROMAN_VOICE_ASSETS using the exact
   dialogue text as the key. When a clip exists it completely replaces
   browser speechSynthesis for that line. This keeps the game standalone:
   generated clips can be embedded directly into this HTML as data:audio/...
   strings instead of shipping a folder next to the file.
   ===================================================================== */
const ROMAN_TOAST_DC_LINE = 'Hasta aquí llegaste, mi amigo. Washington D.C. is mine to conquer. Step aside now, before you get caught in la tormenta...';
const ROMAN_VOICE_ASSETS = {
  [ROMAN_TOAST_DC_LINE]: ''
}; 


const ROMAN_DC_DEFEAT_LINE = 'Enjoy washington DC while it lasts, Il see you in Mexico you little perro';
ROMAN_VOICE_ASSETS[ROMAN_DC_DEFEAT_LINE] = '';

const RomanRecordedVoice = {
  audio:null,
  play(text){
    const src = ROMAN_VOICE_ASSETS[text];
    if (!src) return false;
    try {
      this.stop();
      const a = this.audio = new Audio(src);
      a.volume = 1.0;
      Music.setDuck(0.38);
      a.onended = () => {
        if (this.audio === a) this.audio = null;
        Music.setDuck(1);
      };
      a.onerror = () => {
        if (this.audio === a) this.audio = null;
        Music.setDuck(1);
      };
      const p = a.play();
      if (p && p.catch) p.catch(() => {
        if (this.audio === a) this.audio = null;
        Music.setDuck(1);
      });
      return true;
    } catch(e){
      Music.setDuck(1);
      return false;
    }
  },
  stop(){
    if (this.audio){
      try { this.audio.pause(); this.audio.currentTime = 0; } catch(e){}
      this.audio = null;
    }
    Music.setDuck(1);
  }
};

      if (p && p.catch) p.catch(() => { if (this.audio === a) this.audio = null; Music.setDuck(1); });
      return true;
    } catch(e){ Music.setDuck(1); return false; }
  },
  stop(){
    if (this.audio){
      try { this.audio.pause(); this.audio.currentTime = 0; } catch(e){}
      this.audio = null;
    }

const Voice = {
  muted:false, voices:[], ready:false, chain:0, timers:[],

  load(){
    if (typeof speechSynthesis === 'undefined') return;
    this.voices = speechSynthesis.getVoices() || [];
    this.ready = this.voices.length > 0;
  },
  /* Prefer genuinely natural/neural voices when the browser exposes them.
     Extreme pitch-shifting is avoided later, so the timbre of the selected
     actor does most of the work instead of a DSP-like robot effect. */
  find(langs, preferDeep, actor){
    const naturalHints = ['natural','neural','online','google'];
    const maleHints = ['ryan','george','guy','andrew','brian','christopher','eric','daniel',
                       'mark','david','james','thomas','male','raul','pablo','diego','jorge'];
    const romanHints = ['ryan','george','brian','guy','andrew','christopher','eric','james'];
    let best = null, bestScore = -1e9;
    for (const v of this.voices){
      const lang = (v.lang || '').toLowerCase();
      const li = langs.findIndex(l => lang.startsWith(l));
      if (li < 0) continue;
      const name = (v.name || '').toLowerCase();
      let score = 100 - li*12;
      if (naturalHints.some(h => name.includes(h))) score += 48;
      if (name.includes('microsoft')) score += 12;
      if (preferDeep && maleHints.some(h => name.includes(h))) score += 30;
      if (actor === 'roman' && romanHints.some(h => name.includes(h))) score += 26;
      if (name.includes('compact') || name.includes('espeak') || name.includes('festival')) score -= 70;
      if (name.includes('zira') || name.includes('samantha')) score -= preferDeep ? 22 : 0;
      if (score > bestScore){ bestScore = score; best = v; }
    }
    return best;
  },

  /* split a line into speakable phrases, keeping the punctuation as timing.
     Written as a manual scan rather than a lookbehind regex, because a
     lookbehind is a parse error in older Safari and would take the whole
     script down with it. */
  phrases(text){
    const chunks = [];
    let cur = '';
    for (let i=0; i<text.length; i++){
      const ch = text[i];
      cur += ch;
      if (ch === ',' || ch === '.' || ch === '!' || ch === '?' || ch === '\u2026'){
        // keep "..." together
        if (ch === '.' && text[i+1] === '.') continue;
        while (text[i+1] === ' ') i++;
        chunks.push(cur.trim()); cur = '';
      }
    }
    if (cur.trim()) chunks.push(cur.trim());

    const out = [];
    for (const p of chunks){
      if (!p) continue;
      if (p.length > 46){
        const words = p.split(' ');
        let line = '';
        for (const w of words){
          line = line ? line + ' ' + w : w;
          if (line.length > 30){ out.push(line); line = ''; }
        }
        if (line) out.push(line);
      } else out.push(p);
    }
    return out.length ? out : [text];
  },

  speak(text, prof){
    if (this.muted) return;
    this.cancel();

    // Toast uses only the generated Cillian/Qwen performances. Deliberately
    // do not fall back to speechSynthesis: the old Toast browser voice is retired.
    if (prof && prof.actor === 'toast'){
      ToastRecordedVoice.play(text);
      return;
    }

    // Roman uses real recorded voice acting whenever a clip is embedded.
    // If a clip has not been generated yet, fall back to ONE continuous
    // utterance. Never split Roman into phrase-sized utterances: some Windows
    // voices insert multi-second resets between utterances, which caused the
    // Washington line to sound like one word every few seconds.
    if (prof && prof.actor === 'roman'){
      if (RomanRecordedVoice.play(text)) return;
      if (typeof speechSynthesis === 'undefined') return;
      if (!this.ready) this.load();
      const voice = this.find(prof.langs || ['en'], prof.deep, prof.actor);
      try {
        const u = new SpeechSynthesisUtterance(text);
        if (voice) u.voice = voice;
        if (prof.lang) u.lang = prof.lang;
        u.pitch = Math.max(0.78, Math.min(1.08, prof.pitch || 0.92));
        u.rate = Math.max(0.92, Math.min(1.16, (prof.rate || 1.0) + 0.08));
        u.volume = prof.vol === undefined ? 1 : prof.vol;
        speechSynthesis.speak(u);
      } catch(e){}
      return;
    }

    if (typeof speechSynthesis === 'undefined') return;
    if (!this.ready) this.load();
    const id = ++this.chain;
    const voice = this.find(prof.langs || ['en'], prof.deep, prof.actor);
    const list = this.phrases(text);

    if (prof.growl) Music.growl(Math.min(10, 1.2 + list.length*0.85));
    if (prof.trumpet) Music.trumpetStab();

    const speakPhrase = (i) => {
      if (id !== this.chain || this.muted || i >= list.length) return;
      const phrase = list[i];
      const caps = phrase === phrase.toUpperCase() && /[A-Z]{3}/.test(phrase);
      const trail = /\.\.\.|…$/.test(phrase);
      const bang = /!$/.test(phrase);
      const quest = /\?$/.test(phrase);
      const arc = Math.sin((i+0.5)/list.length * Math.PI) * 0.45;
      let pitch = prof.pitch + arc*(prof.range || 0.08) + rnd(-1,1)*(prof.jitterP || 0.015);
      let rate  = prof.rate  + rnd(-1,1)*(prof.jitterR || 0.025);
      let gap   = prof.gap || 180;

      // Roman's acting direction: restrained menace first, anger second.
      // The taunting words slow down; threats tighten and land harder.
      if (prof.actor === 'roman'){
        if (/well|savvy|mi amigo|rum|clever|adorable|smile|favou?r/i.test(phrase)){
          rate -= 0.07; pitch -= 0.025; gap += 120;
        }
        if (/siege|fleet|burn|inevitable|pull the plug|mine|enough|now|gunpowder|die|head/i.test(phrase)){
          rate += 0.035; pitch -= 0.018;
        }
        if (/mi amigo|savvy/i.test(phrase)) gap += 120;
      }
      if (caps){ rate += 0.045; pitch += 0.025; }
      if (trail){ pitch -= 0.055; rate -= 0.10; gap += 340; }
      if (bang){ rate += 0.035; }
      if (quest){ pitch += 0.025; }

      // Natural voices distort badly under extreme pitch shifting. Keep the
      // range human and let pacing + word choice carry the performance.
      pitch = Math.max(0.65, Math.min(1.18, pitch));
      rate  = Math.max(0.68, Math.min(1.30, rate));

      try {
        const u = new SpeechSynthesisUtterance(phrase);
        if (voice) u.voice = voice;
        if (prof.lang) u.lang = prof.lang;
        u.pitch = pitch; u.rate = rate; u.volume = prof.vol === undefined ? 1 : prof.vol;
        const continueChain = () => {
          if (id !== this.chain || this.muted) return;
          const t = setTimeout(() => speakPhrase(i+1), gap);
          this.timers.push(t);
        };
        u.onend = continueChain;
        u.onerror = continueChain;
        speechSynthesis.speak(u);
      } catch(e){
        const t = setTimeout(() => speakPhrase(i+1), gap);
        this.timers.push(t);
      }
    };

    const leadTimer = setTimeout(() => speakPhrase(0), prof.lead || 0);
    this.timers.push(leadTimer);
  },
  cancel(){
    this.chain++;
    for (const t of this.timers) clearTimeout(t);
    this.timers.length = 0;
    RomanRecordedVoice.stop();
    ToastRecordedVoice.stop();
    try { if (typeof speechSynthesis !== 'undefined') speechSynthesis.cancel(); } catch(e){}
  }
};
if (typeof speechSynthesis !== 'undefined'){
  Voice.load();
  speechSynthesis.onvoiceschanged = () => Voice.load();
}

const Dialogue = {
  active:null, queue:[], typed:0, t:0,
  next(){
    this.active = this.queue.shift() || null;
    this.typed = 0;
    if (this.active){
      const prof = VOICES[this.active.key] || VOICES.warden;
      // subtitles track the slower, phrased delivery (esp. Romandicario)
      this.t = Math.max(3.2, this.active.text.length*0.105 + 1.4) / (prof.rate || 1);
      Voice.speak(this.active.text, prof);
    }
  },
  push(key, speaker, text, color, skin){
    this.queue.push({ key, speaker, text, color, skin });
    if (!this.active) this.next();
  },
  update(dt){
    if (!this.active){ if (this.queue.length) this.next(); return; }
    this.typed += dt*34;
    this.t -= dt;
    if (this.t <= 0) this.next();
  },
  clear(){ this.queue.length = 0; this.active = null; Voice.cancel(); }
};

/* =====================================================================
   SPRITE BAKER — renders pixel maps to canvases with baked shading,
   an ambient-occlusion pass, and a silhouette for outlining.
   ===================================================================== */
function newCanvas(w, h){
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  return c;
}
function bakePart(rows, pal, opts){
  opts = opts || {};
  const h = rows.length, w = rows[0].length;
  const c = newCanvas(w, h);
  const g = c.getContext('2d');
  for (let y=0;y<h;y++){
    for (let x=0;x<w;x++){
      const ch = rows[y][x];
      if (ch === '.' || ch === ' ' || !pal[ch]) continue;
      g.fillStyle = pal[ch];
      g.fillRect(x, y, 1, 1);
    }
  }
  // richer baked lighting: warm upper-left rim, cool lower-right shadow, soft AO
  g.globalCompositeOperation = 'source-atop';
  const lg = g.createLinearGradient(0, 0, w*1.1, h*1.15);
  lg.addColorStop(0, 'rgba(255,248,230,0.38)');
  lg.addColorStop(0.28, 'rgba(255,255,255,0.08)');
  lg.addColorStop(0.55, 'rgba(255,255,255,0.0)');
  lg.addColorStop(1, 'rgba(4,8,22,0.48)');
  g.fillStyle = lg; g.fillRect(0,0,w,h);
  // subtle top highlight strip
  const hi = g.createLinearGradient(0, 0, 0, h*0.35);
  hi.addColorStop(0, 'rgba(255,252,240,0.18)');
  hi.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = hi; g.fillRect(0,0,w,h);
  if (opts.ao !== false){
    const ao = g.createLinearGradient(0, h*0.45, 0, h);
    ao.addColorStop(0, 'rgba(0,0,0,0)');
    ao.addColorStop(0.6, 'rgba(0,0,0,0.12)');
    ao.addColorStop(1, 'rgba(0,0,0,0.38)');
    g.fillStyle = ao; g.fillRect(0, 0, w, h);
  }
  if (opts.dark){
    g.fillStyle = 'rgba(0,0,0,' + opts.dark + ')';
    g.fillRect(0,0,w,h);
  }
  g.globalCompositeOperation = 'source-over';
  return c;
}
function bakeSilhouette(rows, pal, col){
  const h = rows.length, w = rows[0].length;
  const c = newCanvas(w, h);
  const g = c.getContext('2d');
  g.fillStyle = col;
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const ch = rows[y][x];
    if (ch === '.' || ch === ' ' || !pal[ch]) continue;
    g.fillRect(x, y, 1, 1);
  }
  return c;
}
function bakeWhite(rows, pal){
  return bakeSilhouette(rows, pal, '#ffffff');
}

/* Exact boss-skin references supplied by the user. These are embedded so the HTML remains
   a single portable file. They override the procedural fallback maps only for KingGaming
   and MalshMan, preserving their actual skins in combat, intros and dialogue portraits. */
const REFERENCE_SKIN_ASSETS = {
  kinggaming: { img:new Image(), aspect:205/380, hMul:1.02, portraitTop:0.43 },
  malshman:   { img:new Image(), aspect:195/384, hMul:1.00, portraitTop:0.42 }
};
REFERENCE_SKIN_ASSETS.kinggaming.img.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M/wHwAF/gL+XHb6GQAAAABJRU5ErkJggg==';
REFERENCE_SKIN_ASSETS.malshman.img.src = 'data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mNk+M/wHwAF/gL+XHb6GQAAAABJRU5ErkJggg==';

function drawReferenceSkin(key, x, y, s, o){
  const a=REFERENCE_SKIN_ASSETS[key];
  if(!a || !a.img.complete || !a.img.naturalWidth) return false;
  o=o||{};
  Visual.shadow(x,y,s,o);
  const h=46*s*a.hMul, w=h*(a.img.naturalWidth/a.img.naturalHeight);
  const hop=o.hop||0, bob=Math.sin((o.walk||0)*0.72)*Math.min(1.6*s,3.2);
  const face=o.facing===undefined?1:o.facing;
  ctx.save();
  ctx.globalAlpha=o.alpha===undefined?1:o.alpha;
  ctx.translate(x, y-hop+bob);
  if(face<0) ctx.scale(-1,1);
  ctx.drawImage(a.img,-w/2,-h,w,h);
  if((o.flash||0)>0){
    ctx.globalCompositeOperation='source-atop';
    ctx.globalAlpha=Math.min(.82,(o.flash||0)*.82);
    ctx.fillStyle='#ffffff'; ctx.fillRect(-w/2,-h,w,h);
  }
  ctx.restore();
  return true;
}

function drawReferencePortrait(key, x, y, s){
  const a=REFERENCE_SKIN_ASSETS[key];
  if(!a || !a.img.complete || !a.img.naturalWidth) return false;
  const im=a.img, sw=im.naturalWidth*0.72, sh=im.naturalHeight*a.portraitTop;
  const sx=(im.naturalWidth-sw)/2, box=8*s;
  ctx.save(); ctx.translate(x,y);
  ctx.beginPath(); ctx.rect(-box/2,-box,box,box); ctx.clip();
  ctx.drawImage(im,sx,0,sw,sh,-box/2,-box,box,box);
  ctx.restore();
  return true;
}

const BAKED = {};
function buildSkin(key){
  if (BAKED[key]) return BAKED[key];
  const s = SKINS[key];
  const p = s.pal;
  const o = {
    head: bakePart(s.head, p), headS: bakeSilhouette(s.head, p, '#05060c'), headW: bakeWhite(s.head, p),
    body: bakePart(s.body, p), bodyS: bakeSilhouette(s.body, p, '#05060c'), bodyW: bakeWhite(s.body, p),
    arm:  bakePart(s.arm, p),  armS:  bakeSilhouette(s.arm, p, '#05060c'),  armW:  bakeWhite(s.arm, p),
    armB: bakePart(s.arm, p, {dark:0.32}),
    leg:  bakePart(s.leg, p),  legS:  bakeSilhouette(s.leg, p, '#05060c'),  legW:  bakeWhite(s.leg, p),
    legB: bakePart(s.leg, p, {dark:0.28}),
    def: s
  };
  if (s.hat){
    o.hat = bakePart(s.hat.rows, p, {ao:false});
    o.hatS = bakeSilhouette(s.hat.rows, p, '#05060c');
    o.hatW = bakeWhite(s.hat.rows, p);
  }
  BAKED[key] = o;
  return o;
}

/* draw one part with outline, at unit coordinates (ux from centre, uy from head-top) */
function part(img, sil, wht, ux, uy, s, flash, ol){
  const x = Math.round(ux*s), y = Math.round((uy-32)*s);
  const w = Math.ceil(img.width*s), h = Math.ceil(img.height*s);
  if (ol > 0){
    ctx.drawImage(sil, x-ol, y, w, h); ctx.drawImage(sil, x+ol, y, w, h);
    ctx.drawImage(sil, x, y-ol, w, h); ctx.drawImage(sil, x, y+ol, w, h);
  }
  ctx.drawImage(img, x, y, w, h);
  if (flash > 0){
    ctx.globalAlpha = flash;
    ctx.drawImage(wht, x, y, w, h);
    ctx.globalAlpha = 1;
  }
}

function drawArmorOverlay(kind,x,y,s,facing,hop,walk,flash,pose){
  if(!kind||kind==='none')return;
  const B=Visual.armor(kind), last=Visual.lastRig;
  const o={facing,hop:hop||0,walk:walk||0,...(pose||{})};
  const r=last&&last.x===x&&last.y===y&&Math.abs(last.s-s)<.01?last.r:Visual.pose(x,y,s,o);
  if(last&&last.x===x&&last.y===y&&last.o){o.alpha=last.o.alpha;o.hop=last.o.hop||0;}
  ctx.save(); Visual.rigTransform(x,y,s,r,o); Visual.limbs(B,s,r,flash||0);ctx.restore();
}

/* full character */
function drawSkin(key, x, y, s, o){
  o=o||{};
  if(drawReferenceSkin(key,x,y,s,o)) return;
  const B=buildSkin(key), r=Visual.pose(x,y,s,o);
  Visual.lastRig={x,y,s,r,o};
  Visual.shadow(x,y,s,o);
  ctx.save(); Visual.rigTransform(x,y,s,r,o);
  if(B.def.cape && o.cape!==false) Visual.cape(B.def.cape,s,r,o);
  Visual.limbs(B,s,r,o.flash||0);
  ctx.save(); ctx.translate(0,-24*s); ctx.rotate(r.head);
  Visual.block(B.head,B.headS,B.headW,-4*s,-8*s,s,o.flash||0,2.0);
  if(B.hat) Visual.block(B.hat,B.hatS,B.hatW,(-4+B.def.hat.ox)*s,(-8+B.def.hat.oy)*s,s,o.flash||0,1.4);
  ctx.restore(); ctx.restore();
}

/* small portrait for the dialogue box */
function drawPortrait(key, x, y, s){
  if(drawReferencePortrait(key,x,y,s)) return;
  const B = buildSkin(key);
  ctx.save();
  ctx.translate(x, y);
  const ol = Math.max(1, Math.round(s*0.4));
  part(B.head, B.headS, B.headW, -4, 32-8, s, 0, ol);
  if (B.hat) part(B.hat, B.hatS, B.hatW, -4 + B.def.hat.ox, 32-8+B.def.hat.oy, s, 0, ol);
  ctx.restore();
}


/* =====================================================================
   STAGES — blocky Minecraft backdrops, pre-rendered once then animated
   ===================================================================== */
const BD_H = HORIZON - STAGE.y;      // backdrop band height
const STAGE_CACHE = {};

function hash(n){ const x = Math.sin(n*127.1)*43758.5453; return x - Math.floor(x); }

/* one 16x16-ish minecraft block with bevel */
function blk(g, x, y, s, col, shadeCol, seed){
  const v = hash(seed)*0.16 - 0.08;
  g.fillStyle = shadeCol;
  g.fillRect(x, y, s, s);
  g.fillStyle = col;
  g.fillRect(x, y, s-1, s-1);
  g.globalAlpha = Math.abs(v)*2;
  g.fillStyle = v > 0 ? '#ffffff' : '#000000';
  g.fillRect(x, y, s-1, s-1);
  g.globalAlpha=.18;g.fillStyle='#fff4d8';g.fillRect(x,y,Math.max(1,s-1),1);
  g.globalAlpha=.20;g.fillStyle='#080e1a';g.fillRect(x+s-2,y+1,1,Math.max(1,s-2));
  g.globalAlpha = 1;
}
function blkRect(g, x, y, w, h, s, col, shade, seed){
  for (let yy=0; yy<h; yy+=s)
    for (let xx=0; xx<w; xx+=s)
      blk(g, x+xx, y+yy, s, col, shade, seed + xx*0.31 + yy*0.77);
}

  g.fillStyle = sky; g.fillRect(0,0,W,BD_H);

  // sun
  g.fillStyle = 'rgba(255,250,214,0.9)';
  for (let y=-40;y<40;y+=8) for (let x=-40;x<40;x+=8)
    if (x*x+y*y < 1500) g.fillRect(748+x, 44+y, 8, 8);
  g.fillStyle = 'rgba(255,255,255,0.35)';
  for (let y=-24;y<24;y+=8) for (let x=-24;x<24;x+=8)

  for (let x=0;x<W;x+=16) g.fillRect(x + (hash(x)*8|0), BD_H-92 + (hash(x*2)*12|0), 10, 3);

  // coastal skyline
  const cols = ['#efe6d6','#e3d3bb','#f6efe2','#d9c9ad','#efdcc4'];
  for (let i=0;i<16;i++){
    const bw = 44 + (hash(i*5.1)*40|0), bh = 44 + (hash(i*9.7)*74|0);

  // beach + boardwalk

    const leaf = ['#2f9e4a','#278a3f','#3cb45a'];
    for (let a=0;a<7;a++){
      const ang = -Math.PI + a*(Math.PI/6);

  [70, 232, 430, 640, 858].forEach((px,i)=>palm(px, BD_H-24, 0.85 + hash(i)*0.35));

/* ------------------------------------------------- Burning coast (Romandicario) */
function buildSiege(){
  const c = newCanvas(W, BD_H);
  const g = c.getContext('2d');
  // reddish, apocalyptic sky — a dark tower looming over its own island,
  // with a lone pirate ship riding at anchor beside it
  const sky = g.createLinearGradient(0,0,0,BD_H);
  sky.addColorStop(0,'#1a0305'); sky.addColorStop(0.28,'#5c0f0c');
  sky.addColorStop(0.58,'#b8321a'); sky.addColorStop(0.82,'#e8641f');
  sky.addColorStop(1,'#ffab4a');
  g.fillStyle = sky; g.fillRect(0,0,W,BD_H);

  // dim blood-orange sun glow low behind the tower
  const sun = g.createRadialGradient(W*0.5, BD_H*0.6, 4, W*0.5, BD_H*0.6, 100);
  sun.addColorStop(0,'rgba(255,205,130,0.85)'); sun.addColorStop(1,'rgba(255,120,40,0)');
  g.fillStyle = sun; g.fillRect(0,0,W,BD_H);

  // dramatic backlit storm clouds, some glowing from the fires below
  for (let i=0;i<24;i++){
    const cx = hash(i*3.7)*W, cy = hash(i*9.1)*BD_H*0.55, r = 24+hash(i*5.5)*44;
    const lit = hash(i*1.3) > 0.5;
    g.fillStyle = lit ? 'rgba(255,150,80,'+(0.10+hash(i)*0.16)+')' : 'rgba(30,8,10,'+(0.14+hash(i)*0.20)+')';
    for (let yy=-r*0.5;yy<r*0.5;yy+=7) for (let xx=-r;xx<r;xx+=7)
      if ((xx*xx)/(r*r)+(yy*yy)/((r*0.5)*(r*0.5))<1) g.fillRect((cx+xx)|0,(cy+yy)|0,7,7);
  }
  // heavy smoke columns rising off the siege below
  for (let i=0;i<40;i++){
    const x = hash(i*2.2)*W, y = hash(i*5.5)*76, r = 16+hash(i*8.8)*44;
    g.fillStyle = 'rgba(18,6,8,'+(0.12+hash(i)*0.24)+')';
    for (let yy=-r;yy<r;yy+=7) for (let xx=-r;xx<r;xx+=7)
      if (xx*xx+yy*yy<r*r) g.fillRect((x+xx)|0,(y+yy)|0,7,7);
  }

  // distant scorched ruins, kept small and off to the side so they read as
  // background siege damage without competing with the tower
  for (let i=0;i<4;i++){
    const bw = 28+(hash(i*3.9)*22|0), bh = 18+(hash(i*7.3)*28|0);
    const bx = 10 + i*38, by = BD_H-30-bh;
    blkRect(g, bx, by, bw, bh, 7, '#241614', '#140c0c', i*4.2);
    if (hash(i*1.7) > 0.3){
      g.fillStyle = 'rgba(255,140,30,0.7)';
      for (let f=0;f<3;f++) g.fillRect(bx+4+f*8, by-5-(hash(i+f)*8|0), 5, 8+(hash(f)*6|0));
    }
  }

  // ---- the tower: a tall, dark, multi-tiered spire dominating the skyline,
  // rising from its own island — same silhouette language as Orthanc ----
  const tcx = W*0.5, tBase = BD_H - 40;
  (function tower(){
    const h = BD_H - 6;
    g.save();
    // main shaft, faintly lit on the side facing the sun
    g.fillStyle = '#171012';
    g.beginPath();
    g.moveTo(tcx-30, tBase);
    g.lineTo(tcx-19, 6);
    g.lineTo(tcx+19, 6);
    g.lineTo(tcx+30, tBase);
    g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,140,70,0.16)';
    g.beginPath();
    g.moveTo(tcx+2, tBase); g.lineTo(tcx+10, 6); g.lineTo(tcx+19, 6); g.lineTo(tcx+30, tBase);
    g.closePath(); g.fill();
    // banded ridges up the shaft
    g.fillStyle = '#0c0708';
    for (let i=0;i<7;i++){
      const ty = tBase - h*(0.12+i*0.115);
      const tw = 22 - i*1.6;
      g.fillRect(tcx-tw, ty, tw*2, 4);
    }
    // four horn spires crowning the top, like Orthanc's own
    const crown = (fx) => {
      g.fillStyle = '#0e0a0b';
      g.beginPath();
      g.moveTo(tcx+fx*6, tBase-h*0.62);
      g.lineTo(tcx+fx*10, 4);
      g.lineTo(tcx+fx*14, 14);
      g.lineTo(tcx+fx*20, tBase-h*0.62);
      g.closePath(); g.fill();
    };
    crown(-1); crown(1);
    // pinnacle needle
    g.fillStyle = '#0a0607';
    g.beginPath();
    g.moveTo(tcx-3, 14); g.lineTo(tcx, -8); g.lineTo(tcx+3, 14);
    g.closePath(); g.fill();
    // glowing embers/windows up the shaft
    g.fillStyle = 'rgba(255,150,60,0.85)';
    for (const gy of [0.2,0.34,0.47,0.6,0.74]) g.fillRect(tcx-2, tBase-h*gy, 4, 4);
    g.restore();
  })();

  // the rocky island at the tower's base, with lush green glow crystals
  // climbing up it — same accent as the tower-top's glowing windows
  blkRect(g, tcx-70, tBase-4, 140, 40, 7, '#2a2422', '#181413', 44.4);
  for (let i=0;i<10;i++){
    const gx = (tcx-64+i*13 + hash(i*3)*6)|0, gh = 10+hash(i*7)*18;
    g.fillStyle = 'rgba(80,220,110,0.55)'; g.fillRect(gx, tBase-4-gh, 3, gh);
    g.fillStyle = 'rgba(150,255,170,0.85)'; g.fillRect(gx, tBase-4-gh, 3, 3);
  }

  // one pirate galleon riding at anchor beside the tower's island
  function ship(px, py, sc, flip){
    g.save(); g.translate(px, py); g.scale(flip?-sc:sc, sc);
    blkRect(g, -46, -12, 92, 20, 6, '#241a14', '#160f0b', px);
    blkRect(g, -52, -6, 12, 12, 6, '#1c130f', '#110b08', px+1);
    blkRect(g, 40, -18, 14, 16, 6, '#1c130f', '#110b08', px+2);
    blkRect(g, -4, -78, 6, 68, 6, '#2e2015', '#1c130d', px+3);
    blkRect(g, -30, -70, 58, 30, 6, '#3a2c22', '#241a14', px+4);
    blkRect(g, -24, -34, 46, 22, 6, '#40301f', '#291f14', px+5);
    g.fillStyle = '#0a0a0a'; g.fillRect(-14, -62, 10, 10);
    g.fillStyle = '#1a1a1a'; g.fillRect(2, -86, 22, 10);
    g.restore();
  }
  ship(W*0.78, BD_H-40, 0.9, true);

  // dark water with fire reflection under everything
  blkRect(g, 0, BD_H-58, W, 34, 8, '#2a1420', '#1a0c14', 6.6);
  g.fillStyle = 'rgba(255,100,30,0.26)';
  for (let x=0;x<W;x+=12) g.fillRect(x, BD_H-54+(hash(x)*12|0), 10, 4);

  // scorched shore with ash, right at the front edge of the backdrop
  blkRect(g, 0, BD_H-24, W, 24, 8, '#2e2320', '#1c1412', 15.2);
  g.fillStyle = 'rgba(40,28,22,0.7)';
  for (let i=0;i<30;i++) g.fillRect((hash(i*3)*W)|0, BD_H-18+(hash(i)*10|0), 8, 4);
  return c;
}

      g.beginPath(); g.moveTo(x-ww/2-8*s,yy); g.lineTo(x,yy-8*s); g.lineTo(x+ww/2+8*s,yy); g.closePath(); g.fill();

  pagoda(490,BD_H*0.62,1.0);

  // Torii gate on the central island.
  g.fillStyle='#8d2634';

  g.fillRect(664,BD_H*0.55,96,8); g.fillRect(674,BD_H*0.50,76,6);
  g.fillStyle='#cfa45d'; g.fillRect(676,BD_H*0.54,72,3);

  for(const [x,y] of [[150,BD_H*.61],[795,BD_H*.57],[590,BD_H*.66]]){

}


function buildDC(){
  const c = newCanvas(W, BD_H);
  const g = c.getContext('2d');
  // bright blue Washington sky
  const sky = g.createLinearGradient(0,0,0,BD_H);
  sky.addColorStop(0,'#3a7ec8'); sky.addColorStop(0.5,'#6aade0'); sky.addColorStop(1,'#b8d8f0');
  g.fillStyle = sky; g.fillRect(0,0,W,BD_H);
  // soft clouds
  g.fillStyle = 'rgba(255,255,255,0.55)';
  for (const [x,y,w] of [[60,18,90],[280,12,70],[520,22,110],[780,14,80]]){
    g.beginPath(); g.ellipse(x,y,w/2,12,0,0,7); g.fill();
    g.beginPath(); g.ellipse(x+22,y-6,w/3,10,0,0,7); g.fill();
  }
  // distant green mall strip
  g.fillStyle = '#5a8a4a'; g.fillRect(0, BD_H*0.78, W, BD_H*0.22);
  g.fillStyle = '#4a7a3a'; g.fillRect(0, BD_H*0.86, W, 6);
  // reflecting pool
  g.fillStyle = '#5a9ac8'; g.fillRect(W*0.32, BD_H*0.72, W*0.36, 10);
  g.fillStyle = 'rgba(255,255,255,0.35)'; g.fillRect(W*0.34, BD_H*0.73, W*0.32, 3);

  // === Capitol dome (center) ===
  const cx = W/2, baseY = BD_H*0.72;
  g.fillStyle = '#e8e4d8';
  g.fillRect(cx-78, baseY-18, 156, 28);           // main wing
  g.fillRect(cx-52, baseY-48, 104, 34);            // upper body
  // dome
  g.beginPath(); g.ellipse(cx, baseY-48, 44, 38, 0, Math.PI, 0); g.fill();
  g.fillStyle = '#d4cfc0';
  g.fillRect(cx-7, baseY-95, 14, 48);              // cupola stem
  g.beginPath(); g.arc(cx, baseY-98, 9, 0, 7); g.fill(); // statue ball
  // columns on capitol face
  g.fillStyle = '#c8c0b0';
  for (let i=0;i<7;i++) g.fillRect(cx-42+i*12, baseY-44, 5, 28);

  // === Washington Monument (left) ===
  const mx = 120;
  g.fillStyle = '#d8d2c4';
  g.fillRect(mx-8, BD_H*0.22, 16, BD_H*0.56);
  // pyramidion
  g.beginPath();
  g.moveTo(mx-10, BD_H*0.22); g.lineTo(mx, BD_H*0.12); g.lineTo(mx+10, BD_H*0.22); g.fill();
  g.fillStyle = '#c0b8a8'; g.fillRect(mx-6, BD_H*0.22, 4, BD_H*0.56);

  // === Lincoln Memorial style building (right) ===
  const lx = W-130;
  g.fillStyle = '#e0dcd0';
  g.fillRect(lx-50, BD_H*0.48, 100, BD_H*0.32);
  g.fillStyle = '#c8c0b0';
  for (let i=0;i<6;i++) g.fillRect(lx-42+i*14, BD_H*0.50, 6, BD_H*0.28);
  g.fillStyle = '#d4cfc0'; g.fillRect(lx-54, BD_H*0.46, 108, 8); // roof

  // small federal buildings mid-ground
  g.fillStyle = '#d0c8b8';
  g.fillRect(240, BD_H*0.58, 70, BD_H*0.22);
  g.fillRect(W-320, BD_H*0.55, 80, BD_H*0.25);
  g.fillStyle = '#b8b0a0';
  for (let i=0;i<4;i++){ g.fillRect(248+i*14, BD_H*0.60, 5, BD_H*0.18); g.fillRect(W-310+i*16, BD_H*0.57, 5, BD_H*0.20); }

  // American flags on poles near capitol (stars canton + red/white stripes)
  function drawUSFlag(g, fx, fy, fw, fh){
    // 13 stripes
    const sh = fh / 13;
    for (let s = 0; s < 13; s++){
      g.fillStyle = (s % 2 === 0) ? '#b22234' : '#ffffff';
      g.fillRect(fx, fy + s * sh, fw, sh + 0.5);
    }
    // blue canton (union)
    const cw = fw * 0.42, ch = sh * 7;
    g.fillStyle = '#3c3b6e';
    g.fillRect(fx, fy, cw, ch);
    // white stars (simple dots grid)
    g.fillStyle = '#ffffff';
    for (let row = 0; row < 5; row++){
      for (let col = 0; col < 6; col++){
        if (row % 2 === 1 && col === 5) continue;
        const sx = fx + 2 + col * (cw / 6) + (row % 2) * 1.5;
        const sy = fy + 2 + row * (ch / 5);
        g.fillRect(sx, sy, 1.5, 1.5);
      }
    }
  }
  g.fillStyle = '#555'; g.fillRect(cx-95, BD_H*0.32, 3, BD_H*0.38); g.fillRect(cx+92, BD_H*0.32, 3, BD_H*0.38);
  drawUSFlag(g, cx-93, BD_H*0.32, 28, 18);
  drawUSFlag(g, cx+94, BD_H*0.32, 28, 18);

  return c;
}

/* ============================================ WASHINGTON DC — DAMAGED
   Toast Phase II only. This is still HIS capital: the first fight has battered
   Washington, but RomanDiCario and SPQM have NOT arrived yet. No SPQM banners,
   no opposing armies, no artillery battle. */
function buildDCDamaged(){
  const c = buildDC();
  const g = c.getContext('2d');
  const cx = W/2, baseY = BD_H*0.72;

  // Slightly dimmer/smokier atmosphere while keeping the original blue sky visible.
  const haze = g.createLinearGradient(0,0,0,BD_H);
  haze.addColorStop(0,'rgba(35,48,64,0.16)');
  haze.addColorStop(0.62,'rgba(90,72,58,0.08)');
  haze.addColorStop(1,'rgba(85,55,35,0.16)');
  g.fillStyle=haze; g.fillRect(0,0,W,BD_H);

  // A handful of distant smoke plumes caused by the player's assault.
  for(let i=0;i<5;i++){
    const x=[210,340,610,735,855][i], y=BD_H*(0.48+(i%2)*0.08);
    for(let j=0;j<4;j++){
      const yy=y-j*12, ww=18+j*8;
      g.fillStyle='rgba(47,46,48,'+(0.16-j*0.018)+')';
      g.beginPath(); g.ellipse(x+j*4,yy,ww,7+j*2,0,0,7); g.fill();
    }
  }

  // Capitol battle damage: cracked facade and chipped dome, not total destruction.
  g.strokeStyle='rgba(92,79,68,.72)'; g.lineWidth=2;
  const cracks=[[cx-46,baseY-43],[cx+31,baseY-34],[cx+8,baseY-74]];
  for(const q of cracks){
    g.beginPath(); g.moveTo(q[0],q[1]); g.lineTo(q[0]+7,q[1]+8); g.lineTo(q[0]+1,q[1]+16); g.lineTo(q[0]+10,q[1]+24); g.stroke();
  }
  // Small missing masonry patches; deliberately modest so the landmark is intact.
  g.fillStyle='rgba(72,65,58,.62)';
  g.fillRect(cx-70,baseY-15,16,7); g.fillRect(cx+49,baseY-46,13,8); g.fillRect(cx+19,baseY-70,10,5);

  // Lawn craters and scattered rubble from the player's attack.
  for(let i=0;i<9;i++){
    const x=45+hash(i*7.7)*(W-90), y=BD_H*(0.79+hash(i*4.3)*0.13);
    const rr=5+hash(i*9.1)*8;
    g.fillStyle='rgba(57,46,37,.48)'; g.beginPath(); g.ellipse(x,y,rr,rr*.34,0,0,7); g.fill();
    g.fillStyle='rgba(177,160,132,.55)';
    for(let r=0;r<3;r++) g.fillRect(x-8+r*7,y-4-r*2,4+r,3+r);
  }

  // A few isolated fires — battle damage, not a city-wide firestorm.
  for(const [x,y] of [[278,BD_H*.76],[690,BD_H*.74],[825,BD_H*.79]]){
    g.fillStyle='rgba(84,55,35,.9)'; g.fillRect(x-7,y-3,14,5);
    g.fillStyle='rgba(236,112,38,.75)'; g.beginPath(); g.moveTo(x-5,y); g.lineTo(x,y-17); g.lineTo(x+6,y); g.fill();
    g.fillStyle='rgba(255,202,85,.65)'; g.beginPath(); g.moveTo(x-2,y); g.lineTo(x+1,y-10); g.lineTo(x+3,y); g.fill();
  }

  // Flags remain AMERICAN in Toast's phase. One is slightly torn to show morale collapsing.
  g.fillStyle='rgba(58,60,68,.45)'; g.fillRect(cx-94,BD_H*.32,3,BD_H*.38);
  return c;
}

/* ============================================ WASHINGTON DC — INVADED
   The same capital after RomanDiCario's legion arrives: a burning skyline,
   the dome breached, the monument snapped in half, SPQM banners raised over
   the wreckage. Built as its own stage so the intact 'dc' backdrop used for
   the Toast_Quite fight is never disturbed. */
function buildDCInvaded(){
  const c = newCanvas(W, BD_H);
  const g = c.getContext('2d');

  // ---- burning sky: smoke overhead, firestorm along the horizon ----
  const sky = g.createLinearGradient(0,0,0,BD_H);
  sky.addColorStop(0,'#14090c'); sky.addColorStop(0.28,'#3d1410');
  sky.addColorStop(0.55,'#7a2c10'); sky.addColorStop(0.80,'#b8551c');
  sky.addColorStop(1,'#d98a33');
  g.fillStyle = sky; g.fillRect(0,0,W,BD_H);

  // heavy smoke banks rolling across the top
  for (let i=0;i<9;i++){
    const x = hash(i*2.7)*W, y = 6 + hash(i*5.1)*BD_H*0.30, w2 = 90 + hash(i*3.9)*120;
    g.fillStyle = 'rgba(24,14,14,' + (0.30 + hash(i*8.3)*0.30) + ')';
    g.beginPath(); g.ellipse(x, y, w2/2, 13 + hash(i*1.7)*9, 0, 0, 7); g.fill();
  }

  // ---- scorched mall strip + drained, burning reflecting pool ----
  g.fillStyle = '#4a3a22'; g.fillRect(0, BD_H*0.78, W, BD_H*0.22);
  g.fillStyle = '#372a18'; g.fillRect(0, BD_H*0.86, W, 6);
  // craters gouged out of the lawn
  for (let i=0;i<11;i++){
    const cxr = 30 + hash(i*6.2)*(W-60), cyr = BD_H*(0.80 + hash(i*4.4)*0.13);
    const rr = 7 + hash(i*9.8)*13;
    g.fillStyle = 'rgba(20,12,8,0.75)';
    g.beginPath(); g.ellipse(cxr, cyr, rr, rr*0.38, 0, 0, 7); g.fill();
    g.fillStyle = 'rgba(255,120,40,0.22)';
    g.beginPath(); g.ellipse(cxr, cyr, rr*0.55, rr*0.20, 0, 0, 7); g.fill();
  }
  g.fillStyle = '#2a1c14'; g.fillRect(W*0.32, BD_H*0.72, W*0.36, 10);
  g.fillStyle = 'rgba(255,140,50,0.30)'; g.fillRect(W*0.34, BD_H*0.73, W*0.32, 3);

  /* a broken masonry silhouette: solid block with chunks bitten out of the
     top edge, so every ruin reads as shelled rather than merely dark */
  function shelled(x, y, w2, h2, col, seed){
    g.fillStyle = col; g.fillRect(x, y, w2, h2);
    const bites = 3 + ((seed*7)|0) % 4;
    for (let i=0;i<bites;i++){
      const bw = w2*(0.12 + hash(seed+i*1.3)*0.20);
      const bx = x + hash(seed+i*2.9)*(w2-bw);
      const bh = h2*(0.10 + hash(seed+i*4.1)*0.22);
      g.clearRect(bx, y, bw, bh);
    }
  }

  // === Capitol dome — breached, drum cracked, fire inside ===
  const cx = W/2, baseY = BD_H*0.72;
  g.fillStyle = '#6a6154';
  shelled(cx-78, baseY-18, 156, 28, '#6a6154', 1.2);   // main wing
  shelled(cx-52, baseY-48, 104, 34, '#5e5648', 2.4);   // upper body
  // the dome itself, with a hole punched through the right shoulder
  g.fillStyle = '#6a6154';
  g.beginPath(); g.ellipse(cx, baseY-48, 44, 38, 0, Math.PI, 0); g.fill();
  g.save();
  g.beginPath(); g.arc(cx+22, baseY-62, 17, 0, 7); g.clip(); g.clearRect(cx, baseY-90, 60, 60);
  g.restore();
  // fire glowing out of the breach
  const dfire = g.createRadialGradient(cx+20, baseY-58, 2, cx+20, baseY-58, 22);
  dfire.addColorStop(0,'rgba(255,220,120,0.95)'); dfire.addColorStop(0.5,'rgba(255,120,30,0.55)');
  dfire.addColorStop(1,'rgba(255,90,20,0)');
  g.fillStyle = dfire; g.beginPath(); g.arc(cx+20, baseY-58, 22, 0, 7); g.fill();
  // cupola stem snapped off, statue gone
  g.fillStyle = '#544c40'; g.fillRect(cx-7, baseY-78, 14, 31);
  g.fillStyle = '#3e382e';
  g.beginPath(); g.moveTo(cx-7, baseY-78); g.lineTo(cx+7, baseY-78); g.lineTo(cx+2, baseY-86); g.closePath(); g.fill();
  // surviving columns, several toppled
  g.fillStyle = '#4e483c';
  for (let i=0;i<7;i++){ if (i===2 || i===5) continue; g.fillRect(cx-42+i*12, baseY-44, 5, 28); }
  g.save(); g.translate(cx-42+2*12, baseY-16); g.rotate(-1.1); g.fillRect(0,0,5,26); g.restore();

  // === Washington Monument — snapped in half ===
  const mx = 120;
  g.fillStyle = '#6e6558';
  g.fillRect(mx-8, BD_H*0.46, 16, BD_H*0.32);          // surviving stump
  // jagged shear line
  g.fillStyle = '#463f35';
  g.beginPath();
  g.moveTo(mx-8, BD_H*0.46); g.lineTo(mx-2, BD_H*0.44);
  g.lineTo(mx+3, BD_H*0.47); g.lineTo(mx+8, BD_H*0.45);
  g.lineTo(mx+8, BD_H*0.48); g.lineTo(mx-8, BD_H*0.48); g.closePath(); g.fill();
  // the toppled upper section lying across the lawn
  g.save();
  g.translate(mx+58, BD_H*0.79); g.rotate(-0.30);
  g.fillStyle = '#665d50'; g.fillRect(-46, -7, 92, 14);
  g.fillStyle = '#514a3e';
  g.beginPath(); g.moveTo(46,-7); g.lineTo(62,0); g.lineTo(46,7); g.closePath(); g.fill();  // pyramidion
  g.restore();

  // === Lincoln Memorial — colonnade collapsed ===
  const lx = W-130;
  shelled(lx-50, BD_H*0.48, 100, BD_H*0.32, '#655c4f', 3.6);
  g.fillStyle = '#4a4338';
  for (let i=0;i<6;i++){ if (i===1 || i===4) continue; g.fillRect(lx-42+i*14, BD_H*0.50, 6, BD_H*0.28); }
  g.fillStyle = '#59513f'; g.fillRect(lx-54, BD_H*0.46, 70, 8);   // roof, right half sheared off
  g.save(); g.translate(lx-6, BD_H*0.76); g.rotate(0.9);
  g.fillStyle = '#4a4338'; g.fillRect(0,0,6,30); g.restore();

  // === federal buildings, gutted and burning ===
  shelled(240, BD_H*0.58, 70, BD_H*0.22, '#5c5346', 4.8);
  shelled(W-320, BD_H*0.55, 80, BD_H*0.25, '#584f43', 6.1);
  g.fillStyle = 'rgba(255,150,40,0.55)';
  for (let i=0;i<4;i++){
    if (i%2) g.fillRect(248+i*14, BD_H*0.60, 5, BD_H*0.18);
    else g.fillRect(W-310+i*16, BD_H*0.57, 5, BD_H*0.20);
  }

  // ---- fire columns + smoke plumes rising off the ruins ----
  for (const [fx, fy, fh] of [[cx+18, baseY-58, 40],[262, BD_H*0.58, 34],
                              [W-292, BD_H*0.55, 38],[lx-20, BD_H*0.48, 30],[mx+50, BD_H*0.76, 22]]){
    for (let i=0;i<7;i++){
      const k = i/7, yy = fy - k*fh;
      g.fillStyle = 'rgba(' + (255) + ',' + (170 - k*90|0) + ',' + (50 - k*40|0) + ',' + (0.5 - k*0.4) + ')';
      g.beginPath(); g.ellipse(fx + Math.sin(i*1.9)*5, yy, 7 - k*4, 9 - k*5, 0, 0, 7); g.fill();
    }
    for (let i=0;i<6;i++){
      const yy = fy - fh - i*11;
      g.fillStyle = 'rgba(30,20,18,' + (0.34 - i*0.045) + ')';
      g.beginPath(); g.ellipse(fx + Math.sin(i*2.3)*11, yy, 13 + i*4, 8 + i*2, 0, 0, 7); g.fill();
    }
  }

  // ---- burned US flags, and SPQM banners raised over the capital ----
  g.fillStyle = '#3a3a3a';
  g.fillRect(cx-95, BD_H*0.32, 3, BD_H*0.38);
  g.save(); g.translate(cx+92, BD_H*0.32); g.rotate(0.22); g.fillRect(0,0,3,BD_H*0.38); g.restore();
  // one shredded stars-and-stripes still clinging to the left pole
  g.fillStyle = 'rgba(178,34,52,0.55)'; g.fillRect(cx-93, BD_H*0.32, 15, 5);
  g.fillStyle = 'rgba(230,230,230,0.40)'; g.fillRect(cx-93, BD_H*0.32+5, 11, 4);
  g.fillStyle = 'rgba(60,59,110,0.55)'; g.fillRect(cx-93, BD_H*0.32, 8, 7);
  // SPQM banners planted on the dome and the ruins
  function spqmBanner(bx, by, bh){
    g.fillStyle = '#2a1a12'; g.fillRect(bx, by, 2, bh);
    g.fillStyle = '#8c2230'; g.fillRect(bx+2, by, 17, 12);
    g.fillStyle = '#c9a227';
    g.font = 'bold 7px "Pixelify Sans", monospace';
    g.fillText('SPQM', bx+3, by+9);
    g.fillStyle = '#6d1a25';
    g.beginPath(); g.moveTo(bx+19, by); g.lineTo(bx+19, by+12); g.lineTo(bx+14, by+6); g.closePath(); g.fill();
  }
  spqmBanner(cx-4, baseY-96, 20);
  spqmBanner(240+16, BD_H*0.58-16, 16);
  spqmBanner(W-320+50, BD_H*0.55-16, 16);
  spqmBanner(mx-2, BD_H*0.44-16, 16);

  // ---- SECOND DESTRUCTION PASS: rubble, wrecks, broken infrastructure ----
  // shattered masonry piles make the destruction read all the way across
  // the Mall instead of only on the landmark silhouettes.
  function rubblePile(rx, ry, rw, seed){
    for (let i=0;i<13;i++){
      const xx = rx + hash(seed+i*2.71)*rw;
      const yy = ry - hash(seed+i*4.33)*9;
      const ww = 4 + hash(seed+i*7.17)*12;
      const hh = 2 + hash(seed+i*5.21)*6;
      g.fillStyle = i%4===0 ? '#8a6b4b' : (i%3===0 ? '#45372d' : '#625044');
      g.fillRect(xx|0, yy|0, ww|0, hh|0);
    }
  }
  rubblePile(18, BD_H*0.83, 160, 9.1);
  rubblePile(190, BD_H*0.80, 170, 12.7);
  rubblePile(cx-120, BD_H*0.79, 240, 15.4);
  rubblePile(W-355, BD_H*0.81, 165, 18.2);
  rubblePile(W-175, BD_H*0.83, 155, 21.6);

  // blast fractures across the avenues / Mall surface.
  g.strokeStyle = 'rgba(26,18,14,0.78)';
  g.lineWidth = 2;
  for (let i=0;i<12;i++){
    const sx = 30 + hash(i*6.73)*(W-60);
    const sy = BD_H*(0.79 + hash(i*4.21)*0.15);
    g.beginPath(); g.moveTo(sx,sy);
    let px=sx, py=sy;
    for (let j=0;j<4;j++){
      px += (hash(i*13+j*3.7)-0.5)*34;
      py += 5 + hash(i*7+j*2.8)*10;
      g.lineTo(px,py);
    }
    g.stroke();
  }

  // burned-out military / government vehicles abandoned in the fighting.
  function wreckedVehicle(vx, vy, flip, seed){
    g.save(); g.translate(vx,vy); g.scale(flip,1);
    g.fillStyle='#282522'; g.fillRect(-22,-10,44,11);
    g.fillStyle='#3d3a33'; g.fillRect(-12,-18,23,9);
    g.fillStyle='#171615'; g.beginPath(); g.arc(-14,2,6,0,7); g.arc(14,2,6,0,7); g.fill();
    g.fillStyle='rgba(255,95,25,0.55)';
    if (hash(seed)>0.35){ g.fillRect(-7,-20,6,8); g.fillRect(2,-17,5,6); }
    g.fillStyle='rgba(20,17,16,0.62)';
    for(let i=0;i<4;i++){ g.beginPath(); g.ellipse(-2+i*4,-28-i*6,9+i*2,5+i,0,0,7); g.fill(); }
    g.restore();
  }
  wreckedVehicle(365, BD_H*0.865, 1, 2.2);
  wreckedVehicle(705, BD_H*0.855, -1, 7.1);

  // snapped street lamps, barricades, and sandbags close to the battle line.
  for (const [sx,sy,rot] of [[205,BD_H*.77,-.42],[585,BD_H*.78,.55],[875,BD_H*.79,-.60]]){
    g.save(); g.translate(sx,sy); g.rotate(rot);
    g.fillStyle='#272522'; g.fillRect(-2,-33,4,36);
    g.fillStyle='#3c352c'; g.fillRect(-3,-35,12,4);
    g.restore();
  }
  g.fillStyle='#6e5638';
  for(let i=0;i<9;i++) g.fillRect(392+i*15, BD_H*.815 + (i%2)*3, 17, 6);
  g.fillStyle='#3b2d22';

/* --------------------------------------- Tower-top (RomanDiCario phase 3) */
function buildTowerTop(){
  const c = newCanvas(W, BD_H);
  const g = c.getContext('2d');
  // hazy, overcast height — we are standing on the roof, looking out past
  // its spires to green land far, far below through the haze
  const sky = g.createLinearGradient(0,0,0,BD_H);
  sky.addColorStop(0,'#b9c4c2'); sky.addColorStop(0.35,'#8a9a8e'); sky.addColorStop(0.7,'#5c6f5a'); sky.addColorStop(1,'#3a4a38');
  g.fillStyle = sky; g.fillRect(0,0,W,BD_H);
  // distant hazy mountains / terrain, far below and softened by atmosphere
  for (let i=0;i<6;i++){
    const mx = i*180 - 60, mh = 40 + hash(i*4.4)*30;
    g.fillStyle = 'rgba(70,86,68,' + (0.35+hash(i)*0.2) + ')';
    g.beginPath();
    g.moveTo(mx-90, BD_H*0.86); g.lineTo(mx, BD_H*0.86-mh); g.lineTo(mx+90, BD_H*0.86);
    g.closePath(); g.fill();
  }
  // mottled green ground texture bleeding through the haze at the very bottom
  for (let i=0;i<40;i++){
    const gx = hash(i*3.3)*W, gy = BD_H*0.78 + hash(i*7.1)*BD_H*0.22;
    g.fillStyle = 'rgba(60,90,50,' + (0.15+hash(i*2.1)*0.2) + ')';
    g.fillRect(gx|0, gy|0, 14+((i%4)*6), 5);
  }
  // atmospheric haze bands, thick near the bottom
  const haze = g.createLinearGradient(0,BD_H*0.55,0,BD_H);
  haze.addColorStop(0,'rgba(200,210,205,0)'); haze.addColorStop(1,'rgba(215,222,215,0.55)');
  g.fillStyle = haze; g.fillRect(0,0,W,BD_H);
  // the jagged crown of the tower — twin blade-like prongs on each side with
  // curved horn spurs at the base, exactly as it stands over the rooftop
  const crown = (cx, s, flip) => {
    const fx = flip ? -1 : 1;
    g.fillStyle = '#14171a';
    // two tall inner/outer blade prongs
    g.beginPath();
    g.moveTo(cx, BD_H*0.92);
    g.lineTo(cx-6*s*fx, BD_H*0.30);
    g.lineTo(cx-2*s*fx, BD_H*0.06);
    g.lineTo(cx+3*s*fx, BD_H*0.30);
    g.lineTo(cx+10*s*fx, BD_H*0.92);
    g.closePath(); g.fill();
    g.beginPath();
    g.moveTo(cx+16*s*fx, BD_H*0.92);
    g.lineTo(cx+20*s*fx, BD_H*0.44);
    g.lineTo(cx+24*s*fx, BD_H*0.20);
    g.lineTo(cx+29*s*fx, BD_H*0.44);
    g.lineTo(cx+30*s*fx, BD_H*0.92);
    g.closePath(); g.fill();
    // panel seams on the blades
    g.strokeStyle = 'rgba(0,0,0,0.4)'; g.lineWidth = 1;
    for (let i=0;i<6;i++){
      g.beginPath(); g.moveTo(cx-4*s*fx, BD_H*(0.35+i*0.09)); g.lineTo(cx+6*s*fx, BD_H*(0.35+i*0.09)); g.stroke();
    }
    // curved horn spur jutting out near the base, as in the reference photo
    g.fillStyle = '#0f1113';
    g.beginPath();
    g.moveTo(cx+8*s*fx, BD_H*0.90);
    g.quadraticCurveTo(cx+40*s*fx, BD_H*0.80, cx+46*s*fx, BD_H*0.92);
    g.quadraticCurveTo(cx+30*s*fx, BD_H*0.88, cx+14*s*fx, BD_H*0.95);
    g.closePath(); g.fill();
  };
  // the wings sit right at the edges of the rooftop platform (drawn below
  // the horizon in drawGround('towertop', ...)) so they read as the tower's
  // own horn-spires flanking the arena, not unrelated shapes off in space
  const platL = W*0.27, platR = W*0.73;
  crown(platL, 1.3, true);
  crown(platR, 1.3, false);
  return c;
}

/* ------------------------------------------------- Earth from orbit (Oxbit phase 2) */
function buildEarthMap(){
  const c = newCanvas(W, BD_H);
  const g = c.getContext('2d');
  // deep space
  const sky = g.createLinearGradient(0,0,0,BD_H);
  sky.addColorStop(0,'#02030a'); sky.addColorStop(1,'#050914');
  g.fillStyle = sky; g.fillRect(0,0,W,BD_H);
  for (let i=0;i<90;i++){
    g.fillStyle = 'rgba(230,235,250,' + (0.2+hash(i*4.1)*0.6) + ')';
    g.fillRect((hash(i*3.3)*W)|0, (hash(i*7.7)*BD_H*0.8)|0, 1.3, 1.3);
  }
  // the planet: ocean sphere with continents, seen edge-on from just above orbit
  const ex = W*0.5, ey = BD_H*1.55, er = BD_H*1.35;
  const oceanGrad = g.createRadialGradient(ex-er*0.3, ey-er*0.3, er*0.2, ex, ey, er);
  oceanGrad.addColorStop(0, '#2f6fb0'); oceanGrad.addColorStop(0.6, '#1c4a80'); oceanGrad.addColorStop(1, '#0e2a50');
  g.fillStyle = oceanGrad;
  g.beginPath(); g.arc(ex, ey, er, 0, 7); g.fill();
  // continents — stylized but recognizable silhouettes, clipped to the globe
  g.save();
  g.beginPath(); g.arc(ex, ey, er, 0, 7); g.clip();
  g.fillStyle = '#3f8f4a';
  const land = (pts) => { g.beginPath(); g.moveTo(pts[0][0],pts[0][1]); for(let i=1;i<pts.length;i++) g.lineTo(pts[i][0],pts[i][1]); g.closePath(); g.fill(); };
  // Africa + Europe silhouette (centre)
  land([[ex-40,ey-er+40],[ex+10,ey-er+30],[ex+55,ey-er+90],[ex+60,ey-er+180],[ex+30,ey-er+260],
        [ex-5,ey-er+300],[ex-35,ey-er+250],[ex-55,ey-er+170],[ex-50,ey-er+90]]);
  // Asia, to the right
  land([[ex+70,ey-er+20],[ex+170,ey-er+10],[ex+230,ey-er+70],[ex+210,ey-er+140],
        [ex+150,ey-er+160],[ex+90,ey-er+120],[ex+65,ey-er+70]]);
  // the Americas, to the left
  land([[ex-160,ey-er+10],[ex-110,ey-er+40],[ex-95,ey-er+110],[ex-120,ey-er+200],
        [ex-150,ey-er+270],[ex-175,ey-er+220],[ex-190,ey-er+120],[ex-185,ey-er+50]]);
  // small islands / Australia
  land([[ex+150,ey-er+240],[ex+190,ey-er+235],[ex+195,ey-er+265],[ex+155,ey-er+270]]);
  // polar ice cap
  g.fillStyle = 'rgba(235,240,250,0.85)';
  g.beginPath(); g.ellipse(ex, ey-er+8, er*0.9, 18, 0, 0, 7); g.fill();
  // cloud wisps over the ocean
  g.fillStyle = 'rgba(255,255,255,0.12)';
  for (let i=0;i<14;i++){
    const cx = ex + (hash(i*5.5)-0.5)*er*1.6, cy = ey - er + hash(i*8.2)*er*0.9;
    g.beginPath(); g.ellipse(cx, cy, 40+hash(i)*30, 8, 0, 0, 7); g.fill();
  }
  g.restore();
  // rim light / atmosphere glow along the horizon
  g.strokeStyle = 'rgba(120,180,255,0.35)'; g.lineWidth = 4;
  g.beginPath(); g.arc(ex, ey, er, 0, 7); g.stroke();
  return c;
}
