/* ---------------------------------------------- Ba Sing Se (Teknam, India) */
function buildBaSingSe(){
  const c = newCanvas(W, BD_H);
  const g = c.getContext('2d');
  // hazy golden desert-afternoon sky
  const sky = g.createLinearGradient(0,0,0,BD_H);
  sky.addColorStop(0,'#3a2f52'); sky.addColorStop(0.35,'#a8683f');
  sky.addColorStop(0.62,'#e0a850'); sky.addColorStop(1,'#f2cf8a');
  g.fillStyle = sky; g.fillRect(0,0,W,BD_H);
  // low sun disc, low enough not to fight the palace silhouette
  const sun = g.createRadialGradient(W*0.68, BD_H*0.30, 4, W*0.68, BD_H*0.30, 46);
  sun.addColorStop(0,'rgba(255,235,190,0.9)'); sun.addColorStop(1,'rgba(255,200,120,0)');
  g.fillStyle = sun; g.fillRect(0,0,W,BD_H);
  g.fillStyle = 'rgba(230,180,110,0.08)';
  for (let i=0;i<8;i++) g.fillRect(0, BD_H*0.22+i*8, W, 3);

  // ---- tiered outer ring wall, receding toward the palace ----
  const baseY = BD_H*0.78;
  for (let ring=2; ring>=0; ring--){
    const ry = baseY - ring*24, rh = 34 - ring*6, shade = 0.55 + ring*0.16;
    g.fillStyle = 'rgba(' + Math.round(196*shade) + ',' + Math.round(150*shade) + ',' + Math.round(90*shade) + ',1)';
    g.fillRect(0, ry-rh, W, rh);
    g.fillStyle = 'rgba(0,0,0,0.12)'; g.fillRect(0, ry-rh, W, 3);
    g.fillStyle = 'rgba(' + Math.round(170*shade) + ',' + Math.round(128*shade) + ',' + Math.round(72*shade) + ',1)';
    for (let x=0; x<W; x+=22) g.fillRect(x, ry-rh-7, 12, 7);
  }

  // ---- central palace: sandstone-red facade, pointed gateway, one modest
  //      onion dome flanked by two small chhatri — all sized to sit well
  //      inside the backdrop band instead of poking off the top ----
  const cx = W*0.5, bodyH = 62, py = baseY - bodyH;
  g.fillStyle = '#8f4a34';
  g.fillRect(cx-118, py, 236, bodyH);
  g.fillStyle = 'rgba(0,0,0,0.14)'; g.fillRect(cx-118, py, 236, 6);
  // pointed-arch gateway
  g.fillStyle = '#3a2418';
  g.beginPath();
  g.moveTo(cx-20, py+bodyH); g.lineTo(cx-20, py+30);
  g.quadraticCurveTo(cx, py+8, cx+20, py+30);
  g.lineTo(cx+20, py+bodyH); g.closePath(); g.fill();
  g.fillStyle = '#e0b23a';
  g.beginPath(); g.moveTo(cx-20, py+31); g.quadraticCurveTo(cx, py+11, cx+20, py+31); g.lineTo(cx+16, py+31);
  g.quadraticCurveTo(cx, py+19, cx-16, py+31); g.closePath(); g.fill();
  // rows of small pointed-arch windows either side
  g.fillStyle = 'rgba(60,40,30,0.7)';
  for (let i=0;i<3;i++){
    g.fillRect(cx-98+i*22, py+16, 10, 16);
    g.fillRect(cx+48+i*22, py+16, 10, 16);
  }
  // central onion dome, kept short so its finial stays on-canvas
  g.fillStyle = '#e0b23a';
  g.beginPath(); g.ellipse(cx, py-2, 27, 20, 0, Math.PI, 0); g.fill();
  g.beginPath(); g.moveTo(cx-11, py-20); g.quadraticCurveTo(cx, py-40, cx+11, py-20); g.closePath(); g.fill();
  g.fillStyle = '#c9862f'; g.fillRect(cx-2, py-48, 4, 10);
  g.fillStyle = '#e0b23a'; g.beginPath(); g.arc(cx, py-50, 3, 0, 7); g.fill();
  // flanking chhatri (small domed kiosks) on the roofline
  for (const sx of [cx-142, cx+142]){
    g.fillStyle = '#a8691f'; g.fillRect(sx-9, py-8, 18, 12);
    g.fillStyle = '#e0b23a';
    g.beginPath(); g.ellipse(sx, py-10, 11, 9, 0, Math.PI, 0); g.fill();
    g.fillStyle = '#c9862f'; g.fillRect(sx-2, py-22, 4, 8);
  }

  // saffron-and-white banners hanging off the ring wall
  for (let i=0;i<7;i++){
    const bx = 40 + i*130, by0 = Math.max(4, baseY-64);
    g.fillStyle = '#c9862f'; g.fillRect(bx, by0, 4, 46);
    g.fillStyle = i%2===0 ? '#e0733a' : '#3a6a4a';
    g.fillRect(bx+4, by0+4, 12, 30);
    g.fillStyle = 'rgba(255,255,255,0.22)'; g.fillRect(bx+4, by0+4, 12, 5);
  }

  // rowhouses either side of the palace, sandstone-and-terracotta
  const rowhouse = (x,y,w2,h2,col) => {
    g.fillStyle = col; g.fillRect(x, y, w2, h2);
    g.fillStyle = 'rgba(255,255,255,0.08)'; g.fillRect(x, y, w2, 3);
    g.fillStyle = 'rgba(70,40,20,0.4)';
    for (let wy=y+7; wy<y+h2-6; wy+=12) for (let wx=x+5; wx<x+w2-6; wx+=12) g.fillRect(wx, wy, 5, 6);
  };
  rowhouse(28, baseY-52, 66, 52, '#c9862f');
  rowhouse(104, baseY-42, 56, 42, '#b4732a');
  rowhouse(W-94, baseY-54, 66, 54, '#c9862f');
  rowhouse(W-168, baseY-40, 56, 40, '#b4732a');

  // dust motes low over the road
  g.fillStyle = 'rgba(255,225,170,0.10)';
  for (let i=0;i<24;i++) g.fillRect((hash(i*4.3)*W)|0, baseY*0.92+(hash(i*2.7)*BD_H*0.12)|0, 4, 3);
  return c;
}

/* --------------------------------------- Antarctic cathedral (Dandire) */
function buildAntarcticaCathedral(){
  const c = newCanvas(W, BD_H);
  const g = c.getContext('2d');
  // pale, overcast polar sky with a faint cold-blue wash — the black stone
  // needs a light sky behind it or it disappears into silhouette
  const sky = g.createLinearGradient(0,0,0,BD_H);
  sky.addColorStop(0,'#232c40'); sky.addColorStop(0.32,'#4d6480');
  sky.addColorStop(0.62,'#b0c4d2'); sky.addColorStop(1,'#e4ecf2');
  g.fillStyle = sky; g.fillRect(0,0,W,BD_H);
  g.fillStyle = 'rgba(120,220,200,0.05)';
  for (let i=0;i<4;i++) g.fillRect(0, BD_H*0.05+i*8, W, 4);

  // distant snowy peaks, soft in the haze, sitting behind the cathedral
  for (let i=0;i<7;i++){
    const mx = i*160 - 40, mh = 16 + hash(i*3.3)*18;
    g.fillStyle = 'rgba(200,214,224,' + (0.5+hash(i)*0.25) + ')';
    g.beginPath();
    g.moveTo(mx-80, BD_H*0.74); g.lineTo(mx, BD_H*0.74-mh); g.lineTo(mx+80, BD_H*0.74);
    g.closePath(); g.fill();
  }

  // ---- a huge black gothic cathedral, wider and taller than before —
  //      wide enough to dominate the arena, every height still kept
  //      inside the backdrop band so nothing clips off-canvas ----
  const cx = W*0.5, baseY = BD_H*0.90, naveH = 66, naveY = baseY - naveH;
  // flying buttresses along the sides (drawn behind the towers)
  for (const side of [-1,1]){
    for (let i=0;i<4;i++){
      const bx = cx + side*(158 + i*20);
      g.strokeStyle = '#3a3d48'; g.lineWidth = 5;
      g.beginPath();
      g.moveTo(bx, baseY-4); g.quadraticCurveTo(bx-side*16, naveY+16, bx-side*28, naveY-8);
      g.stroke();
    }
  }
  // nave body — near-black stone, the whole point of Dandire's secret
  g.fillStyle = '#15161c'; g.fillRect(cx-160, naveY, 320, naveH);
  g.fillStyle = 'rgba(255,255,255,0.06)'; g.fillRect(cx-160, naveY, 320, 5);
  g.fillStyle = 'rgba(0,0,0,0.35)'; g.fillRect(cx-160, naveY+naveH-8, 320, 8);
  // twin front towers, each with its own spire — bigger and further apart
  for (const sx of [cx-136, cx+136]){
    const towH = 100, towY = baseY - towH;
    g.fillStyle = '#191a21'; g.fillRect(sx-19, towY, 38, towH);
    g.fillStyle = 'rgba(255,255,255,0.05)'; g.fillRect(sx-19, towY, 38, 5);
    g.fillStyle = 'rgba(140,90,200,0.35)';
    for (let i=0;i<4;i++) g.fillRect(sx-3, towY+12+i*20, 6, 14);
    g.fillStyle = '#101116';
    g.beginPath(); g.moveTo(sx-21, towY); g.lineTo(sx, towY-48); g.lineTo(sx+21, towY); g.closePath(); g.fill();
    g.fillStyle = '#26282f';
    g.beginPath(); g.moveTo(sx-6, towY); g.lineTo(sx, towY-48); g.lineTo(sx+2, towY); g.closePath(); g.fill();
    g.fillStyle = '#0a0a0d'; g.fillRect(sx-1, towY-52, 2, 6);
  }
  // central gable + rose window, taller and wider than before
  g.fillStyle = '#191a21';
  g.beginPath(); g.moveTo(cx-96, naveY); g.lineTo(cx, naveY-46); g.lineTo(cx+96, naveY); g.closePath(); g.fill();
  g.fillStyle = '#0c0d10';
  g.beginPath(); g.arc(cx, naveY-20, 23, 0, 7); g.fill();
  g.strokeStyle = '#4a3a68'; g.lineWidth = 2;
  g.beginPath(); g.arc(cx, naveY-20, 23, 0, 7); g.stroke();
  for (let i=0;i<8;i++){
    const ang = (i/8)*Math.PI*2;
    g.beginPath(); g.moveTo(cx, naveY-20); g.lineTo(cx+Math.cos(ang)*23, naveY-20+Math.sin(ang)*23); g.stroke();
  }
  // a faint violet glow behind the glass, since nothing about this place
  // should read as welcoming
  g.fillStyle = 'rgba(150,110,220,0.55)'; g.beginPath(); g.arc(cx, naveY-20, 7, 0, 7); g.fill();
  // grand pointed-arch doorway — a true black void
  g.fillStyle = '#050609';
  g.beginPath();
  g.moveTo(cx-26, baseY); g.lineTo(cx-26, baseY-38);
  g.quadraticCurveTo(cx, baseY-72, cx+26, baseY-38);
  g.lineTo(cx+26, baseY); g.closePath(); g.fill();
  g.strokeStyle = '#3a3d48'; g.lineWidth = 3;
  g.beginPath();
  g.moveTo(cx-26, baseY); g.lineTo(cx-26, baseY-38);
  g.quadraticCurveTo(cx, baseY-72, cx+26, baseY-38);
  g.lineTo(cx+26, baseY); g.stroke();
  // lancet windows along the nave, the same faint violet glow as the rose
  g.fillStyle = 'rgba(120,90,180,0.30)';
  for (let i=0;i<4;i++){
    g.fillRect(cx-130+i*24, naveY+22, 8, 28);
    g.fillRect(cx+38+i*24, naveY+22, 8, 28);
  }
  // icicles off the nave roofline — pale against the black stone
  g.fillStyle = 'rgba(210,230,240,0.9)';
  for (let i=0;i<22;i++){
    const ix = cx-154 + i*15, il = 5 + hash(i*2.2)*11;
    g.beginPath(); g.moveTo(ix, naveY); g.lineTo(ix+3, naveY+il); g.lineTo(ix+6, naveY); g.closePath(); g.fill();
  }

  // snowdrift at the cathedral base, blending into the arena floor
  g.fillStyle = '#eef4f8';
  g.beginPath();
  g.moveTo(0, baseY+8);
  for (let x=0; x<=W; x+=40) g.lineTo(x, baseY + 6 + Math.sin(x*0.02)*5);
  g.lineTo(W, BD_H); g.lineTo(0, BD_H); g.closePath(); g.fill();
  return c;
}
/* --------------------------------------------- Sicily bunker (Kippenwortel) */
function buildSicilyBunker(){
  const c = newCanvas(W, BD_H);
  const g = c.getContext('2d');
  // warm Mediterranean afternoon sky
  const sky = g.createLinearGradient(0,0,0,BD_H);
  sky.addColorStop(0,'#2f5a8a'); sky.addColorStop(0.4,'#5c8fc0');
  sky.addColorStop(0.72,'#a8cfe0'); sky.addColorStop(1,'#e8dba0');
  g.fillStyle = sky; g.fillRect(0,0,W,BD_H);
  const sun = g.createRadialGradient(W*0.18, BD_H*0.22, 3, W*0.18, BD_H*0.22, 44);
  sun.addColorStop(0,'rgba(255,244,210,0.85)'); sun.addColorStop(1,'rgba(255,244,210,0)');
  g.fillStyle = sun; g.fillRect(0,0,W,BD_H);

  const baseY = BD_H*0.80;

  // ---- Mount Etna, smoking, off to the right ----
  const vx = W*0.80, vTop = baseY-96;
  g.fillStyle = '#5a4a52';
  g.beginPath();
  g.moveTo(vx-118, baseY); g.lineTo(vx-18, vTop); g.lineTo(vx+18, vTop); g.lineTo(vx+128, baseY);
  g.closePath(); g.fill();
  g.fillStyle = '#3f3440';
  g.beginPath();
  g.moveTo(vx-118, baseY); g.lineTo(vx-40, baseY-52); g.lineTo(vx+10, baseY-40); g.lineTo(vx+128, baseY);
  g.closePath(); g.fill();
  // snow cap + glowing crater
  g.fillStyle = 'rgba(230,236,244,0.85)';
  g.beginPath(); g.moveTo(vx-18,vTop); g.lineTo(vx-30,vTop+16); g.lineTo(vx-6,vTop+10); g.lineTo(vx+6,vTop+16); g.lineTo(vx+18,vTop); g.closePath(); g.fill();
  g.fillStyle = '#ff7a3a';
  g.fillRect(vx-6, vTop+2, 12, 5);
  // drifting smoke plume, kept low enough to stay inside the backdrop band
  for (let i=0;i<4;i++){
    const sy = vTop - i*9, sx = vx + Math.sin(bgT*0.4+i)*8, sr = 6+i*2;
    g.fillStyle = 'rgba(120,120,128,' + (0.22 - i*0.035) + ')';
    g.beginPath(); g.arc(sx, sy, sr, 0, 7); g.fill();
  }

  // ---- rolling Sicilian plains ----
  g.fillStyle = '#7a9a4a';
  g.beginPath();
  g.moveTo(0, baseY+10);
  for (let x=0; x<=W; x+=48) g.lineTo(x, baseY + 6 + Math.sin(x*0.018)*6);
  g.lineTo(W, BD_H); g.lineTo(0, BD_H); g.closePath(); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.06)';
  for (let i=0;i<10;i++) g.fillRect((i*97)%W, baseY+14+((i*53)%14), 30, 2);

  // ---- the gank base: a plain stone box with trapdoors, an iron door,
  //      and nothing decorative — exactly what a PvP-only clan would build ----
  const bx = W*0.40, bw = 108, bh = 62, by = baseY - bh;
  g.fillStyle = '#8a8a8a'; g.fillRect(bx-bw/2, by, bw, bh);
  g.fillStyle = 'rgba(0,0,0,0.16)'; g.fillRect(bx-bw/2, by, bw, 5);
  // cobble texture flecks
  g.fillStyle = 'rgba(40,40,40,0.20)';
  for (let yy=by+6; yy<by+bh-4; yy+=9) for (let xx=bx-bw/2+4; xx<bx+bw/2-4; xx+=11)
    g.fillRect(xx + ((yy/9|0)%2)*4, yy, 5, 4);
  // flat dark roof, one block thick
  g.fillStyle = '#3a3a3a'; g.fillRect(bx-bw/2-3, by-7, bw+6, 8);
  // iron door, centred
  g.fillStyle = '#b8bcc2'; g.fillRect(bx-9, by+bh-30, 18, 30);
  g.fillStyle = '#8a8f96'; g.fillRect(bx-9, by+bh-30, 18, 4);
  g.fillStyle = '#5a5e64'; g.fillRect(bx-2, by+bh-18, 4, 4);
  // trapdoors, flipped open on the wall either side — the whole point of a
  // gank base: something to duck through when the fight goes wrong
  for (const side of [-1,1]){
    const tx = bx + side*(bw/2 - 14);
    g.save();
    g.translate(tx, by+18);
    g.fillStyle = '#7a5a34';
    g.fillRect(-10, -2, 20, 4);
    g.fillStyle = '#5a4226';
    g.fillRect(-10, -2, 20, 1.5);
    g.restore();
  }
  // a couple of loose stone blocks scattered around the base, half-built
  g.fillStyle = '#7a7a7a';
  g.fillRect(bx-bw/2-22, baseY-14, 14, 14);
  g.fillRect(bx+bw/2+10, baseY-20, 16, 20);
  g.fillStyle = 'rgba(0,0,0,0.15)';
  g.fillRect(bx-bw/2-22, baseY-14, 14, 3);
  g.fillRect(bx+bw/2+10, baseY-20, 16, 3);

  return c;
}

/* ================================================= SPQM CITY (Roman, ph1)
   RomanDiCario's capital, intact and imposing: high fortified curtain walls,
   Roman architecture (arcades, columns, pediments, terracotta roofs) blended
   with Mexican colonial forms (domes, bell gables, stucco in warm ochres and
   pinks), and a single black Orthanc-style spire dead centre. */
function buildSPQMCity(splitDestroyed){
  const D = !!splitDestroyed;           // draw the ruined variant instead
  const c = newCanvas(W, BD_H);
  const g = c.getContext('2d');

  // ---- sky ----
  const sky = g.createLinearGradient(0,0,0,BD_H);
  if (D){
    sky.addColorStop(0,'#1a0a0a'); sky.addColorStop(0.30,'#4a1408');
    sky.addColorStop(0.58,'#8f3410'); sky.addColorStop(0.82,'#c96a22');
    sky.addColorStop(1,'#e0932f');
  } else {
    sky.addColorStop(0,'#2a4a7a'); sky.addColorStop(0.34,'#5f88b8');
    sky.addColorStop(0.64,'#a8c4d8'); sky.addColorStop(1,'#e8dcc0');
  }
  g.fillStyle = sky; g.fillRect(0,0,W,BD_H);

  if (!D){
    // clean sun + a few clouds over an untouched capital
    const sun = g.createRadialGradient(W*0.16, BD_H*0.20, 3, W*0.16, BD_H*0.20, 40);
    sun.addColorStop(0,'rgba(255,248,220,0.9)'); sun.addColorStop(1,'rgba(255,240,190,0)');
    g.fillStyle = sun; g.fillRect(0,0,W,BD_H);
    g.fillStyle = 'rgba(255,255,255,0.16)';
    for (let i=0;i<5;i++){
      const cxx = 90 + i*190, cyy = 16 + (i%3)*11;
      g.fillRect(cxx, cyy, 46, 6); g.fillRect(cxx+12, cyy-5, 24, 5);
    }
  } else {
    // burning sky: smoke bands and a dull red sun behind the murk
    const sun = g.createRadialGradient(W*0.16, BD_H*0.22, 3, W*0.16, BD_H*0.22, 46);
    sun.addColorStop(0,'rgba(255,140,60,0.7)'); sun.addColorStop(1,'rgba(200,60,20,0)');
    g.fillStyle = sun; g.fillRect(0,0,W,BD_H);
    for (let i=0;i<7;i++){
      g.fillStyle = 'rgba(40,26,26,' + (0.10+ (i%3)*0.05) + ')';
      g.fillRect(0, 8+i*13, W, 7);
    }
  }

  const baseY = BD_H*0.86;

  // ---- distant hills behind the city ----
  for (let i=0;i<6;i++){
    const mx = i*190 - 60, mh = 14 + hash(i*3.7)*14;
    g.fillStyle = D ? 'rgba(70,44,36,0.75)' : 'rgba(150,168,140,0.6)';
    g.beginPath();
    g.moveTo(mx-90, baseY-52); g.lineTo(mx, baseY-52-mh); g.lineTo(mx+90, baseY-52);
    g.closePath(); g.fill();
  }

  // ---- helper: a Roman/Mexican block with terracotta roof and arcade ----
  function cityBlock(x, y, w2, h2, wall, roof, ruined){
    g.fillStyle = wall; g.fillRect(x, y, w2, h2);
    g.fillStyle = 'rgba(255,255,255,0.10)'; g.fillRect(x, y, w2, 3);
    if (!ruined){
      // terracotta pitched roof
      g.fillStyle = roof;
      g.beginPath(); g.moveTo(x-3, y); g.lineTo(x+w2/2, y-9); g.lineTo(x+w2+3, y); g.closePath(); g.fill();
    } else {
      // blown-open roofline: a jagged broken top edge
      g.fillStyle = 'rgba(20,12,10,0.85)';
      g.beginPath(); g.moveTo(x, y);
      for (let k=0;k<=6;k++) g.lineTo(x + (w2*k/6), y - (hash(x+k*7)*9));
      g.lineTo(x+w2, y+4); g.lineTo(x, y+4); g.closePath(); g.fill();
    }
    // ground-floor arcade — round Roman arches
    const n = Math.max(2, Math.floor(w2/22));
    for (let k=0;k<n;k++){
      const ax = x + 6 + k*(w2-10)/n, aw = (w2-10)/n - 5;
      g.fillStyle = ruined ? 'rgba(10,6,6,0.9)' : 'rgba(60,40,30,0.55)';
      g.beginPath();
      g.moveTo(ax, y+h2); g.lineTo(ax, y+h2-11);
      g.quadraticCurveTo(ax+aw/2, y+h2-20, ax+aw, y+h2-11);
      g.lineTo(ax+aw, y+h2); g.closePath(); g.fill();
    }
    // upper windows
    g.fillStyle = ruined ? 'rgba(255,120,40,0.55)' : 'rgba(60,40,30,0.45)';
    for (let wy=y+7; wy<y+h2-24; wy+=13)
      for (let wx=x+6; wx<x+w2-8; wx+=15) g.fillRect(wx, wy, 6, 8);
  }

  // ---- helper: a Mexican colonial dome + bell gable ----
  function domeBuilding(x, y, r, wall, dome, ruined){
    g.fillStyle = wall; g.fillRect(x-r, y, r*2, 26);
    g.fillStyle = 'rgba(255,255,255,0.10)'; g.fillRect(x-r, y, r*2, 3);
    if (!ruined){
      g.fillStyle = dome;
      g.beginPath(); g.ellipse(x, y, r, r*0.85, 0, Math.PI, 0); g.fill();
      g.fillStyle = 'rgba(255,255,255,0.18)';
      g.beginPath(); g.ellipse(x-r*0.3, y-r*0.25, r*0.28, r*0.18, -0.4, 0, 7); g.fill();
      g.fillStyle = dome; g.fillRect(x-1.5, y-r-7, 3, 8);
    } else {
      // dome caved in
      g.fillStyle = 'rgba(24,14,12,0.9)';
      g.beginPath(); g.ellipse(x, y, r, r*0.5, 0, Math.PI, 0); g.fill();
      g.fillStyle = dome;
      g.beginPath(); g.moveTo(x-r, y); g.lineTo(x-r*0.55, y-r*0.6); g.lineTo(x-r*0.2, y); g.closePath(); g.fill();
      g.beginPath(); g.moveTo(x+r*0.25, y); g.lineTo(x+r*0.7, y-r*0.5); g.lineTo(x+r, y); g.closePath(); g.fill();
    }
  }

  // ---- city blocks flanking the centre ----
  const wallCol  = D ? '#6b4a3c' : '#d8b48a';
  const wallCol2 = D ? '#5a3d33' : '#c9906a';
  const roofCol  = D ? '#4a221a' : '#a8432a';
  const domeCol  = D ? '#4a3a44' : '#2f7a86';
  cityBlock(34,  baseY-56, 96, 56, wallCol,  roofCol, D);
  cityBlock(140, baseY-44, 78, 44, wallCol2, roofCol, D);
  cityBlock(W-130, baseY-58, 96, 58, wallCol,  roofCol, D);
  cityBlock(W-216, baseY-42, 76, 42, wallCol2, roofCol, D);
  domeBuilding(250, baseY-26, 22, wallCol,  domeCol, D);
  domeBuilding(W-250, baseY-26, 20, wallCol2, domeCol, D);

  // ---- the great curtain wall, running the width of the city ----
  const wallTop = baseY-34, wallH = 34;
  g.fillStyle = D ? '#5e4034' : '#c9a878';
  g.fillRect(0, wallTop, W, wallH);
  g.fillStyle = D ? 'rgba(0,0,0,0.25)' : 'rgba(255,255,255,0.10)';
  g.fillRect(0, wallTop, W, 4);
  // stone courses
  g.fillStyle = D ? 'rgba(20,12,10,0.25)' : 'rgba(120,90,60,0.20)';
  for (let yy=wallTop+7; yy<baseY; yy+=8)
    for (let xx=0; xx<W; xx+=17) g.fillRect(xx + ((yy/8|0)%2)*8, yy, 15, 3);
  // crenellations, with gaps blown out of them in the ruined variant
  g.fillStyle = D ? '#4a3128' : '#b8956a';
  for (let x=0; x<W; x+=24){
    if (D && hash(x*0.7) < 0.4) continue;              // shot away
    g.fillRect(x, wallTop-9, 14, 9);
  }
  // SPQM banners hung along the wall
  for (let i=0;i<6;i++){
    const bx = 70 + i*150;
    if (D && hash(bx) < 0.5) continue;                  // burned off
    g.fillStyle = D ? '#4a1a18' : '#8c2230';
    g.fillRect(bx, wallTop+4, 15, 24);
    g.fillStyle = D ? '#6a4a1a' : '#c9a227';
    g.fillRect(bx+4, wallTop+9, 7, 3); g.fillRect(bx+6, wallTop+9, 3, 12);
  }

  // ---- the Orthanc-style spire, dead centre and dominating ----
  const tx = W*0.5, towH = D ? 96 : 118, towY = baseY - towH;
  // tapering black body
  g.fillStyle = D ? '#17120f' : '#1b1b20';
  g.beginPath();
  g.moveTo(tx-19, baseY); g.lineTo(tx-13, towY+14); g.lineTo(tx+13, towY+14); g.lineTo(tx+19, baseY);
  g.closePath(); g.fill();
  g.fillStyle = 'rgba(255,255,255,0.07)';
  g.beginPath();
  g.moveTo(tx-19, baseY); g.lineTo(tx-13, towY+14); g.lineTo(tx-7, towY+14); g.lineTo(tx-11, baseY);
  g.closePath(); g.fill();
  if (!D){
    // four sharp horns crowning the tower
    g.fillStyle = '#1b1b20';
    for (const o of [-13,-5,5,13]){
      g.beginPath();
      g.moveTo(tx+o, towY+16); g.lineTo(tx+o+(o<0?-2:2), towY-10); g.lineTo(tx+o+(o<0?3:-3), towY+16);
      g.closePath(); g.fill();
    }
    g.fillStyle = 'rgba(201,162,39,0.85)';
    g.fillRect(tx-4, towY+26, 8, 10);                   // lit chamber
  } else {
    // snapped off at an angle, top third gone
    g.fillStyle = 'rgba(24,16,12,0.9)';
    g.beginPath();
    g.moveTo(tx-14, towY+14); g.lineTo(tx+4, towY+2); g.lineTo(tx+14, towY+16); g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,140,50,0.7)';
    g.fillRect(tx-4, towY+24, 8, 9);
  }
  // narrow windows up the shaft
  g.fillStyle = D ? 'rgba(255,120,40,0.6)' : 'rgba(201,162,39,0.55)';
  for (let i=0;i<5;i++) g.fillRect(tx-2, towY+34+i*13, 4, 7);

  // ---- ruined-only: fires, rubble, wrecked carts, blast plumes ----
  if (D){
    // scattered rubble mounds along the base
    g.fillStyle = '#3a2a22';
    for (let i=0;i<14;i++){
      const rx = (i*71 + 20) % W, rw = 16 + hash(i*4.1)*22;
      g.beginPath();
      g.moveTo(rx, baseY); g.lineTo(rx+rw*0.4, baseY-7-hash(i)*6); g.lineTo(rx+rw, baseY);
      g.closePath(); g.fill();
    }
    // fires banked against the wall and buildings
    for (let i=0;i<11;i++){
      const fx = 34 + i*84 + Math.sin(i)*10, fy = baseY - 4;
      const fh = 12 + hash(i*5.3)*14;
      g.fillStyle = 'rgba(201,51,30,0.85)';
      g.beginPath(); g.moveTo(fx-6, fy); g.quadraticCurveTo(fx-3, fy-fh*0.6, fx, fy-fh);
      g.quadraticCurveTo(fx+3, fy-fh*0.6, fx+6, fy); g.closePath(); g.fill();
      g.fillStyle = 'rgba(240,140,42,0.9)';
      g.beginPath(); g.moveTo(fx-3.5, fy); g.quadraticCurveTo(fx-1.5, fy-fh*0.4, fx, fy-fh*0.65);
      g.quadraticCurveTo(fx+1.5, fy-fh*0.4, fx+3.5, fy); g.closePath(); g.fill();
      g.fillStyle = 'rgba(255,214,110,0.9)';
      g.beginPath(); g.moveTo(fx-1.6, fy); g.quadraticCurveTo(fx, fy-fh*0.28, fx+1.6, fy); g.closePath(); g.fill();
    }
    // wrecked TNT carts strewn across the middle ground
    for (let i=0;i<5;i++){
      const cx2 = 90 + i*180 + Math.sin(i*2)*22, cy2 = baseY - 10 - (i%2)*5;
      g.save(); g.translate(cx2, cy2); g.rotate((hash(i*9)-0.5)*1.1);
      g.fillStyle = '#7a3a2a'; g.fillRect(-9, -8, 18, 9);       // tipped cart body
      g.fillStyle = '#c0392b'; g.fillRect(-7, -14, 14, 7);      // tnt block
      g.fillStyle = '#e8e2d0'; g.fillRect(-7, -12, 14, 2);
      g.fillStyle = '#2a2a2e';
      g.beginPath(); g.arc(-6, 2, 3, 0, 7); g.fill();
      g.beginPath(); g.arc(6, 2, 3, 0, 7); g.fill();
      g.restore();
    }
    // distant explosion plumes rising behind the wall
    for (let i=0;i<4;i++){
      const ex = 130 + i*230, ey = baseY - 46 - i*4;
      g.fillStyle = 'rgba(255,168,60,0.30)';
      g.beginPath(); g.arc(ex, ey, 15+i*2, 0, 7); g.fill();
      g.fillStyle = 'rgba(255,110,30,0.26)';
      g.beginPath(); g.arc(ex, ey-9, 11+i, 0, 7); g.fill();
      g.fillStyle = 'rgba(60,44,40,0.30)';
      g.beginPath(); g.arc(ex, ey-20, 13+i*2, 0, 7); g.fill();
    }
  }

  // ---- ground strip meeting the arena floor ----
  g.fillStyle = D ? '#4a3a28' : '#6f9a44';
  g.beginPath();
  g.moveTo(0, baseY+2);
  for (let x=0; x<=W; x+=40) g.lineTo(x, baseY + Math.sin(x*0.02)*3);
  g.lineTo(W, BD_H); g.lineTo(0, BD_H); g.closePath(); g.fill();
  return c;
}

/* Phase 4 — interior of the destroyed SPQM capital: church towers with
   crosses, a colossal armored statue in the square, fire on the streets,
   and a choking brown sky (matches the reference screenshot). */
function buildSPQMCapitalDestroyed(){
  const c = newCanvas(W, BD_H);
  const g = c.getContext('2d');
  const sky = g.createLinearGradient(0,0,0,BD_H);
  sky.addColorStop(0,'#1a0e08'); sky.addColorStop(0.25,'#3a1a0c');
  sky.addColorStop(0.55,'#6a2e12'); sky.addColorStop(0.8,'#9a4a1c');
  sky.addColorStop(1,'#b86828');
  g.fillStyle = sky; g.fillRect(0,0,W,BD_H);
  for (let i=0;i<9;i++){
    g.fillStyle = 'rgba(30,18,12,' + (0.08 + (i%3)*0.04) + ')';
    g.fillRect(0, 4+i*12, W, 8);
  }
  const sun = g.createRadialGradient(W*0.72, BD_H*0.18, 2, W*0.72, BD_H*0.18, 50);
  sun.addColorStop(0,'rgba(255,160,70,0.55)'); sun.addColorStop(1,'rgba(180,60,20,0)');
  g.fillStyle = sun; g.fillRect(0,0,W,BD_H);

  const baseY = BD_H * 0.88;

  // a few static smoke columns behind everything else, so the capital
  // reads as still-burning even before the animated FX layer kicks in.
  // Kept conservative on size/position so nothing pokes off the canvas.
  function smokeColumn(x, w0){
    const topY = 24 + hash(x*0.7)*12;      // never above y=24
    const segs = 6;
    for (let i=0;i<segs;i++){
      const yy = baseY - (i/segs)*(baseY-topY);
      const rr = w0 * (0.5 + i/segs*0.6);   // capped growth, stays small
      g.globalAlpha = 0.26 - i*0.03;
      g.fillStyle = i%2===0 ? '#3a322c' : '#4a4038';
      g.beginPath(); g.ellipse(x + Math.sin(i*1.3)*5, yy, rr, rr*0.6, 0, 0, 7); g.fill();
    }
    g.globalAlpha = 1;
  }
  smokeColumn(W*0.30, 14);
  smokeColumn(W*0.62, 16);
  smokeColumn(W*0.82, 12);

  function churchTower(x, top, w, ruined){
    const h = baseY - top;
    g.fillStyle = '#c8b8a0';
    g.fillRect(x - w/2, top, w, h);
    g.fillStyle = 'rgba(0,0,0,0.18)';
    g.fillRect(x - w/2, top, w*0.18, h);
    g.fillStyle = 'rgba(80,60,45,0.25)';
    for (let yy = top+8; yy < baseY; yy += 10)
      g.fillRect(x - w/2 + 2, yy, w - 4, 2);
    g.fillStyle = 'rgba(20,12,8,0.85)';
    for (let i=0;i<3;i++){
      const wy = top + 18 + i*22;
      if (wy + 14 > baseY - 8) break;
      g.fillRect(x - 5, wy, 10, 14);
      g.beginPath(); g.arc(x, wy, 5, Math.PI, 0); g.fill();
    }
    if (ruined){
      g.fillStyle = '#a89880';
      g.beginPath();
      g.moveTo(x-w/2, top+4); g.lineTo(x-w/4, top-8); g.lineTo(x, top+2);
      g.lineTo(x+w/3, top-6); g.lineTo(x+w/2, top+4); g.closePath(); g.fill();
    } else {
      g.fillStyle = '#b8a888';
      g.beginPath();
      g.moveTo(x-w/2-2, top); g.lineTo(x, top-12); g.lineTo(x+w/2+2, top); g.closePath(); g.fill();
    }
    g.fillStyle = '#2a2218';
    g.fillRect(x-1.5, top-22, 3, 16);
    g.fillRect(x-6, top-18, 12, 3);
  }

  churchTower(70,  baseY-110, 28, false);
  churchTower(110, baseY-88,  22, true);
  churchTower(42,  baseY-70,  18, true);
  churchTower(W-80,  baseY-100, 26, false);
  churchTower(W-120, baseY-78,  20, true);
  churchTower(W-48,  baseY-64,  18, true);

  function ruinBlock(x, w, h, col){
    g.fillStyle = col;
    g.fillRect(x, baseY-h, w, h);
    g.fillStyle = 'rgba(0,0,0,0.25)';
    g.fillRect(x, baseY-h, 4, h);
    g.fillStyle = col;
    g.beginPath();
    g.moveTo(x, baseY-h);
    for (let i=0;i<5;i++){
      const px = x + (i+1)*(w/5);
      g.lineTo(px, baseY-h - (hash(x+i)*10-3));
    }
    g.lineTo(x+w, baseY-h); g.closePath(); g.fill();
    g.fillStyle = 'rgba(15,10,8,0.9)';
    for (let i=0;i<2;i++) for (let j=0;j<2;j++)
      g.fillRect(x+8+i*18, baseY-h+12+j*20, 10, 14);
  }
  ruinBlock(150, 70, 48, '#9a8a72');
  ruinBlock(230, 55, 38, '#8a7a62');
  ruinBlock(W-230, 60, 52, '#9a8a72');
  ruinBlock(W-160, 50, 36, '#8a7a62');

  g.fillStyle = 'rgba(60,45,35,0.7)';
  for (let i=0;i<18;i++){
    const dx = 40 + hash(i*2.1)* (W-80);
    const dy = 20 + hash(i*3.3)* (baseY-40);
    const s = 3 + hash(i)*8;
    g.save(); g.translate(dx, dy); g.rotate(hash(i*7)*6);
    g.fillRect(-s/2, -s/2, s, s*0.7); g.restore();
  }

  // CENTRAL COLOSSAL STATUE
  const sx = W*0.5, sy = baseY;
  g.fillStyle = '#5a5048';
  g.fillRect(sx-36, sy-18, 72, 18);
  g.fillStyle = '#3a3530';
  g.fillRect(sx-40, sy-4, 80, 6);
  g.fillStyle = 'rgba(255,255,255,0.08)';
  g.fillRect(sx-36, sy-18, 72, 3);
  g.fillStyle = '#6a6460';
  g.fillRect(sx-16, sy-48, 12, 32);
  g.fillRect(sx+4, sy-48, 12, 32);
  g.fillStyle = '#3a3530';
  g.fillRect(sx-18, sy-20, 16, 8);
  g.fillRect(sx+2, sy-20, 16, 8);
  g.fillStyle = '#7a7470';
  g.fillRect(sx-20, sy-88, 40, 42);
  g.fillStyle = 'rgba(200,190,180,0.25)';
  g.fillRect(sx-16, sy-84, 14, 30);
  g.fillStyle = '#6a1820';
  g.beginPath();
  g.moveTo(sx+18, sy-86); g.lineTo(sx+34, sy-40); g.lineTo(sx+22, sy-36); g.lineTo(sx+14, sy-70);
  g.closePath(); g.fill();
  g.fillStyle = '#8c2230';
  g.beginPath();
  g.moveTo(sx+18, sy-86); g.lineTo(sx+28, sy-50); g.lineTo(sx+20, sy-48); g.lineTo(sx+14, sy-72);
  g.closePath(); g.fill();
  g.fillStyle = '#6a6460';
  g.fillRect(sx-32, sy-82, 12, 28);
  g.fillRect(sx+18, sy-86, 12, 22);
  g.fillStyle = '#8a8480';
  g.fillRect(sx-10, sy-108, 20, 22);
  g.fillStyle = '#2a2826';
  g.fillRect(sx-6, sy-100, 5, 4); g.fillRect(sx+2, sy-100, 5, 4);
  g.fillStyle = '#5a5550';
  g.fillRect(sx-12, sy-110, 24, 6);
  g.fillStyle = '#2a2e34';
  g.fillRect(sx+22, sy-150, 4, 120);
  g.fillStyle = '#4a5058';
  g.fillRect(sx+20, sy-156, 8, 14);
  g.fillStyle = '#6a7078';
  g.beginPath(); g.moveTo(sx+20, sy-156); g.lineTo(sx+24, sy-168); g.lineTo(sx+28, sy-156); g.closePath(); g.fill();

  for (let i=0;i<14;i++){
    const fx = 30 + i*68 + Math.sin(i)*8, fy = baseY - 2;
    const fh = 10 + hash(i*4.2)*16;
    g.fillStyle = 'rgba(201,51,30,0.85)';
    g.beginPath(); g.moveTo(fx-5, fy); g.quadraticCurveTo(fx-2, fy-fh*0.55, fx, fy-fh);
    g.quadraticCurveTo(fx+2, fy-fh*0.55, fx+5, fy); g.closePath(); g.fill();
    g.fillStyle = 'rgba(255,180,50,0.9)';
    g.beginPath(); g.moveTo(fx-2.5, fy); g.quadraticCurveTo(fx, fy-fh*0.4, fx+2.5, fy); g.closePath(); g.fill();
  }

  g.fillStyle = '#3a2a22';
  for (let i=0;i<16;i++){
    const rx = (i*61 + 15) % W, rw = 14 + hash(i*5)*20;
    g.beginPath();
    g.moveTo(rx, baseY); g.lineTo(rx+rw*0.4, baseY-5-hash(i)*5); g.lineTo(rx+rw, baseY);
    g.closePath(); g.fill();
  }

  const fog = g.createLinearGradient(0, baseY-40, 0, baseY+4);
  fog.addColorStop(0, 'rgba(80,50,30,0)'); fog.addColorStop(1, 'rgba(60,35,20,0.55)');
  g.fillStyle = fog; g.fillRect(0, baseY-40, W, 50);

  return c;
}

function buildSPQMCityRuined(){ return buildSPQMCity(true); }

/* ------------------------------------------------ TORONTO / BOREALIAN CAPITAL */
function buildToronto(){
  const c = newCanvas(W, BD_H), g = c.getContext('2d');
  const baseY = BD_H - 12;

  // Toronto dusk: cold blue glass, a faint emerald Borealian glow, and a
  // visible lakefront. Every height below is constrained to BD_H so the
  // skyline cannot be clipped above the backdrop canvas like the old build.
  const sky = g.createLinearGradient(0,0,0,BD_H);
  sky.addColorStop(0,'#071524');
  sky.addColorStop(0.48,'#17364f');
  sky.addColorStop(0.78,'#35616d');
  sky.addColorStop(1,'#70918b');
  g.fillStyle=sky; g.fillRect(0,0,W,BD_H);

  const glow = g.createRadialGradient(W*.61,BD_H*.50,6,W*.61,BD_H*.50,290);
  glow.addColorStop(0,'rgba(103,255,139,.20)');
  glow.addColorStop(.55,'rgba(56,185,122,.07)');
  glow.addColorStop(1,'rgba(40,110,105,0)');
  g.fillStyle=glow; g.fillRect(0,0,W,BD_H);

  // Lake Ontario strip behind the city.
  g.fillStyle='#153747'; g.fillRect(0,baseY-16,W,28);
  g.fillStyle='rgba(192,237,236,.16)';
  for(let i=0;i<18;i++) g.fillRect((i*61 + (i%3)*11)%W, baseY-12+(i%3)*4, 38+(i%4)*8, 1);

  function tower(x,w,h,body,edge,seed,stepX=10,stepY=12){
    h=Math.min(h,baseY-7);
    const y=baseY-h;
    const grad=g.createLinearGradient(x,y,x+w,y+h);
    grad.addColorStop(0,edge); grad.addColorStop(.45,body); grad.addColorStop(1,'#09151c');
    g.fillStyle=grad; g.fillRect(x,y,w,h);
    g.fillStyle='rgba(210,244,250,.09)'; g.fillRect(x+2,y+2,2,h-4);
    g.strokeStyle='rgba(3,10,15,.72)'; g.lineWidth=1; g.strokeRect(x+.5,y+.5,w-1,h-1);
    for(let wy=y+8; wy<baseY-6; wy+=stepY){
      for(let wx=x+6; wx<x+w-6; wx+=stepX){
        const lit=hash(seed + wx*.37 + wy*.61)>.43;
        g.fillStyle=lit ? 'rgba(185,244,225,.68)' : 'rgba(48,95,110,.44)';
        g.fillRect(wx,wy,Math.max(2,stepX-5),4);
      }
    }
  }

  // Far layer: compact silhouettes create a dense downtown horizon.
  for(let i=0;i<26;i++){
    const x=i*39-18, w=25+(i%4)*5, h=36+(i*17%48);
    g.fillStyle=i%3===0?'#17303b':i%3===1?'#1c3942':'#122a35';
    g.fillRect(x,baseY-h,w,h);
    g.fillStyle='rgba(133,205,200,.20)';
    for(let yy=baseY-h+7; yy<baseY-5; yy+=11) g.fillRect(x+5,yy,Math.max(3,w-10),2);
  }

  // Foreground high-rises. They deliberately reach high into the backdrop,
  // making Toronto read as a real vertical downtown rather than low huts.
  const skyline=[
    [8,58,96,'#244754','#315d68',11], [73,46,122,'#183947','#2b5966',21],
    [126,54,82,'#274a54','#38636a',31], [188,65,136,'#1b3d4d','#356372',41],
    [263,48,103,'#223f4c','#3b6570',51], [320,66,146,'#163643','#315966',61],
    [401,55,115,'#254a58','#47707a',71], [466,60,132,'#173844','#315f69',81],
    [535,48,93,'#24434c','#416975',91], [594,54,126,'#193845','#315c68',101],
    [708,61,118,'#21414d','#3d6570',121], [778,52,139,'#173744','#315d69',131],
    [840,62,104,'#23444f','#416a74',141], [908,45,128,'#183945','#315d68',151]
  ];
  for(const t of skyline) tower(...t);

  // CN Tower — unmistakable, fully visible, and near the center of the
  // Toronto skyline. The old version extended far above BD_H and was clipped.
  const cx=674, top=5, deckY=51, lowerDeck=61;
  // tapered concrete shaft
  g.fillStyle='#aebbc0';
  g.beginPath();
  g.moveTo(cx-3,deckY+8); g.lineTo(cx-9,baseY); g.lineTo(cx+9,baseY); g.lineTo(cx+3,deckY+8);
  g.closePath(); g.fill();
  g.fillStyle='rgba(244,252,252,.40)';
  g.beginPath(); g.moveTo(cx-1,deckY+8); g.lineTo(cx-4,baseY); g.lineTo(cx+1,baseY); g.lineTo(cx+1,deckY+8); g.closePath(); g.fill();
  // main observation pod / ring
  g.fillStyle='#0d222b'; g.fillRect(cx-25,deckY,50,10);
  g.fillStyle='#315a61'; g.fillRect(cx-29,deckY+3,58,5);
  g.fillStyle='#8eea82'; g.fillRect(cx-25,deckY+4,50,2);
  g.fillStyle='#b8c5c7'; g.fillRect(cx-17,lowerDeck,34,6);
  g.fillStyle='#203d45'; g.fillRect(cx-14,lowerDeck+2,28,3);
  // antenna/needle with aviation light
  g.fillStyle='#cfd8dc'; g.fillRect(cx-2,top+5,4,deckY-top-5);
  g.fillStyle='#e9f0f2'; g.fillRect(cx-1,top,2,11);
  g.fillStyle='#ff6b5b'; g.fillRect(cx-2,top-1,4,4);
  g.fillStyle='rgba(255,107,91,.28)'; g.fillRect(cx-5,top-4,10,10);

  // Front waterfront towers + Borealian emerald banners.
  for(const bx of [25,235,455,820]){
    g.fillStyle='#0b171d'; g.fillRect(bx,baseY-52,76,52);
    g.fillStyle='#17362a'; g.fillRect(bx+19,baseY-48,38,42);
    g.fillStyle='#8eea82'; g.fillRect(bx+34,baseY-43,8,29);
    g.fillRect(bx+27,baseY-31,22,5);
    g.fillStyle='rgba(210,255,218,.35)'; g.fillRect(bx+20,baseY-47,36,2);
  }

  // Dark promenade / battle-plane horizon edge.
  g.fillStyle='#101b1b'; g.fillRect(0,baseY,W,BD_H-baseY);
  g.fillStyle='rgba(142,234,130,.25)'; g.fillRect(0,baseY,W,2);
  return c;
}

function buildCanadaDominion(){ return buildToronto(); }
function buildAmericaFortress(){ return buildDCInvaded(); }

const STAGE_BUILDERS = {
  california: buildCalifornia, empire: buildEmpire, siege: buildSiege, newyork: buildNewYork,
  ambitious: buildAmbitious, dc: buildDC, dcdamaged: buildDCDamaged, dcinvaded: buildDCInvaded, texas: buildTexas, budapest: buildBudapest,
  towertop: buildTowerTop, earthmap: buildEarthMap, basingse: buildBaSingSe, antarctica: buildAntarcticaCathedral,
  sicily: buildSicilyBunker, toronto: buildToronto, canada: buildCanadaDominion, americafort: buildAmericaFortress, spqmcity: buildSPQMCity, spqmruins: buildSPQMCityRuined,
  spqmcapital: buildSPQMCapitalDestroyed
};
function stageBackdrop(kind){
  if (!STAGE_CACHE[kind]) STAGE_CACHE[kind] = STAGE_BUILDERS[kind](); // rebuilt
  return STAGE_CACHE[kind];
}

/* ------------------------------------------------------------- ground */
function drawGround(kind, t){
  const y0 = HORIZON, hgt = STAGE.y + STAGE.h - HORIZON;
  // palette matched to each stage backdrop edge
  let a, b, line, tint, blockA, blockB;
  if (kind === 'california'){
    a='#e8d4a4'; b='#c4a06a'; line='rgba(255,255,255,0.12)'; tint='rgba(255,196,90,0.12)';
    blockA='#d9c08a'; blockB='#b8975f';
  } else if (kind === 'empire'){
    a='#2e2a3a'; b='#161320'; line='rgba(240,164,35,0.14)'; tint='rgba(120,80,200,0.10)';
    blockA='#2a2733'; blockB='#18151f';
  } else if (kind === 'siege'){
    a='#4a3228'; b='#221612'; line='rgba(255,110,40,0.16)'; tint='rgba(255,80,25,0.12)';
    blockA='#3a2a24'; blockB='#1c1210';
  } else if (kind === 'ambitious'){
    a='#c7aa72'; b='#715b3b'; line='rgba(255,235,175,0.16)'; tint='rgba(30,130,150,0.06)';
    blockA='#b79a63'; blockB='#8f7348';
  } else if (kind === 'dc'){
    a='#6a8a5a'; b='#3a5a3a'; line='rgba(255,255,255,0.10)'; tint='rgba(70,140,220,0.08)';
    blockA='#5a7a4a'; blockB='#3a5a32';
  } else if (kind === 'dcdamaged'){
    a='#697556'; b='#414a35'; line='rgba(255,225,180,0.10)'; tint='rgba(145,90,50,0.08)';
    blockA='#5b684b'; blockB='#424a38';
  } else if (kind === 'dcinvaded'){
    a='#5a4530'; b='#2e2016'; line='rgba(255,140,50,0.16)'; tint='rgba(200,70,20,0.13)';
    blockA='#4c3a26'; blockB='#2a1d13';
  } else if (kind === 'texas'){
    a='#c9a35e'; b='#8f6a35'; line='rgba(255,230,170,0.14)'; tint='rgba(255,170,80,0.10)';
    blockA='#b6893f'; blockB='#93692c';
  } else if (kind === 'toronto'){
    a='#3e5d4b'; b='#182a21'; line='rgba(142,234,130,0.16)'; tint='rgba(85,210,115,0.08)';
    blockA='#355343'; blockB='#243b30';
  } else if (kind === 'canada'){
    a='#687f95'; b='#314558'; line='rgba(245,245,255,0.14)'; tint='rgba(150,180,220,0.08)';
    blockA='#64798c'; blockB='#4d6070';
  } else if (kind === 'americafort'){
    a='#eef3f7'; b='#b7c7d5'; line='rgba(170,195,225,0.24)'; tint='rgba(180,210,240,0.08)';
    blockA='#e0e8ee'; blockB='#c9d4de';
  } else if (kind === 'budapest'){
    a='#8a9aa8'; b='#4a5a6a'; line='rgba(220,235,255,0.12)'; tint='rgba(90,130,180,0.10)';
    blockA='#7a8a98'; blockB='#4e5c6a';
  } else if (kind === 'towertop'){
    a='#3a3c46'; b='#17181e'; line='rgba(200,215,205,0.10)'; tint='rgba(120,140,120,0.06)';
    blockA='#33353e'; blockB='#1c1d24';
  } else if (kind === 'earthmap'){
    a='#0e1420'; b='#03050a'; line='rgba(47,191,63,0.22)'; tint='rgba(47,191,63,0.10)';
    blockA='#0c121c'; blockB='#050810';
  } else if (kind === 'basingse'){
    a='#d8ae6a'; b='#8f6435'; line='rgba(255,232,180,0.16)'; tint='rgba(224,115,58,0.08)';
    blockA='#c9975a'; blockB='#a17540';
  } else if (kind === 'antarctica'){
    a='#eef4f8'; b='#b9c8d4'; line='rgba(180,215,235,0.22)'; tint='rgba(150,200,230,0.08)';
    blockA='#e2eaf0'; blockB='#c4d2dc';
  } else if (kind === 'sicily'){
    a='#8ab058'; b='#5a7a38'; line='rgba(230,240,180,0.16)'; tint='rgba(140,180,90,0.08)';
    blockA='#7ca04c'; blockB='#5f8038';
  } else if (kind === 'spqmcity'){
    // ordinary grass — his capital is untouched in phase 1
    a='#7fa84a'; b='#4f7030'; line='rgba(226,242,180,0.14)'; tint='rgba(130,175,80,0.07)';
    blockA='#729942'; blockB='#557a34';
  } else if (kind === 'spqmruins' || kind === 'spqmcapital'){
    // scorched earth and ash where the grass used to be
    a='#5a4632'; b='#2e231a'; line='rgba(255,150,70,0.14)'; tint='rgba(200,90,30,0.09)';
    blockA='#4e3b2a'; blockB='#33271c';
  } else {
    a='#1e2a22'; b='#0c1410'; line='rgba(47,191,63,0.18)'; tint='rgba(47,191,63,0.10)';
    blockA='#1a2420'; blockB='#0e1612';
  }

  // base fill matching backdrop shore/street color
  const gr = ctx.createLinearGradient(0, y0, 0, y0+hgt);
  gr.addColorStop(0, b); gr.addColorStop(0.4, a); gr.addColorStop(1, b);
  ctx.fillStyle = gr; ctx.fillRect(0, y0, W, hgt);

  // minecraft-style block tiles that grow larger toward camera — skipped for
  // 'towertop', which draws its own bounded rooftop platform below instead;
  // this generic full-width grid is what made it read as a straight road
  // rather than a platform when it bled through the tower's edges
  if (kind !== 'towertop'){
    for (let row=0; row<9; row++){
      const p0 = row/9, p1 = (row+1)/9;
      const yA = y0 + Math.pow(p0,1.45)*hgt;
      const yB = y0 + Math.pow(p1,1.45)*hgt;
      const rowH = Math.max(4, yB - yA);
      const cols = 10 + row*2;
      const bw = W / cols;
      for (let c=0; c<cols; c++){
        const shade = ((c+row)%2===0) ? blockA : blockB;
        ctx.fillStyle = shade;
        ctx.fillRect(Math.floor(c*bw), Math.floor(yA), Math.ceil(bw)+1, Math.ceil(rowH)+1);
        // subtle top edge highlight
        ctx.fillStyle = 'rgba(255,255,255,0.04)';
        ctx.fillRect(Math.floor(c*bw), Math.floor(yA), Math.ceil(bw), 1);
      }
    }

    // perspective lines on top of blocks
    ctx.strokeStyle = line; ctx.lineWidth = 1;
    for (let i=0;i<10;i++){
      const p = i/9, yy = y0 + Math.pow(p,1.5)*hgt;
      ctx.beginPath(); ctx.moveTo(0, yy); ctx.lineTo(W, yy); ctx.stroke();
    }
    for (let i=-14;i<=14;i++){
      ctx.beginPath();
      ctx.moveTo(W/2 + i*22, y0);
      ctx.lineTo(W/2 + i*96, y0+hgt);
      ctx.stroke();
    }
  }
  if (kind === 'siege'){
    // lava cracks + embers on floor
    ctx.strokeStyle = 'rgba(255,120,30,' + (0.35+0.15*Math.sin(t*3)) + ')';
    ctx.lineWidth = 3;
    for (let i=0;i<8;i++){
      const x = 60 + i*115, yy = y0 + 30 + (i%3)*65;
      ctx.beginPath();
      ctx.moveTo(x, yy);
      ctx.lineTo(x+36, yy+16); ctx.lineTo(x+14, yy+40); ctx.lineTo(x+58, yy+62);
      ctx.stroke();
    }
    ctx.fillStyle = 'rgba(255,90,20,' + (0.15+0.1*Math.sin(t*4)) + ')';
    for (let i=0;i<10;i++) ctx.fillRect(80+i*90, y0+50+(i%4)*40, 14, 6);
  }
  if (kind === 'newyork'){
    // road stripes
    ctx.fillStyle = 'rgba(200,220,200,0.22)';
    for (let i=0;i<14;i++) ctx.fillRect(40+i*70, y0+hgt*0.55, 32, 4);
  }
  if (kind === 'california'){
    // sand grain
    ctx.fillStyle = 'rgba(255,240,200,0.08)';
    for (let i=0;i<20;i++) ctx.fillRect((hash(i*2.1)*W)|0, y0+20+(hash(i)*hgt)|0, 6, 3);
  }
  if (kind === 'empire'){
    // obsidian sheen
    ctx.fillStyle = 'rgba(240,164,35,0.06)';
    for (let i=0;i<8;i++) ctx.fillRect(50+i*110, y0+40+(i%3)*50, 40, 5);
  }
  if (kind === 'ambitious'){
    // Water at the edges, with a broad central sandy island for the arena.
    ctx.fillStyle='#164d61';
    ctx.fillRect(0,y0,W,Math.max(18,hgt*0.22));
    ctx.fillStyle='#c7aa72';
    ctx.beginPath();
    ctx.moveTo(115,y0+12); ctx.lineTo(845,y0+12);
    ctx.lineTo(W+30,H); ctx.lineTo(-30,H); ctx.closePath(); ctx.fill();
    // shore blocks
    ctx.fillStyle='#e0c78d';
    for(let i=0;i<24;i++){
      const x=(hash(i*5.3)*W)|0;
      const yy=y0+20+(hash(i*8.1)*hgt*.55)|0;
      ctx.fillRect(x,yy,10+(i%3)*5,3);
    }
    // dock planks
    ctx.fillStyle='#6b452d';
    for(let i=0;i<10;i++) ctx.fillRect(420+i*14,y0+8+(i%2)*5,11,5);
  }
  if (kind === 'towertop'){
    // A rooftop platform atop Orthanc, drawn as a proper 3D trapezoid —
    // narrower at the far (horizon) edge, wider near the camera. Kept for
    // reference/reuse; RomanDiCario's phase 3 now takes place in the ruins
    // of his city instead, so nothing currently selects this stage.
    const platL_far = W*0.40, platR_far = W*0.60;
    const platL_near = W*0.27, platR_near = W*0.73;
    const edgeL = (yy) => lerp(platL_far, platL_near, Math.max(0, Math.min(1, (yy - y0) / hgt)));
    const edgeR = (yy) => lerp(platR_far, platR_near, Math.max(0, Math.min(1, (yy - y0) / hgt)));

    // hazy green terrain falling away on both sides, continuous with the backdrop
    ctx.save();
    const dropGrad = ctx.createLinearGradient(0,y0,0,y0+hgt);
    dropGrad.addColorStop(0,'#8a9a8e'); dropGrad.addColorStop(0.5,'#5c6f5a'); dropGrad.addColorStop(1,'#3a4a38');
    ctx.fillStyle = dropGrad; ctx.fillRect(0, y0, W, hgt);
    // faint hazy ground texture through the drop, always outside the platform's widest (near) edge
    for (let i=0;i<16;i++){
      const side = i%2===0 ? hash(i*3.1)*platL_near : platR_near + hash(i*3.1)*(W-platR_near);
      const yy = y0 + hash(i*7.7)*hgt*0.8;
      ctx.fillStyle = 'rgba(60,90,50,' + (0.12+hash(i*5.3)*0.18) + ')';
      ctx.fillRect(side|0, yy|0, 10+((i%3)*5), 4);
    }
    // a soft white haze band, thicker toward the bottom, selling the altitude
    for (const [x0,x1] of [[0,platL_near],[platR_near,W]]){
      const hz = ctx.createLinearGradient(0,y0+hgt*0.4,0,y0+hgt);
      hz.addColorStop(0,'rgba(210,218,210,0)'); hz.addColorStop(1,'rgba(210,218,210,0.5)');
      ctx.fillStyle = hz; ctx.fillRect(x0, y0, x1-x0, hgt);
    }
    ctx.restore();

    // the stone platform itself, clipped to a trapezoid so its floor bands
    // converge toward the horizon like a real 3D surface, not a flat rect
    ctx.save();
    ctx.beginPath();
    ctx.moveTo(platL_far, y0);
    ctx.lineTo(platR_far, y0);
    ctx.lineTo(platR_near, y0+hgt);
    ctx.lineTo(platL_near, y0+hgt);
    ctx.closePath();
    ctx.clip();
    ctx.fillStyle = '#33353e'; ctx.fillRect(0, y0, W, hgt);
    for (let i=0;i<6;i++){
      ctx.fillStyle = (i%2===0) ? '#33353e' : '#1c1d24';
      ctx.fillRect(0, y0 + i*(hgt/6), W, hgt/6);
    }
    // seam lines converging toward the horizon — a real depth cue
    ctx.strokeStyle = 'rgba(0,0,0,0.3)'; ctx.lineWidth = 1;
    for (let i=-3;i<=3;i++){
      ctx.beginPath();
      ctx.moveTo(W/2 + i*(platR_far-platL_far)/7, y0);
      ctx.lineTo(W/2 + i*(platR_near-platL_near)/7, y0+hgt);
      ctx.stroke();
    }
    ctx.restore();

    // crenellated parapet walls running along both slanted edges, with a
    // lit top face and a darker front face so they read as raised 3D
    // battlements rather than a flat outline — this is what actually sells
    // "you are standing on top of a walled tower"
    const merlons = 16;
    for (let side=-1; side<=1; side+=2){
      for (let i=0;i<merlons;i++){
        const t0 = i/merlons, t1 = (i+1)/merlons;
        const yy0 = y0 + t0*hgt, yy1 = y0 + t1*hgt;
        const ex0 = side<0 ? edgeL(yy0) : edgeR(yy0);
        const wallH = lerp(5, 18, t0);
        if (i % 2 === 0){
          // raised merlon: dark front face + a thin lit top edge
          const x0 = side<0 ? ex0 - wallH*0.6 : ex0;
          ctx.fillStyle = '#232530';
          ctx.fillRect(x0, yy0 - wallH*0.55, wallH*0.6, (yy1-yy0) + wallH*0.55);
          ctx.fillStyle = '#4a4d58';
          ctx.fillRect(x0, yy0 - wallH*0.55, wallH*0.6, 3);
        } else {
          // lower gap between merlons
          const x0 = side<0 ? ex0 - wallH*0.4 : ex0;
          ctx.fillStyle = '#18191f';
          ctx.fillRect(x0, yy0, wallH*0.4, yy1-yy0);
        }
      }
    }
  }
  ctx.fillStyle = tint; ctx.fillRect(0, y0, W, hgt);
  const hs = ctx.createLinearGradient(0, y0, 0, y0+34);
  hs.addColorStop(0,'rgba(0,0,0,0.5)'); hs.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle = hs; ctx.fillRect(0, y0, W, 34);
}

/* animated foreground effects per stage */
function drawStageFX(kind, t){
  if (kind === 'california'){
    // warm golden haze + floating dust motes
    ctx.fillStyle = 'rgba(255,230,160,0.06)';
    ctx.fillRect(0, STAGE.y, W, STAGE.h);
    for (let i=0;i<18;i++){
      const x = (hash(i*7.1)*W + Math.sin(t*0.6+i)*30) % W;
      const y = STAGE.y + 40 + hash(i*3.3)*(HORIZON-STAGE.y-20);
      ctx.fillStyle = 'rgba(255,245,200,' + (0.15+0.2*Math.sin(t*2+i)) + ')';
      ctx.fillRect(x|0, y|0, 2, 2);
    }
  } else if (kind === 'siege'){
    // dense rising embers + ash
    for (let i=0;i<80;i++){
      const s2 = (t*32 + i*37) % (BD_H+160);
      const x = (hash(i*4.4)*W + Math.sin(t*1.6+i)*22);
      const y = HORIZON + 40 - s2;
      if (y < STAGE.y-10) continue;
      const a = Math.max(0, 1 - s2/(BD_H+160));
      const sz = 2 + (i%4);
      ctx.fillStyle = 'rgba(255,' + (90+((i*41)%120)|0) + ',25,' + (a*0.95) + ')';
      ctx.fillRect(x|0, y|0, sz, sz);
    }
    // heat haze pulse
    const pulse = 0.08 + 0.05*Math.sin(t*2.8);
    ctx.fillStyle = 'rgba(230,45,8,' + pulse + ')';
    ctx.fillRect(0, STAGE.y, W, STAGE.h);
    // skyline fire columns
    for (let i=0;i<12;i++){
      const fx = 25 + i*80 + Math.sin(t*1.3+i)*8;
      const fh = 14 + (Math.sin(t*6+i)*8|0);
      ctx.fillStyle = 'rgba(255,150,40,' + (0.2+0.15*Math.sin(t*7+i)) + ')';
      ctx.fillRect(fx|0, HORIZON-fh, 10+(i%3)*4, fh);
      ctx.fillStyle = 'rgba(255,220,80,' + (0.15+0.1*Math.sin(t*9+i)) + ')';
      ctx.fillRect((fx+3)|0, HORIZON-fh-6, 5, 8);
    }
  } else if (kind === 'newyork'){
    // soft green owner-console glow only (no scrolling command chat)
    ctx.fillStyle = 'rgba(47,191,63,0.05)';
    ctx.fillRect(0, STAGE.y, W, STAGE.h);
  } else if (kind === 'empire'){
    // cold violet haze + drifting star-dust
    ctx.fillStyle = 'rgba(90,50,180,0.06)';
    ctx.fillRect(0, STAGE.y, W, STAGE.h);
    for (let i=0;i<22;i++){
      const x = (hash(i*9.2)*W + t*12) % W;
      const y = STAGE.y + hash(i*5.5)*(HORIZON-STAGE.y);
      ctx.fillStyle = 'rgba(255,210,120,' + (0.12+0.18*Math.sin(t*3+i)) + ')';
      ctx.fillRect(x|0, y|0, 1+(i%2), 1+(i%2));
    }
  } else if (kind === 'ambitious'){
    // moonlit sea shimmer and drifting petals.
    ctx.fillStyle='rgba(100,220,220,0.05)';
    ctx.fillRect(0,STAGE.y,W,STAGE.h);
    for(let i=0;i<18;i++){
      const x=(hash(i*11.2)*W + t*(8+i%3))%W;
      const y=HORIZON+8+hash(i*4.7)*42;
      ctx.fillStyle='rgba(190,245,240,'+(0.16+0.12*Math.sin(t*2+i))+')';
      ctx.fillRect(x|0,y|0,12+(i%4)*4,2);
    }
    for(let i=0;i<10;i++){
      const x=(hash(i*13.7)*W + Math.sin(t+i)*14)%W;
      const y=STAGE.y+30+hash(i*3.9)*(HORIZON-STAGE.y-20);
      ctx.fillStyle='rgba(255,220,225,.35)';
      ctx.fillRect(x|0,y|0,3,2);
    }
  } else if (kind === 'dcdamaged'){
    // Toast Phase II: isolated smoke, sparks and small fires only. No SPQM troops.
    ctx.fillStyle='rgba(95,63,42,'+(0.025+0.015*Math.sin(t*1.7))+')';
    ctx.fillRect(0,STAGE.y,W,STAGE.h);
    const fires=[[278,HORIZON-10],[690,HORIZON-16],[825,HORIZON-6]];
    for(let i=0;i<fires.length;i++){
      const [fx,fy]=fires[i], pulse=.55+.45*Math.sin(t*8+i*2.1);
      ctx.fillStyle='rgba(255,115,40,'+(0.18+.16*pulse)+')';
      ctx.fillRect(fx-5,fy-10-pulse*7,10,10+pulse*7);
      ctx.fillStyle='rgba(255,210,95,'+(0.12+.12*pulse)+')';
      ctx.fillRect(fx-2,fy-13-pulse*5,4,8+pulse*5);
    }
    for(let i=0;i<14;i++){
      const x=(hash(i*8.3)*W + Math.sin(t*.35+i)*12);
      const y=HORIZON-22-hash(i*3.7)*105;
      ctx.fillStyle='rgba(70,68,72,'+(0.025+0.035*Math.sin(t*.8+i)*.5+.035)+')';
      ctx.fillRect(x|0,y|0,8+(i%4)*4,3+(i%3)*2);
    }
  } else if (kind === 'dcinvaded'){
    /* the city is a live battlefield behind the duel: two infantry lines
       running at each other across the mall, and an SPQM gun line on the
       right shelling what is left of the federal buildings */
    const midY = HORIZON - 12;

    // firelit haze over everything
    ctx.fillStyle = 'rgba(200,70,20,' + (0.07 + 0.03*Math.sin(t*1.6)) + ')';
    ctx.fillRect(0, STAGE.y, W, STAGE.h);

    /* one tiny marching silhouette; legs scissor off a per-figure phase so
       the line doesn't step in lockstep */
    function trooper(x, y, dir, col, ph, sc){
      const s = sc || 1;
      const leg = Math.sin(t*9 + ph) * 3 * s;
      ctx.fillStyle = col;
      ctx.fillRect(x-2*s, y-11*s, 4*s, 7*s);
      ctx.fillRect(x-2*s, y-15*s, 4*s, 4*s);
      ctx.fillRect(x-1*s, y-4*s+leg*0.2, 2*s, 4*s+leg);
      ctx.fillRect(x-1*s, y-4*s-leg*0.2, 2*s, 4*s-leg);
      ctx.fillRect(x + dir*2*s, y-10*s, 5*s*dir, 1.6*s);
    }

    // --- SPQM line charging in from the right, Americans holding left ---
    for (let i=0;i<14;i++){
      const ph = i*1.7;
      const adv = (t*26 + i*37) % (W*0.52);
      const x = W*0.94 - adv;
      const y = midY + ((i%3)-1)*7;
      trooper(x, y, -1, 'rgba(96,20,30,0.92)', ph, 0.9 + (i%3)*0.12);
    }
    for (let i=0;i<12;i++){
      const ph = i*2.3;
      const adv = (t*22 + i*41) % (W*0.46);
      const x = W*0.06 + adv;
      const y = midY + ((i%3)-1)*7 + 2;
      trooper(x, y, 1, 'rgba(30,44,92,0.92)', ph, 0.9 + (i%2)*0.12);
    }

    // --- where the two lines meet: clash sparks and fallen figures ---
    for (let i=0;i<6;i++){
      const cxc = W*0.34 + Math.sin(t*0.7 + i*2.1)*W*0.13;
      const cyc = midY + ((i%3)-1)*7;
      const flick = Math.sin(t*13 + i*3.3);
      if (flick > 0.55){
        ctx.fillStyle = 'rgba(255,235,170,' + (0.5 + 0.4*flick) + ')';
        ctx.fillRect(cxc-2, cyc-11, 5, 2);
        ctx.fillStyle = 'rgba(255,180,60,0.5)';
        ctx.fillRect(cxc-5, cyc-13, 11, 1);
      }
      ctx.fillStyle = i%2 ? 'rgba(96,20,30,0.55)' : 'rgba(30,44,92,0.55)';
      ctx.fillRect(cxc-6 + i*3, cyc-2, 9, 3);
    }

    // --- SPQM cannon battery on the right, shelling the skyline ---
    const guns = [[W-58, midY+4], [W-96, midY-2], [W-136, midY+6]];
    guns.forEach((gp, gi) => {
      const gx = gp[0], gy = gp[1];
      const cyc = (t*0.62 + gi*0.41) % 1;
      const recoil = cyc < 0.10 ? (0.10-cyc)*40 : 0;
      ctx.fillStyle = 'rgba(28,22,20,0.95)';
      ctx.fillRect(gx-9+recoil, gy-7, 12, 6);
      ctx.fillRect(gx-15+recoil, gy-9, 14, 3);
      ctx.fillStyle = 'rgba(18,14,12,0.95)';
      ctx.beginPath(); ctx.arc(gx-2+recoil, gy-1, 4, 0, 7); ctx.fill();
      if (cyc < 0.07){
        const fa = 1 - cyc/0.07;
        const mf = ctx.createRadialGradient(gx-17, gy-8, 1, gx-17, gy-8, 15);
        mf.addColorStop(0,'rgba(255,245,190,' + fa + ')');
        mf.addColorStop(0.45,'rgba(255,150,40,' + (fa*0.7) + ')');
        mf.addColorStop(1,'rgba(255,110,20,0)');
        ctx.fillStyle = mf;
        ctx.beginPath(); ctx.arc(gx-17, gy-8, 15, 0, 7); ctx.fill();
      }
      const tgt = [W*0.50, W*0.30, W*0.72][gi];
      if (cyc > 0.07 && cyc < 0.55){
        const k = (cyc-0.07)/0.48;
        const sx = gx-17 + (tgt - (gx-17))*k;
        const sy = (gy-8) - Math.sin(k*Math.PI)*54;
        ctx.fillStyle = 'rgba(60,50,44,0.9)';
        ctx.fillRect(sx-1.5, sy-1.5, 3, 3);
        ctx.fillStyle = 'rgba(255,180,80,0.35)';
        ctx.fillRect(sx-3, sy-0.5, 4, 1);
      } else if (cyc >= 0.55 && cyc < 0.72){
        const k = (cyc-0.55)/0.17, fa = 1-k;
        const ty = HORIZON - 46;
        const ib = ctx.createRadialGradient(tgt, ty, 2, tgt, ty, 10+k*26);
        ib.addColorStop(0,'rgba(255,240,180,' + fa + ')');
        ib.addColorStop(0.4,'rgba(255,140,40,' + (fa*0.7) + ')');
        ib.addColorStop(1,'rgba(120,40,10,0)');
        ctx.fillStyle = ib;
        ctx.beginPath(); ctx.arc(tgt, ty, 10+k*26, 0, 7); ctx.fill();
      }
    });

    // --- NEAR-BACKDROP FIREFIGHT --------------------------------------
    // Larger silhouettes sit just behind the playable plane. They are still
    // scenery (drawn before actors), but are detailed enough to read as SPQM
    // and American soldiers actively trading fire rather than distant dots.
    function nearSoldier(x,y,dir,team,ph,sc){
      const bob = Math.abs(Math.sin(t*6.5+ph))*2.2*sc;
      const step = Math.sin(t*8.2+ph)*3.1*sc;
      const spqm = team === 'spqm';
      const body = spqm ? 'rgba(91,23,31,0.88)' : 'rgba(37,53,94,0.88)';
      const trim = spqm ? 'rgba(201,162,39,0.82)' : 'rgba(190,196,178,0.78)';
      const skin = 'rgba(162,125,89,0.80)';
      ctx.save(); ctx.translate(x,y-bob); ctx.scale(sc,sc);
      // shadow
      ctx.fillStyle='rgba(0,0,0,0.34)'; ctx.beginPath(); ctx.ellipse(0,2,8,2.7,0,0,7); ctx.fill();
      // legs + boots
      ctx.fillStyle='#25201d';
      ctx.fillRect(-5,-15+step*.25,4,15); ctx.fillRect(2,-15-step*.25,4,15);
      ctx.fillRect(-6,-2+step*.25,6,3); ctx.fillRect(2,-2-step*.25,6,3);
      // torso / straps
      ctx.fillStyle=body; ctx.fillRect(-7,-31,14,17);
      ctx.fillStyle=trim; ctx.fillRect(-1,-31,2,17); ctx.fillRect(-7,-25,14,2);
      // head + helmet
      ctx.fillStyle=skin; ctx.fillRect(-4,-39,8,8);
      ctx.fillStyle=spqm ? '#4b1820' : '#26345b'; ctx.fillRect(-5,-41,10,4);
      ctx.fillRect(-6,-39,12,2);
      // forward arm and rifle
      ctx.fillStyle=body; ctx.fillRect(dir*4,-29,dir*8,4);
      ctx.fillStyle='#171717';
      if(dir>0) ctx.fillRect(8,-28,14,2); else ctx.fillRect(-22,-28,14,2);
      ctx.fillStyle='#5a4430';
      if(dir>0) ctx.fillRect(11,-27,5,3); else ctx.fillRect(-16,-27,5,3);
      // intermittent muzzle flash keyed to phase
      const fire = Math.sin(t*10.5 + ph*2.7);
      if(fire > 0.82){
        const mx = dir>0 ? 23 : -23;
        ctx.fillStyle='rgba(255,238,170,0.95)';
        ctx.beginPath(); ctx.moveTo(mx,-28); ctx.lineTo(mx+dir*9,-32); ctx.lineTo(mx+dir*7,-28); ctx.lineTo(mx+dir*9,-24); ctx.closePath(); ctx.fill();
      }
      ctx.restore();
    }

    // Broken barricades between the two sides.
    ctx.fillStyle='rgba(78,57,38,0.80)';
    for(let i=0;i<6;i++) ctx.fillRect(310+i*17, midY+12+(i%2)*3, 19, 6);
    ctx.fillStyle='rgba(70,56,42,0.78)';
    for(let i=0;i<6;i++) ctx.fillRect(598+i*17, midY+10+((i+1)%2)*3, 19, 6);

    const closeY = HORIZON + 18;
    const closeUS = [
      [188, closeY+6, 1, 0.2, 1.28], [238, closeY-2, 1, 1.5, 1.18],
      [286, closeY+9, 1, 2.6, 1.34], [338, closeY, 1, 4.1, 1.20]
    ];
    const closeSPQM = [
      [772, closeY+5, -1, 0.8, 1.30], [721, closeY-4, -1, 2.0, 1.18],
      [670, closeY+8, -1, 3.3, 1.34], [620, closeY, -1, 4.7, 1.20]
    ];
    closeUS.forEach(s => nearSoldier(s[0],s[1],s[2],'us',s[3],s[4]));
    closeSPQM.forEach(s => nearSoldier(s[0],s[1],s[2],'spqm',s[3],s[4]));

    // Bullet tracers and impacts between the near lines.
    for(let i=0;i<5;i++){
      const cyc = (t*1.85 + i*0.37) % 1;
      if(cyc < 0.30){
        const fromRight = i%2===0;
        const sx = fromRight ? 650+i*14 : 290-i*9;
        const ex = fromRight ? 330+i*8 : 635-i*12;
        const sy = closeY-28 + (i%3)*4;
        const k = cyc/0.30;
        const tx = lerp(sx,ex,k);
        ctx.strokeStyle = fromRight ? 'rgba(255,188,90,0.62)' : 'rgba(220,235,255,0.58)';
        ctx.lineWidth=1.3;
        ctx.beginPath(); ctx.moveTo(tx-(fromRight?-1:1)*14,sy); ctx.lineTo(tx,sy); ctx.stroke();
      }
    }
    // Occasional near impact puff / spark.
    for(let i=0;i<4;i++){
      const flick=Math.sin(t*11+i*2.8);
      if(flick>0.78){
        const ix=420+i*43, iy=closeY-6+(i%2)*6;
        ctx.fillStyle='rgba(255,208,120,'+(0.45+flick*.4)+')';
        ctx.fillRect(ix-4,iy-3,8,2); ctx.fillRect(ix-1,iy-7,2,9);
      }
    }

    // --- embers and ash drifting over the whole scene ---
    for (let i=0;i<46;i++){
      const s2 = (t*30 + i*29) % (BD_H+120);
      const x = (hash(i*4.9)*W + Math.sin(t*1.4+i)*18);
      const y = HORIZON + 26 - s2;
      if (y < STAGE.y-8) continue;
      const a2 = Math.max(0, 1 - s2/(BD_H+120));

  const attackLean = player.swing ? Math.sin(swingK*Math.PI) * (player.swing.step===2 ? 0.13 : 0.08) : 0;

/* cone attack used by melee bosses: hits the player if they are inside an
   arc of `spread` radians centred on `ang`, within `reach`. */
function bossMelee(b, ang, reach, spread, dmg){
  b.armSwingT = 0.24; b.armSwingMax = 0.24;
  const dx = player.x - b.x, dy = (player.y - b.y)*1.4;
  const d = Math.hypot(dx, dy);
  if (d > reach) return false;
  let da = Math.atan2(dy, dx) - ang;
  while (da > Math.PI) da -= Math.PI*2;
  while (da < -Math.PI) da += Math.PI*2;
  if (Math.abs(da) > spread) return false;
  hurtPlayer(dmg);
  return true;
}

/* =====================================================================
   CUSTOM AUDIO — hand-authored music tracks, embedded as data URIs.
   The procedural Music engine drives every other boss; a boss listed in
   CUSTOM_TRACKS bypasses it entirely and plays a real recording instead.
   The track keeps playing across that boss's phase changes rather than
   restarting, so a multi-phase fight stays one continuous piece.
   ===================================================================== */
const CustomAudio = {
  el: null, key: null, pending: null,
  play(key, src){
    if (this.key === key && this.el && !this.el.paused) return;   // already running
    this.stop();
    try {
      const a = new Audio(src);
      a.loop = true;
      a.volume = Music.muted ? 0 : Music.duck;
      this.el = a; this.key = key;
      // browsers block audio until a gesture; retry on the next click/key
      const p = a.play();
      if (p && p.catch) p.catch(() => { this.pending = { key, src }; });
    } catch(e){ /* audio unsupported: fall through silently */ }
  },
  stop(){
    if (this.el){ try { this.el.pause(); this.el.currentTime = 0; } catch(e){} }
    this.el = null; this.key = null; this.pending = null;
  },
  setMuted(m){ if (this.el) this.el.volume = m ? 0 : Music.duck; },
  retry(){
    if (this.pending){ const p = this.pending; this.pending = null; this.play(p.key, p.src); }
    else if (this.el && this.el.paused){ try { this.el.play(); } catch(e){} }
  }
};

/* ---------------------------------------------------------------- fx */
function puff(x,y,col,n,spd,life,size){
  for (let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, v = rnd(spd*0.25, spd);
    parts.push({ x, y, vx:Math.cos(a)*v, vy:Math.sin(a)*v*0.7, life:life||0.5, max:life||0.5,
                 col, size:size||rnd(2,4), g: rnd(30,90) });
  }
}
function leafBurst(x,y,n=30,spd=240){
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, v=rnd(spd*.35,spd);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v*.72-rnd(20,80),life:rnd(.65,1.15),max:1.15,
      col:i%4===0?'#ff9aaa':i%3===0?'#f24b58':'#c91f37',size:rnd(6,11),g:rnd(80,150),kind:'mapleLeaf',rot:rnd(0,Math.PI*2),vr:rnd(-8,8)});
  }
}
function dmgNum(x,y,v,col){ nums.push({x, y, v: typeof v === 'number' ? Math.round(v) : v, t:0.95, col:col||'#ffe7a8'}); }

/* d = damage. force = ignores invincibility frames (used by scripted supers
   like the Ban Hammer, which should never be eaten by a stray chip hit).
   iTime = how long the hit grants invincibility for; contact damage uses a
   short one so brushing a boss cannot shield you from its real attacks. */
function hurtPlayer(d, force, iTime){
  if (!player.alive) return;
  let guarded = false;

  // Guardian pass: F opens a very short perfect-parry window followed by a
  // weaker guard window. Scripted/forced supers still punch through so boss
  // signature attacks cannot be trivialized by holding guard.
  if (!force && player.parryT > 0){
    player.parryT = 0;
    player.guardT = Math.max(player.guardT, 0.22);
    player.perfectParryT = 0.58;
    player.riposteT = 1.25;
    player.iframe = Math.max(player.iframe, 0.28);
    timeScale = Math.min(timeScale, 0.40);
    combatCamera.pulse = Math.max(combatCamera.pulse, 1.15);
    combatCamera.kick = Math.max(combatCamera.kick, 0.45);
    addImpactRing(player.x, player.y-28, '#ffe9a6', true);
    puff(player.x, player.y-28, '#fff2bf', 18, 205, 0.34, 3);
    dmgNum(player.x, player.y-70, 'PERFECT PARRY', '#ffe9a6');
    Music.sfx('block');
    addValor(28);
    // A perfect parry creates breathing room without damaging enemies or
    // changing any boss state. Regular enemies are briefly staggered only.
    for (const e of enemies){
      const dx=e.x-player.x, dy=(e.y-player.y)*1.25, dd=Math.hypot(dx,dy);
      if (dd>0 && dd<112){
        e.kbx += dx/dd*180; e.kby += dy/dd*95;
        e.cd += 0.48; e.flash=Math.max(e.flash,0.10);
      }
    }
    return;
  }
  if (!force && player.guardT > 0){
    const blocked = Math.max(1, Math.round(d*0.45));
    const absorbed = Math.max(0, d-blocked);
    d = blocked;
    player.guardT = Math.max(0, player.guardT-0.12);
    player.iframe = Math.max(player.iframe, 0.16);
    combatCamera.kick = Math.max(combatCamera.kick, 0.22);
    addImpactRing(player.x, player.y-28, '#c8d8e8', false);
    puff(player.x, player.y-28, '#dce9f3', 7, 95, 0.20, 2);
    if (absorbed>0) dmgNum(player.x, player.y-60, 'BLOCK '+Math.round(absorbed), '#c8d8e8');
    Music.sfx('block');
    guarded = true;
  }
  if (!force && !guarded && player.iframe > 0){
    // Rolling through a real hit now has visible, rewarding feedback.
    if (player.rollT > 0 && player.perfectDodgeCd <= 0){
      player.perfectDodgeT = 0.52;
      player.perfectDodgeCd = 0.8;
      timeScale = Math.min(timeScale, 0.48);
      combatCamera.pulse = Math.max(combatCamera.pulse, 1);
      addImpactRing(player.x, player.y-28, '#8fe3ff', true);
      puff(player.x, player.y-28, '#8fe3ff', 14, 170, 0.32, 3);
      dmgNum(player.x, player.y-68, 'PERFECT DODGE', '#8fe3ff');
      Music.sfx('block');
      addValor(18);
    }
    return;
  }
  if (godmode){ player.hp = player.maxHp; return; }
  if (state==='play' && boss){ refreshMissionThreat(); d *= missionThreat.damage; }
  if (player.absorb > 0){ const use = Math.min(player.absorb, d); player.absorb -= use; d -= use; }
  const armorRes = { none:0, iron:0.15, diamond:0.30, netherite:0.48 }[player.armor] || 0;
  if (armorRes) d = Math.max(1, Math.round(d * (1-armorRes)));
  if (d <= 0){ player.iframe = Math.max(player.iframe, 0.3); return; }
  player.hp -= d; player.flash = 0.14;
  player.valor = Math.max(0, (player.valor||0) - Math.max(12, d*1.4));
  player.focusT = Math.max(0, (player.focusT||0) - 0.65);
  Visual.impact(player.x,player.y-30,'#cbeaff',10);
  player.iframe = Math.max(player.iframe, iTime === undefined ? 0.55 : iTime);
  shake = Math.min(16, shake + 6); hitstop = Math.max(hitstop, 0.05); combatCamera.kick = Math.max(combatCamera.kick, 0.8); addImpactRing(player.x, player.y-30, '#ff8a6a', false);
  dmgNum(player.x, player.y-48, d, '#ff8a6a');
  Music.sfx('hurt');
  if (player.hp <= 0){
    player.hp = 0; player.alive = false;
    Music.stop(); CustomAudio.stop(); Music.sfx('die'); Voice.cancel(); Dialogue.clear();
    state = 'dead'; bannerT = 0;
  }
}
function hurtEnemy(e, d, kb, ang){
  // v1.4 elite troops remain ordinary enemies, but Bulwarks trade mobility for
  // real staying power. Centralizing mitigation here keeps melee, arrows,
  // explosions and allied hit feedback consistent instead of creating exceptions.
  let dealt = d;
  if(e.kind==='blueskull' && Math.random()<0.24){dealt*=0.38;kb*=0.35;puff(e.x,e.y-30,'#8ec8ff',7,90,.2,2);dmgNum(e.x,e.y-58,'BLOCK','#b8d6ff');Music.sfx('block');}
  if (e.elite === 'bulwark'){
    dealt *= 0.68;
    kb *= 0.55;
    if (dealt > 0){
      const pulse = Math.min(1, dealt/35);
      puff(e.x, e.y-30, '#8ec8ff', 4 + Math.round(pulse*4), 85, 0.22, 2);
      addImpactRing(e.x, e.y-30, '#8ec8ff', false);
    }
  }
  e.hp -= dealt; e.flash = 0.12;
  Visual.impact(e.x,e.y-30,e.elite==='bulwark'?'#8ec8ff':'#ffe5ac',9);
  dmgNum(e.x, e.y-52, Math.max(1,Math.round(dealt)), e.elite==='bulwark'?'#a9d8ff':undefined);
  if (kb){ e.kbx = Math.cos(ang)*kb; e.kby = Math.sin(ang)*kb*0.6; }
}
function hurtBoss(d, ang){
  if (!boss) return;
  if (boss.def.key === 'kinggaming' && boss.dualDown){
    puff(boss.x,boss.y-40,'#8eea82',3,55,.18,2);
    dmgNum(boss.x,boss.y-70,'DOWN','#c8ff9c');
    return;
  }
  // Taurzan's panic dash gives him a chance to evade incoming attacks.
  if (boss.def.key === 'ambitious' && boss.evasion > 0 && Math.random() < 0.72){
    dmgNum(boss.x,boss.y-74,'MISS','#f1d27a');
    puff(boss.x,boss.y-42,'#f1d27a',8,120,.25);
    return;
  }
  // Tobikoer's shield: anything arriving at his front is turned away
  if (boss.guard > 0){
    const toBoss = ang === undefined ? 0 : ang;
    const facingAng = boss.facing < 0 ? Math.PI : 0;
    let da = toBoss - facingAng;
    while (da > Math.PI) da -= Math.PI*2;
    while (da < -Math.PI) da += Math.PI*2;
    if (Math.abs(da) > Math.PI*0.5){
      puff(boss.x - boss.facing*22, boss.y-44, '#d8dce4', 8, 130, 0.35);
      dmgNum(boss.x, boss.y-72, 0, '#cfd6e2');
      Music.sfx('block');
      shake = Math.max(shake, 3);
      return;
    }
  }
  // Matie's medieval wall: blocks arrows arriving at his front only; melee still lands
  if (boss.wall > 0 && boss._lastHitWasArrow){
    const toBoss = ang === undefined ? 0 : ang;
    const facingAng = boss.facing < 0 ? Math.PI : 0;
    let da = toBoss - facingAng;
    while (da > Math.PI) da -= Math.PI*2;
    while (da < -Math.PI) da += Math.PI*2;
    if (Math.abs(da) > Math.PI*0.5){
      puff(boss.x - boss.facing*20, boss.y-40, '#cfc0a0', 8, 130, 0.35);
      dmgNum(boss.x, boss.y-72, 0, '#e8d9b0');
      Music.sfx('block');
      shake = Math.max(shake, 3);
      return;
    }
  }
  if (boss.def.key === 'toast' && boss.phase2 && !boss.toastLastStand){
    puff(boss.x, boss.y-42, '#c9d6ff', 7, 95, 0.28);
    dmgNum(boss.x, boss.y-70, boss.shield>0 ? 'WAR ECONOMY' : 'FORTIFIED', boss.shield>0 ? '#ffd95e' : '#c9d6ff');
    if (!boss._fortifiedTalk || boss._fortifiedTalk <= 0){ boss._fortifiedTalk = 2.2; bossLine('Break the defenses first!'); }
    return;
  }
  if (boss.shield > 0){ puff(boss.x, boss.y-40, '#9dffb0', 6, 90, 0.35); dmgNum(boss.x, boss.y-64, 0, '#9dffb0'); return; }
  // netherite armor (creative flight): strong arrow resistance
  if (boss.armor && ang !== undefined){
    // treat incoming player projectiles as reduced (melee still full)
    // callers pass ang for directed hits; arrow hits always pass ang
  }
  if (boss.armor && boss._lastHitWasArrow){
    d = Math.max(1, Math.round(d * 0.28));
    puff(boss.x, boss.y-50, '#3a3a42', 8, 100, 0.35);
    Music.sfx('block');
  }
  boss._lastHitWasArrow = false;
  // secret K godmode also grants a massive damage bonus so weapons one-shot bosses
  if (godmode) d = 1000000;
  boss.hp -= d; boss.flash = 0.1;
  dmgNum(boss.x, boss.y-70, d);
  score += Math.round(d);
  checkBossDialogue();
}
