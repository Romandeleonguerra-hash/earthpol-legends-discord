/* ---------------------------------------------------------------------
   LORE RAIL — the encyclopedia's front door now lives permanently down
   the left edge of the war map: one big portrait per player, scrollable,
   click a face to jump straight into that article.
   --------------------------------------------------------------------- */
const LORE_TILE_H = 94, LORE_TILE_GAP = 10;
const loreUI = {
  scroll:0, target:0,      // smoothed / desired scroll offset in px
  max:0,                   // how far the list can scroll
  hover:null,              // key under the pointer
  rows:[],                 // hitboxes, in screen space
  headRect:{ x:0, y:0, w:0, h:0 },
  grab:false, gy:0, gmoved:0
};
const LORE_HEAD_H = 46;   // taller header: room for the EarthpolWiki wordmark + subtitle
function loreRailBounds(){
  return { x:0, y:MAPV.y, w:LORE_W, h:MAPV.h };
}
function loreViewport(){
  const r = loreRailBounds();
  return { x:r.x, y:r.y+LORE_HEAD_H, w:r.w, h:r.h-LORE_HEAD_H-16 };
}
function inLoreRail(x, y){
  if (LORE_W <= 0) return false;
  const r = loreRailBounds();
  return x >= r.x && x <= r.x+r.w && y >= r.y && y <= r.y+r.h;
}
function loreKeyAt(x, y){
  const v = loreViewport();
  if (y < v.y || y > v.y+v.h) return null;
  for (const row of loreUI.rows){
    if (x >= row.x && x <= row.x+row.w && y >= row.y && y <= row.y+row.h) return row.key;
  }
  return null;
}
function loreScrollBy(d){
  loreUI.target = Math.max(0, Math.min(loreUI.max, loreUI.target + d));
}
function openWikiArticle(key, from){
  wikiFrom = from || 'title';
  wikiSel  = key || null;
  state = 'wiki';
  confirmLatch = false;
}

function drawLoreRail(){
  if (LORE_W <= 0){ loreUI.rows = []; loreUI.hover = null; loreUI.max = 0; return; }
  const r = loreRailBounds(), v = loreViewport();

  // panel plate
  ctx.fillStyle = '#080b14'; ctx.fillRect(r.x, r.y, r.w, r.h);
  const pg = ctx.createLinearGradient(r.x, 0, r.x+r.w, 0);
  pg.addColorStop(0, 'rgba(28,36,58,0.95)');
  pg.addColorStop(1, 'rgba(12,16,28,0.95)');
  ctx.fillStyle = pg; ctx.fillRect(r.x, r.y, r.w, r.h);
  ctx.fillStyle = '#2b3450'; ctx.fillRect(r.x+r.w-2, r.y, 2, r.h);

  // header doubles as a button into the full article index — this is the
  // wiki's actual storefront now, so the wordmark has to read as a brand,
  // not just another map label
  const hb = { x:r.x, y:r.y, w:r.w, h:LORE_HEAD_H };
  loreUI.headRect = hb;
  const hg = ctx.createLinearGradient(hb.x, hb.y, hb.x, hb.y+hb.h);
  hg.addColorStop(0, 'rgba(58,42,16,0.98)');
  hg.addColorStop(1, 'rgba(16,21,36,0.98)');
  ctx.fillStyle = hg; ctx.fillRect(hb.x, hb.y, hb.w, hb.h);
  ctx.fillStyle = '#f1d27a'; ctx.fillRect(hb.x, hb.y, hb.w, 3);
  ctx.fillStyle = '#2b3450'; ctx.fillRect(hb.x, hb.y+hb.h-1, hb.w, 1);
  ctx.save();
  ctx.textAlign = 'center';
  // big wordmark — the whole point is that this reads as "the EarthPol wiki"
  // at a glance, not a generic sidebar
  ctx.font = '900 15px "Pixelify Sans", Inter, Segoe UI, Arial';
  ctx.fillStyle = '#ffe9a8';
  ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = 3; ctx.shadowOffsetY = 1;
  ctx.fillText('\ud83d\udcd6EarthpolWiki', hb.x+hb.w/2, hb.y+19);
  ctx.shadowBlur = 0; ctx.shadowOffsetY = 0;
  ctx.font = '700 8px "Pixelify Sans", Inter, Segoe UI, Arial';
  ctx.fillStyle = '#c9a227';
  ctx.fillText('PLAYER LORE', hb.x+hb.w/2, hb.y+30);
  ctx.font = '600 7px "Pixelify Sans", Inter, Segoe UI, Arial';
  ctx.fillStyle = '#8b96b4';
  ctx.fillText('TAP A FACE TO READ', hb.x+hb.w/2, hb.y+40);
  ctx.restore();

  // ease the scroll so flicks and wheel spins feel weighty rather than snappy
  loreUI.scroll += (loreUI.target - loreUI.scroll) * 0.25;
  if (Math.abs(loreUI.target - loreUI.scroll) < 0.4) loreUI.scroll = loreUI.target;

  ctx.save();
  ctx.beginPath(); ctx.rect(v.x, v.y, v.w, v.h); ctx.clip();

  loreUI.rows = [];
  const tw = r.w - 20;
  let ty = v.y + 8 - loreUI.scroll;

  for (const key of LORE_ORDER){
    const e = LORE_ENTRIES[key];
    const row = { x:r.x+10, y:ty, w:tw, h:LORE_TILE_H, key };
    // only rows actually on screen are clickable, so a click can't land on
    // a tile that has been scrolled out of the viewport
    if (ty + LORE_TILE_H > v.y && ty < v.y + v.h) loreUI.rows.push(row);

    const hot = loreUI.hover === key;

    ctx.fillStyle = hot ? 'rgba(32,42,66,0.98)' : 'rgba(15,20,34,0.92)';
    ctx.fillRect(row.x, row.y, row.w, row.h);
    ctx.strokeStyle = hot ? e.accent : e.color;
    ctx.lineWidth = hot ? 2 : 1.5;
    ctx.strokeRect(row.x+0.5, row.y+0.5, row.w-1, row.h-1);
    ctx.fillStyle = e.color; ctx.fillRect(row.x, row.y, row.w, 3);

    // big portrait — the whole point of the rail
    ctx.save();
    ctx.translate(row.x + row.w/2, row.y + 64);
    const s = hot ? 5.6 : 5.2;
    drawPortrait(e.skin, 0, 0, s);
    ctx.restore();

    ctx.save();
    ctx.textAlign = 'center';
    ctx.font = '700 10px "Pixelify Sans", Inter, Segoe UI, Arial';
    ctx.fillStyle = hot ? '#ffffff' : '#eef2fb';
    ctx.fillText(e.name.length > 13 ? e.name.slice(0,12)+'\u2026' : e.name, row.x+row.w/2, row.y+79);
    ctx.font = '600 7px "Pixelify Sans", Inter, Segoe UI, Arial';
    ctx.fillStyle = e.accent;
    ctx.fillText(e.title.length > 18 ? e.title.slice(0,17)+'\u2026' : e.title, row.x+row.w/2, row.y+89);
    ctx.restore();

    ty += LORE_TILE_H + LORE_TILE_GAP;
  }

  // tail card so the list never just stops dead
  ctx.save();
  ctx.textAlign = 'center';
  ctx.setLineDash([4,4]);
  ctx.strokeStyle = 'rgba(107,120,149,0.5)'; ctx.lineWidth = 1;
  ctx.strokeRect(r.x+10.5, ty+0.5, tw-1, 40);
  ctx.setLineDash([]);
  ctx.font = '600 8px "Pixelify Sans", Inter, Segoe UI, Arial';
  ctx.fillStyle = '#6b7895';
  ctx.fillText('MORE ARTICLES', r.x+r.w/2, ty+18);
  ctx.fillText('COMING SOON', r.x+r.w/2, ty+30);
  ctx.restore();
  ty += 40;

  ctx.restore();   // end clip

  loreUI.max = Math.max(0, (ty + loreUI.scroll) - (v.y + v.h) + 8);
  loreUI.target = Math.min(loreUI.target, loreUI.max);

  // scrollbar, only when there is something to scroll to
  if (loreUI.max > 1){
    const trackH = v.h - 8;
    const thumbH = Math.max(24, trackH * (v.h / (v.h + loreUI.max)));
    const t = loreUI.max ? loreUI.scroll / loreUI.max : 0;
    const tx = r.x + r.w - 6;
    ctx.fillStyle = 'rgba(107,120,149,0.18)';
    ctx.fillRect(tx, v.y+4, 3, trackH);
    ctx.fillStyle = '#6b7895';
    ctx.fillRect(tx, v.y+4 + t*(trackH-thumbH), 3, thumbH);
  }

  // footer hint
  ctx.save();
  ctx.textAlign = 'center';
  ctx.font = '600 8px "Pixelify Sans", Inter, Segoe UI, Arial';
  ctx.fillStyle = 'rgba(10,14,24,0.9)';
  ctx.fillRect(r.x, r.y+r.h-16, r.w, 16);
  ctx.fillStyle = loreUI.max > 1 ? '#8f9cba' : '#4d566f';
  ctx.fillText(loreUI.max > 1 ? 'SCROLL FOR MORE \u25be' : 'ALL ARTICLES SHOWN', r.x+r.w/2, r.y+r.h-5);
  ctx.restore();
}

  if (x >= bb.x && x <= bb.x+bb.w && y >= bb.y && y <= bb.y+bb.h){

  }
  const fb = fightBtnRect;
  if (fb && x >= fb.x && x <= fb.x+fb.w && y >= fb.y && y <= fb.y+fb.h){
    challengeFromWiki(fb.key);
    return;
  }
  if (!wikiSel){
    for (const row of wikiRows){
      if (x >= row.x && x <= row.x+row.w && y >= row.y && y <= row.y+row.h){
        wikiSel = row.key; confirmLatch = false;
        return;
      }
    }
  }
}

/* the "FIGTH HIM" button: leave the encyclopedia and drop straight into
   that warlord's fight, the same way picking them off the war map does */
function challengeFromWiki(key){
  const n = MAP_NODES.find(m => m.key === key);
  if (!n) return;
  wikiSel = null; fightBtnRect = null;
  openMap(null);
  launchNode(n);
}

/* backing out of the wiki: an article reached through the index returns to
   the index, while one opened straight off a rail portrait returns to the
   map, because that is where the click came from */
function wikiBack(){
  if (wikiSel && wikiFrom !== 'rail'){ wikiSel = null; return; }
  wikiSel = null;
  if (wikiFrom === 'title'){ state = 'title'; Music.play('title'); }
  else state = 'map';
}

function wikiWrap(text, x, y, maxW, lh){
  const words = text.split(' ');
  let line = '', yy = y;
  for (const w of words){
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line){
      ctx.fillText(line, x, yy); line = w; yy += lh;
    } else line = t;
  }
  if (line){ ctx.fillText(line, x, yy); yy += lh; }
  return yy;
}

function shopClick(x,y){
  // Only the visible upgrade cards consume a click. Previously the whole middle
  // band of the screen counted as shop territory, so empty black space could not
  // perform the advertised return-to-map action.
  for(let i=0;i<SHOP_ITEMS.length;i++){
    const col=i%6, row=Math.floor(i/6);

 function guide(){return `<div class="ep-callout"><small>EARTHPOL LEGENDS · CHRONICLES</small><h2>A world worth conquering.</h2><p>Fight across the Earthpol war map, master combat abilities, break rival composure, and defeat the existing warlord roster in any order.</p></div><div class="ep-grid"><article><small>LEGENDS</small><h4>Fight with intent</h4><p><kbd>E</kbd> Toxic Potion: throw a lingering poison flask; 12s cooldown.<br><kbd>R</kbd> Rally: shield and cleanse; 22s.<br><kbd>T</kbd> Volley: five aimed arrows; 14s.</p><p>Ship phases retain their own controls.</p></article><article><small>EXISTING BOSSES</small><h4>Read. Defend. Punish.</h4><p>Striped amber circles warn of dangerous attacks. Filling the blue stagger meter interrupts bosses and slows them briefly. Perfect parries build stagger and empower your next hit.</p><p>At low health, bosses use their special attacks more often while their existing phases remain intact.</p></article><article><small>WAR MAP</small><h4>Pick any front</h4><p>Choose territories in your own order. Campaign Threat rises as missions are cleared, keeping earlier enemies relevant even if you return with better equipment.</p><p>The bottom portrait strip opens each character's Wiki entry.</p></article></div><h3>Field controls</h3><table><tr><td>WASD / arrows</td><td>Move · Shift sprint · Space roll</td></tr><tr><td>Left click / J</td><td>Melee · hold right click to charge bow</td></tr><tr><td>F / Q</td><td>Guard & perfect parry / healing apple</td></tr><tr><td>1–5</td><td>Switch unlocked melee weapons</td></tr><tr><td>E / R / T</td><td>Toxic Potion / Rally / Volley</td></tr><tr><td>P / Escape</td><td>Pause fight / return to campaign map</td></tr><tr><td>M / V / F8</td><td>Mute music / mute voices / toggle 3D characters</td></tr><tr><td>H</td><td>Chronicles menu</td></tr></table><p>Legends saves your equipment and cleared territories at battle entry and victory. Death retries the same encounter from its entry checkpoint.</p>`;}

/* =====================================================================
   DISCORD / WIKI BOSS DEEP LINKS — v34
   Host one copy of this game, then link each wiki entry as ?fight=<bosskey>.
   Example: game.html?fight=oxbit   or   game.html?fight=kinggaming&embed=1
   ===================================================================== */
const DEFAULT_WIKI_BOSS = 'oxbit';
const WikiFightLink = (()=>{
  const qs = new URLSearchParams(location.search);
  const aliases = {
    'thewarden':'warden','warden':'warden','commandervideoyt':'commandervideo','commandervideo':'commandervideo',
    'tobikoer':'tobikoer','taurzan':'ambitious','ambitious':'ambitious','theambitious':'ambitious',
    'maaaaaattie':'matie','matie':'matie','toastquite':'toast','toast_quite':'toast','toast':'toast',
    'romandicario':'romandicario','oxbit':'oxbit','teknam':'teknam','dandire':'dandire','n20':'n20',
    'borealia':'kinggaming','emeraldheirs':'kinggaming','kinggaming':'kinggaming','malshman':'kinggaming',
    'kippenwortel':'kippenwortel'
  };
  const clean = v => (v||'').toLowerCase().replace(/[^a-z0-9_]/g,'');
  const raw = qs.get('fight') || DEFAULT_WIKI_BOSS;
  const key = aliases[clean(raw)] || clean(raw);
  const index = key ? WAVES.findIndex(w=>w.key===key) : -1;
  const embed = qs.get('embed') !== '0';
  if (embed) document.body.classList.add('ep-embed');
  let panel = null;
  function show(){
    if(index < 0 || panel) return;
    const w=WAVES[index];
    panel=document.createElement('div'); panel.id='ep-wiki-launch';
    panel.innerHTML='<div class="card"><div class="eyebrow">EARTHPOL LEGENDS · WIKI ENCOUNTER</div><h1>'+w.name+'</h1><h2>'+w.levelName+' · '+w.title+'</h2><div class="rule"></div><p>This wiki link opens directly into this player\'s EarthPol Legends boss encounter. The full campaign remains unchanged.</p><button type="button">⚔ FIGHT '+w.name.toUpperCase()+'</button><span class="hint">Click once to enable music, voices and controls.</span></div>';
    document.body.appendChild(panel);
    panel.querySelector('button').addEventListener('click', launch, {once:true});
  }
  function launch(){
    if(index < 0) return;
    try{ Music.init(); Voice.load(); }catch(e){}
    if(panel){ panel.remove(); panel=null; }
    confirmLatch=false;
    startWave(index);
  }
  if(index >= 0){
    if(document.readyState==='loading') addEventListener('DOMContentLoaded',show,{once:true}); else show();
  }
  return {active:index>=0,key,index,embed,show,launch};
})();

let last = 0;
function frame(now){
  const raw = Math.min(0.05, (now - last)/1000);
  last = now;
  Chronicle.tick(raw);
  if (Chronicle.open || Forge.open || document.hidden){ requestAnimationFrame(frame); return; }
  let dt = raw;
  if (!(paused && state==='play')) bgT += raw;
  Visual.tick(raw);
  Hybrid3D.flush();
  timeScale = lerp(timeScale, 1, raw*1.6);
  if (hitstop > 0){ hitstop -= raw; dt = 0; } else dt = raw * timeScale;

  Chronicle.update(dt);
  Forge.tick(dt);
  ctx.save();
  // Impact movement belongs exclusively to the world camera.

  if (state === 'title'){
    if (confirmPressed()){ Music.init(); openMap(); }
    drawTitleScreen();
  } else if (state === 'wiki'){
    drawWiki();
    if (confirmPressed()) wikiBack();
  } else if (state === 'map'){
    updateMisc(dt);
    updateMapCam(raw);
    mapKeys();
    drawMapScreen();
    if (confirmPressed()){
      if (allCleared()){ state = 'victory'; Music.play('victory'); }
      else launchNode(MAP_NODES[mapUI.sel]);
    }
  } else if (state === 'romanarrival'){
    updateRomanInvasion(raw);
    drawRomanInvasion();
    confirmPressed();   // absorb input so it can't leak into the fight
  } else if (state === 'romanflee'){
    updateRomanFlee(raw);
    drawRomanFlee();
    confirmPressed();
  } else if (state === 'oxbitfinale'){
    updateOxbitFinale(raw);
    drawOxbitFinale();
    confirmPressed();   // absorb input so it doesn't bleed into the next screen
  } else if (state === 'cutscene'){
    updateMisc(dt);
    updateCutscene(raw);
    drawCutscene();
    if (confirmPressed()) endCutscene(false);   // N20 takeover ignores premature skips until its final hold
  } else if (state === 'intro'){
    bannerT -= raw;
    updateMisc(dt);
    drawScene(); drawHUD(); drawBanner(); drawWarning(); drawDialogue();
    if (bannerT <= 0) state = 'play';
    confirmPressed();
  } else if (state === 'play'){
    if (!paused){
      updatePlayer(dt); updateEnemies(dt); updateBoss(dt);
      updateShots(dt); updateHazards(dt); updateMisc(dt);
    }
    drawScene(); drawHUD(); drawDialogue();
    if (paused){
      ctx.fillStyle='rgba(5,7,13,0.72)'; ctx.fillRect(0,0,W,H);
      ctext('PAUSED', 250, 34, '#e8e2d0');
      ctext('press P to resume', 282, 13, '#9aa6c8');
    }
    confirmPressed();
  } else if (state === 'shop'){
    updateMisc(dt);
    drawShop();
    if (confirmPressed()) startWave(WikiFightLink.index);
  } else if (state === 'cleared'){
    updateMisc(dt);
    drawCleared(); drawDialogue();
    if (confirmPressed()) startWave(WikiFightLink.index);
  } else if (state === 'dead'){
    updateMisc(dt);
    drawScene(); drawHUD(); drawDead();
    if (confirmPressed()) Chronicle.retry();
  } else if (state === 'victory'){
    updateMisc(dt);
    drawScene(); drawHUD(); drawVictory(); drawDialogue();
    if (confirmPressed()) resetGame();
  }

  if (flashFx > 0 && Chronicle.motion){
    ctx.fillStyle = 'rgba(255,255,255,' + (flashFx*0.55) + ')';
    ctx.fillRect(0,0,W,H);
  }
  ctx.restore();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

document.addEventListener && document.addEventListener('visibilitychange', () => {
  if (document.hidden){ Music.suspend(); Voice.cancel(); }
  else if (!paused && !Music.muted) Music.resume();
});

function boot(){ Music.init(); Voice.load(); if (state === 'title') Music.play('title'); }
addEventListener('pointerdown', boot, { once:true });
addEventListener('keydown', boot, { once:true });
