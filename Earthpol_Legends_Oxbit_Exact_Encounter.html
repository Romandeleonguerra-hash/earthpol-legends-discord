  mercTobikoer:{ skin:'hungariansoldier', hp:62, speed:70, r:13, dmg:13, ranged:false, cd:1.0, scale:1.75,
          col:'#2f5c3a', weapon:'axe', label:'Heartland Mercenary', nameCol:'#8fd49a' },
  mercWarden:{ skin:'guard', hp:58, speed:74, r:13, dmg:12, ranged:false, cd:0.95, scale:1.75,
          col:'#3a6ea8', weapon:'sword', label:'Californian Mercenary', nameCol:'#8ab4e8' }
};
function spawnEnemy(kind, x, y){
  const d = EDEF[kind];
  const threat=boss?refreshMissionThreat():{enemyHp:1,damage:1,speed:1};
  const scaledHp=Math.max(1,Math.round(d.hp*threat.enemyHp));
  const e = { kind, skin:d.skin, x, y, r:d.r, hp:scaledHp, maxHp:scaledHp, speed:d.speed*threat.speed, dmg:d.dmg,
    ranged:d.ranged, cd:rnd(0.4,d.cd), cdMax:d.cd, scale:d.scale, weapon:d.weapon,
    facing:1, walk:rnd(0,6), flash:0, kbx:0, kby:0, spawnT:0.45,
    flyH: d.flying ? 34 : 0, elite:null, eliteCd:rnd(2.5,5.0), eliteShots:0 };
  enemies.push(e);
  puff(x, y-20, d.col, 14, 120, 0.45);
  Music.sfx('spawn');
  return e;   // callers may want to configure the spawned unit further
}

// Elite Forces are deliberately modifiers on ordinary troops, never bosses.
// Only edge-spawned reinforcements can roll elite, leaving authored story
// summons and named helpers exactly as their scripts expect.
function promoteElite(e){
  if (!e || e.elite || EDEF[e.kind].flying || /^mini/.test(e.kind) || ['serveradmin','tradevillager','tonzan','probablyvano','mrtytanic','bustun','demagorgan','tacosbuilds'].includes(e.kind)) return e;
  if (e.ranged){
    e.elite = 'deadeye';
    e.maxHp = e.hp = Math.round(e.maxHp*1.18);
    e.dmg = Math.round(e.dmg*1.12);
    e.cdMax *= 1.08;
  } else if (Math.random() < 0.52){
    e.elite = 'vanguard';
    e.maxHp = e.hp = Math.round(e.maxHp*1.18);
    e.speed *= 1.18;
    e.cdMax *= 0.88;
    e.eliteCd = rnd(2.8,4.8);
  } else {
    e.elite = 'bulwark';
    e.maxHp = e.hp = Math.round(e.maxHp*1.55);
    e.speed *= 0.88;
    e.dmg = Math.round(e.dmg*1.08);
    e.scale *= 1.06;
  }
  puff(e.x,e.y-34,e.elite==='deadeye'?'#ffcf70':e.elite==='vanguard'?'#ff8068':'#8ec8ff',18,155,.52,3);
  return e;
}
function spawnEdge(kind){
  const s = Math.floor(Math.random()*3);
  let x, y;
  if (s === 0){ x = PLAY.x + 20; y = rnd(PLAY.y+20, PLAY.y+PLAY.h-10); }
  else if (s === 1){ x = PLAY.x + PLAY.w - 20; y = rnd(PLAY.y+20, PLAY.y+PLAY.h-10); }
  else { x = rnd(PLAY.x+40, PLAY.x+PLAY.w-40); y = PLAY.y + 18; }
  const e = spawnEnemy(kind, x, y);
  // roughly one elite in four reinforcement spawns; capped so effects and
  // difficulty stay readable on low-end machines.
  const elites = enemies.reduce((n,u)=>n+(u.elite?1:0),0);
  if (enemies.length >= 3 && elites < 3 && Math.random() < 0.26) promoteElite(e);
  return e;
}
function countKind(k){ let n=0; for (const e of enemies) if (e.kind === k || (k==='merc' && e.kind==='mercx')) n++; return n; }

/* ---------------------------------------------------------------- shots */
function fireShot(x, y, tx, ty, speed, dmg, owner, type, size){
  const a = Math.atan2(ty-y, tx-x);
  shots.push({ x, y, vx:Math.cos(a)*speed, vy:Math.sin(a)*speed, dmg, owner,
               type: type||'arrow', life:3, size:size||4, ang:a });
}

/* =====================================================================
   PLAYER
   ===================================================================== */
function updatePlayer(dt){
  if (shipBattle){
    // movement handled by updateShipBattle; keep apple use & invuln timers
    player.iframe = Math.max(0, player.iframe - dt);
    player.flash = Math.max(0, player.flash - dt);
    if (player.absorb > 0) player.absorb = Math.max(0, player.absorb - dt*4);
    if (player.regen > 0){ player.regen -= dt; player.hp = Math.min(player.maxHp, player.hp + 8*dt); }
    if (pressed('KeyQ') && player.apples > 0 && player.hp < player.maxHp && (player.embargoT||0)<=0){
      player.apples--; player.hp = Math.min(player.maxHp, player.hp + 28);
      player.absorb = Math.max(player.absorb, 16); player.regen = 4;
      Music.sfx('apple');
    }
    return;
  }
  let dx = 0, dy = 0;
  if (keys['KeyW'] || keys['ArrowUp']) dy--;
  if (keys['KeyS'] || keys['ArrowDown']) dy++;
  if (keys['KeyA'] || keys['ArrowLeft']) dx--;
  if (keys['KeyD'] || keys['ArrowRight']) dx++;
  if (touch.moveId !== null && touch.origin && touch.pos){
    const jx = touch.pos.x - touch.origin.x, jy = touch.pos.y - touch.origin.y, m = Math.hypot(jx,jy);
    if (m > 10){ dx += jx/m; dy += jy/m; }
  }
  const m = Math.hypot(dx,dy);
  if (m > 0){ dx/=m; dy/=m; }
  player.moveX = dx; player.moveY = dy;
  player.sprinting = m > 0 && (keys['ShiftLeft'] || keys['ShiftRight']) && player.bowCharge < 0 && !player.swing && player.rollT <= 0;
  if (m > 0){
    player.walk += dt*(player.sprinting ? 20 : 12);
    if (player.sprinting && Math.random() < dt*15)
      puff(player.x-rnd(-7,7), player.y+rnd(-1,5), '#c9c1ab', 1, 42, 0.24, rnd(2,4));
  } else player.walk *= 0.82;

  if (player.poisonT > 0){
    player.poisonT -= dt;
    // a DoT tick is not a "hit": it must never touch shake/hitstop/iframe or
    // play the impact sound, or a continuously-refreshed hitstop of 0.05s
    // will force dt=0 on the very next frame before it can decay, then get
    // refreshed again the frame after that — a stutter loop that throttles
    // the whole game to a crawl for as long as the player stays poisoned.
    // So poison is applied the same quiet way enemy burn already is:
    // straight HP loss, with its own minimal death check.
    if (!godmode && player.alive){
      player.hp -= 3.2*dt;
      if (player.hp <= 0){
        player.hp = 0; player.alive = false;
        Music.stop(); Music.sfx('die'); Voice.cancel(); Dialogue.clear();
        state = 'dead'; bannerT = 0; CustomAudio.stop();
      }
    }
    if (Math.random() < 0.3) puff(player.x+rnd(-8,8), player.y-rnd(10,40), '#7ac84a', 1, 30, 0.35, 2);
  }
  if (player.weakT > 0) player.weakT -= dt;
  if (player.slowT > 0) player.slowT -= dt;
  if (player.embargoT > 0) player.embargoT -= dt;
  if (player.sanctionT > 0) player.sanctionT -= dt;

  const drawing = player.bowCharge >= 0;
  const meleeMove = player.swing ? (player.meleeType==='rapier' ? 0.82 : player.meleeType==='spear' ? 0.66 : player.meleeType==='glaive' ? 0.61 : player.meleeType==='hammer' ? 0.48 : 0.58) : 1;
  const guardMove = player.guardT > 0 ? 0.70 : 1;
  const focusMove = player.focusT > 0 ? 1.08 : 1;
  const sp = player.speed * (player.sprinting ? 1.38 : 1) * (drawing ? 0.45 : 1) * meleeMove * guardMove * focusMove * (player.slowT > 0 ? 0.6 : 1) * (player.sanctionT>0 ? 0.76 : 1);
  if (player.rollT > 0){
    player.rollT -= dt;
    player.x += player.rvx*dt; player.y += player.rvy*dt*0.65;
    puff(player.x, player.y, '#c9c1ab', 1, 26, 0.25, 3);
  } else {
    player.x += dx*sp*dt; player.y += dy*sp*dt*0.72;
  }
  // knockback impulse (currently only RomanDiCario's dagger sets this),
  // decaying via friction so a hit reads as one solid shove, not a shove
  // that lingers forever
  if (player.kbx || player.kby){
    player.x += player.kbx*dt; player.y += player.kby*dt*0.7;
    player.kbx *= 0.88; player.kby *= 0.88;
    if (Math.abs(player.kbx) < 4) player.kbx = 0;
    if (Math.abs(player.kby) < 4) player.kby = 0;
  }
  player.facing = mouse.x < player.x ? -1 : 1;
  clampPlay(player);

  player.swingCd -= dt; player.bowCd -= dt; player.rollCd -= dt;
  player.comboWindow = Math.max(0, player.comboWindow-dt);
  player.attackBuffer = Math.max(0, player.attackBuffer-dt);
  player.perfectDodgeT = Math.max(0, player.perfectDodgeT-dt);
  player.perfectDodgeCd = Math.max(0, player.perfectDodgeCd-dt);
  player.guardT = Math.max(0, player.guardT-dt);
  player.parryT = Math.max(0, player.parryT-dt);
  player.guardCd = Math.max(0, player.guardCd-dt);
  player.perfectParryT = Math.max(0, player.perfectParryT-dt);
  player.riposteT = Math.max(0,(player.riposteT||0)-dt);
  player.focusT = Math.max(0,(player.focusT||0)-dt);
  player.focusFlash = Math.max(0,(player.focusFlash||0)-dt);
  if (player.focusT <= 0 && !player.swing && player.guardT <= 0) player.valor = Math.max(0,(player.valor||0)-dt*1.5);
  if (player.comboWindow <= 0 && !player.swing) player.comboStep = 0;
  player.iframe -= dt; player.flash = Math.max(0, player.flash - dt);
  if (godmode) player.hp = player.maxHp;
  if (player.regen > 0){
    player.regen -= dt;
    player.hp = Math.min(player.maxHp, player.hp + 9*dt);
    if (Math.random() < 0.35) puff(player.x+rnd(-12,12), player.y-rnd(10,50), '#ffe27a', 1, 12, 0.5, 2);
  }

  // Guard / perfect parry — tap F. The first 0.16s is a perfect-parry
  // window; the remainder is a conventional guard that reduces chip damage.
  // Cooldown deliberately exceeds the guard duration so F cannot be mashed.
  if (pressed('KeyF') && player.guardCd <= 0 && player.rollT <= 0 && player.bowCharge < 0 && !player.swing){
    player.parryT = 0.16;
    player.guardT = 0.62;
    player.guardCd = 0.86;
    combatCamera.kick = Math.max(combatCamera.kick, 0.08);
    Music.sfx('block');
  }

  // roll
  if ((keys['Space']) && player.rollCd <= 0 && player.rollT <= 0){
    let ax = dx, ay = dy;
    if (!ax && !ay){ const a = Math.atan2(mouse.y-(player.y-24), mouse.x-player.x); ax = Math.cos(a); ay = Math.sin(a); }
    player.rvx = ax*560; player.rvy = ay*560;
    player.rollT = 0.24; player.rollCd = 1.3; player.iframe = 0.34;
    Music.sfx('roll');
  }

  // melee arsenal — the original sword chain plus specialist weapons.
  // Spear: long, narrow reach and quick recovery. Hammer: slower, shorter, brutal impact.
  function meleeProfile(){
    if (player.meleeType === 'spear') return {kind:'spear', damage:42, reach:96, arc:0.58, dur:0.92, cd:1.05, knock:220, col:'#bdeaff'};
    if (player.meleeType === 'hammer') return {kind:'hammer', damage:58, reach:66, arc:1.08, dur:1.28, cd:1.42, knock:335, col:'#ffd08a'};
    if (player.meleeType === 'rapier') return {kind:'rapier', damage:31, reach:80, arc:0.42, dur:0.70, cd:0.66, knock:120, col:'#d9c7ff'};
    if (player.meleeType === 'glaive') return {kind:'glaive', damage:44, reach:91, arc:1.12, dur:1.08, cd:1.12, knock:245, col:'#9ee8c7'};
    const damage = player.sword==='wood' ? 24 : player.sword==='iron' ? 34 : player.sword==='diamond' ? 46 : 62;
    return {kind:'sword', damage, reach:62, arc:1.42, dur:1, cd:1, knock:175, col:'#fff3c4'};
  }

  // sword / spear / hammer — three-hit chain with input buffering and distinct silhouettes
  const wantSword = (mouse.left || keys['KeyJ']);
  if (wantSword && player.swing) player.attackBuffer = 0.16;

  function startSwordSwing(){
    const a = Math.atan2(mouse.y-(player.y-26), mouse.x-player.x);
    const step = player.comboWindow > 0 ? (player.comboStep % 3) : 0;
    const wp = meleeProfile();
    const focusAtk = player.focusT > 0 ? 0.88 : 1;
    const dur = (step===2 ? 0.30 : (step===1 ? 0.22 : 0.24)) * wp.dur * focusAtk;
    const dmgMul = step===2 ? 1.34 : (step===1 ? 0.98 : 0.90);
    const forcedHeavy = wp.kind==='hammer';
    const riposte = (player.riposteT||0) > 0;
    if (riposte) player.riposteT = 0;
    const finalDur = riposte ? dur*0.82 : dur;
    player.swing = { a, t:finalDur, max:finalDur, hit:[], step, dmgMul, heavy:(step===2 && wp.kind!=='rapier') || forcedHeavy, weaponKind:wp.kind, riposte };
    // Rapier footwork: a short committed advance makes thrusts feel agile without becoming a teleport.
    if (wp.kind==='rapier'){ player.x += Math.cos(a)*10; player.y += Math.sin(a)*6; clampPlay(player); }
    player.comboStep = (step+1)%3;
    player.comboWindow = 0;
    player.swingCd = (step===2 ? 0.34 : 0.19) * wp.cd * focusAtk;
    player.attackBuffer = 0;
    combatCamera.kick = Math.max(combatCamera.kick, riposte ? 0.55 : (wp.kind==='rapier' ? 0.10 : (step===2 ? 0.45 : 0.18)));
    if (riposte){ addImpactRing(player.x,player.y-28,'#ffe9a6',false); puff(player.x,player.y-28,'#ffe9a6',8,110,.22,2); }
    Music.sfx((step===2 && wp.kind!=='rapier') ? 'heavy' : 'swing');
  }

  if (wantSword && !player.swing && player.swingCd <= 0 && player.bowCharge < 0 && player.guardT <= 0) startSwordSwing();

  if (player.swing){
    player.swing.t -= dt;
    const sw = player.swing;
    const wp = meleeProfile();
    const reach = wp.reach + (sw.step===2 ? 10 : (sw.step===1 ? 4 : 0));
    const cx = player.x + Math.cos(sw.a)*(wp.kind==='spear'?36:wp.kind==='glaive'?34:wp.kind==='rapier'?32:24), cy = player.y-26 + Math.sin(sw.a)*(wp.kind==='spear'?30:wp.kind==='glaive'?28:wp.kind==='rapier'?26:22);
    const arc = wp.arc + (sw.step===2 ? 0.18 : 0);
    const list = enemies.slice();
    if (boss) list.push(boss);
    if (sidekick) list.push(sidekick);
    for (const e of list){
      if (sw.hit.indexOf(e) >= 0) continue;
      if (e === boss && boss.def.key === 'n20' && boss.phase2 && (boss.flyH||0) > 80) continue;
      const ex = e.x, ey = e.y - 26;
      const d = Math.hypot(ex-cx, ey-cy);
      if (d > reach) continue;
      let da = Math.atan2(ey-cy, ex-cx) - sw.a;
      while (da > Math.PI) da -= Math.PI*2;
      while (da < -Math.PI) da += Math.PI*2;
      if (Math.abs(da) > arc) continue;
      sw.hit.push(e);
      const ang = Math.atan2(ey-(player.y-26), ex-player.x);
      // Rapier sweet spot: land a nearly dead-center thrust in the outer half of its reach for a precision critical.
      const precision = wp.kind==='rapier' && Math.abs(da)<0.115 && d>reach*0.48;
      // Glaive rewards sweeping through groups: later regular-enemy hits in the same swing gain a modest cleave bonus, capped to avoid boss burst abuse.
      const cleave = wp.kind==='glaive' && e!==boss && e!==sidekick ? 1+Math.min(0.24,Math.max(0,sw.hit.length-1)*0.08) : 1;
      const riposteMul = sw.riposte ? (e===boss ? 1.18 : e===sidekick ? 1.22 : 1.35) : 1;
      const swordDmg = Math.round(wp.damage * sw.dmgMul * (precision?1.55:1) * cleave * riposteMul * (player.focusT>0?1.15:1) * (player.weakT > 0 ? 0.6 : 1) * (player.sanctionT>0 ? 0.85 : 1));
      if (e === boss) hurtBoss(swordDmg, ang);
      else if (e === sidekick){ e.hp-=swordDmg; e.flash=.12; dmgNum(e.x,e.y-52,swordDmg); }
      else hurtEnemy(e, swordDmg, sw.heavy ? Math.max(250,wp.knock) : wp.knock, ang);
      const hitCol = sw.riposte ? '#ffe9a6' : (precision ? '#efe5ff' : (wp.kind==='rapier' ? '#d9c7ff' : (wp.kind==='glaive' ? '#9ee8c7' : (wp.kind==='spear' ? '#bdeaff' : (wp.kind==='hammer' ? '#ffd08a' : (sw.heavy ? '#ffd27a' : '#fff3c4'))))));
      puff(ex, ey, hitCol, sw.heavy ? 17 : 10, sw.heavy ? 230 : 165, sw.heavy ? 0.42 : 0.30, sw.heavy ? 4 : 3);
      addImpactRing(ex, ey, hitCol, sw.heavy);
      if (precision){ puff(ex,ey,'#ffffff',8,260,.22,2); addImpactRing(ex,ey,'#d9c7ff',false); }
      if (sw.riposte){ puff(ex,ey,'#fff7d6',12,280,.25,2); addImpactRing(ex,ey,'#ffe9a6',true); dmgNum(ex,ey-66,'RIPOSTE','#ffe9a6'); }
      hitstop = Math.max(hitstop, precision ? 0.055 : (sw.heavy ? 0.075 : 0.045));
      shake = Math.max(shake, precision ? 5 : (sw.heavy ? 8 : 4));
      combatCamera.pulse = Math.max(combatCamera.pulse, sw.heavy ? 0.85 : 0.35);
      Music.sfx(sw.heavy ? 'heavy' : 'hit');
      addValor((sw.riposte?6:0) + (precision ? 10 : (e===boss ? 5 : (e===sidekick ? 4 : 6))));
    }
    if (sw.t <= 0){
      player.swing = null;
      player.comboWindow = sw.heavy ? 0.20 : 0.34;
      if ((player.attackBuffer > 0 || mouse.left || keys['KeyJ']) && player.swingCd <= 0 && player.bowCharge < 0)
        startSwordSwing();
    }
  }

  // bow — right mouse only (K is reserved for secret godmode)
  const wantBow = mouse.right;
  if (wantBow && player.bowCd <= 0 && !player.swing && player.guardT <= 0){
    if (player.bowCharge < 0){ player.bowCharge = 0; Music.sfx('draw'); }
    else player.bowCharge = Math.min(1, player.bowCharge + dt/0.9);
  } else if (player.bowCharge >= 0){
    const c = player.bowCharge;
    const a = Math.atan2(mouse.y-(player.y-28), mouse.x-player.x);
    const bowBonus = player.bow==='fire' ? 10 : player.bow==='explosive' ? 4 : 0;
    const dmg = (14 + c*32 + bowBonus) * (player.focusT>0?1.12:1) * (player.weakT > 0 ? 0.6 : 1) * (player.sanctionT>0 ? 0.85 : 1), spd = (460 + c*380) * (player.focusT>0?1.06:1);
    const shotType = player.bow==='explosive' ? 'explosiveArrow' : (player.bow==='fire' ? 'fireArrow' : 'arrow');
    shots.push({ x:player.x+Math.cos(a)*20, y:player.y-28+Math.sin(a)*20,
      vx:Math.cos(a)*spd, vy:Math.sin(a)*spd, dmg, owner:'player', type:shotType,
      life:2.2, size:3, ang:a, crit:c>0.92 });
    player.bowCharge = -1; player.bowCd = 0.3;
    Music.sfx('bow');
    puff(player.x+Math.cos(a)*24, player.y-28+Math.sin(a)*24, '#ffe7a8', 4, 90, 0.2);
  }

  // golden apple
  if (pressed('KeyQ') && player.apples > 0 && player.regen <= 0 && (player.embargoT||0)<=0){
    player.apples--;
    player.hp = Math.min(player.maxHp, player.hp + 22);
    player.regen = 5; player.absorb = 20;
    puff(player.x, player.y-30, '#ffd95e', 22, 130, 0.8, 3);
    Music.sfx('apple');
  }
}

/* =====================================================================
   ENEMIES
   ===================================================================== */
function updateEnemies(dt){
  for (const e of enemies){
    e.flash = Math.max(0, e.flash - dt);
    e.spawnT -= dt;
    e.cd -= dt;
    e.x += e.kbx*dt; e.y += e.kby*dt;
    e.kbx *= 0.86; e.kby *= 0.86;
    if (e.spawnT > 0) continue;

    if (e.kind === 'permissionNode'){
      e.walk = 0; e.kbx = e.kby = 0; e.facing = 1;
      continue;
    }
    if (e.kind === 'commandpost' || e.kind === 'supplycache'){
      e.walk = 0; e.kbx = e.kby = 0; e.facing = 1;
      if (e.kind === 'supplycache' && Math.random() < dt*4) puff(e.x+rnd(-20,20), e.y-rnd(16,42), '#ffd95e', 1, 18, 0.28, 2);
      continue;
    }

    const a = Math.atan2((player.y-14)-(e.y-14), player.x-e.x);
    const d = Math.hypot(player.x-e.x, (player.y-e.y)*1.35);
    e.facing = player.x < e.x ? -1 : 1;
    e.walk += dt*11;
    e.eliteCd = Math.max(0,(e.eliteCd||0)-dt);

    // Vanguard: periodically telegraph, then lunge. The burst is intentionally
    // short enough to dodge/parry and never grants boss-like invulnerability.
    if (e.elite === 'vanguard' && !e.ranged && e.eliteCd <= 0 && d > 75 && d < 290){
      e.eliteCd = rnd(4.2,5.8);
      e.kbx += Math.cos(a)*250; e.kby += Math.sin(a)*165;
      e.atk = Math.max(e.atk||0,0.24); e.armAngle = -1.25;
      puff(e.x,e.y-28,'#ff8068',9,145,.28,3);
      addImpactRing(e.x,e.y-28,'#ff8068',false);
    }

    const want = e.ranged ? (d < (e.elite==='deadeye'?230:190) ? -1 : (d < (e.elite==='deadeye'?290:240) ? 0 : 1)) : 1;
    e.x += Math.cos(a)*e.speed*want*dt;
    e.y += Math.sin(a)*e.speed*want*dt*0.72;
    clampPlay(e);

    // flying units bob in the air instead of walking the ground
    if (EDEF[e.kind].flying){
      e.flyH = lerp(e.flyH || 0, 34 + Math.sin(bgT*2.2 + e.x*0.02)*7, dt*3);
      e.walk = 0;
    }

    if (e.kind === 'arandomfigment'){
      e.potCd = (e.potCd === undefined) ? 0.85 : e.potCd - dt;
      e.dodgeCd = (e.dodgeCd === undefined) ? 1.5 : e.dodgeCd-dt;
      if(e.dodgeCd<=0 && d<150){e.dodgeCd=2.4;e.x-=Math.cos(a)*58;e.y-=Math.sin(a)*34;clampPlay(e);puff(e.x,e.y-24,'#b58cff',9,90,.25,2);}
      if (e.potCd <= 0 && d < 450){
        e.potCd = 1.45;
        const cycle=['poison','harming','slow','weak','heal'];
        const kind=cycle[(e.potCycle||0)%cycle.length]; e.potCycle=(e.potCycle||0)+1;
        if(kind==='heal'){
          e.hp=Math.min(e.maxHp,e.hp+42); dmgNum(e.x,e.y-58,'+42','#7affa0'); puff(e.x,e.y-28,'#7affa0',14,100,.35,3);
          for(const ally of enemies) if(ally!==e&&Math.hypot(ally.x-e.x,ally.y-e.y)<130) ally.hp=Math.min(ally.maxHp,ally.hp+18);
          if(boss&&boss.def.key==='n20'&&boss.panicGround) boss.hp=Math.min(boss.maxHp,boss.hp+16);
          Music.sfx('heal');
        }else{
          const dmg=kind==='harming'?34:kind==='poison'?18:14;
          shots.push({ x:e.x, y:e.y-28, vx:Math.cos(a)*245, vy:Math.sin(a)*170 - 30, dmg, owner:'enemy', type:'potion', pot:kind, life:2.25, size:10, ang:a });
          Music.sfx('crossbow');
        }
      }
      continue;
    }
    if (e.kind === 'blueskull'){
      e.tntCd = (e.tntCd === undefined) ? 1.9 : e.tntCd - dt;
      e.dashCd=(e.dashCd===undefined)?1.3:e.dashCd-dt;
      e.comboFollow=(e.comboFollow||0)-dt;
      if(e.dashCd<=0 && d>95 && d<280){e.dashCd=2.6;e.x+=Math.cos(a)*62;e.y+=Math.sin(a)*38;clampPlay(e);puff(e.x,e.y-26,'#7db7ff',8,105,.24,2);Music.sfx('swing');}
      if(e.comboFollow>0 && e.comboFollow<=.07 && d<100){hurtPlayer(12);e.comboFollow=0;puff((e.x+player.x)/2,(e.y+player.y)/2-24,'#9dc9ff',8,120,.26,2);}
      if(e.cd<=0 && d<88){e.cd=.82;e.atk=.30;e.armAngle=-1.5;hurtPlayer(20);e.comboFollow=.20;Music.sfx('heavy');}
      if (e.tntCd <= 0 && d < 390){
        e.tntCd = 3.6;
        carts.push({ x:e.x, y:e.y-26, vx:Math.cos(a)*225, vy:-105, fuse:2.35, spin:0, falling:false });
        Music.sfx('boom');
      }
      continue;
    }

    if (e.ranged){
      if (e.cd <= 0 && d < 460){
        e.cd = e.cdMax;
        const atype = EDEF[e.kind].arrow || 'arrow';
        const fy = e.y - 26 - (e.flyH || 0);
        if (atype === 'adminLaser'){
          // rapid red laser bolts, fired from the air
          fireShot(e.x, fy, player.x, player.y-26, 520, e.dmg, 'enemy', 'adminLaser', 3);
          Music.sfx('laser');
        } else {
          if (e.elite === 'deadeye'){
            // Two readable bolts with a tiny fan: dangerous at range, but not
            // an unavoidable hitscan attack. The second bolt is slightly weaker.
            const aim = Math.atan2((player.y-26)-fy, player.x-e.x);
            for (const off of [-0.045,0.045]){
              const tx=e.x+Math.cos(aim+off)*420, ty=fy+Math.sin(aim+off)*420;
              fireShot(e.x, fy, tx, ty, 315, Math.round(e.dmg*0.82), 'enemy', atype, 3);
            }
            puff(e.x,fy,'#ffcf70',6,80,.22,2);
          } else fireShot(e.x, fy, player.x, player.y-26, 290, e.dmg, 'enemy', atype, 3);
          Music.sfx('crossbow');
        }
      }
      // blackmailed admins keep topping their employer back up
      if (e.kind === 'serveradmin'){
        e.healCd = (e.healCd === undefined) ? 3.0 : e.healCd - dt;
        if (e.healCd <= 0 && boss && boss.hp > 0 && !boss.jumping){
          e.healCd = 3.0;
          shots.push({ x:e.x, y:e.y-26-(e.flyH||0),
            vx:0, vy:0, owner:'heal', target:'boss', dmg:0,
            type:'healOrb', life:3.0, size:6, ang:0, heal:14 });
        }
      }
    } else if (d < e.r + player.r + 14 && e.cd <= 0){
      e.cd = e.cdMax;
      e.atk = 0.28;
      e.armAngle = -1.4;
      hurtPlayer(e.dmg);
      puff((e.x+player.x)/2, (e.y+player.y)/2 - 26, '#ffd9c0', 7, 120, 0.3);
    }
    if (e.atk > 0){
      e.atk -= dt;
      e.armAngle = e.atk > 0 ? lerp(e.armAngle || 0, 0.6, 1 - e.atk/0.28) : 0;
    } else e.armAngle = 0;
  }
  // fire arrows leave a short burning damage-over-time effect
  for (const e of enemies){
    if(e.burn>0){ e.burn-=dt; e.hp-=5*dt; if(Math.random()<.18) puff(e.x+rnd(-8,8),e.y-28+rnd(-8,8),'#ff6b2f',1,35,.22,3); }
  }
  // soft separation
  for (let i=0;i<enemies.length;i++)
    for (let j=i+1;j<enemies.length;j++){
      const A = enemies[i], B = enemies[j];
      const dx = B.x-A.x, dy = (B.y-A.y)*1.6, d = Math.hypot(dx,dy), mn = A.r+B.r;
      if (d > 0 && d < mn){
        const p2 = (mn-d)/d*0.5;
        A.x -= dx*p2; A.y -= dy*p2*0.5; B.x += dx*p2; B.y += dy*p2*0.5;
      }
    }
  for (let i=enemies.length-1;i>=0;i--){
    const e = enemies[i];
    if (e.hp <= 0){
      if (e.kind === 'permissionNode'){
        puff(e.x,e.y-26,'#dfffe8',30,220,.65,4);
        puff(e.x,e.y-26,'#2fbf3f',22,180,.55,3);
        if (boss && boss.def && boss.def.key === 'oxbit'){
          boss.authority = Math.max(0,(boss.authority||0)-24);
          boss.shield = 0;
          oxbitCommand('PERMISSION NODE REVOKED',0);
          dmgNum(e.x,e.y-70,'-24 AUTH','#9dffb0');
        }
        enemies.splice(i,1); Music.sfx('boom'); continue;
      }
      if (e.kind === 'commandpost'){
        puff(e.x,e.y-34,'#dfe7ff',34,220,.7,4); puff(e.x,e.y-34,'#3c5a9a',22,170,.55,3);
        drops.push({ x:e.x, y:e.y, r:14, t:18, bob:rnd(0,6), gold:32 });
        toastMoraleDrop(24, 'COMMAND POST DOWN', '#dfe7ff');
        Music.sfx('boom'); enemies.splice(i,1); continue;
      }
      if (e.kind === 'supplycache'){
        puff(e.x,e.y-24,'#ffd95e',28,190,.65,4); puff(e.x,e.y-24,'#c9a24f',18,150,.5,3);
        drops.push({ x:e.x-12, y:e.y, r:12, t:18, bob:rnd(0,6), gold:24 });
        drops.push({ x:e.x+12, y:e.y-4, r:12, t:18, bob:rnd(0,6), gold:24 });
        toastMoraleDrop(14, 'SUPPLIES DESTROYED', '#ffe4a6');
        Music.sfx('coin'); enemies.splice(i,1); continue;
      }
      if (e.kind === 'presidentialguard' && boss && boss.def && boss.def.key === 'toast' && boss.phase2 && !boss.toastLastStand){
        toastMoraleDrop(8, '', '#f0f4ff');
      }
      Visual.fall(e);
      puff(e.x, e.y-26, EDEF[e.kind].col, 20, 170, 0.6);
      score += 30;
      // Every summoned soldier is worth gold. The amount scales slightly by soldier type.
      const baseReward = e.kind==='alt' ? 18 : (e.kind==='pvper' ? 16 : (e.kind==='merc' || e.kind==='mercx' || e.kind==='spqmsoldier' ? 20 : (e.kind==='miniTobikoer'||e.kind==='miniWarden'||e.kind==='miniDandire' ? 45 : 14)));
      const reward = e.elite ? Math.round(baseReward*2.1) : baseReward;
      drops.push({ x:e.x, y:e.y, r:e.elite?15:13, t:16, bob:rnd(0,6), gold:reward });
      if (e.elite) dmgNum(e.x,e.y-78,'ELITE +'+reward+'G','#ffd978');
      enemies.splice(i,1);
      Music.sfx('hit');
    }
  }
}

/* =====================================================================
   PROJECTILES / HAZARDS
   ===================================================================== */
function updateShots(dt){
  for (let i=shots.length-1;i>=0;i--){
    const s = shots[i];
    // healing orbs ignore their own velocity and home in on the boss
    if (s.type === 'healOrb'){
      if (!boss || boss.hp <= 0 || boss.jumping){ shots.splice(i,1); continue; }
      const ha = Math.atan2((boss.y-40)-s.y, boss.x-s.x);
      const hd = Math.hypot(boss.x-s.x, (boss.y-40)-s.y);
      const hsp = 300;
      s.x += Math.cos(ha)*hsp*dt; s.y += Math.sin(ha)*hsp*dt;
      s.life -= dt;
      if (Math.random() < 0.5) puff(s.x, s.y, '#7affa0', 1, 20, 0.3, 2);
      if (hd < 26 || s.life <= 0){
        if (hd < 26){
          boss.hp = Math.min(boss.maxHp, boss.hp + s.heal);
          dmgNum(boss.x, boss.y-84, '+' + s.heal, '#7affa0');
          puff(boss.x, boss.y-40, '#7affa0', 14, 110, 0.45, 3);
          Music.sfx('heal');
        }
        shots.splice(i,1); continue;
      }
      continue;
    }
    s.x += s.vx*dt; s.y += s.vy*dt; s.life -= dt;
    if (s.type === 'coin') s.ang += dt*10;
    if (s.type === 'emerald' || s.type === 'emeraldSmall') s.ang += dt*(s.type==='emerald'?7:10);
    if (s.type === 'building') s.spin = (s.spin||0) + dt*3;
    if (s.type === 'n20Rocket' && Math.random()<0.72) puff(s.x-s.vx*.025,s.y-s.vy*.025,'#aeb5bc',1,35,.35,rnd(3,6));
    if (s.type === 'axe'){
      s.spin += dt*18;
      // thrown axe slows, turns, and comes back to the thrower
      if (boss){
        const ba = Math.atan2((boss.y-40-s.y), boss.x-s.x);
        const pull = Math.max(0, (1.4 - s.life)) * 900;
        s.vx = lerp(s.vx, Math.cos(ba)*380, Math.min(1, pull*dt/900));
        s.vy = lerp(s.vy, Math.sin(ba)*260, Math.min(1, pull*dt/900));
      }
    }
    if (s.life <= 0 || s.x < -30 || s.x > W+30 || s.y < STAGE.y-40 || s.y > H+30){
      if (s.type === 'pearl' && boss) pearlLand(s);
      if (s.type === 'n20Rocket'){leafBurst(s.x,s.y,26,230);puff(s.x,s.y,'#ffb5b5',16,180,.5,4);shake=Math.max(shake,10);Music.sfx('boom');}
      shots.splice(i,1); continue;
    }
    if (s.type === 'pearl'){
      puff(s.x, s.y, '#63d6a8', 1, 20, 0.3, 3);
      if (s.life < 2.62){ pearlLand(s); shots.splice(i,1); continue; }
    }
    if (s.type === 'potion'){
      s.vy += 180*dt;
      const potHit=Math.hypot(player.x-s.x,(player.y-30-s.y)*1.2) < player.r+14;
      if (s.life < 0.15 || potHit){
        const col=s.pot==='poison'?'#7ac84a':s.pot==='slow'?'#6ecbe8':s.pot==='weak'?'#a06adf':'#c8382a';
        boom(s.x, s.y, 52, s.dmg, col);
        if(potHit){if(s.pot==='poison')applyPoisonPlayer(4.8);if(s.pot==='slow')applySlowPlayer(4.6);if(s.pot==='weak')applyWeakPlayer(5.2);}
        dmgNum(s.x, s.y-20, s.pot==='poison'?'POISON':s.pot==='slow'?'SLOWNESS':s.pot==='weak'?'WEAKNESS':'HARMING', col);
        shots.splice(i,1); continue;
      }
    }
    if (s.type === 'toxicPotion'){
      s.vy += 210*dt;
      let contact = s.life < 0.12 || s.y >= PLAY.y + PLAY.h - 12;
      if (!contact){
        for (const e of enemies){ if (Math.hypot(e.x-s.x,(e.y-28-s.y)*1.2) < e.r + s.size + 6){ contact = true; break; } }
      }
      if (!contact && boss){
        const by = boss.y - (boss.flyH || 0);
        if (Math.hypot(boss.x-s.x,(by-s.y)*1.1) < boss.r + s.size + 10) contact = true;
      }
      if (contact){
        spawnPlayerToxicPool(s.x, s.y+8);
        dmgNum(s.x, s.y-18, 'TOXIC', '#86d85d');
        shots.splice(i,1); continue;
      }
    }
    if (s.owner === 'player'){
      let hit = false;
      for (const e of enemies){
        if (Math.hypot(e.x-s.x, (e.y-30-s.y)*1.2) < e.r + s.size + 6){
          const finalDmg=s.dmg*(s.crit?1.4:1);
          if(s.type==='explosiveArrow') boom(s.x,s.y,54,Math.round(finalDmg*.7),'#ffb347');
          hurtEnemy(e, finalDmg, 120, s.ang);
          if(s.type==='fireArrow') e.burn=3.5;
          hit = true; puff(s.x,s.y,s.type==='fireArrow'?'#ff6b2f':'#fff',10,150,.32); break;
        }
      }
      if (!hit && sidekick && Math.hypot(sidekick.x-s.x, (sidekick.y-30-s.y)*1.2) < sidekick.r+s.size+8){
        sidekick.hp-=s.dmg*(s.crit?1.4:1); sidekick.flash=.12; dmgNum(sidekick.x,sidekick.y-52,s.dmg,'#e27b9b');
        hit=true; puff(s.x,s.y,'#e27b9b',8,130,.28);
      }
      if (!hit && boss){
        const by = boss.y - (38 + (boss.flyH || 0));
        const hitR = (shipBattle ? 72 : boss.r) + s.size + 12;
        if (Math.hypot(boss.x - s.x, (by - s.y) * 1.1) < hitR){
          if (s.type === 'arrow' || s.type === 'fireArrow' || s.type === 'explosiveArrow') boss._lastHitWasArrow = true;
          if (s.type === 'explosiveArrow') boom(s.x,s.y,54,Math.round(s.dmg*0.7),'#ffb347');
          if (s.type === 'cannon'){ boom(s.x, s.y, 42, 0, '#ffb347'); shake = Math.max(shake, 6); }
          hurtBoss(s.dmg * (s.crit?1.5:1), s.ang); hit = true;
          puff(s.x, s.y, s.type==='fireArrow'?'#ff6b2f':'#fff', 10, 150, 0.32);
          Music.sfx('hit');
        }
      }
      if (hit){ Visual.impact(s.x,s.y,s.type==='fireArrow'?'#ffb45b':'#d9eeff',14); Music.sfx('arrowImpact'); shots.splice(i,1); }
    } else if (s.owner === 'enemy'){
      const pr = player.r + s.size + (shipBattle ? 14 : 6);
      if (Math.hypot(player.x-s.x, (player.y-30-s.y)*1.2) < pr){
        if(s.type==='n20Rocket'){
          hurtPlayer(s.dmg); leafBurst(s.x,s.y,34,285); puff(s.x,s.y,'#ffc0c8',20,210,.55,5);
          Visual.explosion(s.x,s.y,36,'#ff8d8d');
          flashFx=Math.max(flashFx,.32);shake=Math.max(shake,15);Music.sfx('boom');shots.splice(i,1);continue;
        }
        hurtPlayer(s.dmg);
        if (s.type === 'leafArrow'){ leafBurst(s.x,s.y,10,115); puff(s.x,s.y,'#ffb5b5',8,95,.25,2); }
        if (s.type === 'policyCloud'){ puff(s.x,s.y,'#ffffff',10,110,.32,3); dmgNum(player.x,player.y-65,s.label||'SANCTION!','#d94242'); applyN20Policy(s.label||'SANCTION!'); }
        if (s.type === 'toxinArrow') applyPoisonPlayer(4.5);
        if (s.type === 'weakArrow') applyWeakPlayer(5.0);
        if (s.type === 'slowArrow') applySlowPlayer(4.0);
        if (s.type === 'godArrow'){ shake = Math.max(shake, 20); flashFx = Math.max(flashFx, 0.4); }
        if (s.type === 'adminLaser'){ shake = Math.max(shake, 4); }
        const fxCol = s.type==='adminLaser' ? '#ff3b4e' : s.type==='laser' ? '#9dffb0' : s.type==='cannon' ? '#ffb347' :
                      s.type==='toxinArrow' ? '#7ac84a' : s.type==='weakArrow' ? '#a06adf' :
                      s.type==='slowArrow' ? '#6ecbe8' : s.type==='godArrow' ? '#fff2c4' : '#ff9b78';
        puff(s.x, s.y, fxCol, 8, 120, 0.3);
        if (s.type === 'cannon') boom(s.x, s.y, 28, 0, '#ffb347');
        if (s.type === 'godArrow') boom(s.x, s.y, 46, 0, '#fff2c4');
        if (s.boomOnHit) boom(s.x, s.y, 26, 0, fxCol);
        shots.splice(i,1);
      }
    }
  }
}
function pearlLand(s){
  if (!boss) return;
  puff(boss.x, boss.y-30, '#63d6a8', 20, 180, 0.5);
  boss.x = Math.max(PLAY.x+30, Math.min(PLAY.x+PLAY.w-30, s.x));
  boss.y = Math.max(PLAY.y+20, Math.min(PLAY.y+PLAY.h, s.y));
  puff(boss.x, boss.y-30, '#9dffd0', 24, 200, 0.6);
  Music.sfx('pearl');
}

const DEATHSTAR_R = 54; // shared between the ai (hit detection) and the renderer
const DEATHSTAR_DISH_DX = DEATHSTAR_R*0.32, DEATHSTAR_DISH_DY = DEATHSTAR_R*0.34;
function boom(x, y, r, dmg, col){
  Visual.explosion(x,y,r,col);
  puff(x, y, col || '#ffb347', 34, 320, 0.7, 5);
  puff(x, y, '#ff5b2a', 22, 240, 0.55, 4);
  puff(x, y, '#4a4a4a', 18, 150, 1.1, 6);
  if (Math.hypot(player.x-x, (player.y-y)*1.2) < r + player.r) hurtPlayer(dmg);
  for (const e of enemies) if (Math.hypot(e.x-x, (e.y-y)*1.2) < r + e.r) hurtEnemy(e, dmg*0.8, 200, Math.atan2(e.y-y, e.x-x));
  shake = Math.max(shake, 14); flashFx = Math.max(flashFx, 0.3);
  Music.sfx('boom');
}
function spawnPlayerToxicPool(x, y){
  hazards.push({ kind:'toxicPool', x, y:Math.min(PLAY.y+PLAY.h-12, y), r:62, t:4.8, max:4.8, dmg:7, tick:0.1, owner:'player' });
  puff(x, y, '#86d85d', 18, 140, 0.45, 3);
  puff(x, y, '#d4f7a7', 10, 90, 0.35, 2);
  Music.sfx('apple');
}

function updateHazards(dt){
  for (let i=hazards.length-1;i>=0;i--){
    const h = hazards[i];
    h.t -= dt;
    if (h.kind === 'adminWall'){
      const halfW=(h.w||24)/2, halfH=(h.h||118)/2;
      if (Math.abs(player.x-h.x) < halfW+player.r && Math.abs((player.y-20)-h.y) < halfH){
        player.x = h.side<0 ? h.x-halfW-player.r-2 : h.x+halfW+player.r+2;
        player.kbx *= .3;
      }
      if(h.t<=0) hazards.splice(i,1);
      continue;
    }
    if (h.kind === 'toxicPool'){
      h.tick = (h.tick || 0) - dt;
      if (h.tick <= 0){
        h.tick = 0.45;
        for (const e of enemies) if (e.hp>0 && Math.hypot(e.x-h.x,(e.y-h.y)*1.2) < h.r + e.r*0.4) hurtEnemy(e, h.dmg, 35, Math.atan2(e.y-h.y, e.x-h.x));
        if (sidekick && sidekick.hp>0 && Math.hypot(sidekick.x-h.x,(sidekick.y-h.y)*1.2) < h.r + sidekick.r*0.4) sidekick.hp -= h.dmg;
        if (boss && boss.hp>0){
          const by = boss.y - (boss.flyH || 0);
          if (Math.hypot(boss.x-h.x,(by-h.y)*1.15) < h.r + boss.r*0.6) hurtBoss(Math.round(h.dmg*0.85), Math.atan2(by-h.y, boss.x-h.x));
        }
        puff(h.x+rnd(-18,18), h.y+rnd(-10,10), '#8be05d', 2, 26, 0.2, 2);
      }
      if (h.t <= 0){ puff(h.x, h.y, '#6fb648', 10, 60, 0.25, 2); hazards.splice(i,1); }
      continue;
    }
    if (h.t <= 0){
      if (h.kind === 'bolt'){
        if (Math.hypot(player.x-h.x, (player.y-h.y)*1.2) < h.r + player.r) hurtPlayer(h.dmg);
        for (const e of enemies) if (Math.hypot(e.x-h.x, (e.y-h.y)*1.2) < h.r) hurtEnemy(e, h.dmg, 0, 0);
        puff(h.x, h.y, '#dfffe8', 30, 260, 0.5);
        flashFx = Math.max(flashFx, 0.45); shake = Math.max(shake, 12);
        Music.sfx('boom');
      } else if (h.kind === 'anvil'){
        boom(h.x, h.y, h.r, h.dmg, '#8a8f99');
      } else {
        boom(h.x, h.y, h.r, h.dmg);
      }
      hazards.splice(i,1);
    }
  }
  for (let i=carts.length-1;i>=0;i--){
    const c = carts[i];
    c.fuse -= dt;
    c.spin += dt*8;
    if (c.falling){
      // dramatic arc into the ground
      c.vy += 520*dt;
      c.x += c.vx*dt;
      c.y += c.vy*dt;
      if (Math.random() < 0.7) puff(c.x, c.y-10, '#ff6b2f', 2, 40, 0.25, 3);
      if (c.y >= (c.landY || PLAY.y+PLAY.h*0.85) || c.fuse <= 0){
        boom(c.x, c.y-8, 96, 30);
        shake = Math.max(shake, 14);
        flashFx = Math.max(flashFx, 0.35);
        Music.sfx('boom');
        carts.splice(i,1);
      }
    } else {
      // coast then tip into a fall
      c.x += c.vx*dt; c.y += c.vy*dt;
      if (Math.random() < 0.5) puff(c.x, c.y-16, '#ffb347', 1, 30, 0.3, 2);
      if (c.fuse < 1.8 && !c.falling){
        c.falling = true;
        c.landY = Math.min(PLAY.y+PLAY.h-8, c.y + 40 + Math.random()*50);
        c.vy = 40;
        c.vx *= 0.35;
      }
      if (c.fuse <= 0 || Math.hypot(player.x-c.x, (player.y-c.y)*1.2) < 26
          || c.x < PLAY.x-20 || c.x > PLAY.x+PLAY.w+20
          || c.y < PLAY.y-20 || c.y > PLAY.y+PLAY.h+20){

}

function updateMisc(dt){
  updateWarning(dt);
  for (let i=parts.length-1;i>=0;i--){
    const p = parts[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vx *= 0.93; p.vy = p.vy*0.93 + p.g*dt;
    if(p.kind==='mapleLeaf') p.rot=(p.rot||0)+(p.vr||0)*dt;
    p.life -= dt;
    if (p.life <= 0) parts.splice(i,1);
  }
  for (let i=nums.length-1;i>=0;i--){
    const n = nums[i]; n.t -= dt; n.y -= dt*30;
    if (n.t <= 0) nums.splice(i,1);
  }
  for (let i=drops.length-1;i>=0;i--){
    const d = drops[i]; d.t -= dt; d.bob += dt*5;
    if (Math.hypot(player.x-d.x, (player.y-d.y)*1.2) < d.r + player.r){
      if (d.scam){
        hurtPlayer(14);
        dmgNum(d.x, d.y-30, 'SCAMMED!', '#ffd95e');
        puff(d.x, d.y-14, '#c8382a', 16, 140, 0.55);
        Music.sfx('hurt');
      } else if (d.gold){
        gold += d.gold;
        dmgNum(d.x, d.y-30, '+'+d.gold+' GOLD', '#ffd95e');
        puff(d.x, d.y-14, '#ffd95e', 18, 150, 0.55);
        Music.sfx('coin');
      } else {
        player.apples = Math.min(5, player.apples+1);
        puff(d.x, d.y-14, '#ffd95e', 14, 120, 0.5);
        Music.sfx('coin');
      }
      drops.splice(i,1); continue;
    }
    if (d.t <= 0) drops.splice(i,1);
  }
  for (let i=impactRings.length-1;i>=0;i--){
    impactRings[i].t -= dt;
    if (impactRings[i].t <= 0) impactRings.splice(i,1);
  }
  combatCamera.kick = Math.max(0, combatCamera.kick-dt*2.8);
  combatCamera.pulse = Math.max(0, combatCamera.pulse-dt*3.8);
  shake *= 0.86;
  flashFx = Math.max(0, flashFx - dt*1.8);
  Dialogue.update(dt);
}

/* ------------------------------------------------------ boss lifecycle */
function checkBossDialogue(){
  if (!boss) return;
  /* Washington is intentionally dialogue-free once the playable Roman duel
     begins. His entrance recording happens before the fight, and his next
     spoken line is the recorded retreat line after the player defeats him. */
  if (boss.dcInvasion && boss.def.key === 'romandicario') return;
  const L = boss.def.lines;
  const k = boss.hp / boss.maxHp;
  if (!boss.said70 && k <= 0.7){
    boss.said70 = true;
    bossLine(L.hp70);
    if (boss.def.key === 'kinggaming' && sidekick?.skin === 'malshman' && sidekick.hp > 0){
      sidekickLine(sidekick, "Quite Toast? N20_? Those are OLD news, we are the future of North America!");
    }
  }
  if (!boss.said40 && k <= 0.4){ boss.said40 = true; bossLine(L.hp40); }
}
function sidekickLine(s, text){
  if (!s || !text) return;
  const owner = SIDEKICK_OWNER[s.skin];
  if (!boss || (owner && owner !== boss.def.key)) return;
  Dialogue.push(s.skin, s.name || 'Sidekick', text, SIDEKICK_COLOR[s.skin] || boss.def.accent, s.skin);
}
function bossLine(text){
  if (!boss || !text) return;
  // Roman does not speak during the playable Washington invasion duel.
  if (boss.dcInvasion && boss.def.key === 'romandicario') return;
  let voiceKey = boss.def.key;
  if (boss.def.key === 'romandicario' && boss.phase3) voiceKey = 'romandicario_rage';
  if (boss.def.key === 'oxbit' && boss.phase2) voiceKey = 'oxbit_rage';
  Dialogue.push(voiceKey, boss.def.name, text, boss.def.accent, boss.def.skin);
}

function updateShipBattle(dt){
  if (!shipBattle || !boss || !playerShip || !bossShip) return;

  // raging storm lightning bolts
  if (!shipStorm) shipStorm = { boltT: 0, boltX: W/2, cd: 1.5 };
  shipStorm.boltT = Math.max(0, shipStorm.boltT - dt);
  shipStorm.cd -= dt;
  if (shipStorm.cd <= 0){
    shipStorm.cd = 2.2 + Math.random()*2.8;
    shipStorm.boltT = 0.35;
    shipStorm.boltX = PLAY.x + 40 + Math.random()*(PLAY.w-80);
    flashFx = Math.max(flashFx, 0.55);
    shake = Math.max(shake, 10);
    Music.sfx('boom');
    // bolt hazard near strike point on the water line
    hazards.push({
      kind:'bolt', x: shipStorm.boltX, y: PLAY.y + PLAY.h*0.55,
      r: 70, t: 0.12, max: 0.12, dmg: 16
    });
  }

  // RomanDiCario's barricade props also appear during the ship battle instead
  // of vanishing when phase 2 starts — same crates, now stacked on his deck.
  if (!boss.platforms) boss.platforms = [];
  for (let i=boss.platforms.length-1;i>=0;i--){
    boss.platforms[i].t -= dt;
    if (boss.platforms[i].t <= 0) boss.platforms.splice(i,1);
  }
  if (boss.def.key === 'romandicario'){
    boss.cd7 = boss.cd7 === undefined ? 4.0 : boss.cd7;
    boss.cd7 -= dt;
    if (boss.cd7 <= 0){
      boss.cd7 = 6.5;
      const px = bossShip.x + rnd(-30,30), py = bossShip.y - 30;
      boss.platforms.push({ x:px, y:py, t:6.0, h:4 });
      puff(px, py-16, '#5a4a2e', 10, 70, 0.3);
      Music.sfx('block');
    }
  }

  // steer boat: A/D or arrows, also allow slight vertical with W/S
  let dx = 0, dy = 0;
  if (keys['KeyA'] || keys['ArrowLeft'])  dx -= 1;
  if (keys['KeyD'] || keys['ArrowRight']) dx += 1;
  if (keys['KeyW'] || keys['ArrowUp'])    dy -= 1;
  if (keys['KeyS'] || keys['ArrowDown'])  dy += 1;
  // touch stick
  if (touch.moveId !== null && touch.origin && touch.pos){
    const jx = touch.pos.x - touch.origin.x, jy = touch.pos.y - touch.origin.y, m = Math.hypot(jx,jy);
    if (m > 10){ dx += jx/m; dy += jy/m; }
  }
  const m = Math.hypot(dx, dy);
  if (m > 0){ dx /= m; dy /= m; }
  const spd = 260;
  playerShip.x += dx * spd * dt;
  playerShip.y += dy * spd * 0.75 * dt;
  // keep player ship on the left half of the water, inside play area
  playerShip.x = Math.max(PLAY.x + 50, Math.min(W * 0.48, playerShip.x));
  playerShip.y = Math.max(PLAY.y + 50, Math.min(PLAY.y + PLAY.h - 30, playerShip.y));
  player.x = playerShip.x;
  player.y = playerShip.y - 28;
  player.facing = bossShip.x >= playerShip.x ? 1 : -1;
  player.walk = m > 0 ? player.walk + dt * 10 : player.walk * 0.8;

  // fire cannons toward mouse (or boss if no mouse) — slower, heavier shots
  playerShip.cannonCd = Math.max(0, playerShip.cannonCd - dt);
  const fire = mouse.left || keys['Space'] || keys['KeyJ'];
  if (fire && playerShip.cannonCd <= 0){
    playerShip.cannonCd = 0.85;
    const aimX = mouse.x, aimY = mouse.y;
    const ang = Math.atan2(aimY - (playerShip.y - 20), aimX - playerShip.x);
    shots.push({
      x: playerShip.x + Math.cos(ang) * 36,
      y: playerShip.y - 20 + Math.sin(ang) * 20,
      vx: Math.cos(ang) * 420,
      vy: Math.sin(ang) * 320,
      dmg: 30, owner: 'player', type: 'cannon', life: 3.0, size: 10, ang: ang
    });
    Music.sfx('cannonFire');
    shake = Math.max(shake, 4);
    puff(playerShip.x + Math.cos(ang)*30, playerShip.y - 18, '#ffb347', 6, 80, 0.3);
  }

  // boss ship patrols right side and fires at player
  bossShip.bob += dt * 2.4;
  bossShip.x += Math.sin(boss.t * 0.65) * 55 * dt;
  bossShip.x = Math.max(W * 0.52, Math.min(PLAY.x + PLAY.w - 50, bossShip.x));
  // gentle vertical drift so he is not locked
  bossShip.y = (PLAY.y + PLAY.h * 0.55) + Math.sin(bossShip.bob * 0.7) * 18;
  boss.x = bossShip.x;
  boss.y = bossShip.y - 36 + Math.sin(bossShip.bob) * 3;
  boss.facing = player.x < boss.x ? -1 : 1;
  boss.walk = 0;

  bossShip.cannonCd -= dt;
  if (bossShip.cannonCd <= 0){
    bossShip.cannonCd = boss.hp < boss.maxHp * 0.4 ? 1.1 : 1.6;
    const n = boss.hp < boss.maxHp * 0.4 ? 3 : 2;
    for (let i = 0; i < n; i++){
      const ang = Math.atan2(player.y - bossShip.y, player.x - bossShip.x) + (i - (n - 1) / 2) * 0.2;
      shots.push({
        x: bossShip.x - 28, y: bossShip.y - 16,
        vx: Math.cos(ang) * 300, vy: Math.sin(ang) * 220,
        dmg: 19, owner: 'enemy', type: 'cannon', life: 3.0, size: 9, ang: ang
      });
    }
    Music.sfx('cannonFire');
  }
}

/* =====================================================================
   ROMANDICARIO'S FINALE — Oxbit never actually dies to the player. The
   player only ever grinds him down to the rage-quit. It's RomanDiCario —
   the one player in EarthPol lore who ever exposed and humiliated Oxbit —
   who shows up out of nowhere to challenge Oxbit directly. Their red and
   green energy beams collide until the overloaded server core deletes itself. Runs as its own game
   state so it can fully own the camera and the music.
   ===================================================================== */
let oxbitFinale = null;
const OXBIT_FINALE_DUR = { oxbitPower:5.6, blackout:0.9, entrance:2.0, line:3.8, aim:2.6, shoot:4.6, explode:3.1 };
function startOxbitFinale(){
  const bx = boss ? boss.x : W/2, by = boss ? boss.y - (boss.flyH||0) : PLAY.y + PLAY.h*0.5;
  oxbitFinale = {
    phase:'oxbitPower', phaseT:0,
    oxX:bx, oxY:by,
    romX: W + 140, romY: PLAY.y + PLAY.h*0.66,
    romTX: Math.max(120, bx - 190), romTY: PLAY.y + PLAY.h*0.66,
    powerPulse:0,
    spoke:false, diedSpoke:false, shotFired:false, exploded:false, powerStep:0
  };
  state = 'oxbitfinale';
  paused = false;
  Dialogue.clear(); Voice.cancel();
  shots.length = 0; hazards.length = 0; enemies.length = 0;
  // Oxbit's own theme keeps playing through his power-up attempt — it only
  // cuts out dead once RomanDiCario actually interrupts him (see 'blackout')

  // pushed synchronously, the same frame the finale starts, so there is no
  // dependency on update-loop timing for the line to actually appear
  Dialogue.push('oxbit', 'Oxbit',
    'YOU WANT TO SEE WHAT TRUE POWER LOOKS LIKE', '#9dffb0', 'oxbit');
}
function oxbitFinaleNextPhase(p){
  oxbitFinale.phase = p; oxbitFinale.phaseT = 0;
  if (p === 'blackout'){
    // RomanDiCario cuts Oxbit off mid-transformation — his theme dies right here
    Dialogue.clear(); Voice.cancel();
    CustomAudio.stop();
    Music.stop();
    shake = Math.max(shake, 14); flashFx = 1.0;
  }
  if (p === 'entrance'){
    // RomanDiCario's theme motif — a brief entrance sting, not the full loop
    Music.play('romandicario_tower');
  }
  if (p === 'shoot'){
    Music.stop(); CustomAudio.stop();
    Dialogue.clear();
    oxbitFinale.clashPulse=0;
    oxbitFinale.clashMidX=(oxbitFinale.romX+oxbitFinale.oxX)/2;
    oxbitFinale.clashMidY=(oxbitFinale.romY-56+oxbitFinale.oxY-48)/2;
    shake = 8; flashFx = 0.22;
    Music.sfx('heavy');
  }
  if (p === 'explode'){
    oxbitFinale.exploded = true;
    oxbitFinale.staticSeed = Math.random()*9999;
    Music.sfx('boom'); Music.sfx('die');
    shake = 44; flashFx = 1.0;
    const ex=oxbitFinale.clashMidX||W/2, ey=oxbitFinale.clashMidY||H*.46;
    puff(ex, ey, '#ffffff', 86, 440, 1.35, 6);
    puff(ex, ey, '#ff3636', 52, 330, 1.15, 5);
    puff(ex, ey, '#55ff79', 52, 330, 1.15, 5);
    Visual.explosion(ex,ey,92,'#ffffff');
  }
}
function updateOxbitFinale(dt){
  const f = oxbitFinale;
  if (!f) return;
  f.phaseT += dt;
  updateMisc(dt);
  const D = OXBIT_FINALE_DUR;
  if (f.phase === 'oxbitPower'){
    // Oxbit, still floating from the rage-quit, tries to force his way into
    // a "phase 3" — green-and-white power flashes building off him like a
    // god — right up until RomanDiCario cuts the whole attempt short. His
    // line was already pushed synchronously in startOxbitFinale().
    shake = Math.min(11, shake + dt*16);
    if(f.powerStep===0 && f.phaseT>.9){f.powerStep=1;if(boss){boss.consoleText='/op Oxbit';boss.consoleT=2.2;}}
    if(f.powerStep===1 && f.phaseT>2.0){f.powerStep=2;if(boss){boss.consoleText='/gamemode creative Oxbit';boss.consoleT=2.2;}}
    if(f.powerStep===2 && f.phaseT>3.2){f.powerStep=3;if(boss){boss.consoleText='PERMISSION LEVEL: ROOT';boss.consoleT=2.4;}showWarning('PHASE III AUTHORIZATION...');}
    if(f.powerStep===3 && f.phaseT>4.25){f.powerStep=4;if(boss){boss.consoleText='/execute as @s run ...';boss.consoleT=2.0;}}
    f.powerPulse += dt;
    if (f.powerPulse > 0.14){
      f.powerPulse = 0;
      puff(f.oxX, f.oxY, Math.random() < 0.5 ? '#9dffb0' : '#ffffff', 12, 170, 0.55, 3);
    }
    if (f.phaseT >= D.oxbitPower) oxbitFinaleNextPhase('blackout');
  } else if (f.phase === 'blackout'){
    if (f.phaseT >= D.blackout) oxbitFinaleNextPhase('entrance');
  } else if (f.phase === 'entrance'){
    const k = Math.min(1, f.phaseT / D.entrance);
    const ease = 1 - Math.pow(1-k, 3);
    f.romX = lerp(W+140, f.romTX, ease);
    if (k >= 1) oxbitFinaleNextPhase('line');
  } else if (f.phase === 'line'){
    if (!f.spoke){

    }
    if (f.phaseT >= D.line) oxbitFinaleNextPhase('aim');
  } else if (f.phase === 'aim'){
    f.deleteElapsed = (f.deleteElapsed || 0) + dt;
    if (f.phaseT >= D.aim) oxbitFinaleNextPhase('shoot');
  } else if (f.phase === 'shoot'){
    f.deleteElapsed = (f.deleteElapsed || 0) + dt;
    f.clashPulse = Math.min(1, f.phaseT / D.shoot);
    shake = Math.max(shake, 5 + f.clashPulse*18);
    if (f.phaseT >= D.shoot) oxbitFinaleNextPhase('explode');
  } else if (f.phase === 'explode'){
    if (f.phaseT >= D.explode) finishOxbitFinale();
  }

function updateBoss(dt){
  if (!boss) return;
  if (state !== 'play') return;   // a scripted takeover (e.g. the Oxbit finale) owns the frame now
  boss.t += dt;
  boss.flash = Math.max(0, boss.flash - dt);
  if (boss.shield > 0) boss.shield -= dt;
  if (boss.armSwingT > 0){
    boss.armSwingT -= dt;
    const k = 1 - Math.max(0, boss.armSwingT) / boss.armSwingMax;
    boss.armAngle = -1.3 + k*2.3;
  } else boss.armAngle = 0;
  if (boss.phase2 && shipBattle){
    updateShipBattle(dt);
    // still check death in ship phase (was returning before this)
    if (boss.hp <= 0){
      const def = boss.def;
      if (def.key === 'romandicario'){
        // his ship is gone, but he is not — the fight moves to the top of
        // his own tower for a damaged, personal, final round
        startRomanTowerPhase();
        return;
      }
      puff(boss.x, boss.y-40, def.color, 70, 320, 1.1, 5);
      if (bossShip){
        for (let i=0;i<12;i++) puff(bossShip.x+rnd(-40,40), bossShip.y+rnd(-20,10), '#ffb347', 8, 160, 0.6, 4);
      }
      shake = 22; flashFx = 0.8; timeScale = 0.25; score += 800;
      Music.stop(); Music.sfx('win');
      Dialogue.clear();
      if (def.lines.death) Dialogue.push(def.key, def.name, def.lines.death, def.accent, def.skin);
      gold += 120 + Math.round(WAVES[waveIndex].hp*0.45);
      boss = null; sidekick = null;
      shipBattle = false; playerShip = null; bossShip = null;
      onBossDefeated();
    }
    return;
  }
  boss.def.ai(boss, dt * (boss._chron?.recover > 0 ? 0.35 : 1));
  updateSidekick(dt);
  if (!boss.jumping) clampPlay(boss);
  if (boss.def.contact && !boss.dualDown && !boss.jumping && !boss.rageQuit && Math.hypot(player.x-boss.x, (player.y-boss.y)*1.3) < boss.r + player.r + 6){
    const willLand = player.iframe <= 0;
    hurtPlayer(boss.def.contact*dt*3.5, false, 0.1);
    // the dagger knocks the player back a few meters on every clean hit —
    // gated on willLand so it fires once per hit, not once per frame
    if (willLand && boss.def.key === 'romandicario'){
      const ang = Math.atan2(player.y-boss.y, player.x-boss.x);
      player.kbx = Math.cos(ang)*760;
      player.kby = Math.sin(ang)*520;
    }
  }
  if (boss.hp <= 0 && !(boss.jumping && boss.jumpT < 3.4) && !(boss.rageQuit && boss.rageQuitT < 2.2)){
    /* First true dual boss: dropping KingGaming does not clear Toronto while
       MalshMan is still standing. KingGaming remains visibly defeated at 1 HP;
       MalshMan's own death then hands the final zero HP back here. */
    if (boss.def.key === 'kinggaming' && sidekick && sidekick.skin === 'malshman' && sidekick.hp > 0 && !boss.dualDown){
      boss.dualDown = true;
      boss.hp = 1;
      boss.speed = 0;
      boss.contact = 0;
      puff(boss.x,boss.y-40,'#8eea82',34,190,.65,4);
      Dialogue.clear();
      bossLine("MalshMan... the empire is yours. Finish this.");
      Music.sfx('heavy');
      return;
    }
    /* The invasion Roman is a scripted set-piece fought in Washington, not
       his own campaign — he never dies here and must never fall through
       into the ship or tower phases below. Checked before everything. */
    if (boss.dcInvasion){
      startRomanDCFlee();
      return;
    }
    if (boss.def.key === 'n20' && !boss.phase2){
      startN20Phase2();
      return;
    }
    if (boss.def.key === 'n20' && boss.phase2 && !boss.panicGround){
      if(!boss.phase2Ready) beginN20FortressFinale();
      boss.hp=Math.max(1,Math.round(boss.maxHp*.28)); startN20PanicJump(); return;
    }
    if (boss.def.key === 'n20' && boss.phase2 && boss.panicGround && !boss.takeoverStarted){
      boss.takeoverStarted = true; startN20TakeoverCutscene(); return;
    }
    /* Toast_Quite now has a capital-defense phase before Roman crashes the ending. */
    if (boss.def.key === 'toast' && !boss.phase2){
      startToastPhase2();
      return;
    }
    if (boss.def.key === 'toast' && boss.phase2 && !boss.invasionStarted){
      boss.invasionStarted = true;
      const def = boss.def;
      puff(boss.x, boss.y-40, def.color, 60, 300, 1.0, 5);
      shake = 20; flashFx = 0.7;
      score += 800;
      gold += 120 + Math.round(WAVES[waveIndex].hp*0.45);
      Dialogue.clear();
      startRomanDCInvasionCutscene();
      return;
    }
    // RomanDiCario phase 2: floor explodes into water, ship battle
    if (boss.def.key === 'romandicario' && !boss.phase2 && !boss.phase3 && !boss.phase4){
      boss.phase2 = true;
      boss.hp = boss.maxHp;
      boss.said70 = false; boss.said40 = false;
      shipBattle = true;
      shipStorm = { boltT: 0, boltX: W/2, cd: 1.5 };
      // both ships share the same water line so they can trade fire
      const waterY = PLAY.y + PLAY.h * 0.58;
      playerShip = { x: W*0.25, y: waterY, cannonCd:0 };
      bossShip = { x: W*0.75, y: waterY - 8, cannonCd:1.0, bob:0 };
      enemies = []; carts = []; hazards = []; shots = [];
      // floor explosion FX
      for (let i=0;i<18;i++){
        puff(PLAY.x + Math.random()*PLAY.w, PLAY.y + Math.random()*PLAY.h*0.6, '#c8382a', 8, 180, 0.7, 4);
        puff(PLAY.x + Math.random()*PLAY.w, PLAY.y + Math.random()*PLAY.h*0.6, '#ffb347', 6, 140, 0.5, 3);
      }
      shake = 28; flashFx = 1.0; timeScale = 0.35;
      // snap back to full speed quickly so ship steering feels responsive
      setTimeout(() => { timeScale = 1; }, 600);
      Music.sfx('banhammer'); Music.sfx('boom');
      Music.play('roman_ship');
      bossLine("Land was getting predictable. Meet me on the water, mi amigo — let us see if you can swim.");
      boss.x = bossShip.x; boss.y = bossShip.y - 36;
      player.x = playerShip.x; player.y = playerShip.y - 28;
      return;
    }
    // Oxbit phase 2: the ground fight is over, he goes fully airborne
    if (boss.def.key === 'oxbit' && !boss.phase2){
      startOxbitPhase2();
      return;
    }
    // Oxbit's actual death is not a normal boss kill — the player only ever
    // beats him down to a rage-quit. It's RomanDiCario, out of nowhere, who
    // lands the finishing shot and deletes the server.
    if (boss.def.key === 'oxbit' && boss.phase2 && !boss.finaleStarted){
      boss.finaleStarted = true;
      startOxbitFinale();
      return;
    }
    // Dandire phase 2: the bowman drops the act and becomes the Architect
    if (boss.def.key === 'dandire' && !boss.phase2){
      startDandireArchitect();
      return;
    }
    const def = boss.def;
    puff(boss.x, boss.y-40, def.color, 70, 320, 1.1, 5);
    shake = 22; flashFx = 0.8; timeScale = 0.25; score += 800;
    Music.stop(); Music.sfx('win');
    Dialogue.clear();
    if (def.lines.death) Dialogue.push(def.key, def.name, def.lines.death, def.accent, def.skin);
    gold += 120 + Math.round(WAVES[waveIndex].hp*0.45);
    boss = null; sidekick = null;
    shipBattle = false; playerShip = null; bossShip = null;
    
    onBossDefeated();
  }
}

      ctx.lineWidth = 2.5;
      ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r, h.r*0.46, 0, 0, 7); ctx.stroke();
      ctx.fillStyle = 'rgba(106,186,60,' + (0.16 + 0.08*Math.sin(h.t*6)) + ')';
      ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r*0.92, h.r*0.40, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(194,255,148,0.12)';
      ctx.beginPath(); ctx.ellipse(h.x-8, h.y-2, h.r*0.42, h.r*0.14, -0.2, 0, 7); ctx.fill();
      ctx.restore();
    } else if (h.kind === 'anvil'){
      const fall = Math.pow(k, 2);
      ctx.save();
      ctx.globalAlpha = 0.4;
      ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.ellipse(h.x, h.y, 16*(0.4+k*0.6), 6*(0.4+k*0.6), 0, 0, 7); ctx.fill();
      ctx.restore();
      const ay = h.y - 210*(1-fall);
      ctx.fillStyle = '#3f434a'; ctx.fillRect(h.x-16, ay-22, 32, 10);
      ctx.fillStyle = '#585d66'; ctx.fillRect(h.x-11, ay-12, 22, 8);
      ctx.fillStyle = '#2b2f35'; ctx.fillRect(h.x-15, ay-4, 30, 6);
    } else if (h.kind === 'bolt'){
      ctx.strokeStyle = 'rgba(160,255,190,' + (0.35+0.5*Math.sin(h.t*30)) + ')';
      ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(h.x, h.y, h.r*(1-k*0.4), 0, 7); ctx.stroke();
      if (h.t < 0.25){
        ctx.strokeStyle = '#dfffe8'; ctx.lineWidth = 5;
        ctx.beginPath(); ctx.moveTo(h.x, STAGE.y);
        ctx.lineTo(h.x+12, h.y-120); ctx.lineTo(h.x-10, h.y-60); ctx.lineTo(h.x, h.y);
        ctx.stroke();
      }
    } else {
      const col = h.kind === 'gold' ? '255,205,90' : '255,90,50';
      ctx.strokeStyle = 'rgba('+col+',' + (0.45+0.45*Math.sin(h.t*24)) + ')';
      ctx.lineWidth = 3;
      ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r, h.r*0.5, 0, 0, 7); ctx.stroke();
      ctx.fillStyle = 'rgba('+col+',' + (0.08 + k*0.22) + ')';
      ctx.beginPath(); ctx.ellipse(h.x, h.y, h.r*k, h.r*k*0.5, 0, 0, 7); ctx.fill();
      if (h.kind === 'tnt'){
        ctx.fillStyle = '#c8382a'; ctx.fillRect(h.x-11, h.y-26, 22, 22);
        ctx.fillStyle = '#e8e8e8'; ctx.fillRect(h.x-11, h.y-19, 22, 7);
        ctx.fillStyle = '#1c1c1c'; ctx.font = '700 9px "Pixelify Sans", Inter, Segoe UI, Arial'; ctx.textAlign='center';
        ctx.fillText('TNT', h.x, h.y-13); ctx.textAlign='left';
      } else if (h.kind === 'gold'){
        ctx.fillStyle = '#e8c153'; ctx.fillRect(h.x-9, h.y-20, 18, 10);
        ctx.fillStyle = '#fff0b0'; ctx.fillRect(h.x-7, h.y-18, 14, 4);
      }
    }
  }
  for (const c of carts){
    ctx.save(); ctx.translate(c.x, c.y-12);
    ctx.globalAlpha = 0.35; ctx.fillStyle='#000';
    ctx.beginPath(); ctx.ellipse(0, 14, 17, 6, 0, 0, 7); ctx.fill();
    ctx.globalAlpha = 1;
    const blink = (Math.sin(c.fuse*18) > 0 && c.fuse < 3);
    ctx.fillStyle = blink ? '#ffffff' : '#c8382a'; ctx.fillRect(-13,-20,26,24);
    ctx.fillStyle = blink ? '#ffdede' : '#e8e8e8'; ctx.fillRect(-13,-12,26,8);
    ctx.fillStyle = '#1c1c1c'; ctx.font = '700 9px "Pixelify Sans", Inter, Segoe UI, Arial'; ctx.textAlign='center';
    ctx.fillText('TNT', 0, -5); ctx.textAlign='left';
    ctx.fillStyle = '#6b6f77'; ctx.fillRect(-16, 2, 32, 8);
    ctx.fillStyle = '#2a2d33';
    ctx.fillRect(-12+Math.cos(c.spin)*1, 9, 8, 8);
    ctx.fillRect(5+Math.cos(c.spin)*1, 9, 8, 8);
    ctx.restore();
  }
}

/* Tobikoer's netherite axe, posed through his swing states */
function drawTobiAxe(b){
  ctx.save();
  ctx.translate(b.x, b.y - 44);
  if (b.facing < 0) ctx.scale(-1, 1);
  let ang = -0.5 + Math.sin(b.walk)*0.12;
  if (b.mode === 'whirl') ang = (b.spin || 0);
  else if (b.swingT > 0){
    const k = 1 - b.swingT/0.26;
    ang = b.swingHeavy ? (-2.1 + k*3.0) : (-1.5 + k*2.4);
  } else if (b.mode === 'combo') ang = -1.7;
  ctx.rotate(ang);
  ctx.translate(16, 0);
  ctx.fillStyle = '#3a2a18'; ctx.fillRect(-4, -6, 8, 52);          // haft
  ctx.fillStyle = '#5b4326'; ctx.fillRect(-2, -6, 3, 52);
  ctx.fillStyle = '#0f1216'; ctx.fillRect(-2, -34, 26, 30);        // head
  ctx.fillStyle = '#4a4553'; ctx.fillRect(0, -32, 22, 26);
  ctx.fillStyle = '#6b6478'; ctx.fillRect(0, -32, 22, 6);
  ctx.fillStyle = '#c9c2d6'; ctx.fillRect(18, -30, 5, 22);         // edge
  ctx.fillStyle = '#f0a423'; ctx.fillRect(-3, -8, 10, 5);          // gold binding
  ctx.restore();
  if (b.swingT > 0){
    const a2 = b.facing > 0 ? 0 : Math.PI;
    ctx.strokeStyle = 'rgba(255,238,176,' + (b.swingT/0.26*0.7) + ')';
    ctx.lineWidth = b.swingHeavy ? 9 : 6;
    ctx.beginPath();
    ctx.arc(b.x, b.y-40, b.swingHeavy ? 96 : 78, a2-0.9, a2+0.9);
    ctx.stroke();
  }
}

/* Matie's medieval defensive wall — stone blocks with crenellations,
   raised in front of him to stop incoming arrows */
function drawMatieWall(b){
  const k = Math.min(1, (b.wallT || 0) / 0.35);
  ctx.save();
  ctx.globalAlpha = k;
  ctx.translate(b.x + b.facing*30, b.y - 20);
  const wW = 44, wH = 62;
  // shadow
  ctx.globalAlpha = k*0.3; ctx.fillStyle='#000';
  ctx.beginPath(); ctx.ellipse(0, 4, wW*0.5, 8, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = k;
  // stone body, coursed blocks
  for (let row=0; row<6; row++){
    const yy = -wH + row*11;
    for (let col=0; col<4; col++){
      const off = (row%2===0) ? 0 : 6;
      const xx = -wW/2 + off + col*11 - 6;
      ctx.fillStyle = (row+col)%2===0 ? '#9a9184' : '#847b6e';
      ctx.fillRect(xx, yy, 10, 10);
      ctx.fillStyle = 'rgba(255,255,255,0.08)';
      ctx.fillRect(xx, yy, 10, 2);
    }
  }
  // crenellations along the top
  ctx.fillStyle = '#847b6e';
  for (let i=0;i<3;i++) ctx.fillRect(-wW/2+2+i*15, -wH-8, 9, 10);
  // Hungarian-style shield emblem, centered
  ctx.fillStyle = '#8fc4dc'; ctx.fillRect(-8, -wH/2-6, 16, 20);
  ctx.fillStyle = '#caa23a'; ctx.fillRect(-8, -wH/2-6, 16, 6);
  ctx.restore();
}

    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.rotate(b.rot);

      drawSkin(b.skin, 0, 0, b.scale, { walk: 0, facing: 1 });

  for (let i = 0; i < 10; i++){

    ctx.fillRect(fx - 3, fy - 10 - flick*8, 5, 10 + flick*8);

/* floating nameplate, Minecraft style: dark plate, no outline on the text */
function nameplate(x, y, text, col, small){
  ctx.font = '700 ' + (small ? 11 : 13) + 'px "Pixelify Sans", Inter, Segoe UI, Arial';
  const w = ctx.measureText(text).width;
  const h = small ? 13 : 16;
  ctx.globalAlpha = 0.55;
  ctx.fillStyle = '#000';
  ctx.fillRect(Math.round(x - w/2 - 4), Math.round(y - h), Math.round(w + 8), h);
  ctx.globalAlpha = 1;
  ctx.textAlign = 'center';
  ctx.fillStyle = col;
  ctx.fillText(text, Math.round(x), Math.round(y - (small ? 3 : 4)));
  ctx.textAlign = 'left';
}

/* =====================================================================
   THE DC INVASION — RomanDiCario's legion arrives the moment Toast_Quite
   falls. He lands with twelve SPQM troops of mixed rank, claims the city
   for himself, and the capital is levelled around the player. Beating him
   here does NOT kill him: this is Washington, not Mexico, so he withdraws
   and the real reckoning waits on the war map.
   ===================================================================== */
let romanInvasion = null;
const RI_DUR = { hold:1.15, arrive:2.8, line:15.2, draw:1.25, shot:1.05, flash:1.3, reveal:1.7 };
/* the twelve who land with him, by rank */
const RI_SQUAD = ['spqmcenturion','spqmsoldier','spqmsoldier','merc','mercx',
                  'spqmsoldier','merc','spqmcenturion','mercx','spqmsoldier',
                  'merc','mercx'];

function startRomanDCInvasionCutscene(){
  // Toast is defeated by the player, but he does NOT disappear or die here.
  // Keep a cinematic actor copy and shove him safely to the far-left side so
  // Roman's entrance from the right can never overlap him.
  const toastActor = {
    x: boss && boss.def && boss.def.key === 'toast' ? boss.x : PLAY.x + 90,
    y: boss && boss.def && boss.def.key === 'toast' ? boss.y : PLAY.y + PLAY.h*0.62,
    tx: PLAY.x + 76, ty: PLAY.y + PLAY.h*0.63,
    walk:0, hit:false, down:0
  };
  const troops = RI_SQUAD.map((kind, i) => ({
    kind,
    skin:'spqmtrooper',
    x: W + 60 + (i%4)*46 + Math.floor(i/4)*130,
    y: PLAY.y + PLAY.h*(0.42 + (i%4)*0.13),
    ph: i*1.31,
    scale: (kind === 'spqmcenturion') ? 2.0 : 1.75
  }));
  romanInvasion = {
    phase:'hold', phaseT:0,
    romX: W + 150, romY: PLAY.y + PLAY.h*0.62,
    romTX: W*0.69,
    troops, toast:toastActor, spoke:false, blew:false, shotHit:false
  };
  state = 'romanarrival';
  paused = false;
  Dialogue.clear(); Voice.cancel();
  enemies.length = 0; shots.length = 0; hazards.length = 0; carts.length = 0;
  boss = null; sidekick = null;
  Music.stop();
}

function riNextPhase(p){
  romanInvasion.phase = p; romanInvasion.phaseT = 0;
  if (p === 'arrive'){
    // his theme rides in with the legion
    Music.play('romandicario_tower');
    Music.sfx('spawn');
  }
  if (p === 'draw'){
    // Roman takes his time drawing the bow. The pause makes the shot personal.
    Music.trumpetStab();
  }
  if (p === 'shot'){
    Music.sfx('bow');
    romanInvasion.shotHit = false;
  }
  if (p === 'flash'){
    // the capital is levelled in one blinding stroke
    Music.stop();
    Music.sfx('boom'); Music.sfx('banhammer');
    shake = 34; flashFx = 1.0;
    timeScale = 0.3;
    setTimeout(() => { timeScale = 1; }, 700);
    const r = romanInvasion;
    for (let i=0;i<26;i++){
      puff(PLAY.x + Math.random()*PLAY.w, PLAY.y + Math.random()*PLAY.h*0.7,
           pick(['#ffb347','#ff6a2a','#c8382a','#3a2a22']), 6, 260, 0.9, 5);
    }
    r.blew = true;
  }
}

function updateRomanInvasion(dt){
  const r = romanInvasion;
  if (!r) return;
  r.phaseT += dt;
  updateMisc(dt);
  const D = RI_DUR;

  // No matter where Toast ended the fight, force the defeated general toward
  // the left cinematic mark before Roman enters from the opposite side.
  if (r.toast && !r.toast.hit){
    const k = Math.min(1, dt*7.5);
    r.toast.x = lerp(r.toast.x, r.toast.tx, k);
    r.toast.y = lerp(r.toast.y, r.toast.ty, k);
    r.toast.walk += dt*8;
  }

  if (r.phase === 'hold'){
    if (r.phaseT >= D.hold) riNextPhase('arrive');
  } else if (r.phase === 'arrive'){
    const k = Math.min(1, r.phaseT / D.arrive);
    const ease = 1 - Math.pow(1-k, 3);
    r.romX = lerp(W+150, r.romTX, ease);
    for (const tr of r.troops){
      tr.x = lerp(tr.x, r.romTX + 60 + (tr.ph*13) % 240, dt*1.7);
    }
    if (k >= 1) riNextPhase('line');
  } else if (r.phase === 'line'){
    if (!r.spoke){
      r.spoke = true;
      Dialogue.push('romandicario_entrance', 'RomanDiCario',
        ROMAN_TOAST_DC_LINE,
        '#c9a227', 'romandicario');
    }
    if (r.phaseT >= D.line) riNextPhase('draw');
  } else if (r.phase === 'draw'){
    if (r.phaseT >= D.draw) riNextPhase('shot');
  } else if (r.phase === 'shot'){
    const k = Math.min(1, r.phaseT / D.shot);
    if (k >= 0.74 && !r.shotHit){
      r.shotHit = true;
      r.toast.hit = true; r.toast.down = 0.01;
      shake = Math.max(shake, 16); flashFx = Math.max(flashFx, 0.35);
      timeScale = 0.45; setTimeout(() => { timeScale = 1; }, 260);
      Music.sfx('hit');
      puff(r.toast.x, r.toast.y-42, '#ffe7a8', 18, 190, 0.55, 3);
      puff(r.toast.x, r.toast.y-42, '#3c5a9a', 12, 130, 0.5, 3);
    }
    if (r.toast && r.toast.hit) r.toast.down = Math.min(1, r.toast.down + dt*3.2);
    if (r.phaseT >= D.shot) riNextPhase('flash');
  } else if (r.phase === 'flash'){
    if (r.phaseT >= D.flash) riNextPhase('reveal');
  } else if (r.phase === 'reveal'){
    if (r.phaseT >= D.reveal) startRomanDCFight();
  }
}

function drawRomanInvasion(){
  const r = romanInvasion;
  if (!r) return;
  const D = RI_DUR;
  const ruined = (r.phase === 'reveal') || (r.phase === 'flash' && r.phaseT > D.flash*0.45);

  let camX = 0;
  if (r.phase === 'arrive' || r.phase === 'line' || r.phase === 'draw' || r.phase === 'shot')
    camX = Math.max(-8,Math.min(8,(W*0.55-r.romX)*0.04));

  ctx.fillStyle = '#04060a';
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  const invasionZoom=1+Math.abs(camX)/(W*.5)+.015;
  ctx.translate(W/2+camX,H/2);ctx.scale(invasionZoom,invasionZoom);ctx.translate(-W/2,-H/2);
  drawScene();

  if (!ruined){
    // Toast remains in the scene as the exhausted defeated general. He only
    // goes down when Roman's arrow reaches him.
    if (r.toast){
      if (!r.toast.hit){
        drawSkin('toast', r.toast.x, r.toast.y, 2.3, { facing:1, walk:r.toast.walk, tilt:-0.05, breath:0.15 });
      } else {
        ctx.save();
        ctx.translate(r.toast.x, r.toast.y);
        ctx.rotate(1.18 * Math.min(1, r.toast.down));
        ctx.translate(-r.toast.x, -r.toast.y);
        drawSkin('toast', r.toast.x, r.toast.y, 2.3, { facing:1, walk:0, tilt:0, breath:0 });
        ctx.restore();
      }
      nameplate(r.toast.x, r.toast.y - 124, 'Toast_Quite', '#c9a24f');
    }

    for (const tr of r.troops){
      drawSkin(tr.skin, tr.x, tr.y, tr.scale,
               { weapon:tr.kind==='mercx'?'crossbow':tr.kind==='merc'?'bow':'sword', facing:-1, armAngle:0, walk: (r.phase==='arrive') ? bgT*6 + tr.ph : 0 });
    }

    const aiming = r.phase === 'draw' || r.phase === 'shot';
    const drawK = r.phase === 'draw' ? Math.min(1,r.phaseT/D.draw) : (r.phase === 'shot' ? 1 : 0);
    drawSkin('romandicario', r.romX, r.romY, 2.35,
             { weapon:aiming?'bow':'dagger', bowCharge:aiming?drawK:-1, facing:-1, armAngle: aiming ? (-0.55 - drawK*0.42) : 0,
               walk: (r.phase==='arrive') ? bgT*5 : 0, tilt:aiming?-0.035:0 });
    if (aiming) drawWeapon({x:r.romX,y:r.romY,facing:-1,walk:0,atk:0}, 'bow', 2.35);
    else drawWeapon({x:r.romX,y:r.romY,facing:-1,walk:0,atk:0}, 'dagger', 2.35);
    nameplate(r.romX, r.romY - 128, 'RomanDiCario', '#f6e6b8');

    // Arrow flight is drawn explicitly so the execution is impossible to miss.
    if (r.phase === 'shot' && r.toast){
      const k = Math.min(1, r.phaseT / D.shot);
      const travel = Math.min(1, k/0.74);
      const sx = r.romX - 25, sy = r.romY - 53;
      const tx = r.toast.x + 6, ty = r.toast.y - 43;
      const ax = lerp(sx,tx,travel), ay = lerp(sy,ty,travel);
      const ang = Math.atan2(ty-sy,tx-sx);
      ctx.save();
      ctx.translate(ax,ay); ctx.rotate(ang);
      ctx.strokeStyle='#f4e8c8'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-13,0); ctx.lineTo(8,0); ctx.stroke();
      ctx.fillStyle='#c9a227'; ctx.beginPath(); ctx.moveTo(10,0); ctx.lineTo(4,-3); ctx.lineTo(4,3); ctx.closePath(); ctx.fill();
      ctx.globalAlpha=0.35; ctx.strokeStyle='#ffe7a8'; ctx.lineWidth=4; ctx.beginPath(); ctx.moveTo(-30,0); ctx.lineTo(-7,0); ctx.stroke();
      ctx.restore();
    }
  }
  ctx.restore();

  ctx.fillStyle = '#04060a';
  ctx.fillRect(0, 0, W, 40);
  ctx.fillRect(0, H-40, W, 40);

  if (r.phase === 'flash'){
    const k = Math.min(1, r.phaseT / D.flash);
    ctx.fillStyle = 'rgba(255,248,225,' + Math.max(0, 1 - k*1.35) + ')';
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = 'rgba(255,140,40,' + Math.max(0, 0.5 - k*0.5) + ')';
    ctx.fillRect(0, 0, W, H);
  }

  if (r.phase === 'reveal'){
    ctx.save();
    ctx.globalAlpha = Math.min(1, r.phaseT*1.6);
    ctx.textAlign = 'center';
    ctx.font = '900 24px "Pixelify Sans", Inter, Segoe UI, Arial';
    ctx.shadowColor='rgba(0,0,0,.9)'; ctx.shadowBlur=6; ctx.shadowOffsetY=2;
    ctx.fillStyle = '#c9a227';
    ctx.fillText('WASHINGTON HAS FALLEN', W/2, H*0.40);
    ctx.font = '700 12px "Pixelify Sans", Inter, Segoe UI, Arial';
    ctx.fillStyle = '#e8d0a0';
    ctx.fillText('SPQM · SENATVS POPVLVSQVE MARINVM', W/2, H*0.40 + 22);
    ctx.restore();
    ctx.textAlign = 'left';
  }

  drawDialogue();
}

function drawOxbitFinale(){
  const f = oxbitFinale;
  if (!f) return;
  const D = OXBIT_FINALE_DUR;

  // Oxbit's failed power-up attempt plays out on the normal stage, in full
  // light — this is his moment, not RomanDiCario's, so no camera pan and no
  // black vignette yet. Just Oxbit, straining, flashing green and white.
  if (f.phase === 'oxbitPower'){
    drawScene();
    const p = Math.min(1, f.phaseT / D.oxbitPower);
    const pulse = 0.5 + 0.5*Math.sin(bgT*15);
    const slowPulse = 0.5 + 0.5*Math.sin(bgT*3.2);

    // his existing SSJ-style aura as the base layer, so this reads as an
    // escalation of his real power, not an unrelated effect on top of him
    if (boss) drawOxbitAura(boss);

    // a second, much bigger corona around him, growing with the attempt —
    // this is the "trying to force his way into phase 3" layer
    const r = 60 + p*70;
    ctx.save();
    ctx.globalAlpha = 0.5 + 0.35*pulse;
    const rg = ctx.createRadialGradient(f.oxX, f.oxY, 4, f.oxX, f.oxY, r);
    rg.addColorStop(0, 'rgba(255,255,255,0.95)');
    rg.addColorStop(0.35, 'rgba(200,255,215,0.8)');
    rg.addColorStop(0.7, 'rgba(157,255,176,0.5)');
    rg.addColorStop(1, 'rgba(157,255,176,0)');
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(f.oxX, f.oxY, r, 0, 7); ctx.fill();
    ctx.restore();

    // a slower-breathing outer ring, distinct from the fast inner flicker,
    // so the aura reads as layered and deliberate rather than one blob
    ctx.save();
    ctx.globalAlpha = 0.25 + 0.2*slowPulse;
    ctx.strokeStyle = '#dfffe8'; ctx.lineWidth = 3;
    ctx.beginPath(); ctx.arc(f.oxX, f.oxY, r + 18 + slowPulse*10, 0, 7); ctx.stroke();
    ctx.restore();

    // dense white/green god-rays kicking off him as the "power" builds —
    // more of them, at varied lengths, so it reads as radiating energy
    // rather than a handful of static spokes
    ctx.save();
    ctx.globalAlpha = 0.4 + 0.35*pulse;
    for (let i = 0; i < 14; i++){
      const a = (i/14)*Math.PI*2 + bgT*1.6*(i%2===0?1:-1);
      const len = r + 26 + Math.sin(bgT*9 + i*1.7)*16 + p*20;
      ctx.strokeStyle = i%3===0 ? '#ffffff' : '#9dffb0';
      ctx.lineWidth = i%3===0 ? 2.5 : 1.5;
      ctx.beginPath();
      ctx.moveTo(f.oxX + Math.cos(a)*22, f.oxY + Math.sin(a)*22);
      ctx.lineTo(f.oxX + Math.cos(a)*len, f.oxY + Math.sin(a)*len);
      ctx.stroke();
    }
    ctx.restore();

    // small sparks orbiting him, tightening as the attempt escalates
    ctx.save();
    ctx.globalAlpha = 0.85;
    for (let i = 0; i < 10; i++){
      const a = (i/10)*Math.PI*2 - bgT*3.2;
      const rr = 34 + (i%3)*9 - p*10;
      const sx = f.oxX + Math.cos(a)*rr, sy = f.oxY + Math.sin(a)*rr*1.15;
      ctx.fillStyle = i%2===0 ? '#eafff0' : '#9dffb0';
      ctx.beginPath(); ctx.arc(sx, sy, 2.2, 0, 7); ctx.fill();
    }
    ctx.restore();

    // occasional full-screen white strobe as the buildup intensifies
    if (p > 0.35 && Math.random() < 0.06 + p*0.07){
      ctx.fillStyle = 'rgba(255,255,255,0.32)';
      ctx.fillRect(0, 0, W, H);
    }
    // fake root console is physically anchored above Oxbit during the attempted Phase III.
    ctx.save();
    const rcw=300,rch=42,rcx=Math.max(10,Math.min(W-rcw-10,f.oxX-rcw/2)),rcy=Math.max(70,f.oxY-r-92);
    ctx.fillStyle='rgba(0,10,5,.90)';ctx.fillRect(rcx,rcy,rcw,rch);ctx.strokeStyle='#73ff92';ctx.lineWidth=1.5;ctx.strokeRect(rcx+.5,rcy+.5,rcw-1,rch-1);
    ctx.font='700 9px Consolas, monospace';ctx.fillStyle='#73ff92';ctx.fillText('[ROOT CONSOLE // OXBIT]',rcx+10,rcy+14);ctx.fillStyle='#dfffe8';
    const fc=f.phaseT<1.8?'> /op Oxbit':f.phaseT<3?'> /gamemode creative Oxbit':f.phaseT<4.2?'> PERMISSION LEVEL: ROOT':'> PHASE_III OVERRIDE...';ctx.fillText(fc,rcx+10,rcy+31);
    ctx.fillStyle='#73ff92';ctx.beginPath();ctx.moveTo(f.oxX-6,rcy+rch);ctx.lineTo(f.oxX+6,rcy+rch);ctx.lineTo(f.oxX,rcy+rch+8);ctx.closePath();ctx.fill();ctx.restore();
    // thin bars just to read as "cutscene, not gameplay"
    ctx.fillStyle = '#04060a';
    ctx.fillRect(0, 0, W, 38);
    ctx.fillRect(0, H-38, W, 38);
    drawDialogue();
    return;
  }

  let camX = 0, zoom = 1;
  if (f.phase === 'entrance'){
    camX = (W/2 - f.romX) * 0.22;
