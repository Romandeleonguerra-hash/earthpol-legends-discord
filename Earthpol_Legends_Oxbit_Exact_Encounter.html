  ctx.save();
  ctx.translate(W/2, H/2);
  ctx.scale(zoom, zoom);
  ctx.translate(-W/2 + camX, -H/2);

  drawScene();

  if (f.phase !== 'blackout'){
    const s = 2.3;
    // Roman and Oxbit square up for a hand-to-hand energy clash instead of a bow execution.
    const facing = (f.phase === 'entrance') ? -1 : (f.oxX >= f.romX ? 1 : -1);
    const romanHandX = f.romX + facing * 28;
    const romanHandY = f.romY - 24*s;
    const oxFacing = f.romX < f.oxX ? -1 : 1;
    const oxHandX = f.oxX + oxFacing * 25;
    const oxHandY = f.oxY - 48;
    let armMag = -0.15;
    if (f.phase === 'aim') armMag = -0.52 - Math.min(1, f.phaseT/D.aim)*0.28;
    if (f.phase === 'shoot' || f.phase === 'explode') armMag = -0.80;
    const armAngle = facing < 0 ? armMag : -armMag;

    drawSkin('romandicario', f.romX, f.romY, s, { facing, armAngle, walk:0 });

    if (f.phase === 'aim' || f.phase === 'shoot'){
      const charge = f.phase === 'shoot' ? 1 : Math.min(1, f.phaseT / D.aim);
      // Roman's red energy gathers in his forward hand.
      ctx.save();
      const rr=7+charge*15;
      let rg=ctx.createRadialGradient(romanHandX,romanHandY,0,romanHandX,romanHandY,rr*2.2);
      rg.addColorStop(0,'rgba(255,255,255,.98)');rg.addColorStop(.28,'rgba(255,96,96,.95)');rg.addColorStop(.66,'rgba(215,28,42,.62)');rg.addColorStop(1,'rgba(215,28,42,0)');
      ctx.fillStyle=rg;ctx.beginPath();ctx.arc(romanHandX,romanHandY,rr*2.2,0,7);ctx.fill();
      // Oxbit's green energy charges from his hand at the same time.
      const or=7+charge*15;
      let og=ctx.createRadialGradient(oxHandX,oxHandY,0,oxHandX,oxHandY,or*2.2);
      og.addColorStop(0,'rgba(255,255,255,.98)');og.addColorStop(.28,'rgba(120,255,150,.95)');og.addColorStop(.66,'rgba(47,191,63,.62)');og.addColorStop(1,'rgba(47,191,63,0)');
      ctx.fillStyle=og;ctx.beginPath();ctx.arc(oxHandX,oxHandY,or*2.2,0,7);ctx.fill();ctx.restore();
    }

    if (f.phase === 'shoot'){
      const k=Math.min(1,f.phaseT/D.shoot);
      const midX=lerp((romanHandX+oxHandX)/2, W/2, .08*Math.sin(bgT*5));
      const midY=(romanHandY+oxHandY)/2 + Math.sin(bgT*9)*2;
      f.clashMidX=midX;f.clashMidY=midY;
      const beamW=10 + k*20 + Math.sin(bgT*22)*2;
      const coreR=18 + k*38 + Math.sin(bgT*17)*4;
      ctx.save();ctx.lineCap='round';
      // Roman red beam
      ctx.shadowColor='#ff263b';ctx.shadowBlur=22+k*22;ctx.strokeStyle='rgba(215,28,42,.92)';ctx.lineWidth=beamW;
      ctx.beginPath();ctx.moveTo(romanHandX,romanHandY);ctx.lineTo(midX,midY);ctx.stroke();
      ctx.shadowBlur=8;ctx.strokeStyle='rgba(255,220,220,.98)';ctx.lineWidth=Math.max(3,beamW*.28);ctx.beginPath();ctx.moveTo(romanHandX,romanHandY);ctx.lineTo(midX,midY);ctx.stroke();
      // Oxbit green beam
      ctx.shadowColor='#55ff79';ctx.shadowBlur=22+k*22;ctx.strokeStyle='rgba(47,191,63,.94)';ctx.lineWidth=beamW;
      ctx.beginPath();ctx.moveTo(oxHandX,oxHandY);ctx.lineTo(midX,midY);ctx.stroke();
      ctx.shadowBlur=8;ctx.strokeStyle='rgba(220,255,228,.98)';ctx.lineWidth=Math.max(3,beamW*.28);ctx.beginPath();ctx.moveTo(oxHandX,oxHandY);ctx.lineTo(midX,midY);ctx.stroke();
      // Growing collision core where the beams meet.
      ctx.shadowColor='#ffffff';ctx.shadowBlur=30+k*35;
      const cg=ctx.createRadialGradient(midX,midY,0,midX,midY,coreR*1.8);
      cg.addColorStop(0,'rgba(255,255,255,1)');cg.addColorStop(.22,'rgba(255,245,210,.98)');cg.addColorStop(.46,'rgba(255,80,90,.78)');cg.addColorStop(.68,'rgba(80,255,120,.72)');cg.addColorStop(1,'rgba(255,255,255,0)');
      ctx.fillStyle=cg;ctx.beginPath();ctx.arc(midX,midY,coreR*1.8,0,7);ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,.85)';ctx.lineWidth=2+k*3;ctx.beginPath();ctx.arc(midX,midY,coreR+Math.sin(bgT*18)*5,0,7);ctx.stroke();
      // Energy splinters blast away from the clash point.
      for(let i=0;i<12;i++){const a=i/12*Math.PI*2+bgT*(i%2?2.4:-2.0);const len=coreR+20+k*30;ctx.strokeStyle=i%2?'rgba(255,70,80,.7)':'rgba(80,255,120,.7)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(midX+Math.cos(a)*coreR*.55,midY+Math.sin(a)*coreR*.55);ctx.lineTo(midX+Math.cos(a)*len,midY+Math.sin(a)*len);ctx.stroke();}
      ctx.restore();
    }

    if (f.phaseT > 0.35 || f.phase !== 'entrance'){
      nameplate(f.romX, f.romY - 128, 'RomanDiCario', '#f6e6b8');
    }

    if (!f.exploded){
      ctx.save();
      ctx.globalAlpha = 0.45 + 0.3*Math.sin(bgT*8);
      ctx.fillStyle = '#9dffb0';
      ctx.beginPath(); ctx.arc(f.oxX, f.oxY, 28, 0, 7); ctx.fill();
      ctx.restore();
    }
  }

  ctx.restore();   // camera

  // a real black vignette — fades in from full black, then stays as heavy
  // letterbox bars plus a dark radial edge for the rest of the scene
  const barK = f.phase === 'blackout' ? 1 - Math.min(1, f.phaseT/D.blackout) : 0;
  ctx.fillStyle = '#000';
  ctx.globalAlpha = barK;
  ctx.fillRect(0,0,W,H);
  ctx.globalAlpha = 1;
  const barH = 74 * (1 - barK);
  ctx.fillRect(0, 0, W, barH);
  ctx.fillRect(0, H-barH, W, barH);
  const vg = ctx.createRadialGradient(W/2, H/2, H*0.25, W/2, H/2, H*0.75);
  vg.addColorStop(0, 'rgba(0,0,0,0)');
  vg.addColorStop(1, 'rgba(0,0,0,0.6)');
  ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);

  // During the beam struggle the server itself starts failing under the load.
  if (f.phase === 'shoot'){
    const pct = Math.min(99, Math.floor((f.phaseT/D.shoot)*99));
    ctx.save();
    if (Math.random() < 0.35 + pct/220){
      ctx.globalAlpha = 0.08 + Math.random()*0.16;
      ctx.fillStyle = Math.random() < 0.5 ? '#ff2838' : '#55ff79';
      ctx.fillRect(0, Math.random()*H, W, 2 + Math.random()*7);
    }
    ctx.textAlign='center';ctx.font='900 13px Consolas, monospace';ctx.fillStyle='#f4fff6';ctx.globalAlpha=.82+.18*Math.sin(bgT*18);
    ctx.fillText('SERVER INTEGRITY '+(100-pct)+'%',W/2,H*.73);
    ctx.textAlign='left';ctx.restore();
  }

  drawDialogue();

  if (f.phase === 'explode'){
    const ek=Math.min(1,f.phaseT/.65);
    shake=Math.max(shake,38*(1-Math.min(1,f.phaseT/D.explode)));
    ctx.save();
    // white detonation flash that gives way to corrupted television/server static
    if(f.phaseT<.55){ctx.globalAlpha=1-f.phaseT/.55;ctx.fillStyle='#ffffff';ctx.fillRect(0,0,W,H);}
    const staticAmt=Math.min(1,f.phaseT/.35)*(1-Math.max(0,(f.phaseT-2.4)/.7));
    ctx.globalAlpha=.36*staticAmt;
    for(let i=0;i<150;i++){
      const yy=Math.random()*H, hh=1+Math.random()*5;
      ctx.fillStyle=Math.random()<.33?'#ffffff':(Math.random()<.5?'#ff3048':'#55ff79');
      ctx.fillRect(Math.random()*W,yy,20+Math.random()*220,hh);
    }
    ctx.globalAlpha=.18*staticAmt;
    for(let y=0;y<H;y+=4){ctx.fillStyle=(y%8===0?'#fff':'#000');ctx.fillRect(0,y,W,1);}
    ctx.globalAlpha=Math.min(1,f.phaseT*1.4);
    ctx.textAlign='center';
    ctx.font='900 36px "Pixelify Sans", Inter, Segoe UI, Arial';
    ctx.shadowColor='#000';ctx.shadowBlur=10;ctx.shadowOffsetY=3;
    ctx.fillStyle='#ffffff';ctx.fillText('SERVER DELETED',W/2+rnd(-2,2),H*.42+rnd(-1,1));
    ctx.font='900 12px Consolas, monospace';ctx.fillStyle='#ff5968';ctx.fillText('CONNECTION TERMINATED · WORLD DATA UNAVAILABLE',W/2,H*.42+32);
    ctx.restore();ctx.textAlign='left';
  }
}


/* Oxbit phase 2 — a Super-Saiyan-style green power aura around his whole
   body while airborne, flaring brighter with his pulse */
function drawOxbitAura(b){
  const y = b.y - (b.flyH||0);
  const pulse = 0.5 + 0.5*Math.sin(bgT*10);
  // three-tone aura, parametrized so Dandire's Architect phase can burn
  // white/gold instead of Oxbit's Super-Saiyan green
  const c1 = b.auraCol  || '#9dffb0';
  const c2 = b.auraCol2 || '#dfffe8';
  const c3 = b.auraCol3 || '#c9ffd6';
  ctx.save();
  ctx.globalAlpha = 0.22 + 0.14*pulse;
  ctx.fillStyle = c1;
  ctx.beginPath(); ctx.ellipse(b.x, y-38, 52 + pulse*8, 70 + pulse*10, 0, 0, 7); ctx.fill();
  ctx.globalAlpha = 0.30 + 0.18*pulse;
  ctx.fillStyle = c2;
  ctx.beginPath(); ctx.ellipse(b.x, y-38, 30 + pulse*5, 44 + pulse*6, 0, 0, 7); ctx.fill();
  // little jagged energy flickers, like SSJ hair spikes
  ctx.globalAlpha = 0.5;
  ctx.fillStyle = c3;
  for (let i=0;i<6;i++){
    const ang = (i/6)*Math.PI*2 + bgT*1.5;
    const rr = 46 + Math.sin(bgT*8+i)*10;
    const px = b.x + Math.cos(ang)*rr, py = y-38 + Math.sin(ang)*rr*1.3;
    ctx.beginPath(); ctx.moveTo(px,py); ctx.lineTo(px+4,py-10); ctx.lineTo(px-4,py-4); ctx.closePath(); ctx.fill();
  }
  ctx.restore();
}

/* Oxbit's ultimate in phase 2 — a slow, telegraphed, instant-kill strike.
   The ring on the ground is the entire warning: get out of it. */
function drawDoxxingHammer(hm){
  const k = hm.t / hm.max;
  ctx.save();
  ctx.strokeStyle = 'rgba(157,255,176,' + (0.5 + 0.4*Math.sin(hm.t*16)) + ')';
  ctx.lineWidth = 4;
  ctx.beginPath(); ctx.ellipse(hm.x, hm.y, hm.r, hm.r*0.42, 0, 0, 7); ctx.stroke();
  ctx.fillStyle = 'rgba(157,255,176,' + (0.06 + k*0.22) + ')';
  ctx.beginPath(); ctx.ellipse(hm.x, hm.y, hm.r*k, hm.r*k*0.42, 0, 0, 7); ctx.fill();
  // the hammer itself, dropping from above, wrapped in a leaking-document motif
  const drop = Math.pow(k, 2.2);
  const hy = hm.y - 260 + drop*220;
  ctx.save();
  ctx.globalAlpha = Math.min(1, 0.3 + k);
  ctx.translate(hm.x, hy);
  ctx.rotate(-0.2 + Math.sin(hm.t*7)*0.04*k);
  ctx.fillStyle = '#12140f'; ctx.fillRect(-5, 0, 10, 70);
  ctx.fillStyle = '#1e2018'; ctx.fillRect(-36, -28, 72, 34);
  ctx.fillStyle = '#9dffb0'; ctx.fillRect(-32, -24, 64, 26);
  ctx.fillStyle = '#dfffe8'; ctx.fillRect(-32, -24, 64, 6);
  ctx.fillStyle = '#0d2a14'; ctx.font = 'bold 11px "Pixelify Sans", Inter, Segoe UI, Arial'; ctx.textAlign='center';
  ctx.fillText('DOXX', 0, -6);
  ctx.textAlign = 'left';
  ctx.restore();
  const bw = 170;
  ctx.fillStyle = 'rgba(4,8,6,0.85)'; ctx.fillRect(hm.x-bw/2, hm.y-140, bw, 12);
  ctx.fillStyle = '#9dffb0'; ctx.fillRect(hm.x-bw/2+2, hm.y-138, (bw-4)*k, 8);
  ctx.strokeStyle = '#dfffe8'; ctx.lineWidth = 1.5; ctx.strokeRect(hm.x-bw/2, hm.y-140, bw, 12);
  ctx.textAlign = 'center';
  ctx.fillStyle = '#dfffe8'; ctx.font = '11px "Pixelify Sans", Inter, Segoe UI, Arial';
  ctx.fillText('THE ADMIN TRACE HAMMER — MOVE', hm.x, hm.y-146);
  ctx.textAlign = 'left';
  ctx.restore();
}

function drawBanHammer(b){

  // charge bar over his head
  const bw = 170;

  ctx.fillStyle = '#2fbf3f'; ctx.fillRect(b.x-bw/2+2, b.y-116, (bw-4)*k, 8);
  ctx.strokeStyle = '#9dffb0'; ctx.lineWidth = 1.5; ctx.strokeRect(b.x-bw/2, b.y-118, bw, 12);

  ctx.fillText('THE BAN HAMMER', b.x, b.y-124);

}

  ctx.lineTo(75, -8); ctx.lineTo(-75, -8); ctx.closePath(); ctx.fill();
  ctx.fillStyle = blackPearl ? '#2a1c18' : '#5a4434';

  // deck rail
  ctx.fillStyle = blackPearl ? '#0d0a08' : '#3a2a1c';
  ctx.fillRect(-80, -22, 160, 5);
  // masts

  ctx.fillRect(-8, -110, 6, 95);
  ctx.fillRect(40, -85, 5, 70);

  ctx.beginPath(); ctx.moveTo(42, -80); ctx.lineTo(68, -72); ctx.lineTo(68, -35); ctx.lineTo(42, -30); ctx.fill();
  if (blackPearl){
    ctx.fillStyle = '#1a1614';

  ctx.fillStyle = '#7ec8e8';

function drawOrthancTower(cx, baseY){
  // Saruman-style black tower — tall, sharp, multi-tiered, glowing windows
  const h = baseY - STAGE.y - 8;
  ctx.save();
  // main shaft
  const shaftW = 36;
  ctx.fillStyle = '#1a1c22';
  ctx.beginPath();
  ctx.moveTo(cx - shaftW*0.55, baseY);
  ctx.lineTo(cx - shaftW*0.35, STAGE.y + 20);
  ctx.lineTo(cx + shaftW*0.35, STAGE.y + 20);
  ctx.lineTo(cx + shaftW*0.55, baseY);
  ctx.closePath(); ctx.fill();
  // mid ridges
  ctx.fillStyle = '#0e1014';
  for (let i = 0; i < 5; i++){
    const ty = baseY - h * (0.2 + i * 0.15);
    const tw = shaftW * (0.7 - i * 0.06);
    ctx.fillRect(cx - tw, ty, tw * 2, 6);
  }
  // upper spire
  ctx.fillStyle = '#12141a';
  ctx.beginPath();
  ctx.moveTo(cx - 10, STAGE.y + 55);
  ctx.lineTo(cx - 4, STAGE.y + 8);
  ctx.lineTo(cx + 4, STAGE.y + 8);
  ctx.lineTo(cx + 10, STAGE.y + 55);
  ctx.closePath(); ctx.fill();
  // pinnacle
  ctx.fillStyle = '#0a0c10';
  ctx.beginPath();
  ctx.moveTo(cx - 3, STAGE.y + 12);
  ctx.lineTo(cx, STAGE.y - 6);
  ctx.lineTo(cx + 3, STAGE.y + 12);
  ctx.closePath(); ctx.fill();
  // glowing orange windows (palantir light)
  const glow = 0.45 + 0.25 * Math.sin(bgT * 2.2);
  ctx.fillStyle = 'rgba(255,140,40,' + glow + ')';
  for (const [oy, ow] of [[0.35, 5], [0.48, 4], [0.62, 5], [0.75, 3]]){
    ctx.fillRect(cx - ow/2, baseY - h * oy, ow, 5);
  }
  // faint aura
  ctx.globalAlpha = 0.12 + 0.06 * Math.sin(bgT * 1.5);
  ctx.fillStyle = '#ff6a20';
  ctx.beginPath(); ctx.ellipse(cx, STAGE.y + h * 0.35, 50, h * 0.4, 0, 0, 7); ctx.fill();
  ctx.restore();
}

function drawShipBattleOverlay(){
  if (!shipBattle) return;
  const y0 = HORIZON;
  const hgt = STAGE.y + STAGE.h - HORIZON;
  // raging storm ocean
  const wg = ctx.createLinearGradient(0, y0, 0, y0 + hgt);
  wg.addColorStop(0, '#0c2438');
  wg.addColorStop(0.35, '#081828');
  wg.addColorStop(1, '#030a10');
  ctx.fillStyle = wg; ctx.fillRect(0, y0, W, hgt);
  // animated waves
  for (let i = 0; i < 16; i++){
    const wx = (i * 70 + bgT * 35) % (W + 50) - 25;
    const wy = y0 + 16 + Math.sin(bgT * 2.2 + i) * 5 + (i % 4) * 14;
    ctx.strokeStyle = 'rgba(150,220,245,' + (0.18 + 0.14 * Math.sin(bgT + i)) + ')';
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.moveTo(wx, wy);
    ctx.quadraticCurveTo(wx + 18, wy - 6, wx + 36, wy);
    ctx.stroke();
  }
  if (bossShip) drawPirateShip(bossShip.x, bossShip.y + Math.sin(bossShip.bob) * 3, 1.05, true);
  if (playerShip) drawPirateShip(playerShip.x, playerShip.y, 0.9, false);
  // control hint
  ctx.fillStyle = 'rgba(5,7,13,0.75)';
  ctx.fillRect(W / 2 - 200, H - 54, 400, 24);
  ctx.fillStyle = '#c9d4e8';
  ctx.font = '11px "Pixelify Sans", Inter, Arial';
  ctx.textAlign = 'center';
  ctx.fillText('WASD / ARROWS move ship ·  AIM with mouse ·  CLICK or SPACE fire cannons', W / 2, H - 38);
  ctx.textAlign = 'left';

  // raging storm: rain + lightning
  ctx.fillStyle = 'rgba(4,8,16,0.28)';
  ctx.fillRect(0, STAGE.y, W, HORIZON - STAGE.y);
  ctx.strokeStyle = 'rgba(180,200,220,0.22)';
  ctx.lineWidth = 1;
  for (let i = 0; i < 70; i++){
    const rx = (i * 47 + bgT * 380) % (W + 40) - 20;
    const ry = STAGE.y + ((i * 73 + bgT * 520) % (HORIZON - STAGE.y + 40));
    ctx.beginPath();
    ctx.moveTo(rx, ry);
    ctx.lineTo(rx - 6, ry + 14);
    ctx.stroke();
  }
  if (shipStorm && shipStorm.boltT > 0){
    const bx = shipStorm.boltX;
    ctx.save();
    ctx.globalAlpha = Math.min(1, shipStorm.boltT * 4);
    ctx.strokeStyle = '#e8f6ff';
    ctx.lineWidth = 3;
    ctx.shadowColor = '#a0d8ff';
    ctx.shadowBlur = 18;
    ctx.beginPath();
    let lx = bx, ly = STAGE.y;
    ctx.moveTo(lx, ly);
    for (let s = 0; s < 6; s++){
      lx += (Math.random()*36-18);
      ly += (HORIZON - STAGE.y) / 6;
      ctx.lineTo(lx, ly);
    }
    ctx.stroke();
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.moveTo(bx + 10, STAGE.y + 40);
    ctx.lineTo(bx + 20 + Math.random()*30, STAGE.y + 80 + Math.random()*40);
    ctx.stroke();
    ctx.globalAlpha = Math.min(0.35, shipStorm.boltT * 1.2);
    ctx.fillStyle = '#cfe8ff';
    ctx.fillRect(0, STAGE.y, W, STAGE.h);
    ctx.restore();
  }
}


function drawDeathStar(ds){
  if (!ds) return;
  const x = ds.x, y = ds.y;
  const R = DEATHSTAR_R;
  const pulse = ds.phase === 'charge' ? (0.5 + 0.5 * (ds.t / ds.chargeMax)) : 1;
  ctx.save();
  // outer glow
  ctx.globalAlpha = 0.22 + 0.18 * pulse;
  ctx.fillStyle = '#f0a423';
  ctx.beginPath(); ctx.arc(x, y, R + 14 + pulse * 8, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
  // main spherical hull, dark battle-station grey with a lit hemisphere
  const shellGrad = ctx.createRadialGradient(x-R*0.35, y-R*0.4, R*0.15, x, y, R);
  shellGrad.addColorStop(0, '#7a828f');
  shellGrad.addColorStop(0.55, '#4b515c');
  shellGrad.addColorStop(1, '#23262c');
  ctx.fillStyle = shellGrad;
  ctx.beginPath(); ctx.arc(x, y, R, 0, 7); ctx.fill();
  // panel-line texture across the hull
  ctx.strokeStyle = 'rgba(10,12,16,0.35)'; ctx.lineWidth = 1;
  for (let i=-3;i<=3;i++){
    ctx.beginPath(); ctx.arc(x, y, R, 0, 7);
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, R-0.5, 0, 7); ctx.clip();
    ctx.beginPath(); ctx.moveTo(x-R, y+i*R/4); ctx.lineTo(x+R, y+i*R/4); ctx.stroke();
    ctx.restore();
  }
  for (let i=1;i<5;i++){
    ctx.save(); ctx.beginPath(); ctx.arc(x, y, R-0.5, 0, 7); ctx.clip();
    ctx.beginPath(); ctx.arc(x, y, R*i/5, 0, 7); ctx.stroke();
    ctx.restore();
  }
  // small greebled surface blocks scattered on the northern hemisphere
  ctx.fillStyle = 'rgba(20,22,26,0.5)';
  for (let i=0;i<10;i++){
    const ang = hash(i*3.3)*Math.PI*2, rr = hash(i*7.1)*R*0.75;
    const px = x + Math.cos(ang)*rr, py = y + Math.sin(ang)*rr*0.6 - R*0.15;
    if ((px-x)*(px-x)+(py-y)*(py-y) < R*R) ctx.fillRect(px-2, py-1.5, 4+((i%3)), 3);
  }
  // the equatorial trench — the station's iconic surface groove
  ctx.strokeStyle = '#14161a'; ctx.lineWidth = R*0.09;
  ctx.beginPath(); ctx.ellipse(x, y, R*0.98, R*0.16, 0, 0, 7); ctx.stroke();
  ctx.strokeStyle = 'rgba(255,255,255,0.06)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.ellipse(x, y - R*0.06, R*0.98, R*0.16, 0, 0, 7); ctx.stroke();
  // superlaser dish, concave ring with the emitter at its centre
  const dishX = x + DEATHSTAR_DISH_DX, dishY = y + DEATHSTAR_DISH_DY, dishR = R*0.34;
  ctx.fillStyle = '#1c1e22';
  ctx.beginPath(); ctx.arc(dishX, dishY, dishR, 0, 7); ctx.fill();
  ctx.strokeStyle = '#5a616e'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(dishX, dishY, dishR*0.7, 0, 7); ctx.stroke();
  ctx.beginPath(); ctx.arc(dishX, dishY, dishR*0.4, 0, 7); ctx.stroke();
  ctx.fillStyle = ds.phase === 'fire' ? '#ff8a3a' : (ds.phase === 'charge' ? '#ffd97a' : '#33373f');
  ctx.beginPath(); ctx.arc(dishX, dishY, dishR*0.28, 0, 7); ctx.fill();
  if (ds.phase === 'charge'){
    ctx.fillStyle = 'rgba(255,110,40,' + (0.3 + 0.5 * (ds.t / ds.chargeMax)) + ')';
    ctx.beginPath(); ctx.arc(dishX, dishY, dishR*0.28 + (ds.t / ds.chargeMax) * dishR*0.6, 0, 7); ctx.fill();
  }
  // nameplate
  ctx.font = 'bold 12px "Pixelify Sans", Inter, Arial';
  const label = 'DEATH STAR';
  const tw = ctx.measureText(label).width;
  ctx.fillStyle = 'rgba(0,0,0,0.7)';
  ctx.fillRect(x - tw/2 - 6, y - R - 26, tw + 12, 16);
  ctx.fillStyle = '#ffd97a';
  ctx.textAlign = 'center';
  ctx.fillText(label, x, y - R - 14);
  // charge bar
  if (ds.phase === 'charge'){
    const bw = 74;
    ctx.fillStyle = 'rgba(0,0,0,0.75)'; ctx.fillRect(x - bw/2, y + R + 10, bw, 8);
    ctx.fillStyle = '#ff6b2f'; ctx.fillRect(x - bw/2 + 1, y + R + 11, (bw - 2) * (ds.t / ds.chargeMax), 6);
    ctx.strokeStyle = '#ffd97a'; ctx.lineWidth = 1; ctx.strokeRect(x - bw/2, y + R + 10, bw, 8);
    ctx.fillStyle = '#ffd97a'; ctx.font = '9px "Pixelify Sans", Inter, Arial';
    ctx.fillText('CHARGING', x, y + R + 26);
  } else if (ds.phase === 'fire'){
    // laser beam — fires straight down from the dish itself, not the sky
    const beamTop = dishY + dishR*0.5;
    const beamBot = PLAY.y + PLAY.h;
    const grd = ctx.createLinearGradient(dishX, beamTop, dishX, beamBot);
    grd.addColorStop(0, 'rgba(255,220,100,0.95)');
    grd.addColorStop(0.3, 'rgba(255,100,30,0.85)');
    grd.addColorStop(1, 'rgba(255,40,10,0.5)');
    ctx.fillStyle = grd;
    ctx.fillRect(dishX - ds.beamW/2, beamTop, ds.beamW, beamBot - beamTop);
    // core white
    ctx.fillStyle = 'rgba(255,255,220,0.9)';
    ctx.fillRect(dishX - 4, beamTop, 8, beamBot - beamTop);
    // side sparks
    ctx.fillStyle = 'rgba(255,180,60,0.5)';
    ctx.fillRect(dishX - ds.beamW/2 - 6, beamTop, 4, beamBot - beamTop);
    ctx.fillRect(dishX + ds.beamW/2 + 2, beamTop, 4, beamBot - beamTop);
  } else {
    ctx.fillStyle = '#8a909a'; ctx.font = '9px "Pixelify Sans", Inter, Arial';
    ctx.fillText('RECHARGING', x, y + R + 16);
  }
  ctx.textAlign = 'left';
  ctx.restore();
}

function drawScene(){
  const w = WAVES[waveIndex] || WAVES[0];
  let stage = w ? w.stage : 'empire';
  if (boss && boss.def.key === 'romandicario' && boss.phase3) stage = 'spqmruins';
  if (boss && boss.def.key === 'romandicario' && boss.phase4) stage = 'spqmcapital';
  if (boss && boss.def.key === 'oxbit' && boss.phase2) stage = 'earthmap';
  if (boss && boss.def.key === 'n20') stage = boss.phase2 ? 'americafort' : 'canada';
  if (boss && boss.def.key === 'toast' && boss.phase2) stage = 'dcdamaged';
  /* the DC invasion: intact capital until the charge goes off, ruins after */
  if (boss && boss.dcInvasion) stage = 'dcinvaded';
  if (romanFlee) stage = 'dcinvaded';
  if (romanInvasion){
    const past = romanInvasion.phase === 'reveal' ||
                 (romanInvasion.phase === 'flash' && romanInvasion.phaseT > RI_DUR.flash*0.45);
    stage = past ? 'dcinvaded' : 'dc';
  }

  Hybrid3D.stage=stage;
  // world-only camera: HUD remains stable and readable.
  ctx.save();
  Visual.worldCamera();

  ctx.fillStyle = '#05070c'; ctx.fillRect(-24,-24,W+48,H+48);
  if (shipBattle){
    // stormy sea sky for ship phase
    const sky = ctx.createLinearGradient(0, STAGE.y, 0, HORIZON);
    sky.addColorStop(0, '#070b12'); sky.addColorStop(0.45, '#121c2a'); sky.addColorStop(1, '#1a3040');
    ctx.fillStyle = sky; ctx.fillRect(0, STAGE.y, W, HORIZON - STAGE.y);
    // distant storm clouds
    ctx.fillStyle = 'rgba(15,22,32,0.7)';
    for (let i = 0; i < 7; i++){
      const cx = (i * 150 + bgT * 6) % (W + 120) - 60;
      ctx.beginPath(); ctx.ellipse(cx, STAGE.y + 30 + (i % 3) * 12, 80, 18, 0, 0, 7); ctx.fill();
    }
    // Orthanc — Saruman's tower — looming in the far distance
    drawOrthancTower(W * 0.5, HORIZON + 4);
    // horizon mist
    const mist = ctx.createLinearGradient(0, HORIZON - 30, 0, HORIZON + 10);
    mist.addColorStop(0, 'rgba(10,20,30,0)'); mist.addColorStop(1, 'rgba(10,30,40,0.55)');
    ctx.fillStyle = mist; ctx.fillRect(0, HORIZON - 30, W, 40);
    drawShipBattleOverlay();
  } else {
    StageDepth.background(stage);
    drawGround(stage, bgT);
    StageDepth.ground(stage);
    StageDepth.structures(stage);
    drawStageFX(stage, bgT);
    drawAtmosphere(stage, bgT);
    StageDepth.air(stage,bgT,false);
    Visual.environment(stage, false);
    WashingtonHybrid.draw(stage, false);
    if (boss && boss.def.key === 'warden') drawMallFloor();
    /* his capital is intact in phase 1 now, so no battlefield corpses */
    if (boss && boss.def.key === 'romandicario' && (boss.phase3 || boss.phase4)) drawPhase3Corpses();
  }



  Visual.telegraphs();
  drawHazards();
  Visual.remains();
  if (boss && boss.deathStar) drawDeathStar(boss.deathStar);

  // drops
  for (const d of drops){
    const by = Math.sin(d.bob)*3;
    ctx.globalAlpha = d.t < 3 ? (0.35+0.65*Math.abs(Math.sin(d.t*10))) : 1;
    ctx.fillStyle='#000'; ctx.globalAlpha *= 0.9;
    ctx.fillStyle = '#c9a227'; ctx.fillRect(d.x-8, d.y-20+by, 16, 16);
    ctx.fillStyle = '#ffe27a'; ctx.fillRect(d.x-6, d.y-18+by, 8, 6);
    ctx.fillStyle = '#3f7a2a'; ctx.fillRect(d.x-1, d.y-24+by, 4, 5);
    ctx.globalAlpha = 1;
  }

  // ground particles
  for (const p of parts){
    ctx.globalAlpha = Math.max(0, p.life/p.max);
    ctx.fillStyle = p.col;
    if(p.kind==='mapleLeaf'){
      ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot||0);const z=p.size/9;ctx.scale(z,z);
      ctx.beginPath();ctx.moveTo(0,-9);ctx.lineTo(3,-4);ctx.lineTo(7,-6);ctx.lineTo(6,-1);ctx.lineTo(10,1);ctx.lineTo(5,3);ctx.lineTo(6,8);ctx.lineTo(1,5);ctx.lineTo(0,10);ctx.lineTo(-1,5);ctx.lineTo(-6,8);ctx.lineTo(-5,3);ctx.lineTo(-10,1);ctx.lineTo(-6,-1);ctx.lineTo(-7,-6);ctx.lineTo(-3,-4);ctx.closePath();ctx.fill();ctx.restore();
    }else ctx.fillRect(p.x-p.size/2,p.y-p.size/2,p.size,p.size);
  }
  ctx.globalAlpha = 1;

  // depth-sorted actors
  const list = [];
  for (const e of enemies) list.push({ y:e.y, o:e, t:'e' });
  if (boss) list.push({ y:boss.y, o:boss, t:'b' });
  if (player.alive || state !== 'dead' || (Visual.actors.get(player)?.dead||0)<1) list.push({ y:player.y, o:player, t:'p' });
  list.sort((a,b) => a.y - b.y);

  for (const it of list){
    const o = it.o;
    if (it.t === 'p'){
      const blink = player.iframe > 0 && Math.floor(bgT*24)%2 === 0;
      if (godmode){
        // the only tell that dev mode is on: a soft gold rim
        ctx.save();
        ctx.globalAlpha = 0.30 + 0.12*Math.sin(bgT*4);
        ctx.fillStyle = '#ffd95e';
        ctx.beginPath(); ctx.ellipse(player.x, player.y-30, 30, 42, 0, 0, 7); ctx.fill();
        ctx.restore();
      }
      const pp = playerPose();
      const pHop = player.rollT>0 ? Math.sin((1-player.rollT/0.24)*Math.PI)*9 : 0;
      if (player.rollT>0){
        ctx.save(); ctx.globalAlpha=0.12;
        ctx.fillStyle='#d7e8ff';
        const tail=(1-player.rollT/0.24)*32;
        ctx.beginPath(); ctx.ellipse(player.x-(player.rvx<0?-1:1)*tail,player.y,26,7,0,0,Math.PI*2); ctx.fill();
        ctx.restore();
      }
      drawSkin('player', player.x, player.y, 1.95, {
        actor:player, walk:player.walk, facing:player.facing, flash:player.flash>0?0.85:0,
        alpha: blink ? 0.55 : 1, hop:pHop, armAngle:playerArmPose(),
        run:pp.run, tilt:pp.tilt, squash:pp.squash, breath:pp.breath
      });
      drawArmorOverlay(player.armor, player.x, player.y, 1.95, player.facing,
        pHop, player.walk, player.flash>0?0.85:0, pp);
      drawPlayerWeapon();
      nameplate(player.x, player.y - 74 - pHop, PLAYER_NAME, godmode ? '#ffd95e' : '#dfe6f5');
    } else if (it.t === 'e'){
      if (o.spawnT > 0){
        ctx.globalAlpha = 0.4 + 0.6*(1-o.spawnT/0.45);
        ctx.fillStyle = EDEF[o.kind].col;
        ctx.fillRect(o.x-14, o.y-4, 28, 4);
      }
      const oFly = o.flyH || 0;
      const oy = o.y - oFly;
      if (o.kind === 'commandpost'){
        const pulse=.55+.45*Math.sin(bgT*5+o.x*.02);
        ctx.save();
        ctx.globalAlpha=.18+.10*pulse; ctx.fillStyle='#7ea4ff'; ctx.beginPath(); ctx.ellipse(o.x,oy-22,36,14,0,0,7); ctx.fill();
        ctx.globalAlpha=1;
        ctx.fillStyle='#1b2434'; ctx.fillRect(o.x-24,oy-44,48,28);
        ctx.strokeStyle='#9db7ff'; ctx.lineWidth=2; ctx.strokeRect(o.x-24,oy-44,48,28);
        ctx.fillStyle='#314a7c'; ctx.fillRect(o.x-20,oy-40,40,8);
        ctx.fillStyle='#dfe7ff'; ctx.fillRect(o.x-5,oy-54,3,10);
        ctx.fillStyle='#c8382a'; ctx.fillRect(o.x-2,oy-54,18,10);
        ctx.fillStyle='#f2f0e8'; ctx.fillRect(o.x-2,oy-51,18,3);
        ctx.fillStyle='#dfe7ff'; ctx.font='900 9px Inter, Segoe UI, Arial'; ctx.textAlign='center'; ctx.fillText('CMD',o.x,oy-24);
        ctx.fillStyle='rgba(0,0,0,.75)'; ctx.fillRect(o.x-24,oy-10,48,5); ctx.fillStyle='#7ea4ff'; ctx.fillRect(o.x-23,oy-9,46*Math.max(0,o.hp/o.maxHp),3);
        ctx.restore(); nameplate(o.x, oy-66, 'Command Post', '#dfe7ff', true); continue;
      }
      if (o.kind === 'supplycache'){
        const pulse=.55+.45*Math.sin(bgT*6+o.x*.03);
        ctx.save();
        ctx.globalAlpha=.16+.08*pulse; ctx.fillStyle='#ffd95e'; ctx.beginPath(); ctx.ellipse(o.x,oy-14,28,10,0,0,7); ctx.fill();
        ctx.globalAlpha=1; ctx.fillStyle='#5e4426';
        ctx.fillRect(o.x-18,oy-30,16,12); ctx.fillRect(o.x+2,oy-30,16,12); ctx.fillRect(o.x-8,oy-42,16,12);
        ctx.strokeStyle='#c9a24f'; ctx.lineWidth=2;
        ctx.strokeRect(o.x-18,oy-30,16,12); ctx.strokeRect(o.x+2,oy-30,16,12); ctx.strokeRect(o.x-8,oy-42,16,12);
        ctx.fillStyle='rgba(0,0,0,.75)'; ctx.fillRect(o.x-22,oy-10,44,5); ctx.fillStyle='#ffd95e'; ctx.fillRect(o.x-21,oy-9,42*Math.max(0,o.hp/o.maxHp),3);
        ctx.restore(); nameplate(o.x, oy-66, 'Supply Depot', '#ffe4a6', true); continue;
      }
      if (o.kind === 'permissionNode'){
        const pulse=.55+.45*Math.sin(bgT*7+o.x*.02);
        ctx.save();
        ctx.globalAlpha=.18+.12*pulse;ctx.fillStyle='#73ff92';ctx.beginPath();ctx.arc(o.x,oy-28,30+pulse*5,0,7);ctx.fill();
        ctx.globalAlpha=1;ctx.fillStyle='#101a16';ctx.fillRect(o.x-18,oy-48,36,36);ctx.strokeStyle='#73ff92';ctx.lineWidth=2.5;ctx.strokeRect(o.x-18,oy-48,36,36);
        ctx.fillStyle='#dfffe8';ctx.font='900 14px Inter, Segoe UI, Arial';ctx.textAlign='center';ctx.fillText('OP',o.x,oy-25);
        ctx.font='700 8px "Pixelify Sans", Arial';ctx.fillStyle='#9dffb0';ctx.fillText(o.nodeLabel||'PERMISSION',o.x,oy-55);ctx.textAlign='left';
        ctx.fillStyle='rgba(0,0,0,.75)';ctx.fillRect(o.x-20,oy-12,40,5);ctx.fillStyle='#73ff92';ctx.fillRect(o.x-19,oy-11,38*Math.max(0,o.hp/o.maxHp),3);
        ctx.restore();
        continue;
      }
      if (oFly > 2){
        // shadow stays on the ground while the body floats above it
        ctx.save(); ctx.globalAlpha = 0.28;
        ctx.fillStyle = '#000';
        ctx.beginPath(); ctx.ellipse(o.x, o.y+2, 13, 5, 0, 0, 7); ctx.fill();
        ctx.restore();
      }
      // red blackmail aura around the admins Roman press-ganged
      if (EDEF[o.kind].aura){
        const pulse = 0.5 + 0.5*Math.sin(bgT*8 + o.x*0.05);
        ctx.save();
        ctx.globalAlpha = 0.20 + 0.14*pulse;
        ctx.fillStyle = EDEF[o.kind].aura;
        ctx.beginPath(); ctx.ellipse(o.x, oy-30, 30+pulse*5, 44+pulse*6, 0, 0, 7); ctx.fill();
        ctx.globalAlpha = 0.28 + 0.16*pulse;
        ctx.beginPath(); ctx.ellipse(o.x, oy-30, 18+pulse*3, 28+pulse*4, 0, 0, 7); ctx.fill();
        ctx.restore();
      }
      // Elite silhouettes stay cheap: one pulsing ground ring plus a small
      // icon, no extra sprites or shaders. This remains readable at low quality.
      if (o.elite){
        const ec=o.elite==='deadeye'?'#ffcf70':o.elite==='vanguard'?'#ff8068':'#8ec8ff';
        const ep=0.55+0.45*Math.sin(bgT*5+o.x*.02);
        ctx.save();ctx.globalAlpha=.34+.16*ep;ctx.strokeStyle=ec;ctx.lineWidth=2;
        ctx.beginPath();ctx.ellipse(o.x,oy+2,18+ep*3,7+ep,0,0,7);ctx.stroke();
        ctx.fillStyle=ec;ctx.globalAlpha=.85;
        if(o.elite==='bulwark'){ctx.fillRect(o.x-5,oy-88,10,7);ctx.fillRect(o.x-3,oy-81,6,4);}
        else if(o.elite==='vanguard'){ctx.beginPath();ctx.moveTo(o.x,oy-91);ctx.lineTo(o.x-6,oy-82);ctx.lineTo(o.x+6,oy-82);ctx.fill();}
        else {ctx.beginPath();ctx.arc(o.x,oy-86,5,0,7);ctx.stroke();ctx.fillRect(o.x-1,oy-94,2,16);ctx.fillRect(o.x-8,oy-87,16,2);}
        ctx.restore();
      }
      drawSkin(o.skin, o.x, oy, o.scale, { actor:o, walk:o.walk, facing:o.facing, flash:o.flash>0?0.85:0,

        run:Math.max(0,Math.min(1,((o.speed||80)-82)/95)),
        tilt:(o.kbx||0)*0.00018, breath:Math.sin(bgT*2.2+o.x*.01)*0.18 });
      if (EDEF[o.kind].armor) drawArmorOverlay(EDEF[o.kind].armor, o.x, oy, o.scale, o.facing, 0, o.walk, o.flash>0?0.85:0);
      ctx.globalAlpha = 1;
      if (o.weapon && o.weapon !== 'none') drawWeapon({ x:o.x, y:oy, facing:o.facing, armAngle:o.armAngle||0 }, o.weapon, o.scale);
      if (o.hp < o.maxHp){
        ctx.fillStyle='rgba(0,0,0,0.65)'; ctx.fillRect(o.x-16, oy-70, 32, 5);
        ctx.fillStyle = EDEF[o.kind].col; ctx.fillRect(o.x-15, oy-69, 30*(o.hp/o.maxHp), 3);
      }
      const elitePrefix = o.elite==='deadeye'?'Deadeye ':o.elite==='vanguard'?'Vanguard ':o.elite==='bulwark'?'Bulwark ':'';
      const eliteCol = o.elite==='deadeye'?'#ffcf70':o.elite==='vanguard'?'#ff9a88':o.elite==='bulwark'?'#a9d8ff':EDEF[o.kind].nameCol;
      nameplate(o.x, oy - 74, elitePrefix + EDEF[o.kind].label, eliteCol, true);
    } else {
      const b = o;
      if (b.cinematicHidden) continue;
      if (b.def.key==='n20' && b.phase2) drawN20StoneTower(b.towerX||b.x,b.towerY||b.y,b.towerH||b.flyH||142, 'canada');
      if (b.mode === 'wind'){
        const a = Math.atan2((player.y-b.y)*0.8, player.x-b.x);
        ctx.strokeStyle = 'rgba(255,215,122,0.75)'; ctx.lineWidth = 3;
        ctx.setLineDash([10,8]);
        ctx.beginPath(); ctx.moveTo(b.x, b.y-30);
        ctx.lineTo(b.x+Math.cos(a)*460, b.y-30+Math.sin(a)*460*0.7); ctx.stroke();
        ctx.setLineDash([]);
      }
      if (b.fly && b.flyH > 2){
        // hover glow under feet — green for Oxbit's creative mode, or
        // whatever aura colour the boss set (Dandire's Architect: white)
        ctx.save();
        ctx.globalAlpha = 0.35 + 0.15*Math.sin(bgT*6);
        ctx.fillStyle = b.auraCol || '#9dffb0';
        ctx.beginPath(); ctx.ellipse(b.x, b.y+2, 22, 8, 0, 0, 7); ctx.fill();
        ctx.restore();
      }
      // temporary platforms from Romandicario block-place
      if (b.platforms){
        for (const p of b.platforms){
          ctx.fillStyle = '#6b5a3e';
          for (let i=0;i<p.h;i++){
            ctx.fillRect(p.x-12, p.y-16-i*14, 24, 14);
            ctx.fillStyle = '#8a7a5a';
            ctx.fillRect(p.x-10, p.y-14-i*14, 20, 4);
            ctx.fillStyle = '#5a4a2e';
          }
        }
      }
      // RomanDiCario leans into his own movement instead of staying bolt
      // upright — a small rotation around his feet, skipped once he's
      // collapsing so the death sequence doesn't fight with it
      const romanLean = (b.def.key === 'romandicario' && !b.jumping) ? (b.lean||0) : 0;
      if (romanLean){ ctx.save(); ctx.translate(b.x, b.y); ctx.rotate(romanLean); ctx.translate(-b.x, -b.y); }
      if (b.ssj) drawOxbitAura(b);
      const bossAttackK = b.armSwingT>0 && b.armSwingMax ? Math.sin((1-b.armSwingT/b.armSwingMax)*Math.PI) : 0;
      const bossRageK = Math.max(0,Math.min(1,(0.42-b.hp/b.maxHp)/0.22));
      if (bossRageK>0 && !b.jumping){
        ctx.save();
        ctx.globalCompositeOperation='lighter';
        ctx.globalAlpha=(0.05+0.08*Math.sin(bgT*7+b.t))*bossRageK;
        ctx.fillStyle=b.def.accent||'#ffb347';
        ctx.beginPath();
        ctx.ellipse(b.x,b.y-(b.flyH||0)-38,34+bossRageK*9,48+bossRageK*11,0,0,Math.PI*2);
        ctx.fill();
        ctx.restore();
      }
      drawSkin(b.skin, b.x, b.y, b.def.scale * (b.jumpScale||1), {
        actor:b, walk:b.walk, facing: b.jumping && b.jumpT > 1.7 ? (Math.sin(b.jumpSpin||0)>0?1:-1) : b.facing,
        flash:b.flash>0?0.85:0,
        capeSway:b.capeSway||0, hop: (b.flyH || 0) + (b.hop || 0), armAngle: b.armAngle||0,
        run:(b.dashT>0 || b.mode==='whirl') ? 1 : 0,
        tilt:bossAttackK*0.07*(b.facing||1), breath:Math.sin((b.t||0)*2.1)*0.28 });
      if (bossAttackK>0.08){
        ctx.save();
        ctx.globalCompositeOperation='lighter';
        ctx.globalAlpha=(1-bossAttackK)*0.18 + 0.12;
        ctx.strokeStyle=b.def.accent||'#ffffff';
        ctx.lineWidth=5;
        ctx.beginPath();
        const dir=b.facing<0?Math.PI:0;
        ctx.arc(b.x,b.y-(b.flyH||0)-34,46,dir-0.95+bossAttackK*0.75,dir+0.15+bossAttackK*0.9);
        ctx.stroke();
        ctx.restore();
      }
      if (b.def.key === 'romandicario' && b.phase3) drawRomanScars(b);
      // Oxbit's creative-mode Netherite armor now matches his exact skin footprint; only his green head remains visible.
      if (b.armor) drawArmorOverlay('netherite', b.x, b.y, b.def.scale, b.facing, b.flyH||0, b.walk, b.flash>0?0.85:0);
      if (b.def.key === 'tobikoer') drawTobiAxe(b);
      if (b.def.key === 'romandicario' && !b.jumping) drawWeapon(b, 'dagger', b.def.scale);
      if (romanLean) ctx.restore();
      if (b.def.key === 'commandervideo') drawWeapon(b, 'bow', b.def.scale);
      if (b.def.key === 'n20' && !b.phase2) drawWeapon(b, 'bow', b.def.scale);
      if (b.def.key === 'n20' && b.phase2 && !b.panicGround && !b.panicJump) drawN20RocketLauncher(b);
      if (b.def.key === 'n20' && b.phase2 && (b.panicGround || b.panicJump)) drawN20PanicWeapon(b);
      if (b.def.key === 'matie') drawWeapon(b, 'sword', b.def.scale);
      if (b.def.key === 'dandire') drawWeapon(b, 'crossbow', b.def.scale);
      if (b.def.key === 'kippenwortel') drawWeapon(b, b.weapon || 'sword', b.def.scale);
      if (b.def.key === 'matie' && b.wall > 0) drawMatieWall(b);
      if (b.def.key === 'commandervideo' && b.insultT > 0) drawInsultCloud(b);
      if (b.def.key === 'commandervideo' && b.cannon) drawConfedCannon(b.cannon);
      if (b.shield > 0){
        ctx.strokeStyle = 'rgba(160,255,180,'+(0.35+0.35*Math.sin(bgT*22))+')';
        ctx.lineWidth = 3;
        ctx.beginPath(); ctx.ellipse(b.x, b.y-(b.flyH||0)-42, 46, 56, 0, 0, 7); ctx.stroke();
      }
      if (b.guard > 0) drawTobiShield(b);
      if (b.def.key === 'kippenwortel' && b.shield > 0) drawKippenShield(b);
      if (b.def.key === 'oxbit') drawBanHammer(b);
      if (b.def.key === 'oxbit' && b.hammer2) drawDoxxingHammer(b.hammer2);
      if (!b.rageQuit) nameplate(b.x, b.y - (b.flyH||0) - 92, b.def.name, b.def.accent);
    }
  }

  if (sidekick){
    drawSkin(sidekick.skin, sidekick.x, sidekick.y, sidekick.scale, {
      actor:sidekick, walk:sidekick.walk, facing:sidekick.facing, flash:sidekick.flash>0?.85:0,
      armAngle:sidekick.armAngle||0, run:0.25, breath:Math.sin(bgT*2.15+1.7)*0.2
    });
    drawWeapon(sidekick, sidekick.weapon || 'sword', sidekick.scale);
    if(sidekick.hp<sidekick.maxHp){
      ctx.fillStyle='rgba(0,0,0,.7)'; ctx.fillRect(sidekick.x-18,sidekick.y-72,36,5);
      ctx.fillStyle=SIDEKICK_COLOR[sidekick.skin] || '#c94f7a'; ctx.fillRect(sidekick.x-17,sidekick.y-71,34*(sidekick.hp/sidekick.maxHp),3);
    }
    // the nameplate used to hardcode "Jessiesgirl" no matter which sidekick
    // was actually on screen, so Granitial fought under the wrong name
    // during Dandire's level. Every sidekick now carries and shows its own.
    nameplate(sidekick.x, sidekick.y-76, sidekick.name || 'Sidekick', SIDEKICK_COLOR[sidekick.skin] || '#e27b9b', true);
  }

  // projectiles
  for (const s of shots) drawShot(s);

  // damage numbers
  ctx.textAlign = 'center';
  for (const n of nums){
    const pop=Math.min(1,Math.max(0,n.t*4));
    ctx.globalAlpha = Math.min(1, n.t*1.6);
    ctx.save();
    ctx.translate(n.x,n.y);
    ctx.scale(0.86+0.14*pop,0.86+0.14*pop);
    ctx.font = 'bold 15px "Pixelify Sans", Inter, Segoe UI, Arial';
    ctx.fillStyle = '#000';
    ctx.fillText(n.v, 2, 2);
    ctx.fillStyle = n.col;
    ctx.fillText(n.v, 0, 0);
    ctx.restore();
  }
  ctx.globalAlpha = 1; ctx.textAlign = 'left';

  drawImpactRings();
  Visual.effects();
  if (!shipBattle){Visual.environment(stage, true);WashingtonHybrid.draw(stage,true);StageDepth.air(stage,bgT,true);}
  drawVignette();
  // cinematic black vignette closing in during RomanDiCario's tower-edge fall
  if (boss && boss.def && boss.def.key === 'romandicario' && boss.jumping){
    const k = Math.min(1, boss.jumpT / 2.2);
    ctx.save();
    ctx.globalAlpha = Math.min(0.92, k*k*1.05);
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, STAGE.y*0.9);
    ctx.fillRect(0, H - STAGE.y*0.9, W, STAGE.y*0.9);
    const g = ctx.createRadialGradient(W/2, H*0.48, H*0.18, W/2, H*0.48, H*0.72);
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(1, 'rgba(0,0,0,' + (0.55 + k*0.4) + ')');
    ctx.fillStyle = g; ctx.fillRect(0,0,W,H);
    ctx.restore();
  }
  ctx.restore(); // combat camera
}

/* poses the player's front arm to match sword swings / bow draws so the
   hand actually moves with the action instead of sitting still */
function playerArmPose(){
  if (player.swing){
    const k = 1 - player.swing.t/player.swing.max;
    if (player.swing.step===1) return 1.15-k*2.35;
    if (player.swing.step===2) return -1.75+k*2.85;
    return -1.3 + k*2.3;
  }
  if (player.bowCharge >= 0){
    return -0.95 - player.bowCharge*0.3;
  }
  return 0;
}
function drawPlayerWeapon(){
  const px = player.x, py = player.y - 30;

  // and cheap enough to keep the low graphics mode fast.
  if (player.guardT>0){
    ctx.save();
    ctx.translate(px,py);

    ctx.globalAlpha=pulse; ctx.strokeStyle=player.parryT>0?'#ffe9a6':'#b7cad9';
    ctx.lineWidth=player.parryT>0?4:3;
    ctx.beginPath(); ctx.arc(face*7,0,28,face>0?-1.08:Math.PI-2.06,face>0?1.08:Math.PI+2.06); ctx.stroke();
    ctx.globalAlpha*=0.45; ctx.beginPath(); ctx.arc(face*7,0,22,face>0?-0.92:Math.PI-2.22,face>0?0.92:Math.PI+2.22); ctx.stroke();
    ctx.restore();
  }
  const meleeKind = player.meleeType || 'sword';
  const swordCols = {
    wood:['#654a2f','#8a6234','#b58a54'],
    iron:['#7d8792','#c7d0d9','#f0f4f7'],
    diamond:['#147f86','#3bc7c7','#b9ffff'],

  }[player.sword] || ['#7d8792','#c7d0d9','#f0f4f7'];

  if (player.bowCharge >= 0){
    const a = Math.atan2(mouse.y-py, mouse.x-px);
    ctx.save(); ctx.translate(px, py); ctx.rotate(a);
    const pull = player.bowCharge*10;

    if(player.bowCharge>0.72){

      ctx.setLineDash([5,7]); ctx.beginPath(); ctx.moveTo(24,0); ctx.lineTo(220,0); ctx.stroke(); ctx.setLineDash([]);
      ctx.restore();

    ctx.shadowColor='rgba(0,0,0,.65)';ctx.shadowOffsetX=2;ctx.shadowOffsetY=2;
    ctx.strokeStyle = player.bow==='fire' ? '#b95b32' : (player.bow==='explosive' ? '#8067a8' : '#8a6234');
    ctx.lineWidth = 4;
    ctx.beginPath(); ctx.arc(18, 0, 15, -1.9, 1.9); ctx.stroke();
    ctx.shadowColor='transparent';ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;
    ctx.strokeStyle='#dfb87a';ctx.lineWidth=1.2;ctx.beginPath();ctx.arc(18,-1,14,-1.9,1.9);ctx.stroke();
    ctx.strokeStyle = '#f4ead4'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(13, -14); ctx.lineTo(13-pull, 0); ctx.lineTo(13, 14); ctx.stroke();
    ctx.fillStyle = '#b8a07a'; ctx.fillRect(13-pull, -1, 27, 2);
    ctx.fillStyle='#edf5ff';ctx.beginPath();ctx.moveTo(44-pull,0);ctx.lineTo(36-pull,-3);ctx.lineTo(37-pull,3);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ede3c7';ctx.beginPath();ctx.moveTo(15-pull,0);ctx.lineTo(8-pull,-4);ctx.lineTo(6-pull,-3);ctx.lineTo(10-pull,0);ctx.lineTo(6-pull,3);ctx.lineTo(8-pull,4);ctx.closePath();ctx.fill();
    ctx.restore();

    const cw = 48;
    ctx.fillStyle='rgba(0,0,0,0.68)'; ctx.fillRect(px-cw/2, player.y+8, cw, 6);
    ctx.fillStyle = player.bowCharge>0.92 ? '#8fe3ff' : '#ffd95e';
    ctx.fillRect(px-cw/2+1, player.y+9, (cw-2)*player.bowCharge, 4);
  } else if (player.swing){
    const sw=player.swing, k = 1 - sw.t/sw.max;
    let from=-1.15,to=1.15;

    if(sw.step===2){from=-1.65;to=1.58;}
    const ease = 1-Math.pow(1-k,3);

    // broad luminous trail — multiple bands give it a hand-animated feel
    ctx.save();
    ctx.globalCompositeOperation='lighter';
    const trailAlpha=(1-k)*(sw.heavy?0.78:0.56);
    const rr=sw.heavy?69:58;

    if(sw.heavy && k>0.35 && k<0.72){
      ctx.save(); ctx.globalAlpha=0.22;
      ctx.fillStyle='#ffd27a';
      ctx.beginPath(); ctx.ellipse(px+Math.cos(sw.a)*44,py+Math.sin(sw.a)*34,45,18,sw.a,0,Math.PI*2); ctx.fill();
      ctx.restore();

  } else {
    ctx.save(); ctx.translate(px, py);
    if (player.facing < 0) ctx.scale(-1,1);

    }else if(meleeKind==='spear'){

function drawShot(s){

    // a shop item TheWarden grabbed off his own shelves and hurled at you
    ctx.save(); ctx.translate(s.x, s.y); ctx.rotate(s.ang*0.3 + bgT*4);
    if (s.item === 'diamond'){
      ctx.fillStyle = '#3bc7c7'; ctx.beginPath();
      ctx.moveTo(0,-9); ctx.lineTo(8,-2); ctx.lineTo(4,9); ctx.lineTo(-4,9); ctx.lineTo(-8,-2); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#a7ffff'; ctx.fillRect(-2,-6,4,4);
    } else if (s.item === 'apple'){
      ctx.fillStyle = '#c8382a'; ctx.beginPath(); ctx.arc(0,1,8,0,7); ctx.fill();
      ctx.fillStyle = '#ff8a78'; ctx.fillRect(-4,-3,4,3);
      ctx.fillStyle = '#3f7a2a'; ctx.fillRect(-1,-10,4,5);

function drawHeart(x, y, fill){
  // blocky minecraft-ish heart
  ctx.fillStyle = '#1b1b1b';
  ctx.fillRect(x, y+1, 14, 12);
  ctx.fillRect(x+1, y, 12, 3);
  if (fill <= 0) return;
  const col = '#d33a35', hi = '#f06860';
  ctx.save();
  ctx.beginPath(); ctx.rect(x, y, 14*fill, 14); ctx.clip();

  ctx.fillRect(x+1, y+2, 12, 9);

  ctx.restore();
}

      ctx.fillStyle='rgba(4,12,8,.88)';ctx.fillRect(ax-3,ay-3,aw+6,18);
      ctx.fillStyle='#17251d';ctx.fillRect(ax,ay,aw,10);ctx.fillStyle=auth<25?'#ff6868':'#55e875';ctx.fillRect(ax,ay,aw*auth/100,10);ctx.strokeStyle='#9dffb0';ctx.strokeRect(ax,ay,aw,10);
      ctx.textAlign='center';ctx.font='900 9px Inter, Segoe UI, Arial';ctx.fillStyle='#dfffe8';ctx.fillText((boss.phase2?'ROOT AUTHORITY ':'SERVER AUTHORITY ')+Math.round(auth)+'%',W/2,ay+9);ctx.textAlign='left';
      if((boss.rootNightT||0)>0){ctx.save();ctx.globalAlpha=.28*Math.min(1,boss.rootNightT);ctx.fillStyle='#031021';ctx.fillRect(0,0,W,H);ctx.restore();}
      if((boss.consoleT||0)>0){
        const cmd=String(boss.consoleText||'').slice(0,42);
        const cw=Math.min(300, Math.max(190, 56 + cmd.length*6.0));
        const bh=34;
        const headY=boss.y-(boss.flyH||0)-122;
        const cx=Math.max(8,Math.min(W-cw-8,boss.x-cw/2));
        const cy=Math.max(82,Math.min(H-bh-70,headY-bh));
        ctx.save();
        ctx.fillStyle='rgba(0,10,5,.91)';ctx.fillRect(cx,cy,cw,bh);
        ctx.strokeStyle='#2fbf3f';ctx.lineWidth=1.5;ctx.strokeRect(cx+.5,cy+.5,cw-1,bh-1);
        ctx.fillStyle='rgba(47,191,63,.16)';ctx.fillRect(cx+3,cy+3,cw-6,12);
        ctx.font='700 8px Consolas, monospace';ctx.fillStyle='#73ff92';ctx.fillText('[OXBIT // SERVER]',cx+8,cy+12);
        ctx.font='700 9px Consolas, monospace';ctx.fillStyle='#dfffe8';ctx.fillText('> '+cmd,cx+8,cy+27);
        // little pointer makes the console visibly belong to Oxbit
        const px=Math.max(cx+18,Math.min(cx+cw-18,boss.x));
        ctx.fillStyle='#2fbf3f';ctx.beginPath();ctx.moveTo(px-6,cy+bh);ctx.lineTo(px+6,cy+bh);ctx.lineTo(boss.x,cy+bh+7);ctx.closePath();ctx.fill();

      }
    }
  }

  // ===== Minecraft-style bottom HUD: hearts + golden apples =====
  const by0 = H - 42;
  const hudScale = 1.18;
  // dark plate behind hearts so they stay readable on any stage
  ctx.fillStyle = 'rgba(4,6,12,0.58)';
  ctx.fillRect(12, by0-8, 246, 36);
  ctx.save();
  ctx.translate(20, by0); ctx.scale(hudScale, hudScale);
  for (let i=0;i<10;i++){
    const f = Math.max(0, Math.min(1, (player.hp - i*10)/10));
    drawHeart(i*17, 0, f);
  }
  ctx.restore();
  if (player.absorb > 0){
    ctx.fillStyle = '#e8c153'; ctx.font = '12px "Pixelify Sans", Inter, Segoe UI, Arial';
    ctx.fillText('+' + Math.ceil(player.absorb), 232, by0+13);
  }
  // apples to the right of hearts
  const ax0 = 272;
  ctx.fillStyle = 'rgba(4,6,12,0.58)';
  ctx.fillRect(ax0-6, by0-8, Math.max(66, player.apples*24 + 24), 36);
  ctx.save();
  ctx.translate(ax0, by0); ctx.scale(1.22, 1.22);
  for (let i=0;i<player.apples;i++){
    const x = i*18, y = 0;
    ctx.fillStyle = '#c9a227'; ctx.fillRect(x, y, 14, 14);
    ctx.fillStyle = '#ffe27a'; ctx.fillRect(x+2, y+2, 6, 5);
    ctx.fillStyle = '#3f7a2a'; ctx.fillRect(x+6, y-3, 4, 4);
  }
  ctx.restore();
  ctx.fillStyle = '#7d88a8'; ctx.font = '11px "Pixelify Sans", Inter, Segoe UI, Arial';
  ctx.fillText('Q', ax0 + player.apples*22 + 6, by0+13);

  // low-HP blood vignette so danger is impossible to miss.
  const hpK = player.maxHp>0 ? player.hp/player.maxHp : 1;
  if (hpK < 0.38){
    const danger = Math.max(0, Math.min(1, (0.38-hpK)/0.38));
    const pulse = 0.72 + 0.28*Math.sin(bgT*8.5);
    const vg = ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.24,W/2,H/2,Math.max(W,H)*0.68);
    vg.addColorStop(0,'rgba(120,0,0,0)');
    vg.addColorStop(0.72,'rgba(120,0,0,0)');
    vg.addColorStop(1,'rgba(155,0,0,'+(0.18 + danger*0.38*pulse)+')');
    ctx.fillStyle = vg; ctx.fillRect(0,0,W,H);
  }

  // v33: peripheral low-health warning; center screen remains clear for dodging/parrying.
  if (state === 'play' && player && player.maxHp > 0){
    const hpFrac=Math.max(0,Math.min(1,player.hp/player.maxHp));
    if(hpFrac<0.30){
      const pulse=Math.min(.34,0.10+(0.30-hpFrac)*0.42+0.035*(1+Math.sin(bgT*7)));
      const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*0.27,W/2,H/2,Math.max(W,H)*0.72);
      vg.addColorStop(0,'rgba(120,0,0,0)');
      vg.addColorStop(.72,'rgba(150,0,0,0)');
      vg.addColorStop(1,'rgba(190,18,18,'+pulse+')');
      ctx.fillStyle=vg; ctx.fillRect(0,STAGE.y,W,H-STAGE.y);
      ctx.textAlign='center';
      ctx.font='900 10px "Pixelify Sans", Inter, Segoe UI, Arial';
      ctx.fillStyle='rgba(255,190,180,'+(0.62+0.25*Math.sin(bgT*7))+')';
      ctx.fillText('CRITICAL HEALTH',W/2,H-14);
      ctx.textAlign='left';
    }
  }
}

function drawDialogue(){
  const d = Dialogue.active;
  if (!d) return;
  // sit above the bottom Minecraft-style hearts HUD
  const bw = 660, bx = (W-bw)/2, by = H - 118, bh = 68;
  ctx.fillStyle = 'rgba(5,7,13,0.64)';
  ctx.fillRect(bx, by, bw, bh);
  ctx.strokeStyle = d.color; ctx.lineWidth = 2;
  ctx.strokeRect(bx, by, bw, bh);
  ctx.fillStyle = 'rgba(255,255,255,0.035)';
  ctx.fillRect(bx+2, by+2, bw-4, 3);
  // portrait
  ctx.save();
  ctx.beginPath(); ctx.rect(bx+8, by+8, 52, 52); ctx.clip();
  ctx.fillStyle = 'rgba(255,255,255,0.04)'; ctx.fillRect(bx+8, by+8, 52, 52);
  drawPortrait(d.skin, bx+34, by+62, 6.4);
  ctx.restore();
  ctx.strokeStyle = 'rgba(255,255,255,0.18)'; ctx.lineWidth = 1;
  ctx.strokeRect(bx+8, by+8, 52, 52);

  ctx.fillStyle = d.color; ctx.font = '800 15px "Pixelify Sans", Inter, Segoe UI, Arial';
  ctx.fillText(d.speaker, bx+72, by+24);
  ctx.fillStyle = '#f3f5fa'; ctx.font = '600 15px "Pixelify Sans", Inter, Segoe UI, Arial';
  const shown = d.text.slice(0, Math.floor(Dialogue.typed));
  wrapText(shown, bx+72, by+44, bw-92, 16);
}
function wrapText(text, x, y, maxW, lh){
  const words = text.split(' ');
  let line = '', yy = y;
  for (const w of words){
    const t = line ? line + ' ' + w : w;
    if (ctx.measureText(t).width > maxW && line){
      ctx.fillText(line, x, yy); line = w; yy += lh;
    } else line = t;
  }
  if (line) ctx.fillText(line, x, yy);
}

/* the lore rail lives in its own gutter down the left-hand edge, and the
   map viewport simply starts to the right of it — that way the portraits
   never sit on top of the world, they sit beside it */
const LORE_W = 0;
const MAPV = { x:0, y:50, w:W, h:420 };
const ROSTER_Y = 468, ROSTER_H = 66, ROSTER_X = 16;
const ROSTER_CARD_W = 92, ROSTER_CARD_GAP = 8;
const rosterUI = { scroll:0, target:0, max:0, grab:false, gx:0, gmoved:0 };
function rosterViewportW(){ return W - ROSTER_X*2; }
function inRoster(x, y){ return x >= ROSTER_X && x <= W-ROSTER_X && y >= ROSTER_Y && y <= ROSTER_Y+ROSTER_H; }
function rosterScrollBy(d){ rosterUI.target = Math.max(0, Math.min(rosterUI.max, rosterUI.target + d)); }

let terrMask = null, terrMaskCtx = null, terrPaint = null, terrPaintCtx = null;
function ensureTerritoryBuffers(){
  if (!terrMask){ terrMask = document.createElement('canvas'); terrMaskCtx = terrMask.getContext('2d'); }
  if (!terrPaint){ terrPaint = document.createElement('canvas'); terrPaintCtx = terrPaint.getContext('2d'); }
  if (terrMask.width !== W || terrMask.height !== H){ terrMask.width = W; terrMask.height = H; }
  if (terrPaint.width !== W || terrPaint.height !== H){ terrPaint.width = W; terrPaint.height = H; }
}
function resetTerritoryBuffers(){
  ensureTerritoryBuffers();
  terrMaskCtx.clearRect(0,0,W,H);
  terrPaintCtx.clearRect(0,0,W,H);
}
function traceTerritoryPath(g, t){

    const cx = projX(t.c[0]), cy = projY(t.c[1]), p = mapPPD();
    const rx = (t.r / Math.cos(t.c[1]*Math.PI/180)) * p;
    g.beginPath(); g.ellipse(cx, cy, rx, t.r*p, 0, 0, 7);
  }
}

function mapBasePPD(){ return Math.min(MAPV.w/360, MAPV.h/180); }
function mapPPD(){ return mapBasePPD() * cam.zoom; }
function mapClampCam(){
  const p = mapPPD();
  const hl = (MAPV.w/2)/p, hv = (MAPV.h/2)/p;
  cam.lon = (hl >= 180) ? 0 : Math.max(-180+hl, Math.min(180-hl, cam.lon));
  cam.lat = (hv >= 90)  ? 0 : Math.max(-90+hv,  Math.min(90-hv,  cam.lat));
}
function projX(lon){ return MAPV.x + MAPV.w/2 + (lon - cam.lon)*mapPPD(); }
function projY(lat){ return MAPV.y + MAPV.h/2 - (lat - cam.lat)*mapPPD(); }
function unprojLon(sx){ return cam.lon + (sx - MAPV.x - MAPV.w/2)/mapPPD(); }

/* ------------------------------------------------------- hit testing */
function pointInFlatPoly(lon, lat, p){
  let inside = false;
  for (let i=0, j=p.length-2; i<p.length; j=i, i+=2){
    const xi=p[i], yi=p[i+1], xj=p[j], yj=p[j+1];
    if (((yi>lat) !== (yj>lat)) && (lon < (xj-xi)*(lat-yi)/(yj-yi)+xi)) inside = !inside;
  }
  return inside;
}
function territoryCenter(n){
  const t=n.terr;
  if(t.t==='circ') return {lon:t.c[0],lat:t.c[1]};
  const p=t.p;
  let twiceA=0,cx=0,cy=0;
  for(let i=0,j=p.length-2;i<p.length;j=i,i+=2){
    const cross=p[j]*p[i+1]-p[i]*p[j+1];
    twiceA+=cross;
    cx+=(p[j]+p[i])*cross;
    cy+=(p[j+1]+p[i+1])*cross;
  }
  if(Math.abs(twiceA)<1e-6){
    let lon=0,lat=0,nPts=p.length/2;
    for(let i=0;i<p.length;i+=2){lon+=p[i];lat+=p[i+1];}
    return {lon:lon/nPts,lat:lat/nPts};
  }
  return {lon:cx/(3*twiceA),lat:cy/(3*twiceA)};
}
function nodeAt(sx, sy){
  if (sy < MAPV.y || sy > MAPV.y+MAPV.h) return null;
  if (sx < MAPV.x) return null;                  // that column is the lore rail
  const lon = unprojLon(sx), lat = unprojLat(sy);
  let best = null, bestD = 1e9;
  // Boss-head markers win over territory: they are the deliberate target.
  for (const n of MAP_NODES){
    const m=territoryCenter(n);
    const d = Math.hypot(projX(m.lon)-sx, projY(m.lat)-sy);
    if (d < 22 && d < bestD){ best = n; bestD = d; }
  }
  if (best) return best;
  for (const n of MAP_NODES){
    const t = n.terr;
    if (t.t === 'poly'){ if (pointInFlatPoly(lon, lat, t.p)) return n; }
    else { if (Math.hypot((lon-t.c[0])*Math.cos(lat*Math.PI/180), lat-t.c[1]) < t.r) return n; }
  }
  return null;
}

/* ------------------------------------------------------ camera moves */
function mapFlyTo(lon, lat, zoom){ cam.tlon = lon; cam.tlat = lat; cam.tzoom = zoom; }
function mapZoomAt(sx, sy, factor){
  const lon0 = unprojLon(sx), lat0 = unprojLat(sy);
  const z = Math.max(1, Math.min(9, cam.zoom * factor));
  if (z === cam.zoom) return;
  cam.zoom = z; cam.tzoom = z;
  mapClampCam();
  // keep the point under the cursor pinned while zooming
  cam.lon += lon0 - unprojLon(sx);
  cam.lat += lat0 - unprojLat(sy);
  mapClampCam();
  cam.tlon = cam.lon; cam.tlat = cam.lat;
}
function updateMapCam(dt){
  const k = Math.min(1, dt*7);
  cam.zoom = lerp(cam.zoom, cam.tzoom, k);
  cam.lon  = lerp(cam.lon,  cam.tlon,  k);
  cam.lat  = lerp(cam.lat,  cam.tlat,  k);
  mapClampCam();
}

/* --------------------------------------------------------- rendering */
function mapPath(g, flat, close){
  g.beginPath();
  g.moveTo(projX(flat[0]), projY(flat[1]));
  for (let i=2; i<flat.length; i+=2) g.lineTo(projX(flat[i]), projY(flat[i+1]));
  if (close !== false) g.closePath();
}

function drawGraticule(){
  ctx.save();
  ctx.lineWidth = 1;
  const step = cam.zoom > 4 ? 5 : (cam.zoom > 2 ? 10 : 15);
  ctx.strokeStyle = 'rgba(120,170,215,0.10)';
  ctx.beginPath();
  for (let lon=-180; lon<=180; lon+=step){
    const x = projX(lon);
    if (x < MAPV.x-2 || x > MAPV.x+MAPV.w+2) continue;
    ctx.moveTo(x, MAPV.y); ctx.lineTo(x, MAPV.y+MAPV.h);
  }
  for (let lat=-90; lat<=90; lat+=step){
    const y = projY(lat);
    if (y < MAPV.y-2 || y > MAPV.y+MAPV.h+2) continue;
    ctx.moveTo(MAPV.x, y); ctx.lineTo(MAPV.x+MAPV.w, y);
  }
  ctx.stroke();
  // equator and the tropics read a little hotter
  ctx.strokeStyle = 'rgba(150,200,255,0.24)';
  ctx.beginPath();
  ctx.moveTo(MAPV.x, projY(0)); ctx.lineTo(MAPV.x+MAPV.w, projY(0));
  ctx.stroke();
  ctx.restore();
}

function drawWorldLand(){
  const p = mapPPD();
  // continental shelf halo — a soft light-blue skirt around every coast
  ctx.save();
  ctx.strokeStyle = 'rgba(90,170,225,0.30)';
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.lineWidth = Math.max(3, p*2.2);
  for (const poly of WORLD_LAND){ mapPath(ctx, poly); ctx.stroke(); }
  ctx.restore();

  // land body
  const g = ctx.createLinearGradient(0, MAPV.y, 0, MAPV.y+MAPV.h);
  g.addColorStop(0,   '#5c6f52');
  g.addColorStop(0.28,'#4a6b45');
  g.addColorStop(0.55,'#456b3f');
  g.addColorStop(0.82,'#4a6b45');
  g.addColorStop(1,   '#7f8f86');
  ctx.fillStyle = g;
  for (const poly of WORLD_LAND){ mapPath(ctx, poly); ctx.fill(); }

  // lakes & inland seas cut back out
  ctx.fillStyle = '#123a5e';
  for (const poly of WORLD_LAKES){ mapPath(ctx, poly); ctx.fill(); }
  ctx.strokeStyle = 'rgba(150,205,240,0.35)'; ctx.lineWidth = 1;
  for (const poly of WORLD_LAKES){ mapPath(ctx, poly); ctx.stroke(); }

  // coastline
  ctx.strokeStyle = 'rgba(196,226,178,0.75)';
  ctx.lineWidth = Math.min(2, 0.9 + cam.zoom*0.12);
  ctx.lineJoin = 'round';
  for (const poly of WORLD_LAND){ mapPath(ctx, poly); ctx.stroke(); }

  // polar ice, faked as a bright wash at the extremes
  const yN = projY(72), yS = projY(-62);
  if (yN > MAPV.y){
    const ig = ctx.createLinearGradient(0, MAPV.y, 0, yN);
    ig.addColorStop(0,'rgba(226,240,255,0.30)'); ig.addColorStop(1,'rgba(226,240,255,0)');
    ctx.fillStyle = ig; ctx.fillRect(MAPV.x, MAPV.y, MAPV.w, Math.min(yN,MAPV.y+MAPV.h)-MAPV.y);
  }
  if (yS < MAPV.y+MAPV.h){
    const ig = ctx.createLinearGradient(0, MAPV.y+MAPV.h, 0, yS);
    ig.addColorStop(0,'rgba(226,240,255,0.34)'); ig.addColorStop(1,'rgba(226,240,255,0)');
    ctx.fillStyle = ig;
    const top = Math.max(yS, MAPV.y);
    ctx.fillRect(MAPV.x, top, MAPV.w, MAPV.y+MAPV.h-top);
  }
}

function drawTerritory(n, hovered){
  const t = n.terr, cleared = nodeCleared(n), c = (n.mapColor || n.def.color);
  ensureTerritoryBuffers();

  // Paint the territory to a scratch layer first, then subtract all land that was
  // already claimed earlier in the draw order. This prevents ugly overlaps and
  // keeps one nation's claim from visibly sitting inside another one.
  terrPaintCtx.clearRect(0,0,W,H);
  terrPaintCtx.save();
  traceTerritoryPath(terrPaintCtx, t);
  const pulse = 0.5 + 0.5*Math.sin(bgT*2.4 + n.lon*0.05);
  terrPaintCtx.globalAlpha = hovered ? (0.34 + pulse*0.14) : (cleared ? 0.13 : 0.20);
  terrPaintCtx.fillStyle = cleared ? '#5c6b7d' : c;
  terrPaintCtx.fill();
  terrPaintCtx.restore();

  terrPaintCtx.save();
  terrPaintCtx.globalCompositeOperation = 'destination-out';
  terrPaintCtx.drawImage(terrMask, 0, 0);
  terrPaintCtx.restore();

  ctx.drawImage(terrPaint, 0, 0);

  // Update the occupied map mask with the full shape so later territories cannot
  // draw inside this one.
  terrMaskCtx.save();
  traceTerritoryPath(terrMaskCtx, t);
  terrMaskCtx.fillStyle = '#fff';
  terrMaskCtx.fill();
  terrMaskCtx.restore();

  // Every claim gets a visible border so the colored area reads clearly at a glance.
  // Hovered claims receive the brighter glow, while idle claims keep a thinner subtle outline.
  ctx.save();
  traceTerritoryPath(ctx, t);
  if (hovered){
    ctx.globalAlpha = 1;
    ctx.strokeStyle = c;
    ctx.lineWidth = 2.6;
    ctx.shadowColor = c;
    ctx.shadowBlur = 14;
  } else {
    ctx.globalAlpha = cleared ? 0.55 : 0.85;
    ctx.strokeStyle = cleared ? '#8d9aac' : c;
    ctx.lineWidth = 1.15;
    ctx.shadowBlur = 0;
  }
  ctx.stroke();
  ctx.restore();
}

/* a small animated campfire, floating over any territory the player has
   already conquered — a quick, readable "you burned this empire down" */
function drawMapFireIcon(x, y, scale){
  const flick = Math.sin(bgT*9)*0.5 + Math.sin(bgT*13.7)*0.3;
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(scale, scale);
  // soft glow behind the flame
  ctx.globalAlpha = 0.35 + 0.1*Math.sin(bgT*7);
  ctx.fillStyle = '#ff9a3a';
  ctx.beginPath(); ctx.arc(0, -2, 9 + flick*0.6, 0, 7); ctx.fill();
  ctx.globalAlpha = 1;
  // three licking flame layers, tallest at the back
  const layers = [
    { c:'#c9331e', w:7, h:14, off:0 },
    { c:'#f0762a', w:5.5, h:11, off:1.2 },
    { c:'#ffd35e', w:3.2, h:7, off:2.2 }
  ];
  for (const L of layers){
    const sway = Math.sin(bgT*6 + L.off)*1.4 + flick;
    ctx.fillStyle = L.c;
    ctx.beginPath();
    ctx.moveTo(sway, -L.h-4);
    ctx.quadraticCurveTo(sway+L.w*0.7, -L.h*0.4-4, sway+L.w*0.35, 2-4);
    ctx.quadraticCurveTo(sway, -L.h*0.15-4, sway-L.w*0.35, 2-4);
    ctx.quadraticCurveTo(sway-L.w*0.7, -L.h*0.4-4, sway, -L.h-4);
    ctx.closePath(); ctx.fill();
  }
  // a couple of drifting embers
  for (let i=0;i<2;i++){
    const et = (bgT*1.3 + i*1.7) % 1;
    ctx.globalAlpha = 1 - et;
    ctx.fillStyle = '#ffcf7a';
    ctx.fillRect(Math.sin(bgT*4+i*3)*4 - 1, -10 - et*14, 2, 2);
  }
  ctx.globalAlpha = 1;
  ctx.restore();
}

function drawBossHeadBadge(skin,x,y,size,col,cleared){
  const r=size*.52;
  ctx.save();
  ctx.beginPath(); ctx.arc(x,y,r,0,7); ctx.clip();
  ctx.fillStyle=cleared?'#27313d':'#0a1019'; ctx.fillRect(x-r,y-r,r*2,r*2);
  // drawPortrait's y is the bottom edge of the 8x8 head. Offset by half the
  // rendered head height so the face is perfectly centered in the badge.
  const ps=size/8;

  if(cleared){ctx.globalAlpha=.45;ctx.fillStyle='#071018';ctx.fillRect(x-r,y-r,r*2,r*2);}
  ctx.restore();
  ctx.strokeStyle=cleared?'#8c99a9':col; ctx.lineWidth=2;
  ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.stroke();
}
function drawPin(n, hovered){
  const m=territoryCenter(n), x=projX(m.lon), y=projY(m.lat);
  if (x < MAPV.x-40 || x > MAPV.x+MAPV.w+40 || y < MAPV.y-40 || y > MAPV.y+MAPV.h+40) return;
  const cleared = nodeCleared(n), c = cleared ? '#8894a8' : n.def.color;
  const pulse = 0.5 + 0.5*Math.sin(bgT*3 + n.index);
  const size=hovered?30:26;

  ctx.save();
  // A glowing locator ring remains behind the portrait so the marker still
  // reads clearly over similarly coloured claims at low zoom.
  if (!cleared){
    ctx.globalAlpha = 0.24 + pulse*0.28;
    ctx.strokeStyle = c; ctx.lineWidth = 1.5;
    const rr = size*.58 + pulse*5 + (hovered?4:0);
    ctx.beginPath(); ctx.arc(x, y, rr, 0, 7); ctx.stroke();
    ctx.globalAlpha = 1;
  }

  // Every claim now shows the boss's actual skin head instead of a generic
  // coloured banner. Borealia gets both rulers because it is a dual boss.
  if(n.key==='kinggaming'){
    drawBossHeadBadge('kinggaming',x-7,y,size*.82,c,cleared);
    drawBossHeadBadge('malshman',x+8,y+1,size*.82,'#c8ff9c',cleared);
  }else{
    drawBossHeadBadge(n.def.skin,x,y,size,c,cleared);
  }

  if (cleared) drawMapFireIcon(x, y-size*.78-12, .85);

  // Name plate: still available at useful zoom, but the portrait makes boss
  // location readable even without hovering over every territory.
  if (hovered || cam.zoom >= 2.2){
    const label = mapBossLabel(n);
    ctx.font = '700 11px "Pixelify Sans", Inter, Segoe UI, Arial';
    const tw = ctx.measureText(label).width;
    let lx = x + n.ldx, ly = y + n.ldy;
    if(n.key==='kinggaming'){ lx=x-tw/2; ly=y-34; }
    ctx.strokeStyle = 'rgba(232,226,208,0.45)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(x, y-8); ctx.lineTo(lx + (n.ldx<0 && n.key!=='kinggaming'? tw+10 : 0), ly+5); ctx.stroke();
    ctx.fillStyle = 'rgba(6,9,16,0.90)'; ctx.fillRect(lx-5, ly-9, tw+10, 17);
    ctx.strokeStyle = c; ctx.lineWidth = 1; ctx.strokeRect(lx-5.5, ly-9.5, tw+11, 18);
    ctx.fillStyle = cleared ? '#93a0b8' : '#f1f4fc';
    ctx.textAlign = 'left'; ctx.fillText(label, lx, ly+4);
  }
  ctx.restore();
  ctx.textAlign='left';
}

/* the panel that appears when a territory is under the cursor */
function drawMapCard(n){
  const pw = 296, ph = 152;
  let px = projX(n.lon) + 26, py = projY(n.lat) - ph/2;
  if (px + pw > W-12) px = projX(n.lon) - pw - 26;
  px = Math.max(10, Math.min(W-pw-10, px));
  py = Math.max(MAPV.y+8, Math.min(MAPV.y+MAPV.h-ph-8, py));
  mapUI.card = { x:px, y:py, w:pw, h:ph };
  const cleared = nodeCleared(n), c = n.def.color;

  ctx.save();
  ctx.fillStyle = 'rgba(6,9,17,0.95)'; ctx.fillRect(px, py, pw, ph);
  ctx.strokeStyle = c; ctx.lineWidth = 2; ctx.strokeRect(px+0.5, py+0.5, pw-1, ph-1);
  ctx.fillStyle = c; ctx.fillRect(px, py, pw, 3);

  drawSkin(n.def.skin, px+42, py+118, 1.7, { walk: Math.sin(bgT*3)*0.55, facing:1 });

  ctx.textAlign = 'left';
  ctx.fillStyle = c; ctx.font = '900 14px "Pixelify Sans", Inter, Segoe UI, Arial';
  ctx.fillText(n.region, px+80, py+26);
  ctx.fillStyle = '#f1f4fc'; ctx.font = '800 15px "Pixelify Sans", Inter, Segoe UI, Arial';
  ctx.fillText(n.key==='kinggaming' ? 'KingGaming & MalshMan' : n.def.name, px+80, py+46);
  ctx.fillStyle = '#8b96b4'; ctx.font = '600 10px "Pixelify Sans", Inter, Segoe UI, Arial';
  ctx.fillText(n.def.levelName.toUpperCase() + ' \u00b7 ' + n.sub, px+80, py+62);

  ctx.fillStyle = '#a9b4cc'; ctx.font = '600 10px "Pixelify Sans", Inter, Segoe UI, Arial';
  wrapText(n.blurb, px+80, py+80, pw-92, 13);

  const threat = Math.max(1, Math.min(5, Math.round(n.def.hp/150)));
  ctx.fillStyle = '#f1d27a'; ctx.font = '700 10px "Pixelify Sans", Inter, Segoe UI, Arial';
  ctx.fillText('THREAT ' + '\u25c6'.repeat(threat) + '\u25c7'.repeat(5-threat) + '    ' + n.def.hp + ' HP',
               px+14, py+ph-24);
  if (cleared){
    ctx.fillStyle = '#78d69a'; ctx.font = '800 11px "Pixelify Sans", Inter, Segoe UI, Arial';
    ctx.fillText('TERRITORY TAKEN \u00b7 CLICK TO REMATCH', px+14, py+ph-9);
  } else {
    ctx.globalAlpha = 0.6 + 0.4*Math.sin(bgT*5);
    ctx.fillStyle = '#ffd58a'; ctx.font = '800 11px "Pixelify Sans", Inter, Segoe UI, Arial';
    ctx.fillText('CLICK TO INVADE', px+14, py+ph-9);
    ctx.globalAlpha = 1;
  }
  ctx.restore();
  ctx.textAlign = 'left';
}

const MAP_SHOP_BTN = { x: Math.round(W*0.34), y: 6, w: 230, h: 40 };

/* the EPMC seal — a small round earth (blue ocean, a couple of green
   landmasses, a highlight) with "EPMC" set beside it. Used next to the
   game's wordmark wherever it appears, at whatever radius fits. */
function drawEPMCLogo(x, y, r){
  ctx.save();
  ctx.translate(x, y);
  // ocean
  const oceanG = ctx.createRadialGradient(-r*0.3,-r*0.3,r*0.1, 0,0,r);
  oceanG.addColorStop(0,'#5aa8e0'); oceanG.addColorStop(1,'#1c4f86');
  ctx.fillStyle = oceanG;
  ctx.beginPath(); ctx.arc(0,0,r,0,7); ctx.fill();
  // a couple of simple landmasses
  ctx.fillStyle = '#4f9a52';
  ctx.beginPath();
  ctx.ellipse(-r*0.28,-r*0.15,r*0.42,r*0.3,-0.3,0,7); ctx.fill();
  ctx.beginPath();
  ctx.ellipse(r*0.35,r*0.32,r*0.3,r*0.22,0.4,0,7); ctx.fill();
  ctx.fillStyle = '#3f7f44';
  ctx.beginPath(); ctx.ellipse(-r*0.1,r*0.05,r*0.18,r*0.14,0.1,0,7); ctx.fill();
  // rim light + outline
  ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = Math.max(1, r*0.08);
  ctx.beginPath(); ctx.arc(0,0,r-ctx.lineWidth/2,0,7); ctx.stroke();
  ctx.strokeStyle = 'rgba(6,10,18,0.6)'; ctx.lineWidth = Math.max(1, r*0.12);
  ctx.beginPath(); ctx.arc(0,0,r,-2.4,-0.6); ctx.stroke();
  // soft specular highlight
  ctx.fillStyle = 'rgba(255,255,255,0.25)';
  ctx.beginPath(); ctx.ellipse(-r*0.32,-r*0.35,r*0.22,r*0.14,-0.4,0,7); ctx.fill();
  ctx.restore();

  ctx.save();
  ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
  ctx.font = '800 ' + Math.round(r*0.95) + 'px "Pixelify Sans", Inter, Segoe UI, Arial';
  ctx.fillStyle = 'rgba(0,0,0,0.55)';
  ctx.fillText('EPMC', x+r*1.5+1, y+1);
  ctx.fillStyle = '#cdd6ea';
  ctx.fillText('EPMC', x+r*1.5, y);
  ctx.restore();
}

function drawRoster(){
  const viewW = rosterViewportW();
  const cardW = ROSTER_CARD_W, gap = ROSTER_CARD_GAP;
  const totalW = LORE_ORDER.length * (cardW + gap) - gap;
  rosterUI.max = Math.max(0, totalW - viewW);
  rosterUI.target = Math.max(0, Math.min(rosterUI.max, rosterUI.target));
  rosterUI.scroll += (rosterUI.target - rosterUI.scroll) * 0.28;
  if (Math.abs(rosterUI.target - rosterUI.scroll) < 0.35) rosterUI.scroll = rosterUI.target;

  ctx.fillStyle = '#0a0e18'; ctx.fillRect(0, MAPV.y+MAPV.h, W, H-(MAPV.y+MAPV.h));
  ctx.fillStyle = '#2b3450'; ctx.fillRect(0, MAPV.y+MAPV.h, W, 2);

  // viewport clip so extra cards can live off-screen and be scrolled into view
  ctx.save();
  ctx.beginPath(); ctx.rect(ROSTER_X, ROSTER_Y, viewW, ROSTER_H); ctx.clip();
  ctx.textAlign = 'center';
  for (let i=0;i<LORE_ORDER.length;i++){
    const key = LORE_ORDER[i], e = LORE_ENTRIES[key];
    if (!e) continue;
    const x = ROSTER_X + i*(cardW+gap) - rosterUI.scroll, y = ROSTER_Y;
    if (x + cardW < ROSTER_X-2 || x > ROSTER_X + viewW + 2) continue;
    const hot = mapUI.hoverChip === i;
    ctx.fillStyle = hot ? 'rgba(18,29,48,0.98)' : 'rgba(8,13,24,0.95)';
    ctx.fillRect(x, y, cardW, ROSTER_H);
    ctx.strokeStyle = hot ? e.color : '#2b3450';
    ctx.lineWidth = hot ? 2 : 1;
    ctx.strokeRect(x+0.5, y+0.5, cardW-1, ROSTER_H-1);
    ctx.fillStyle = e.color; ctx.fillRect(x, y, 4, ROSTER_H);
    const headSize = 30;
    const hx = x + (cardW - headSize)/2;
    const hy = y + 5;
    ctx.save();
    ctx.fillStyle = '#0b1019'; ctx.fillRect(hx-1, hy-1, headSize+2, headSize+2);
    ctx.strokeStyle = hot ? e.color : '#506286'; ctx.lineWidth = 1.5;
    ctx.strokeRect(hx-1, hy-1, headSize+2, headSize+2);
    ctx.beginPath(); ctx.rect(hx, hy, headSize, headSize); ctx.clip();
    drawPortrait(e.skin, hx + headSize/2, hy + headSize, headSize/8);
    ctx.restore();
    ctx.fillStyle = '#eef2fb';
    ctx.font = '900 8px "Pixelify Sans", Inter, Segoe UI, Arial';
    let name = (e.name || key).toUpperCase();
    if (name.length > 13) name = name.slice(0,13);
    ctx.fillText(name, x + cardW/2, y + 50);
    ctx.fillStyle = '#f2d889';
    ctx.font = '900 7px "Pixelify Sans", Inter, Segoe UI, Arial';
    ctx.fillText('WIKI', x + cardW/2, y + 60);
  }
  ctx.restore();

  // edge fades and explicit scroll hint so players know there is more roster to the right
  if (rosterUI.max > 1){
    const lg = ctx.createLinearGradient(ROSTER_X,0,ROSTER_X+24,0);
    lg.addColorStop(0,'rgba(10,14,24,1)'); lg.addColorStop(1,'rgba(10,14,24,0)');
    ctx.fillStyle = lg; ctx.fillRect(ROSTER_X, ROSTER_Y, 24, ROSTER_H);
    const rg = ctx.createLinearGradient(W-ROSTER_X-24,0,W-ROSTER_X,0);
    rg.addColorStop(0,'rgba(10,14,24,0)'); rg.addColorStop(1,'rgba(10,14,24,1)');
    ctx.fillStyle = rg; ctx.fillRect(W-ROSTER_X-24, ROSTER_Y, 24, ROSTER_H);

    ctx.save();
    ctx.textAlign = 'right';
    ctx.font = '900 8px "Pixelify Sans", Inter, Segoe UI, Arial';
    ctx.fillStyle = '#8f9cba';
    const hint = 'MORE WIKI HEADS → DRAG / WHEEL';
    ctx.fillText(hint, W-ROSTER_X-6, ROSTER_Y+10);
    ctx.textAlign = 'left';
    if (rosterUI.scroll > 2){ ctx.fillStyle = '#d7e7ff'; ctx.fillText('←', ROSTER_X+6, ROSTER_Y+10); }
    if (rosterUI.scroll < rosterUI.max-2){ ctx.textAlign='right'; ctx.fillText('→', W-ROSTER_X-6, ROSTER_Y+10); }
    ctx.restore();
  }
}


function drawMapScreen(){
  // deep ocean
  ctx.fillStyle = '#050810'; ctx.fillRect(0,0,W,H);
  ctx.save();
  ctx.beginPath(); ctx.rect(MAPV.x, MAPV.y, MAPV.w, MAPV.h); ctx.clip();
  const oc = ctx.createLinearGradient(0, MAPV.y, 0, MAPV.y+MAPV.h);
  oc.addColorStop(0,   '#0b2440');
  oc.addColorStop(0.45,'#143a60');
  oc.addColorStop(0.75,'#123a5e');
  oc.addColorStop(1,   '#0b2440');
  ctx.fillStyle = oc; ctx.fillRect(MAPV.x, MAPV.y, MAPV.w, MAPV.h);

  drawGraticule();
  drawWorldLand();

  // The non-overlap claim mask is frame-local. If it is not cleared here,
  // yesterday's/frame's occupied pixels erase every claim on the next redraw.
  resetTerritoryBuffers();
  for (const n of MAP_NODES) drawTerritory(n, mapUI.hover === n);
  for (const n of MAP_NODES) if (mapUI.hover !== n) drawPin(n, false);
  if (mapUI.hover) drawPin(mapUI.hover, true);

  // scanline sweep, purely for flavour
  const sw = ((bgT*70) % (MAPV.w + 300)) - 150;
  const sg = ctx.createLinearGradient(sw-90, 0, sw+90, 0);
  sg.addColorStop(0,'rgba(140,220,255,0)');
  sg.addColorStop(0.5,'rgba(140,220,255,0.045)');
  sg.addColorStop(1,'rgba(140,220,255,0)');
  ctx.fillStyle = sg; ctx.fillRect(MAPV.x, MAPV.y, MAPV.w, MAPV.h);

  if (mapUI.hover) drawMapCard(mapUI.hover); else mapUI.card = null;
  ctx.restore();

  drawLoreRail();
  drawMapHeader();
  drawRoster();

  // zoom readout + controls hint
  ctx.save();
  ctx.textAlign = 'left';
  ctx.font = '600 9px "Pixelify Sans", Inter, Segoe UI, Arial';
  ctx.fillStyle = 'rgba(8,12,20,0.75)'; ctx.fillRect(MAPV.x+8, MAPV.y+MAPV.h-22, 236, 15);
  ctx.fillStyle = '#8f9cba';
  ctx.fillText(mapUI.touch
    ? 'TAP a territory to select \u00b7 TAP again to invade \u00b7 DRAG to pan'
    : 'HOVER a territory \u00b7 CLICK to fight \u00b7 DRAG pan \u00b7 WHEEL zoom', MAPV.x+13, MAPV.y+MAPV.h-11);
  ctx.textAlign = 'right';
  ctx.fillStyle = 'rgba(8,12,20,0.75)'; ctx.fillRect(W-96, MAPV.y+MAPV.h-22, 88, 15);
  ctx.fillStyle = '#8f9cba';
  ctx.fillText('ZOOM \u00d7' + cam.zoom.toFixed(1) + '  [R reset]', W-12, MAPV.y+MAPV.h-11);
  ctx.textAlign = 'left';
  ctx.restore();

  if (allCleared()){
    ctx.fillStyle = 'rgba(6,20,12,0.55)'; ctx.fillRect(0, MAPV.y, W, 28);
    ctx.globalAlpha = 0.6+0.4*Math.sin(bgT*4);
    ctext('THE WHOLE MAP IS YOURS \u2014 PRESS ENTER FOR THE ENDING', MAPV.y+19, 14, '#9effb8');
    ctx.globalAlpha = 1;
  }
}

/* ------------------------------------------------------------- input */
function mapPointerDown(x, y){
  mapUI.dragging = true; mapUI.dragged = 0; mapUI.px = x; mapUI.py = y;
  // a gesture that starts on the lore rail belongs to the rail for its whole
  // life, so dragging a portrait list never drags the world underneath it
  if (inLoreRail(x, y)){
    loreUI.grab = true; loreUI.gy = y; loreUI.gmoved = 0;
    loreUI.target = loreUI.scroll;
    rosterUI.grab = false;
    return;
  } else loreUI.grab = false;
  if (inRoster(x, y)){
    rosterUI.grab = true; rosterUI.gx = x; rosterUI.gmoved = 0;
    rosterUI.target = rosterUI.scroll;
    mapUI.dragging = false;
    return;
  } else rosterUI.grab = false;
}
function mapPointerMove(x, y, isMouse){
  if (isMouse) mapUI.touch = false;

  if (loreUI.grab){
    const dy = y - loreUI.gy;
    loreUI.gmoved += Math.abs(dy);
    loreUI.target = Math.max(0, Math.min(loreUI.max, loreUI.target - dy));
    loreUI.scroll = loreUI.target;          // dragging tracks the finger exactly
    loreUI.gy = y;
    mapUI.px = x; mapUI.py = y;
    loreUI.hover = loreKeyAt(x, y);
    return;
  }
  if (rosterUI.grab){
    const dx = x - rosterUI.gx;
    rosterUI.gmoved += Math.abs(dx);
    rosterUI.target = Math.max(0, Math.min(rosterUI.max, rosterUI.target - dx));
    rosterUI.scroll = rosterUI.target;
    rosterUI.gx = x;
    mapUI.hoverChip = rosterIndexAt(x, y);
    return;
  }
  loreUI.hover = inLoreRail(x, y) ? loreKeyAt(x, y) : null;
  if (inLoreRail(x, y)){
    // the rail sits beside the map, not on it: nothing under it is hoverable
    mapUI.hoverShop = false; mapUI.hoverChip = -1;
    if (mapUI.dragging){ mapUI.px = x; mapUI.py = y; }
    return;
  }
  if (inRoster(x, y)){
    mapUI.hoverShop = false;
    mapUI.hoverChip = rosterIndexAt(x, y);
    mapUI.hover = null;
    return;
  }

  if (mapUI.dragging){
    const dx = x - mapUI.px, dy = y - mapUI.py;
    mapUI.dragged += Math.abs(dx) + Math.abs(dy);
    if (mapUI.py > MAPV.y && mapUI.py < MAPV.y+MAPV.h && mapUI.px > MAPV.x){
      const p = mapPPD();
      cam.lon -= dx/p; cam.lat += dy/p;
      mapClampCam();
      cam.tlon = cam.lon; cam.tlat = cam.lat;
    }
    mapUI.px = x; mapUI.py = y;
  }
  mapUI.hoverShop = x>=MAP_SHOP_BTN.x && x<=MAP_SHOP_BTN.x+MAP_SHOP_BTN.w &&
                    y>=MAP_SHOP_BTN.y && y<=MAP_SHOP_BTN.y+MAP_SHOP_BTN.h;
  mapUI.hoverChip = rosterIndexAt(x, y);
  if (mapUI.hoverChip >= 0){
    mapUI.hover = null;
  } else if (mapUI.hover && inCard(x, y)){
    // the panel sits on top of the map; whatever is underneath it is not
    // what the player is pointing at
  } else {
    const n = nodeAt(x, y);
    mapUI.hover = n;
    if (n) mapUI.sel = MAP_NODES.indexOf(n);
  }
}
function rosterIndexAt(x, y){
  if (!inRoster(x, y)) return -1;
  const cardW = ROSTER_CARD_W, gap = ROSTER_CARD_GAP;
  for (let i=0;i<LORE_ORDER.length;i++){
    const cx = ROSTER_X + i*(cardW+gap) - rosterUI.scroll;
    if (x >= cx && x <= cx+cardW) return i;
  }
  return -1;
}
function mapPointerUp(x, y){
  const wasDrag = mapUI.dragged > 6;
  mapUI.dragging = false;

  if (loreUI.grab){
    const flicked = loreUI.gmoved > 6;
    loreUI.grab = false;
    if (flicked) return;
    const hb = loreUI.headRect;
    if (x >= hb.x && x <= hb.x+hb.w && y >= hb.y && y <= hb.y+hb.h){
      Music.sfx('coin'); openWikiArticle(null, 'map'); return;
    }
    const key = loreKeyAt(x, y);
    if (key){ Music.sfx('coin'); openWikiArticle(key, 'rail'); }
    return;
  }
  if (rosterUI.grab){
    const flicked = rosterUI.gmoved > 6;
    rosterUI.grab = false;
    if (flicked) return;
    const ri = rosterIndexAt(x, y);
    if (ri >= 0){
      const key = LORE_ORDER[ri];
      if (key){ Music.sfx('coin'); openWikiArticle(key, 'map'); }
    }
    return;
  }
  if (inLoreRail(x, y)) return;

  if (wasDrag) return;

  if (mapUI.hoverShop){ Music.sfx('coin'); state = 'shop'; return; }

  const ri = rosterIndexAt(x, y);
  if (ri >= 0){
    const key = LORE_ORDER[ri];
    if (key){ Music.sfx('coin'); openWikiArticle(key, 'map'); }
    return;
  }

  // clicking anywhere on the open info panel commits to that fight
  if (mapUI.hover && inCard(x, y)){ launchNode(mapUI.hover); return; }

  const n = nodeAt(x, y);
  if (!n) return;
  if (mapUI.touch && mapUI.armed !== n){
    // on a touchscreen there is no hover, so the first tap only selects
    mapUI.armed = n; mapUI.hover = n; mapUI.sel = MAP_NODES.indexOf(n);
    mapFlyTo(n.lon, n.lat, Math.max(cam.zoom, 3.0));
    Music.sfx('coin');
    return;
  }
  launchNode(n);
}
function launchNode(n){
  mapUI.armed = null; mapUI.card = null;
  Music.sfx('win');
  startWave(n.index);
}
function mapWheel(ev){
  const p = canvasPos(ev);
  if (inLoreRail(p.x, p.y)){ loreScrollBy(ev.deltaY > 0 ? 64 : -64); return; }
  if (inRoster(p.x, p.y)){ rosterScrollBy(ev.deltaY > 0 ? 80 : -80); return; }
  mapZoomAt(p.x, p.y, ev.deltaY < 0 ? 1.25 : 0.8);
}
function mapKeys(){
  if (pressed('KeyR')){ cam.tlon = 0; cam.tlat = 0; cam.tzoom = 1; }
  if (pressed('Equal') || pressed('NumpadAdd')) mapZoomAt(W/2, MAPV.y+MAPV.h/2, 1.3);
  if (pressed('Minus') || pressed('NumpadSubtract')) mapZoomAt(W/2, MAPV.y+MAPV.h/2, 0.77);
  let moved = false;
  if (pressed('ArrowRight') || pressed('Tab')){ mapUI.sel = (mapUI.sel+1) % MAP_NODES.length; moved = true; }
  if (pressed('ArrowLeft')){ mapUI.sel = (mapUI.sel+MAP_NODES.length-1) % MAP_NODES.length; moved = true; }
  for (let i=0;i<MAP_NODES.length;i++){
    // real keyboards only have Digit1..Digit9 and Digit0, so the 10th
    // territory (index 9) rides on the 0 key instead of a nonexistent Digit10
    const key = i < 9 ? 'Digit'+(i+1) : 'Digit0';
    if (pressed(key)){ mapUI.sel = i; moved = true; }
  }
  if (moved){
    const n = MAP_NODES[mapUI.sel];
    mapUI.hover = n;
    mapFlyTo(n.lon, n.lat, Math.max(cam.zoom, 3.0));
    Music.sfx('coin');
  }
  // WASD nudges the camera too, so the map feels like the rest of the game
  const p = mapPPD(), sp = 260/p;
  if (keys['KeyA']) { cam.tlon -= sp*0.03; }
  if (keys['KeyD']) { cam.tlon += sp*0.03; }
  if (keys['KeyW']) { cam.tlat += sp*0.03; }
  if (keys['KeyS']) { cam.tlat -= sp*0.03; }
}

/* ------------------------------------------- entering & leaving fights */
function openMap(focusKey){
  state = 'map';
  CustomAudio.stop();
  cutscene = null;
  boss = null; sidekick = null;
  enemies = []; shots = []; hazards = []; carts = []; parts = []; nums = []; drops = [];
  shipBattle = false; playerShip = null; bossShip = null;
  Dialogue.clear();
  paused = false;
  mapUI.dragging = false; mapUI.dragged = 0;
  mapUI.armed = null; mapUI.card = null; mapUI.hover = null;
  loreUI.grab = false; loreUI.hover = null;
  if (focusKey){
    const n = MAP_NODES.find(m => m.key === focusKey);
    if (n){ mapUI.sel = MAP_NODES.indexOf(n); mapFlyTo(n.lon, n.lat, Math.max(2.6, cam.zoom)); }
  }
  Music.play('title');
}

/* called the instant a warlord goes down, from either death branch */
function onBossDefeated(){
  const k = WAVES[waveIndex].key;
  defeated.add(k); refreshMissionThreat();
  player.hp = Math.min(player.maxHp, player.hp + 30);
  player.apples = 3;
  bannerT = 0;
  if (allCleared()){ state = 'victory'; Music.play('victory'); }
  else state = 'cleared';
}

let loreBtnRect  = { x:0, y:0, w:0, h:0 };      // title-screen button hitbox
let wikiBackRect = { x:0, y:0, w:0, h:0 };      // in-wiki back-button hitbox
let fightBtnRect = null;                        // "FIGTH HIM" button, article screen only
