<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Earthpol Legends — Oxbit Boss Encounter Preview</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02060a;font-family:Segoe UI,Arial,sans-serif}.card{position:relative;width:100vw;height:100vh;overflow:hidden;background:#02060a}.game{position:absolute;inset:0;width:100%;height:100%;border:0}.shade{position:absolute;left:0;right:0;bottom:0;height:33%;background:linear-gradient(180deg,transparent 0%,rgba(0,0,0,.82) 38%,rgba(0,0,0,.96) 100%);pointer-events:none}.copy{position:absolute;left:5.2%;right:4%;bottom:5.5%;color:#fff;text-shadow:0 2px 12px #000}.title{font-weight:900;font-size:clamp(28px,4.2vw,56px);letter-spacing:.7px;line-height:1.02}.sub{margin-top:12px;font-size:clamp(20px,2.4vw,34px);font-weight:700}.sub .green{color:#64ef82}.swords{color:#64ef82;margin-right:10px}
</style>
</head>
<body>
<div class="card">
  <iframe id="game" class="game" src="/game.html?fight=oxbit&embed=1" scrolling="no" tabindex="-1"></iframe>
  <div class="shade"></div>
  <div class="copy"><div class="title">EARTHPOL LEGENDS — OXBIT BOSS ENCOUNTER</div><div class="sub"><span class="swords">⚔</span><span class="green">Click to fight Oxbit</span> — The Server Master</div></div>
</div>
<script>
const f=document.getElementById('game');
function startPreview(){
  try{
    const d=f.contentDocument;
    const b=d&&d.querySelector('#ep-wiki-launch button');
    if(b) b.click();
  }catch(e){}
}
f.addEventListener('load',()=>{setTimeout(startPreview,250);setTimeout(startPreview,900);});
</script>
</body>
</html>
