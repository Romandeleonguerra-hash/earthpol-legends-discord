<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Earthpol Legends — Oxbit Boss Encounter</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;background:#05070b;overflow:hidden;color:#eef;font-family:Arial,sans-serif}
body{display:grid;place-items:center;background:radial-gradient(circle at 50% 0,#162231 0,#05070b 70%)}
#wrap{width:100vw;height:100vh;display:grid;place-items:center}
canvas{display:block;max-width:100vw;max-height:100vh;width:100%;height:100%;object-fit:contain;image-rendering:pixelated;background:#071018}
#start{position:fixed;inset:0;display:grid;place-items:center;background:rgba(2,5,8,.94);z-index:5}
#card{width:min(560px,90vw);padding:26px 28px;border:1px solid #2fbf3f;border-radius:12px;background:linear-gradient(145deg,#0d1615,#070c0d);box-shadow:0 25px 80px #000;text-align:center}
#card .tiny{font-size:11px;letter-spacing:2px;color:#72e982}
#card h1{margin:8px 0 4px;font-size:34px;color:#b9ffc3}
#card p{color:#a7b5b0;line-height:1.5;font-size:13px}
button{border:1px solid #5be36c;background:#153d1b;color:#dfffe3;border-radius:7px;padding:12px 22px;font-weight:800;cursor:pointer}
button:hover{filter:brightness(1.2)}
</style>
</head>
<body>
<div id="wrap"><canvas id="c" width="960" height="540"></canvas></div>
<div id="start"><div id="card"><div class="tiny">EARTHPOL LEGENDS · WIKI BOSS ENCOUNTER</div><h1>OXBIT</h1><p>The Server Master. He wrote the rules, spawned the city, and thinks admin commands make him untouchable.</p><button id="go">ENTER BOSS FIGHT</button><p style="margin-top:12px;font-size:11px">WASD move · Shift sprint · Space roll · LMB sword · RMB bow · F guard</p></div></div>
<script>
"use strict";
const C=document.getElementById('c'),X=C.getContext('2d'),W=960,H=540;
let t=0,last=performance.now(),shake=0,flash=0,state='intro',introT=0,phase=1,dead=false,win=false;
const K={},M={x:480,y:350,l:false,r:false};
addEventListener('keydown',e=>{K[e.code]=true;if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code))e.preventDefault()});
addEventListener('keyup',e=>K[e.code]=false);
C.onmousemove=e=>{let r=C.getBoundingClientRect();M.x=(e.clientX-r.left)*W/r.width;M.y=(e.clientY-r.top)*H/r.height};
C.onmousedown=e=>{if(e.button===0)M.l=true;if(e.button===2)M.r=true};
addEventListener('mouseup',e=>{if(e.button===0)M.l=false;if(e.button===2)M.r=false});
C.oncontextmenu=e=>e.preventDefault();
const R=(a,b)=>a+Math.random()*(b-a), clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
function hit(a,b,r){return Math.hypot(a.x-b.x,(a.y-b.y)*1.15)<r}
const p={x:480,y:450,r:15,hp:200,max:200,st:100,roll:0,inv:0,swing:0,bow:0,guard:false,cd:0,facing:1};
const b={x:480,y:230,r:20,hp:650,max:650,cd1:2,cd2:4,cd3:5,cd4:8,hammer:null,shield:0,authority:100,stun:0};
let shots=[],alts=[],haz=[],parts=[],texts=[],lines=[];
function say(name,text,c='#fff'){lines.push({name,text,c,t:4.8});if(lines.length>2)lines.shift()}
function puff(x,y,c,n=12,sp=100){for(let i=0;i<n;i++){let a=R(0,Math.PI*2),v=R(sp*.3,sp);parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:R(.25,.7),c,s:R(2,5)})}}
function txt(x,y,s,c='#fff'){texts.push({x,y,s,c,life:.8})}
let AC=null;
function beep(type='hit'){if(!AC)return;let o=AC.createOscillator(),g=AC.createGain(),now=AC.currentTime;const map={hit:[120,.07],slash:[220,.05],laser:[520,.08],boom:[65,.2],roll:[180,.08],hurt:[90,.12],bow:[360,.06],phase:[45,.55]};let [f,d]=map[type]||map.hit;o.type=type==='laser'?'square':'sawtooth';o.frequency.setValueAtTime(f,now);o.frequency.exponentialRampToValueAtTime(Math.max(40,f*.55),now+d);g.gain.setValueAtTime(.08,now);g.gain.exponentialRampToValueAtTime(.001,now+d);o.connect(g).connect(AC.destination);o.start();o.stop(now+d)}
let hum=null;
function music(){if(!AC||hum)return;let o=AC.createOscillator(),g=AC.createGain();o.type='square';o.frequency.value=55;g.gain.value=.014;o.connect(g).connect(AC.destination);o.start();hum={o,g}}
document.getElementById('go').onclick=()=>{document.getElementById('start').style.display='none';AC=new (window.AudioContext||window.webkitAudioContext)();music();state='play';say('Oxbit','Spawned this city on a Tuesday. One command. Bad mood.','#9dffb0');setTimeout(()=>say('Oxbit','You cannot beat the person who wrote the rules.','#9dffb0'),1900)};
function hurtP(d,force=false){if(p.inv>0&&!force)return;if(p.guard&&!force){d*=.25;p.st=Math.max(0,p.st-18);beep('hit')}p.hp-=d;p.inv=.45;shake=9;flash=.18;beep('hurt');puff(p.x,p.y,'#e55',12,130);txt(p.x,p.y-25,'-'+Math.round(d),'#ff8d8d');if(p.hp<=0){p.hp=0;dead=true;say('SYSTEM','PLAYER DEFEATED','#ff7474')}}
function hurtB(d){if(b.stun>0)d*=1.25;if(b.shield>0){d*=.22;txt(b.x,b.y-35,'PERMISSION SHIELD','#92ffa0')}b.hp-=d;b.authority=Math.max(0,b.authority-d*.55);shake=5;beep('hit');puff(b.x,b.y,'#64e26e',8,90);txt(b.x,b.y-25,'-'+Math.round(d),'#d9ffdd');if(b.hp<=0&&!win){b.hp=0;win=true;say('Oxbit','...the server is still mine.','#9dffb0');puff(b.x,b.y,'#9dffb0',50,260);beep('phase')}}
function spawnAlt(){alts.push({x:R(90,870),y:R(285,455),hp:45,cd:R(.5,1.2),r:13})}
function laser(x,y,tx,ty,n=1,spread=.12){let a=Math.atan2(ty-y,tx-x);for(let i=0;i<n;i++){let aa=a+(i-(n-1)/2)*spread;shots.push({x,y,vx:Math.cos(aa)*260,vy:Math.sin(aa)*260,d:13,r:5,life:3,c:'#4cff66'})}beep('laser')}
function command(s){say('[ROOT / SERVER]',s,'#6dff83')}
function worldedit(){command('//set barrier');for(let i=0;i<3;i++)haz.push({kind:'zone',x:R(120,840),y:R(320,445),r:R(42,68),t:1.5,max:1.5,d:20})}
function adminHammer(){b.hammer={x:p.x,y:p.y,t:2.35,max:2.35,r:72};command('/execute at Player run admin_trace');say('Oxbit','ADMIN TRACE HAMMER. Move or get erased.','#9dffb0');beep('phase')}
function update(dt){if(state!=='play'||dead||win){for(let q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.life-=dt}return}t+=dt;p.inv=Math.max(0,p.inv-dt);p.swing=Math.max(0,p.swing-dt);p.roll=Math.max(0,p.roll-dt);p.cd=Math.max(0,p.cd-dt);b.stun=Math.max(0,b.stun-dt);let dx=(K.KeyD?1:0)-(K.KeyA?1:0),dy=(K.KeyS?1:0)-(K.KeyW?1:0),len=Math.hypot(dx,dy)||1,sp=(K.ShiftLeft||K.ShiftRight)?220:150;if(p.roll>0)sp=330;p.x=clamp(p.x+dx/len*sp*dt,35,925);p.y=clamp(p.y+dy/len*sp*.78*dt,285,472);p.facing=M.x<p.x?-1:1;if(K.Space&&p.roll<=0&&p.st>=28){p.roll=.33;p.inv=.33;p.st-=28;beep('roll');puff(p.x,p.y,'#74b9ff',8,80)}p.guard=!!K.KeyF&&p.st>0;p.st=clamp(p.st+(p.guard?-18:24)*dt,0,100);if(M.l&&p.cd<=0){p.cd=.29;p.swing=.16;let a=Math.atan2(M.y-p.y,M.x-p.x),hx=p.x+Math.cos(a)*50,hy=p.y+Math.sin(a)*38;if(Math.hypot(b.x-hx,(b.y-hy)*1.2)<62)hurtB(22);for(let e of alts)if(Math.hypot(e.x-hx,e.y-hy)<48)e.hp-=28;beep('slash')}if(M.r&&p.cd<=0){p.cd=.5;let a=Math.atan2(M.y-p.y,M.x-p.x);shots.push({x:p.x,y:p.y-10,vx:Math.cos(a)*370,vy:Math.sin(a)*370,d:15,r:4,life:2,c:'#ffe18a',own:'p'});beep('bow')}if(b.hp<b.max*.45&&phase===1){phase=2;b.shield=0;command('/gamemode creative');say('Oxbit','Creative mode. Effective now.','#9dffb0');beep('phase');shake=16}if(phase===1){b.cd1-=dt;b.cd2-=dt;b.cd3-=dt;b.cd4-=dt;let a=Math.atan2(p.y-b.y,p.x-b.x),d=Math.hypot(p.x-b.x,p.y-b.y);let want=d<180?-1:d>290?1:.15;b.x=clamp(b.x+Math.cos(a)*70*want*dt,60,900);b.y=clamp(b.y+Math.sin(a)*55*want*dt,190,330);if(b.cd1<=0){b.cd1=3.5;command('/tp Oxbit');puff(b.x,b.y,'#9dffb0',18,150);b.x=R(100,860);b.y=R(190,300);puff(b.x,b.y,'#2fbf3f',18,150)}if(b.cd2<=0){b.cd2=6;spawnAlt();command('/summon alt_account')}if(b.cd3<=0){b.cd3=4.2;laser(b.x,b.y,p.x,p.y,3,.13)}if(b.cd4<=0){b.cd4=8;worldedit()}b.shield=b.hp<b.max*.62?1:0}else{b.cd1-=dt;b.cd2-=dt;b.cd3-=dt;b.cd4-=dt;b.y=220+Math.sin(t*2.2)*12;if(b.cd1<=0){b.cd1=1.05;laser(b.x,b.y,p.x,p.y,4,.11)}if(b.cd2<=0){b.cd2=3.1;spawnAlt();spawnAlt();command('/summon alt_account')}if(b.cd3<=0&&!b.hammer){b.cd3=8.7;adminHammer()}if(b.cd4<=0){b.cd4=7.5;worldedit()}}if(b.hammer){b.hammer.t-=dt;if(b.hammer.t<=0){if(Math.hypot(p.x-b.hammer.x,(p.y-b.hammer.y)*1.15)<b.hammer.r)hurtP(999,true);puff(b.hammer.x,b.hammer.y,'#9dffb0',40,260);shake=22;flash=.55;beep('boom');b.hammer=null}}for(let e of alts){e.cd-=dt;let a=Math.atan2(p.y-e.y,p.x-e.x);e.x+=Math.cos(a)*65*dt;e.y+=Math.sin(a)*50*dt;if(e.cd<=0){e.cd=1.4;laser(e.x,e.y,p.x,p.y,1)}if(hit(e,p,26))hurtP(8)}alts=alts.filter(e=>e.hp>0);for(let z of haz){z.t-=dt;if(z.t<=0){if(Math.hypot(p.x-z.x,p.y-z.y)<z.r)hurtP(z.d);puff(z.x,z.y,'#55ff75',22,180);z.t=999}}haz=haz.filter(z=>z.t<900);for(let s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(s.own==='p'){if(hit(s,b,b.r+s.r)){hurtB(s.d);s.life=0}}else if(hit(s,p,p.r+s.r)){hurtP(s.d);s.life=0}}shots=shots.filter(s=>s.life>0&&s.x>-30&&s.x<W+30&&s.y>-30&&s.y<H+30);for(let q of parts){q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=80*dt;q.life-=dt}parts=parts.filter(q=>q.life>0);for(let q of texts){q.y-=25*dt;q.life-=dt}texts=texts.filter(q=>q.life>0);for(let q of lines)q.t-=dt;lines=lines.filter(q=>q.t>0)}
function rect(x,y,w,h,c){X.fillStyle=c;X.fillRect(x,y,w,h)}
function city(){let g=X.createLinearGradient(0,80,0,360);g.addColorStop(0,'#26354b');g.addColorStop(1,'#101925');rect(0,0,W,H,g);X.fillStyle='#8795aa';X.beginPath();X.arc(820,100,28,0,7);X.fill();for(let i=0;i<14;i++){let x=40+i*70,h=70+(i%4)*18;rect(x,145-h*.15,55,h,'#263440');for(let yy=0;yy<h-18;yy+=16)for(let xx=8;xx<48;xx+=14)rect(x+xx,155-h*.15+yy,6,7,(i+yy+xx)%3?'#c5a457':'#4d5966')}rect(0,260,W,280,'#111921');for(let y=285;y<520;y+=38){X.strokeStyle='#24313d';X.beginPath();X.moveTo(0,y);X.lineTo(W,y);X.stroke()}for(let x=0;x<W;x+=70){X.strokeStyle='#1b2731';X.beginPath();X.moveTo(x,260);X.lineTo(x+90,540);X.stroke()}}
function human(x,y,main='#2fbf3f',head='#d6b08b',owner=false){X.save();X.translate(x,y);if(owner){rect(-14,-48,28,28,'#0b0b0b');rect(-12,-46,24,24,'#133d19');rect(-9,-42,18,16,'#080808');rect(-7,-39,4,4,'#fff');rect(3,-39,5,4,'#fff');rect(-10,-18,20,30,'#151b18');rect(-12,-15,4,26,main);rect(8,-15,4,26,main)}else{rect(-10,-42,20,19,head);rect(-8,-40,16,5,'#3a2c25');rect(-11,-22,22,28,'#4f91a8');rect(-12,-17,4,23,'#d6b08b');rect(8,-17,4,23,'#d6b08b')}rect(-9,6,7,22,'#23272b');rect(2,6,7,22,'#23272b');X.restore()}
function draw(){X.save();if(shake>0){X.translate(R(-shake,shake),R(-shake,shake));shake*=.86}city();for(let z of haz){let a=clamp(z.t/z.max,0,1);X.strokeStyle=`rgba(70,255,105,${.5+.5*(1-a)})`;X.lineWidth=3;X.beginPath();X.arc(z.x,z.y,z.r*(.65+.35*a),0,7);X.stroke()}if(b.hammer){let a=clamp(b.hammer.t/b.hammer.max,0,1);X.strokeStyle='#9dffb0';X.lineWidth=5;X.beginPath();X.arc(b.hammer.x,b.hammer.y,b.hammer.r*(1.15-.15*a),0,7);X.stroke();X.fillStyle='rgba(47,191,63,.12)';X.beginPath();X.arc(b.hammer.x,b.hammer.y,b.hammer.r,0,7);X.fill()}for(let s of shots){X.fillStyle=s.c;X.beginPath();X.arc(s.x,s.y,s.r,0,7);X.fill()}for(let e of alts){human(e.x,e.y,'#3ecf57','#b08b6d',true);X.fillStyle='#62ff72';X.fillRect(e.x-16,e.y+33,32*e.hp/45,3)}human(b.x,b.y,'#2fbf3f','#d6b08b',true);human(p.x,p.y,'#4f91a8','#c99a6e',false);if(p.swing>0){X.strokeStyle='#f1dfac';X.lineWidth=5;X.beginPath();X.arc(p.x,p.y-12,48,-.9,.9);X.stroke()}if(p.guard){X.strokeStyle='#8fc9ff';X.lineWidth=4;X.strokeRect(p.x-22,p.y-42,44,68)}for(let q of parts){X.globalAlpha=clamp(q.life*2,0,1);X.fillStyle=q.c;X.fillRect(q.x,q.y,q.s,q.s)}X.globalAlpha=1;for(let q of texts){X.globalAlpha=clamp(q.life*2,0,1);X.fillStyle=q.c;X.font='bold 14px monospace';X.fillText(q.s,q.x,q.y)}X.globalAlpha=1;rect(0,0,W,84,'rgba(7,10,17,.94)');X.strokeStyle='#34475d';X.beginPath();X.moveTo(0,84);X.lineTo(W,84);X.stroke();X.font='bold 13px monospace';X.fillStyle='#e6e9ef';X.fillText('LMB SWORD',26,30);X.fillText('RMB BOW',128,30);X.fillText('SPC ROLL',220,30);X.fillText('F GUARD',310,30);X.textAlign='center';X.fillStyle='#9dffb0';X.font='bold 15px monospace';X.fillText('OXBIT',W/2,25);rect(220,38,520,16,'#18221b');rect(222,40,516*(b.hp/b.max),12,phase===2?'#8aff98':'#2fbf3f');X.textAlign='right';X.fillStyle='#b5c1cf';X.font='12px monospace';X.fillText('THE OWNER · THREAT 8',W-22,25);X.textAlign='left';for(let i=0;i<10;i++){X.fillStyle=i<Math.ceil(p.hp/20)?'#e84949':'#4a2424';X.fillRect(24+i*23,500,17,17)}rect(260,505,190,9,'#17212a');rect(260,505,190*(p.st/100),9,'#65b7ff');X.fillStyle='#9dffb0';X.font='11px monospace';X.fillText('SERVER AUTHORITY '+Math.round(b.authority)+'%',350,70);if(lines.length){let q=lines[lines.length-1];rect(180,420,600,62,'rgba(8,12,18,.94)');X.strokeStyle=q.c;X.strokeRect(180,420,600,62);X.fillStyle=q.c;X.font='bold 14px monospace';X.fillText(q.name,198,443);X.fillStyle='#eef';X.font='13px monospace';X.fillText(q.text,198,464)}if(dead||win){rect(0,0,W,H,'rgba(0,0,0,.55)');X.textAlign='center';X.font='bold 36px monospace';X.fillStyle=win?'#a8ffb2':'#ff8080';X.fillText(win?'OXBIT DEFEATED':'YOU WERE BANNED',W/2,H/2);X.font='14px monospace';X.fillStyle='#fff';X.fillText('Refresh to fight again',W/2,H/2+32);X.textAlign='left'}if(flash>0){X.fillStyle=`rgba(120,255,140,${flash})`;X.fillRect(0,0,W,H);flash*=.82}X.restore()}
function loop(now){let dt=Math.min(.033,(now-last)/1000);last=now;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
</script>
</body></html>
